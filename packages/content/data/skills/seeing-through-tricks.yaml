id: seeing-through-tricks
name:
  en: Seeing Through Tricks
  pt-BR: Enxergar Através de Truques
description:
  en: All actions that involve seeing through a trick, an illusion, a rhetorical ruse designed to evade the issue, or a lie.
  pt-BR: >-
    Todas as ações que envolvem perceber um truque, uma ilusão, um
    artifício retórico projetado para evitar o assunto, ou uma mentira.
