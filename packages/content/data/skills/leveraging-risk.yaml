id: leveraging-risk
name:
  en: Leveraging Risk
  pt-BR: Aproveitar o Risco
description:
  en: Tasks that involve some element of chance, such as playing games or choosing between two or three apparently equal options.
  pt-BR: >-
    Tarefas que envolvem algum elemento de acaso, como jogar jogos ou
    escolher entre duas ou três opções aparentemente iguais.
