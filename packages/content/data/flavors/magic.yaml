# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG, 2025-09-17), Chapter 7 "Further Customization" — NOT the official Cypher System Rulebook.
# description.pt-BR is a translation of the English description (the pt-BR term for "flavor" is "Traço").
id: magic
name:
  en: Magic
  pt-BR: Magia
description:
  en: You know a little about magic. You might not be a wizard, but you know the basics—how
    it works, and how to accomplish a few wondrous things. Of course, in your setting,
    “magic” might actually mean psychic powers, mutant abilities, weird alien tech, or
    anything else that produces interesting and useful effects. An Explorer flavored with
    magic might be a wizard-hunter, and a Speaker with magical flavor might be a
    sorcerer-bard. Although an Adept flavored with magic is still an Adept, you might find
    that swapping some of the type’s basic abilities with those given here tailors the
    character in desirable ways. This flavor is good match for the spellcasting rule
    detailed later in Chapter 7.
  pt-BR: 'Você sabe um pouco sobre magia. Pode não ser um mago, mas conhece o básico — como ela funciona e como realizar algumas coisas maravilhosas. Claro que, no seu cenário, "magia" pode significar poderes psíquicos, habilidades de mutantes, tecnologia alienígena estranha ou qualquer outra coisa que produza efeitos interessantes e úteis. Um Explorador com o Traço de magia pode ser um caçador de magos, e um Orador com o Traço de magia pode ser um bardo-feiticeiro. Embora um Adepto com o Traço de magia continue sendo um Adepto, talvez você ache que trocar algumas das habilidades básicas do Tipo pelas daqui adapta o personagem de maneiras desejáveis. Este Traço combina bem com as regras de feitiços e habilidades psiônicas, detalhadas mais adiante no Capítulo 7.'
