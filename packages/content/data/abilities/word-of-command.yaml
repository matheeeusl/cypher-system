id: word-of-command
name:
  en: Word of Command
  pt-BR: Palavra de Comando
description:
  en: You utter a word so powerful that to fully invest it, you sacrifice a cypher in your possession that is level 6 or higher. You issue the word to one creature within long range that you can see. The affected target must obey the command for several hours before it is free to act as it wishes. Targets that are attacked while under the effect of the command can defend themselves. Typical commands include "retreat," "calm," "come," and "stay." The GM decides how the target acts once a command is given.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "6 Intellect points + level 6 cypher"
  # — a cypher-consumption cost the schema's pool+amount `cost` field
  # can't represent alongside the point cost. Recorded as the 6 Intellect
  # points; the cypher sacrifice is folded into the prose above instead,
  # flagged for schema review.
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: type
    id: speaker
    tier: 6
  - type: focus
    id: curses-the-world
    tier: 6
