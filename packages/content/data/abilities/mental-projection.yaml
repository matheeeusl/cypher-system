id: mental-projection
name:
  en: Mental Projection
  pt-BR: Projeção Mental
description:
  en: Your mind fully leaves your body and manifests anywhere you choose within immediate range. Your projected mind can remain apart from your body for up to 24 hours. This effect ends early if your Intellect Pool is reduced to 0 or if your projection touches your resting body. Your disembodied mind is a psychic construct that looks like you, though its frayed edges trail off into nothingness. You control this body as if it were your normal body and can act and move as you normally would with a few exceptions. You can move through solid objects as if you were phased, and you ignore any terrain feature that would impede your movement. Your attacks inflict 3 fewer points of damage (to a minimum of 1) and you take 3 fewer points of damage (to a minimum of 1) from physical attacks, unless they can affect transdimensional or phased beings, in which case you take full damage. Regardless of the source, you take all damage as Intellect damage first. Your mind can travel up to 1 mile (1.5 km) from your body. Each level of additional Effort applied extends the range that you can travel by 1 mile (1.5 km). Your physical body is helpless until this effect ends. You cannot use your physical senses to perceive anything. For example, your body could sustain a significant injury, and you wouldn't know it. Your body cannot take Intellect damage, so if your body takes enough damage to reduce both your Might Pool and your Speed Pool to 0, your mind snaps back to your body, and you are stunned until the end of the next round as you try to reorient yourself to your predicament.
  pt-BR: Sua mente deixa completamente seu corpo e se manifesta em qualquer lugar que escolher a alcance imediato. Sua mente projetada pode permanecer separada de seu corpo por até 24 horas. Este efeito termina antes se sua Reserva de Intelecto for reduzida a 0 ou se sua projeção tocar seu corpo em repouso. Sua mente desencarnada é um construto psíquico que se parece com você, embora suas bordas desgastadas se dissipem no nada. Você controla esse corpo como se fosse seu corpo normal, e pode agir e se mover normalmente, com algumas exceções. Você pode atravessar objetos sólidos como se estivesse fora de fase, e ignora qualquer característica de terreno que impediria seu movimento. Seus ataques infligem 3 pontos a menos de dano (no mínimo 1) e você sofre 3 pontos a menos de dano (no mínimo 1) de ataques físicos, a menos que possam afetar seres transdimensionais ou fora de fase, caso em que você sofre dano total. Independentemente da origem, você sofre todo o dano primeiro como dano de Intelecto. Sua mente pode viajar até 1,5 quilômetro de seu corpo. Cada nível adicional de Esforço aplicado estende o alcance em que pode viajar em 1,5 quilômetro. Seu corpo físico fica indefeso até que este efeito termine. Você não pode usar seus sentidos físicos para perceber nada. Por exemplo, seu corpo poderia sofrer um ferimento significativo, e você não saberia. Seu corpo não pode sofrer dano de Intelecto, então se sofrer dano suficiente para reduzir tanto sua Reserva de Força quanto sua Reserva de Agilidade a 0, sua mente volta imediatamente ao corpo, e você fica atordoado até o fim da próxima rodada enquanto tenta se reorientar diante de sua situação.
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: sees-beyond
    tier: 6
