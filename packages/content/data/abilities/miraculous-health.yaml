id: miraculous-health
name:
  en: Miraculous Health
  pt-BR: Saúde Milagrosa
description:
  en: >-
    When you would descend a step on the damage track, you can
    attempt a Might task to resist, with a difficulty equal to the
    level of the foe or effect that harmed you. If successful, you
    don't descend the step and you regain 1 point in any Pool that is
    bereft of points. You can't use this ability again until after
    your next ten-hour rest.
  pt-BR: 'Quando você desceria um nível na trilha de dano, pode tentar uma tarefa de Força para resistir, com dificuldade igual ao nível do inimigo ou efeito que a feriu. Se bem-sucedida, você não desce o nível e recupera 1 ponto em qualquer Reserva que esteja zerada. Você não pode usar esta habilidade novamente até depois do seu próximo descanso de dez horas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: made-a-deal-with-death
    tier: 3
