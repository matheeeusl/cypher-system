id: small-flight
name:
  en: Small Flight
  pt-BR: Voo Pequeno
description:
  en: >-
    For the next hour, when using Shrink, you can fly through the
    air. You might accomplish this flight by growing wings from your
    body, extending wings from your suit, calling a tiny creature to
    carry you, or "surfing" air currents. When flying, you can move
    up to a short distance as part of another action or a long
    distance if all you do on your turn is move.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: shrinks-to-minute-size
    tier: 4
