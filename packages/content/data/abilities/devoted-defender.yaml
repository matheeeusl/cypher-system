id: devoted-defender
name:
  en: Devoted Defender
  pt-BR: Defensor Devotado
description:
  en: Choose one character you can see. That character becomes your ward. You are trained in all tasks involving finding, healing, interacting with, and protecting that character. You can have only one ward at a time.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "2 Might or Intellect points" — a
  # choice-of-pool cost the schema's single `pool` field can't represent.
  # Recorded as Might (the first-listed option), flagged for schema
  # review.
cost:
  pool: might
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: defends-the-weak
    tier: 2
  - type: focus
    id: walks-the-wasteland
    tier: 2
