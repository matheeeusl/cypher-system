id: total-awareness
name:
  en: Total Awareness
  pt-BR: Consciência Total
description:
  en: >-
    You possess such a high level of awareness that it's very
    difficult to surprise, hide from, or sneak up on you. When you
    apply a level of Effort to initiative and perception tasks, you
    gain two free levels of Effort.
  pt-BR: 'Você possui um nível de percepção tão alto que é muito difícil surpreendê-la, esconder-se de você, ou se aproximar furtivamente. Quando você aplica um nível de Esforço a tarefas de iniciativa e percepção, ganha dois níveis gratuitos de Esforço.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: sheds-their-skin
    tier: 5
