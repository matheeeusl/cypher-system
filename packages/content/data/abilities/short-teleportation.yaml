id: short-teleportation
name:
  en: Short Teleportation
  pt-BR: Teletransporte Curto
description:
  en: >-
    You instantly teleport to any location within a short distance
    that you can see. In addition to the normal options for using
    Effort, you can choose to use Effort to increase your range,
    teleport to a location you can't see, or bring other people with
    you. Each additional short distance costs one level of Effort.
    Teleporting to a destination you can't see costs one level of
    Effort. Each additional target brought with you costs one level
    of Effort (you must touch any additional targets). These levels
    of Effort are counted separately, so teleporting an additional
    short distance away to a location you can't see with one
    passenger costs a total of three levels of Effort.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "4+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 4 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: ignores-physical-distance
    tier: 4
