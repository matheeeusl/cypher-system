id: present-cantrip
name:
  en: Present Cantrip
  pt-BR: Truque do Presente
description:
  en: You teleport an object within an immediate distance into your upturned hand. The item
    has to be something you're carrying (such as a gem in your pouch or a dagger in your
    boot), something you can see (such as a coffee cup or mobile phone on the other side
    of the table), or something you know is within range (such as a note you saw someone
    put in their pocket). The cantrip affects one small object (for example, a cup or
    mobile phone) or up to a dozen smaller items from the same location (perhaps coins or
    dice).
  pt-BR: Você teletransporta um objeto a uma distância imediata para a palma da sua mão. O
    item precisa ser algo que você esteja carregando (como uma joia na bolsa ou uma adaga
    na bota), algo que você possa ver (como uma xícara de café ou um celular do outro lado
    da mesa) ou algo que você saiba estar ao alcance (como um bilhete que viu alguém
    colocar no bolso). O truque afeta um objeto pequeno (por exemplo, uma xícara ou um
    celular) ou até uma dúzia de itens menores do mesmo local (talvez moedas ou dados).
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
