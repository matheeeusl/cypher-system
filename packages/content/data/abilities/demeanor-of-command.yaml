id: demeanor-of-command
name:
  en: Demeanor of Command
  pt-BR: Porte de Comando
description:
  en: >-
    You project confidence, knowledge, and charisma to all who see you
    for the next hour. Your demeanor is such that those who see you
    automatically understand that you are someone important,
    accomplished, and with authority. When you speak, strangers who are
    not already attacking give you at least a round to have your say.
    If speaking to a group that can understand you, you can attempt to
    have them produce their leader or ask that they take you to their
    leader. You gain a free level of Effort that can be applied to one
    persuasion task you attempt during this period.
  pt-BR: 'Você projeta confiança, conhecimento e carisma para todos que o veem pela próxima hora. Sua postura é tal que aqueles que o veem entendem automaticamente que você é alguém importante, realizado e com autoridade. Quando você fala, estranhos que ainda não estão atacando lhe dão ao menos um round para se manifestar. Se estiver falando a um grupo que consiga entendê-lo, você pode tentar fazer com que apresentem seu líder ou peçam que o levem até ele. Você ganha um nível gratuito de Esforço que pode ser aplicado a uma tarefa de persuasão que tentar durante esse período.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 1
