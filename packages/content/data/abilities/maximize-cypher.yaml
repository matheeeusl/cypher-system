id: maximize-cypher
name:
  en: Maximize Cypher
  pt-BR: Maximizar Cifra
description:
  en: >-
    Choose one subtle cypher you bear. Its level becomes the maximum
    level possible for that cypher. For example, a meditation aid has
    a level range of 1d6 + 2, so maximizing that cypher changes its
    level to 8. You can have only one maximized subtle cypher at a
    time. You can't use this ability again until after you've taken a
    ten-hour recovery action.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: uses-wild-magic
    tier: 6
