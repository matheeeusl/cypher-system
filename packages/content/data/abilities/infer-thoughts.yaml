id: infer-thoughts
name:
  en: Infer Thoughts
  pt-BR: Inferir Pensamentos
description:
  en: If you interact with or study a target for at least a round, you can attempt to read its surface thoughts, even if the subject doesn't want you to. You must be able to see the target. Once you have gained a sense of what it's thinking—through its body language, its speech, and what it does and doesn't say—you can continue to infer the target's surface thoughts for up to one minute as long as you can still see and hear the target.
  pt-BR: Se você interagir com um alvo ou o estudar por pelo menos uma rodada, pode tentar ler seus pensamentos superficiais, mesmo que o alvo não queira. Você precisa conseguir ver o alvo. Uma vez que tenha uma noção do que ele está pensando — por meio de sua linguagem corporal, sua fala, e o que diz e deixa de dizer — você pode continuar a inferir os pensamentos superficiais do alvo por até um minuto, desde que ainda consiga vê-lo e ouvi-lo.
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: has-a-thousand-faces
    tier: 6
