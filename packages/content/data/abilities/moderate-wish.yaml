id: moderate-wish
name:
  en: Moderate Wish
  pt-BR: Desejo Moderado
description:
  en: >-
    At your request, the magic ally from your Bound Magic Creature
    ability can spend its action casting a moderate spell on you.
    Afterward, it must retreat to its bound object to rest for at
    least one hour. The effects it can produce include the following:

    - Golden Armor. You gain +3 to Armor for one hour from a
    translucent sheen of golden light.

    - Golden Fury. A golden light blazes in your eyes. For the next
    three minutes, if you attack a target, you inflict 5 additional
    points of damage.

    - Improved Touch of Grace. With the magic ally's touch, you add 6
    points to any stat Pool. If you are not damaged, you add the
    points to your chosen Pool's maximum. They remain until you spend
    them, you lose them to damage, or an hour passes.

    - Invisible. With a touch, the magic ally bends light that falls
    on you, so you seem to disappear. You are invisible to other
    creatures for ten minutes. While invisible, you are specialized in
    stealth and Speed defense tasks. This effect ends if you do
    something to reveal your presence or position—attacking, using an
    ability, moving a large object, and so on. If this occurs, you can
    regain the remaining invisibility effect by taking an action to
    focus on hiding your position.
  pt-BR: >-
    A seu pedido, a aliada mágica da sua habilidade Criatura Mágica
    Vinculada pode gastar sua ação conjurando um feitiço moderado em
    você. Depois disso, ela deve se retirar para seu objeto vinculado
    para descansar por pelo menos uma hora. Os efeitos que ela pode
    produzir incluem os seguintes:

    - Armadura Dourada. Você ganha +3 de Armadura por uma hora, vinda
    de um brilho translúcido de luz dourada.

    - Fúria Dourada. Uma luz dourada arde em seus olhos. Pelos
    próximos três minutos, se você atacar um alvo, causa 5 pontos
    adicionais de dano.

    - Toque da Graça Aprimorado. Com o toque da aliada mágica, você
    adiciona 6 pontos a qualquer Reserva de atributo. Se não estiver
    ferida, adiciona os pontos ao máximo da Reserva escolhida. Eles
    permanecem até você gastá-los, perdê-los por dano, ou até passar
    uma hora.

    - Invisível. Com um toque, a aliada mágica curva a luz que incide
    sobre você, para que pareça desaparecer. Você fica invisível para
    outras criaturas por dez minutos. Enquanto invisível, você é
    especializada em tarefas de furtividade e defesa de Velocidade.
    Este efeito termina se você fizer algo que revele sua presença ou
    posição — atacar, usar uma habilidade, mover um objeto grande, e
    assim por diante. Se isso ocorrer, você pode recuperar o efeito de
    invisibilidade restante usando uma ação para se concentrar em
    ocultar sua posição.
  # Note: source gives the "Invisible" sub-effect its own trailing
  # "Action to initiate." tag, distinct from the ability's own leading
  # "Action to initiate." — both are the same standard tag here, so no
  # variance to flag (unlike drone-upgrade/trained-gunner).
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 5
