id: beast-form
name:
  en: Beast Form
  pt-BR: Forma Bestial
description:
  en: On five consecutive nights each month, you change into a monstrous beast for up to one hour each night. In this new form, you gain +8 to your Might Pool, +1 to your Might Edge, +2 to your Speed Pool, and +1 to your Speed Edge. While in beast form, you can't spend Intellect points for any reason other than to try to change to your normal form before the one-hour duration is over (a difficulty 2 task). In addition, you attack any and every living creature within short range. After you revert to your normal form, you take a −1 penalty to all rolls for one hour. If you did not kill and eat at least one substantial creature while in beast form, the penalty increases to −2 and affects all your rolls for the next 24 hours.
  pt-BR: Em cinco noites consecutivas a cada mês, você se transforma em uma besta monstruosa por até uma hora a cada noite. Nessa nova forma, você ganha +8 na Reserva de Força, +1 no Bônus de Força, +2 na Reserva de Agilidade, e +1 no Bônus de Agilidade. Enquanto estiver em forma bestial, você não pode gastar pontos de Intelecto por nenhum motivo além de tentar voltar à sua forma normal antes do fim da duração de uma hora (uma tarefa de dificuldade 2). Além disso, você ataca todas e quaisquer criaturas vivas a alcance curto. Depois de reverter à sua forma normal, você sofre uma penalidade de −1 em todas as rolagens por uma hora. Se não tiver matado e comido pelo menos uma criatura substancial enquanto estava em forma bestial, a penalidade aumenta para −2 e afeta todas as suas rolagens pelas próximas 24 horas.
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: howls-at-the-moon
    tier: 1
