id: wing-weapons
name:
  en: Wing Weapons
  pt-BR: Armas das Asas
description:
  en: >-
    You can use your wings to make melee attacks (even when flying),
    leaving your hands and feet free. Your wings are medium bashing
    or bladed weapons (your choice). You are practiced with this
    attack.
  pt-BR: 'Você pode usar suas asas para fazer ataques corpo a corpo (mesmo voando), deixando suas mãos e pés livres. Suas asas são armas médias contundentes ou de lâmina (à sua escolha). Você é praticada com este ataque.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: soars-on-amazing-wings
    tier: 2
