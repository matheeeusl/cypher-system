id: hover
name:
  en: Hover
  pt-BR: Flutuar
description:
  en: You float slowly into the air. If you concentrate, you can control your movement to remain motionless in the air or float up to a short distance as your action; otherwise, you drift with the wind or with any momentum you have gained. This effect lasts for up to ten minutes.
  pt-BR: Você flutua lentamente no ar. Se concentrar-se, pode controlar seu movimento para permanecer imóvel no ar ou flutuar até uma distância curta como sua ação; caso contrário, você deriva com o vento ou com qualquer momento que tenha ganhado. Este efeito dura até dez minutos.
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: controls-gravity
    tier: 1
  - type: focus
    id: emerged-from-the-obelisk
    tier: 2
  - type: focus
    id: flies-faster-than-a-bullet
    tier: 1
  - type: focus
    id: soars-on-amazing-wings
    tier: 1
