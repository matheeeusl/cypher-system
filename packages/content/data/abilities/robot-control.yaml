id: robot-control
name:
  en: Robot Control
  pt-BR: Controle de Robôs
description:
  en: >-
    You use your knowledge of robot command and control (and possibly
    devices that transmit on the proper frequency) to affect any
    mechanized system or robot of level 2 or lower within short
    range. You can render several targets inactive for as long as you
    focus all your attention on them. If you focus on just one
    target, you can attempt to take active control of it for one
    minute, commanding it to do simple tasks on your behalf while you
    concentrate. In addition to the normal options for using Effort,
    you can choose to use Effort to increase the maximum level of the
    mechanized system or robot. Thus, to affect a level 4 target (two
    levels above the normal limit), you must apply two levels of
    Effort.
  pt-BR: 'Tradução em breve.'
  # Note: also prints "Robot Control is a hack." as a trailing aside — a
  # rules-category tag rather than mechanical text, dropped.
  # Source cost is printed as "2+ Intellect points" — the schema's cost
  # field can't represent an open-ended "+". Recorded as the baseline 2
  # Intellect points here, flagged for schema review (same approximation
  # used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: has-a-custom-drone
    tier: 2
    cyberware: true
