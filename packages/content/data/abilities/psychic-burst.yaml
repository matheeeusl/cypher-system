id: psychic-burst
name:
  en: Psychic Burst
  pt-BR: Explosão Psíquica
description:
  en: You blast waves of mental force into the minds of up to three targets within short range (make an Intellect roll against each target). This burst inflicts 3 points of Intellect damage (ignores Armor). For each 2 additional Intellect points you spend, you can make an Intellect attack roll against an additional target.
  pt-BR: Você lança ondas de força mental nas mentes de até três alvos a alcance curto (faça uma rolagem de Intelecto contra cada alvo). Essa explosão inflige 3 pontos de dano de Intelecto (ignora Armadura). Para cada 2 pontos adicionais de Intelecto que gastar, você pode fazer uma rolagem de ataque de Intelecto contra um alvo adicional.
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: commands-mental-powers
    tier: 3
attack: true
