id: animal-shape
name:
  en: Animal Shape
  pt-BR: Forma Animal
description:
  en: >-
    You change into an animal as small as a rat or up to your own size (such
    as a large dog or small bear) for ten minutes. Each time you transform,
    you can take a different animal shape. Your equipment becomes part of
    the transformation, rendering it unusable unless it has a passive
    effect, such as armor. In this form your stats remain the same as your
    normal form, but you can move and attack according to your animal shape
    (attacks from most animals this size are medium weapons, which you can
    use without penalty). Tasks requiring hands (such as using door handles
    or pushing buttons) are hindered when in animal form. You cannot speak
    but can still use abilities that don't rely on human speech. You gain
    two minor abilities associated with the creature you become (see the
    Animal Form Minor Abilities table). For example, if you transform into
    a bat, you become trained in perception and can fly up to a long
    distance each round. If you transform into an octopus, you are trained
    in stealth and can breathe underwater. If you apply a level of Effort
    when you use this ability, you can either become a talking animal or
    take a hybrid shape. The talking animal shape looks exactly like a
    normal animal, but you can still talk and use any abilities that rely
    on human speech. The hybrid shape is like your normal form but with
    animalistic features, even if that animal is something much smaller
    than you (such as a bat or rat). In this hybrid form you can speak, use
    all of your abilities, make attacks like an animal, and perform tasks
    using hands without being hindered. Anyone who sees you clearly in this
    hybrid form would never mistake you for a mere animal. "Similar" is a
    broad term. Lions are similar to tigers and leopards, hawks are similar
    to ravens and swans, dogs are similar to wolves and foxes, and so on.
    Even if your animal shape has multiple attack types (such as claws and
    bite), you can attack only once per round unless you have some other
    ability that lets you make additional attacks on your turn.
  pt-BR: 'Você se transforma em um animal tão pequeno quanto um rato ou até do seu próprio tamanho (como um cão grande ou um urso pequeno) por dez minutos. A cada transformação, você pode assumir uma forma animal diferente. Seu equipamento se torna parte da transformação, tornando-se inutilizável a menos que tenha um efeito passivo, como uma armadura. Nesta forma, seus atributos permanecem os mesmos da sua forma normal, mas você pode se mover e atacar de acordo com sua forma animal (ataques da maioria dos animais desse tamanho são armas médias, que você pode usar sem penalidade). Tarefas que exigem mãos (como usar maçanetas ou apertar botões) são dificultadas na forma animal. Você não consegue falar, mas ainda pode usar habilidades que não dependem da fala humana. Você ganha duas habilidades menores associadas à criatura que se torna (veja a tabela de Habilidades Menores de Forma Animal). Por exemplo, se você se transformar em um morcego, fica treinado em percepção e pode voar até uma distância longa a cada round. Se você se transformar em um polvo, fica treinado em furtividade e pode respirar debaixo d''água. Se aplicar um nível de Esforço ao usar esta habilidade, você pode se tornar um animal falante ou assumir uma forma híbrida. A forma de animal falante parece exatamente com um animal normal, mas você ainda consegue falar e usar quaisquer habilidades que dependam da fala humana. A forma híbrida é como sua forma normal, mas com características animalescas, mesmo que esse animal seja bem menor que você (como um morcego ou rato). Nessa forma híbrida você pode falar, usar todas as suas habilidades, atacar como um animal e realizar tarefas com as mãos sem ser dificultado. Qualquer um que o veja claramente nessa forma híbrida jamais o confundiria com um mero animal. "Semelhante" é um termo amplo. Leões são semelhantes a tigres e leopardos, falcões são semelhantes a corvos e cisnes, cães são semelhantes a lobos e raposas, e assim por diante. Mesmo que sua forma animal tenha múltiplos tipos de ataque (como garras e mordida), você só pode atacar uma vez por round, a menos que tenha alguma outra habilidade que permita fazer ataques adicionais no seu turno.'
cost: null
# Note: source tag is "Action to change or revert." — same tag as
# mist-form/moon-shape. NOT the same as controlled-change/beast-form
# (Howls at the Moon), whose confirmed tags turned out to be two
# separate single-direction tags ("Action to Change."/"Action to change
# back.") rather than one combined "change or revert" tag — see their
# own action_type comments.
action_type: action_to_change_or_revert
sources:
  - type: focus
    id: takes-animal-shape
    tier: 1
