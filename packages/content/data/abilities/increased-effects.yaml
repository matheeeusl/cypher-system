id: increased-effects
name:
  en: Increased Effects
  pt-BR: Efeitos Ampliados
description:
  en: >-
    You treat rolls of natural 19 as rolls of natural 20 for either
    Might actions or Speed actions (your choice when you gain this
    ability). This allows you to gain a major effect on a natural 19 or
    20.
  pt-BR: 'Você trata rolagens de 19 natural como rolagens de 20 natural para ações de Força ou ações de Velocidade (sua escolha ao obter esta habilidade). Isso permite que você obtenha um efeito maior em um 19 ou 20 natural.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 4
  - type: type
    id: warrior
    tier: 4
