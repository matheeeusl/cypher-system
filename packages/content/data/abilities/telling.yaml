id: telling
name:
  en: Telling
  pt-BR: Convincente
description:
  en: >-
    This ability provides an asset to any tasks for attempting to
    deceive, persuade, or intimidate. Each use lasts up to a minute; a
    new use (to switch tasks) replaces the previous use.
  pt-BR: 'Esta habilidade concede um recurso a quaisquer tarefas para tentar enganar, persuadir ou intimidar. Cada uso dura até um minuto; um novo uso (para trocar de tarefa) substitui o uso anterior.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 3
