id: frost-touch
name:
  en: Frost Touch
  pt-BR: Toque Gélido
description:
  en: >-
    Your hands become so cold that the next time you touch a
    creature, you inflict 3 points of damage. Alternatively, you can
    use this ability on a weapon, and for ten minutes, it inflicts 1
    additional point of damage from the cold.
  pt-BR: 'Tradução em breve.'
  # Note: source tag is "Action for touch; enabler for weapon." — a
  # genuinely dual-mode tag, also used verbatim by `shock` (Rides the
  # Lightning).
cost:
  pool: intellect
  amount: 1
action_type: action_or_enabler
sources:
  - type: focus
    id: wears-a-sheen-of-ice
    tier: 2
