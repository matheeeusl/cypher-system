id: spray-venom
name:
  en: Spray Venom
  pt-BR: Espirrar Veneno
description:
  en: >-
    You hiss and release a spray of burning, flesh dissolving venom
    at one target within short range, inflicting 5 points of damage.
    Even on a miss, you inflict 1 point of damage. If you apply a
    level of Effort when you make an attack with this ability (either
    to increase the odds of hitting or to increase damage), you can
    also choose to spin about as you spray venom, attacking every
    creature you choose within short range, and the improved chance
    to hit or deal damage applies to each attack. As with the base
    use, even on a miss, you inflict 1 point of damage. However,
    spinning as you spray venom is dizzying, leaving you dazed for a
    round afterward, during which time all your tasks are hindered.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "5+ Speed points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 5 Speed points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: speed
  amount: 5
action_type: action
sources:
  - type: focus
    id: strikes-like-a-rattler
    tier: 6
