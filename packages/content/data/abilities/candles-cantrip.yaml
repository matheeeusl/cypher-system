id: candles-cantrip
name:
  en: Candles Cantrip
  pt-BR: Truque das Velas
description:
  en: You create up to four candle-like lights that move to your mental commands (but no
    farther away than how far you can reach), lasting about ten minutes. Each light can be
    a different color.
  pt-BR: Você cria até quatro luzes semelhantes a velas que se movem conforme seus comandos
