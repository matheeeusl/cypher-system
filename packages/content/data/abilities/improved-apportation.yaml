id: improved-apportation
name:
  en: Improved Apportation
  pt-BR: Aportação Aprimorada
description:
  en: >-
    You call a creature of up to level 3, which appears next to you.
    You can choose a creature that you've previously encountered, or
    (no more than once per day) you can allow the GM to determine the
    creature randomly. If you call a random creature, it has a 10
    percent chance of being a creature of up to level 5. The creature
    has no memory of anything before being called by you, though it
    can speak and has the general knowledge a creature of its type
    should possess. The creature is receptive to communication and
    helping you (unless shown that it should do otherwise).
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: focuses-mind-over-matter
    tier: 6
