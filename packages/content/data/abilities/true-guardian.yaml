id: true-guardian
name:
  en: True Guardian
  pt-BR: Guardiã Verdadeira
description:
  en: >-
    When you stand guard as your action, allies within immediate
    range of you gain an asset to their defense tasks. This lasts
    until the end of your next turn.
  pt-BR: "Tradução em breve."
  # Note: source cost is a choice-of-pool, "2 Might or Intellect
  # points" — the schema's single `pool` field can't represent that.
  # Recorded as Might (first-listed option), same approximation used
  # for devoted-defender/extreme-mastery/flight-exertion.
cost:
  pool: might
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: steers-the-coven
    tier: 3
