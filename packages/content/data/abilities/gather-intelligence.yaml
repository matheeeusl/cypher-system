id: gather-intelligence
name:
  en: Gather Intelligence
  pt-BR: Coletar Informações
description:
  en: >-
    When in a group of people (a caravan, a palace, a village, a city,
    etc.) you can ask around about any topic you choose and come away
    with useful information. You can ask a specific question, or you
    can simply obtain general facts. You also get a good idea of the
    general layout of the location involved, note the presence of all
    major sites, and perhaps even notice obscure details. For example,
    not only do you find out if anyone in the palace has seen the
    missing boy, but you also get a working knowledge of the layout of
    the palace itself, note all the entrances and which are used more
    often than others, and take notice that everyone seems to avoid the
    well in the eastern courtyard for some reason.
  pt-BR: 'Ao estar em um grupo de pessoas (uma caravana, um palácio, um vilarejo, uma cidade, etc.), você pode fazer perguntas sobre qualquer tópico à sua escolha e sair com informações úteis. Você pode fazer uma pergunta específica, ou pode simplesmente obter fatos gerais. Você também obtém uma boa noção do layout geral do local envolvido, nota a presença de todos os locais principais, e talvez até perceba detalhes obscuros. Por exemplo, não apenas você descobre se alguém no palácio viu o garoto desaparecido, mas também ganha um conhecimento funcional do layout do próprio palácio, nota todas as entradas e quais são usadas mais frequentemente que as outras, e percebe que todos parecem evitar o poço no pátio leste por algum motivo.'
  # Note: source tag is "Action to initiate, about an hour to complete."
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 2
