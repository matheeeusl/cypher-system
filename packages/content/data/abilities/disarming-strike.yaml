id: disarming-strike
name:
  en: Disarming Strike
  pt-BR: Golpe Desarmante
description:
  en: >-
    Your attack inflicts 1 point less damage and disarms your foe so
    that their weapon is now 10 feet (3 m) away on the ground. (If
    your chosen weapon is a whip, you can instead deposit the
    disarmed weapon into your hands; if your chosen weapon is a bow
    or other ranged weapon that fires physical rounds, you can
    instead "nail" the disarmed weapon to a nearby object or
    structure. Choosing to do either of these hinders your attack.)
  pt-BR: 'Tradução em breve.'
cost:
  pool: speed
  amount: 3
action_type: action
sources:
  - type: focus
    id: masters-weaponry
    tier: 3
