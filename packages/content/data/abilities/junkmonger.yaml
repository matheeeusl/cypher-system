id: junkmonger
name:
  en: Junkmonger
  pt-BR: Negociante de Sucata
description:
  en: >-
    You are trained in crafting two kinds of items using scavenged
    junk. If you have scavenged (or otherwise obtained) at least two
    pieces of junk in different categories (electronic, plastic,
    dangerous, metallic, glass, or textile), you have the materials
    you need to craft a new item in one of your areas of training
    (unless the GM deems otherwise).
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: scavenges
    tier: 2
