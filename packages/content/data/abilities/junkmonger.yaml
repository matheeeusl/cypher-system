id: junkmonger
name:
  en: Junkmonger
  pt-BR: Negociante de Sucata
description:
  en: >-
    You are trained in crafting two kinds of items using scavenged
    junk. If you have scavenged (or otherwise obtained) at least two
    pieces of junk in different categories (electronic, plastic,
    dangerous, metallic, glass, or textile), you have the materials
    you need to craft a new item in one of your areas of training
    (unless the GM deems otherwise).
  pt-BR: 'Você é treinada em fabricar dois tipos de itens usando sucata vasculhada. Se você vasculhou (ou de outra forma obteve) pelo menos duas peças de sucata em categorias diferentes (eletrônica, plástica, perigosa, metálica, vidro ou têxtil), você tem os materiais necessários para fabricar um novo item em uma das suas áreas de treinamento (a menos que o Mestre julgue o contrário).'
cost:
  pool: intellect
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: scavenges
    tier: 2
