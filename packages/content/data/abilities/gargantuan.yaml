id: gargantuan
name:
  en: Gargantuan
  pt-BR: Gigantesco
description:
  en: >-
    When you use Enlarge, you can choose to grow up to 30 feet (9 m)
    in height, and you add 3 more temporary points to your Might Pool
    (if you also have the Bigger ability, the temporary points from
    Gargantuan are in addition to the points from Bigger).
  pt-BR: 'Quando você usa Ampliar, pode optar por crescer até 9 metros (30 pés) de altura, e adiciona mais 3 pontos temporários à sua Reserva de Força (se você também tiver a habilidade Ainda Maior, os pontos temporários de Gigantesco se somam aos pontos de Ainda Maior).'
cost: null
action_type: enabler
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 5
