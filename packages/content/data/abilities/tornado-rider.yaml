id: tornado-rider
name:
  en: Tornado Rider
  pt-BR: Cavaleira do Tornado
description:
  en: >-
    Your mount's flashing hooves churn up a small tornado, lifting
    you and your mount a long distance into the eye of the
    supernatural storm. The tornado moves as you direct it up to a
    short distance each round for up to five minutes or until you
    dismiss it. The swirling winds damage creatures, objects, and
    structures within short range of the tornado's eye. Each round,
    creatures in the area take 3 points of damage due to debris on
    the wind. Attempts to damage objects or structures with your
    tornado are eased by two steps.
  pt-BR: 'Os cascos relampejantes da sua montaria revolvem um pequeno tornado, levantando você e sua montaria uma distância longa até o olho da tempestade sobrenatural. O tornado se move conforme você o direciona, até uma distância curta a cada round, por até cinco minutos ou até você dispensá-lo. Os ventos giratórios danificam criaturas, objetos e estruturas dentro de uma distância curta do olho do tornado. A cada round, as criaturas na área sofrem 3 pontos de dano por detritos no vento. Tentativas de danificar objetos ou estruturas com seu tornado são facilitadas em dois níveis.'
cost:
  pool: speed
  amount: 7
action_type: action_to_initiate
sources:
  - type: focus
    id: rides-like-the-wind
    tier: 6
