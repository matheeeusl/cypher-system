id: tornado-rider
name:
  en: Tornado Rider
  pt-BR: Cavaleira do Tornado
description:
  en: >-
    Your mount's flashing hooves churn up a small tornado, lifting
    you and your mount a long distance into the eye of the
    supernatural storm. The tornado moves as you direct it up to a
    short distance each round for up to five minutes or until you
    dismiss it. The swirling winds damage creatures, objects, and
    structures within short range of the tornado's eye. Each round,
    creatures in the area take 3 points of damage due to debris on
    the wind. Attempts to damage objects or structures with your
    tornado are eased by two steps.
  pt-BR: 'Tradução em breve.'
cost:
  pool: speed
  amount: 7
action_type: action_to_initiate
sources:
  - type: focus
    id: rides-like-the-wind
    tier: 6
