id: dream-thief
name:
  en: Dream Thief
  pt-BR: Ladrão de Sonhos
description:
  en: You steal a previous dream from a living creature within short range. The creature loses 2 points of Intellect (ignores Armor), and you learn something the GM chooses to reveal about the creature—its nature, a portion of its plans, a memory, and so on.
  pt-BR: 'Você rouba um sonho anterior de uma criatura viva dentro de uma distância curta. A criatura perde 2 pontos de Intelecto (ignora Armadura), e você aprende algo que o Mestre escolhe revelar sobre a criatura — sua natureza, parte de seus planos, uma memória, e assim por diante.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: awakens-dreams
    tier: 2
