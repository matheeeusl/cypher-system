id: inspiration-in-a-glass
name:
  en: Inspiration in a Glass
  pt-BR: Inspiração em um Copo
description:
  en: >-
    You meditate, perhaps over a drink, perhaps on a fond memory you
    made in a saloon or similar enjoyable location. You gain a level
    6 subtle cypher of the general variety that you want (though the
    GM chooses the specifics) and can use it next round. If you are
    already at your cypher limit when you use this ability, choose
    which cypher you replace with the new one. In addition to the
    normal options for using Effort, you can choose to use Effort to
    increase the cypher's level; each level of Effort used in this
    way increases the level by 1.
  pt-BR: 'Você medita, talvez tomando uma bebida, talvez em uma boa lembrança que criou em um bar ou local agradável semelhante. Você ganha uma cifra sutil de nível 6 da variedade geral que desejar (embora o Mestre escolha os detalhes) e pode usá-la no próximo round. Se você já estiver no seu limite de cifras ao usar esta habilidade, escolha qual cifra substituir pela nova. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o nível da cifra; cada nível de Esforço usado dessa forma aumenta o nível em 1.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: hits-the-saloon
    tier: 6
