id: wild-vitality
name:
  en: Wild Vitality
  pt-BR: Vitalidade Selvagem
description:
  en: >-
    You attune with the life force of a natural creature (your size or
    bigger) within long range that you can see. This is a level 2
    Intellect task. If you succeed, the creature is not harmed, but
    through resonance with its wild vitality, you gain several benefits
    for up to one minute: an asset to all your Might-based tasks
    (including attacks and defenses), +2 to your Might Edge and Speed
    Edge, and 2 additional points of damage on all successful melee
    attacks.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: type
    id: explorer
    tier: 6
