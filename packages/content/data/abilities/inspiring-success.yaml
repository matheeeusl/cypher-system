id: inspiring-success
name:
  en: Inspiring Success
  pt-BR: Sucesso Inspirador
description:
  en: >-
    When you succeed on a roll to perform a task related to the stat
    that you choose upon selecting this ability, and you applied at
    least one level of Effort, you may choose another character within
    short range. That character has an asset on the next task they
    attempt using that stat on their next turn.
  pt-BR: 'Quando você tem sucesso em uma rolagem para realizar uma tarefa relacionada ao atributo escolhido ao obter esta habilidade, e aplicou pelo menos um nível de Esforço, pode escolher outro personagem dentro de uma distância curta. Esse personagem ganha um recurso na próxima tarefa que tentar usando esse atributo no seu próximo turno.'
cost:
  pool: intellect
  amount: 6
action_type: enabler
sources:
  - type: type
    id: speaker
    tier: 6
