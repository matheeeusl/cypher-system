id: greater-necromancy
name:
  en: Greater Necromancy
  pt-BR: Necromancia Superior
description:
  en: This ability works like the Necromancy ability except that it creates a level 3 creature.
  pt-BR: 'Esta habilidade funciona como a habilidade Necromancia, exceto que cria uma criatura de nível 3.'
  # Note: source cost is printed as "5+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 5 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
  # Under Turns Decay to Growth, this ability's Tier 4 grant is
  # conditional on having chosen Necromancy at Tier 3 — see the note
  # on `rewind-rot` for the full explanation.
cost:
  pool: intellect
  amount: 5
# Note: source tag is "Action to animate.", per necromancy's comment
# (this ability works like Necromancy).
action_type: action_to_animate
sources:
  - type: focus
    id: consorts-with-the-dead
    tier: 4
  - type: focus
    id: turns-decay-to-growth
    tier: 4
