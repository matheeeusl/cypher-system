id: perfect-stranger
name:
  en: Perfect Stranger
  pt-BR: Estranho Perfeito
description:
  en: >-
    You alter your posture and way of speaking and make a small but
    real alteration to an outfit (such as putting on or taking off a
    hat, reversing a cloak, and so on). For the next hour (or as long
    as you keep up the alteration), even creatures that know you well
    don't recognize you. All tasks related to hiding your true identity
    during this period gain one free level of Effort.
  pt-BR: 'Você altera sua postura e forma de falar e faz uma alteração pequena, mas real, em uma roupa (como colocar ou tirar um chapéu, virar uma capa do avesso, e assim por diante). Pela próxima hora (ou enquanto mantiver a alteração), até mesmo criaturas que a conhecem bem não a reconhecem. Todas as tarefas relacionadas a esconder sua verdadeira identidade durante esse período ganham um nível gratuito de Esforço.'
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 3
