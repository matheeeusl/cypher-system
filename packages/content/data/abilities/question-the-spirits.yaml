id: question-the-spirits
name:
  en: Question the Spirits
  pt-BR: Questionar os Espíritos
description:
  en: >-
    You can call a spirit to you and petition it to answer a few
    questions (usually no more than three before the spirit fades).
    First, you must summon a spirit. If it is a spirit of the dead,
    you must have personally known the creature, have an object that
    was owned by the creature, or touch the physical remains of the
    creature. For other spirits, you must know the spirit's full name
    or have a great deal of an element (such as fire or earth) that
    the spirit is associated with. If the spirit responds, it can
    manifest as an insubstantial shade that answers for itself, it
    can inhabit an object or any remains you provide, or it can
    manifest as an invisible presence that you speak for. The spirit
    may not wish to answer your questions, in which case you must
    persuade it to help. You can attempt to psychically wrestle the
    spirit into submission (an Intellect task), or you can try
    diplomacy, deception, or blackmail ("Answer me, or I'll tell your
    children that you were a philanderer" or "I'll destroy this relic
    that belonged to you"). The GM determines what the spirit might
    know, based on the knowledge it possessed in life.
  pt-BR: 'Você pode chamar um espírito até você e pedir que responda a algumas perguntas (geralmente não mais que três antes de o espírito se desvanecer). Primeiro, você deve invocar um espírito. Se for um espírito de um morto, você deve tê-lo conhecido pessoalmente, possuir um objeto que pertenceu à criatura, ou tocar seus restos físicos. Para outros espíritos, você deve saber o nome completo do espírito ou ter uma grande quantidade de um elemento (como fogo ou terra) ao qual o espírito está associado. Se o espírito responder, pode se manifestar como uma sombra incorpórea que responde por si mesma, pode habitar um objeto ou quaisquer restos que você fornecer, ou pode se manifestar como uma presença invisível pela qual você fala. O espírito pode não querer responder suas perguntas, caso em que você deve persuadi-lo a ajudar. Você pode tentar dominar psiquicamente o espírito pela força (uma tarefa de Intelecto), ou pode tentar diplomacia, decepção ou chantagem ("Responda-me, ou contarei aos seus filhos que você era um traidor" ou "Destruirei esta relíquia que pertenceu a você"). O Mestre determina o que o espírito pode saber, com base no conhecimento que possuía em vida.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: shepherds-spirits
    tier: 1
