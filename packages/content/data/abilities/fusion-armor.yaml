id: fusion-armor
name:
  en: Fusion Armor
  pt-BR: Armadura Fundida
description:
  en: A procedure gives you biometal implants in major portions of your body, you grow metal-hard skin, the blessings of an angel protect you, or something similar happens. These changes give you +1 to Armor even when you're not wearing physical armor.
  pt-BR: Um procedimento lhe dá implantes de biometal em grandes partes do corpo, sua pele se torna dura como metal, as bênçãos de um anjo o protegem, ou algo semelhante acontece. Essas mudanças lhe dão +1 na Armadura, mesmo quando você não está usando armadura física.
cost: null
