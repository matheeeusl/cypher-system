id: improved-absorb-kinetic-energy
name:
  en: Improved Absorb Kinetic Energy
  pt-BR: Absorver Energia Cinética Aprimorado
description:
  en: When you use Absorb Kinetic Energy, instead of being able to absorb 1 point of damage from a physical attack or impact, you can absorb 2 points. You can also store up to 2 points of energy from any source. However, you can still release energy only 1 point at a time.
  pt-BR: 'Quando você usa Absorver Energia Cinética, em vez de conseguir absorver 1 ponto de dano de um ataque físico ou impacto, você pode absorver 2 pontos. Você também pode armazenar até 2 pontos de energia de qualquer fonte. Porém, você ainda pode liberar energia apenas 1 ponto de cada vez.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: absorbs-energy
    tier: 3
