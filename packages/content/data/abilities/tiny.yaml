id: tiny
name:
  en: Tiny
  pt-BR: Minúscula
description:
  en: >-
    When you use Shrink, you can choose to shrink down to about
    one-sixteenth of an inch (.2 cm). When you do, you add 5 more
    temporary points to your Speed Pool (plus any from Smaller), and
    because your attacks are concentrated into a very small area, you
    deal an additional 2 points of damage. For each level of Effort
    you apply to shrink even more, you become one-tenth as tall
    (one one-hundredth for two levels of Effort, one one-thousandth
    for three, and so on) and you add 1 more point to your Speed
    Pool.
  pt-BR: 'Tradução em breve.'
  # Note: source adds a trailing flavor note: "In campaigns where
  # characters can travel to parallel dimensions, using Tiny to shrink
  # to one-thousandth of your normal height may be a means of doing
  # so." — flavor/setting text, not a mechanical grant, not folded in.
cost: null
action_type: enabler
sources:
  - type: focus
    id: shrinks-to-minute-size
    tier: 6
