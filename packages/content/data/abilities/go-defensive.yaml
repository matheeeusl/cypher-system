id: go-defensive
name:
  en: Go Defensive
  pt-BR: Ficar na Defensiva
description:
  en: >-
    When you wish, while in combat, you can enter a state of
    heightened awareness of threat. While in this state, you can't use
    points from your Intellect Pool, but you gain +1 to your Speed
    Edge and gain two assets to Speed defense tasks. This effect
    lasts as long as you wish or until you attack a foe or no combat
    is taking place within range of your senses. Once the effect of
    this ability ends, you can't enter it again for one minute.
  pt-BR: 'Quando desejar, durante o combate, você pode entrar em um estado de consciência intensificada de ameaças. Nesse estado, não pode usar pontos da sua Reserva de Intelecto, mas ganha +1 na sua Margem de Velocidade e ganha dois recursos em tarefas de defesa de Velocidade. Esse efeito dura enquanto você desejar ou até atacar um inimigo ou nenhum combate estiver ocorrendo dentro do alcance dos seus sentidos. Uma vez que o efeito desta habilidade termina, você não pode entrar nela novamente por um minuto.'
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: runs-away
    tier: 1
