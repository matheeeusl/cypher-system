id: generate-force-field
name:
  en: Generate Force Field
  pt-BR: Gerar Campo de Força
description:
  en: You create six planes of solid force (level 8), each 30 feet (9 m) to a side, which persist for one hour. The planes must be contiguous, and they retain the position that you choose when initiating this ability. For instance, you could arrange the planes linearly, creating a wall 180 feet (55 m) long, or you could create a closed cube. The planes conform to the space available. Each additional level of Effort you apply increases the level of the barrier by one (to a maximum of level 10) or increases the number of hours it remains by one.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "9+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 9 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 9
action_type: action_to_initiate
sources:
  - type: focus
    id: defends-the-gate
    tier: 6
