id: living-armor
name:
  en: Living Armor
  pt-BR: Armadura Viva
description:
  en: >-
    If you're in a location where it's possible for your creatures
    from Influence Swarm to come, you call a swarm around you for
    one hour. They crawl over your body or fly around you in a
    cloud. During this time, your Speed defense tasks are eased, and
    you gain +1 to Armor.
  pt-BR: 'Se você estiver em um local onde seja possível que suas criaturas de Influenciar Enxame venham até você, você convoca um enxame ao seu redor por uma hora. Elas rastejam pelo seu corpo ou voam ao seu redor em uma nuvem. Durante esse tempo, suas tarefas de defesa de Velocidade são facilitadas, e você ganha +1 de Armadura.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 3
