id: sun-siphon
name:
  en: Sun Siphon
  pt-BR: Sifão Solar
description:
  en: >-
    The safe limit of your Siphon Pool from the Store Energy ability
    increases by 3 points. If you spend an hour in sunlight (or an
    hour in contact with a suitable powerful energy source), you
    automatically fill your Siphon Pool to its safe limit. You can't
    refill your Siphon Pool this way again until after your next
    ten-hour recovery roll.
  pt-BR: 'O limite seguro da sua Reserva de Captação da habilidade Armazenar Energia aumenta em 3 pontos. Se você passar uma hora sob luz solar (ou uma hora em contato com uma fonte de energia poderosa adequada), preenche automaticamente sua Reserva de Captação até seu limite seguro. Você não pode reabastecer sua Reserva de Captação dessa forma novamente até depois da sua próxima rolagem de recuperação de dez horas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: siphons-power
    tier: 6
