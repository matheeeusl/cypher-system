id: sun-siphon
name:
  en: Sun Siphon
  pt-BR: Sifão Solar
description:
  en: >-
    The safe limit of your Siphon Pool from the Store Energy ability
    increases by 3 points. If you spend an hour in sunlight (or an
    hour in contact with a suitable powerful energy source), you
    automatically fill your Siphon Pool to its safe limit. You can't
    refill your Siphon Pool this way again until after your next
    ten-hour recovery roll.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: siphons-power
    tier: 6
