id: colossal
name:
  en: Colossal
  pt-BR: Colossal
description:
  en: >-
    When you use Enlarge, you can choose to grow up to a base height
    of 60 feet (18 m). When you do, you add 5 more temporary points
    to your Might Pool (plus any from Gargantuan and Bigger), and you
    deal an additional 2 points of damage with melee attacks (plus
    any from your Huge ability). For each level of Effort you apply
    to increase your height further, your total height increases by
    10 feet (3 m), and you add 1 more point to your Might Pool. Thus,
    the first time you use Enlarge after a ten-hour recovery roll, if
    you apply two levels of Effort, your base height is 80 feet
    (24 m), and you add a total of 17 temporary points to your Might
    Pool.
  pt-BR: 'Quando você usa Aumentar, pode optar por crescer até uma altura base de 18 metros (60 pés). Ao fazer isso, adiciona mais 5 pontos temporários à sua Reserva de Força (além de quaisquer de Gigantesco e Ainda Maior), e causa 2 pontos adicionais de dano com ataques corpo a corpo (além de quaisquer da sua habilidade Enorme). Para cada nível de Esforço que você aplicar para aumentar ainda mais sua altura, sua altura total aumenta em 3 metros (10 pés), e você adiciona mais 1 ponto à sua Reserva de Força. Assim, na primeira vez que você usar Aumentar após uma rolagem de recuperação de dez horas, se aplicar dois níveis de Esforço, sua altura base será 24 metros (80 pés), e você adicionará um total de 17 pontos temporários à sua Reserva de Força.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 6
