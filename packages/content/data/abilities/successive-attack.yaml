id: successive-attack
name:
  en: Successive Attack
  pt-BR: Ataque Sucessivo
description:
  en: >-
    If you take down a foe, you can immediately make another attack
    on that same turn against a new foe within your reach. The second
    attack is part of the same action. You can use this ability with
    melee attacks and ranged attacks.
  pt-BR: 'Se você derrubar um inimigo, pode fazer imediatamente outro ataque no mesmo turno contra um novo inimigo ao seu alcance. O segundo ataque faz parte da mesma ação. Você pode usar esta habilidade com ataques corpo a corpo e ataques à distância.'
cost:
  pool: speed
  amount: 2
action_type: enabler
sources:
  - type: type
    id: warrior
    tier: 2
  - type: focus
    id: sailed-beneath-the-jolly-roger
    tier: 6
  - type: flavor
    id: combat
    tier: 3
