id: successive-attack
name:
  en: Successive Attack
  pt-BR: Ataque Sucessivo
description:
  en: >-
    If you take down a foe, you can immediately make another attack on
    that same turn against a new foe within your reach. The second
    attack is part of the same action. You can use this ability with
    melee attacks and ranged attacks.
  pt-BR: "Tradução em breve."
cost:
  pool: speed
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: is-wanted-by-the-law
    tier: 3
