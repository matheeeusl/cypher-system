id: command-spirit
name:
  en: Command Spirit
  pt-BR: Comandar Espírito
description:
  en: >-
    You can command a spirit or animated dead creature of up to level
    5 within short range. If you are successful, the target cannot
    attack you for one minute, during which time it follows your
    verbal commands if it can hear and understand you.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: shepherds-spirits
    tier: 3
