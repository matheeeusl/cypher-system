id: stashed-vehicle
name:
  en: Stashed Vehicle
  pt-BR: Veículo Escondido
description:
  en: >-
    You track down where you or a fellow prepper stashed a vehicle,
    pristinely stored to remain in working order with minimal repairs
    required. The vehicle has a viable power source (such as hundreds
    of gallons of gasoline treated to resist decomposition, or a
    rechargeable battery with options for solar or wind recharging).
    The vehicle could be an all-terrain vehicle (ATV), a truck, or
    something else; work with your GM to figure out the particulars.
  pt-BR: 'Você localiza onde você ou um colega preparacionista escondeu um veículo, guardado impecavelmente para permanecer em condições de funcionamento com o mínimo de reparos necessários. O veículo tem uma fonte de energia viável (como centenas de litros de gasolina tratada para resistir à decomposição, ou uma bateria recarregável com opções de recarga solar ou eólica). O veículo poderia ser um veículo todo-terreno (ATV), um caminhão, ou outra coisa; combine com seu Mestre para definir os detalhes.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: prepped-for-the-end
    tier: 3
