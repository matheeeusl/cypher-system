id: living-light
name:
  en: Living Light
  pt-BR: Luz Viva
description:
  en: Your body dissolves into a cloud of photons that instantly travel to a location you choose and then reform. You can choose any open space big enough to contain you that you can see within very long range, or any place you have lit by Illuminating Touch that is still shining. You disappear and almost instantly reappear in the space you chose. It takes until the end of the round for your body to become fully solid, so until the start of the next round, you take a maximum of 1 point of damage from any given attack or source of damage. Each level of Effort you apply allows you to bring along one additional person besides yourself, as long as they are within immediate range when you depart.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: blazes-with-radiance
    tier: 6
