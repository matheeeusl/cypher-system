id: force-wall
name:
  en: Force Wall
  pt-BR: Muralha de Força
description:
  en: You can trigger the energy in your Force Field Shield to expand outward in all directions to create an immobile plane of solid force up to 20 feet by 20 feet (6 m by 6 m) for up to one hour or until you take your shield back. (The force shield becomes the force wall.) The plane of the force wall conforms to the space available. While the force wall remains in place, you cannot use any of your other abilities that require Force Field Shield.
  pt-BR: Você pode acionar a energia de seu Escudo de Campo de Força para se expandir em todas as direções, criando um plano imóvel de força sólida de até 6 por 6 metros por até uma hora, ou até que retome seu escudo (o escudo de força se torna a muralha de força). O plano da muralha de força se adapta ao espaço disponível. Enquanto a muralha de força permanecer, você não pode usar nenhuma de suas outras habilidades que exijam o Escudo de Campo de Força.
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: brandishes-an-exotic-shield
    tier: 5
