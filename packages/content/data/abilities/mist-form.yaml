id: mist-form
name:
  en: Mist Form
  pt-BR: Forma de Névoa
description:
  en: >-
    You change into a cloud of mist for up to ten minutes, filling an
    immediate area. You gain an asset to sneaking tasks and Speed
    defense tasks, but you lose the benefit of any armor you wear. You
    can pass through any barrier that allows air to move through it
    (such as a fence, wire screen, cloth, or pipe), moving up to an
    immediate distance each round. You can't affect or be affected by
    normal matter, but energy attacks (like fire or explosions) and
    mental attacks still affect you. You cannot speak but can still
    use abilities that don't rely on human speech or affecting
    physical matter (other than yourself). If large portions of the
    mist are separated (such as behind a closed door) when you return
    to human form, you move one step down the damage track.
  pt-BR: 'Você se transforma em uma nuvem de névoa por até dez minutos, preenchendo uma área imediata. Você ganha um recurso em tarefas de furtividade e defesa de Velocidade, mas perde o benefício de qualquer armadura que estiver usando. Você pode passar por qualquer barreira que permita a passagem de ar (como uma cerca, tela de arame, tecido ou cano), movendo-se até uma distância imediata a cada round. Você não pode afetar nem ser afetada por matéria normal, mas ataques de energia (como fogo ou explosões) e ataques mentais ainda a afetam. Você não consegue falar, mas ainda pode usar habilidades que não dependem da fala humana ou de afetar matéria física (além de você mesma). Se grandes porções da névoa forem separadas (como atrás de uma porta fechada) quando você retornar à forma humana, você desce um nível no marcador de dano.'
  # Note: source tag is "Action to change or revert." — same tag as
  # animal-shape.
cost:
  pool: intellect
  amount: 4
action_type: action_to_change_or_revert
sources:
  - type: focus
    id: inks-spells-on-skin
    tier: 2
