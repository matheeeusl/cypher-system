id: perfect-direction
name:
  en: Perfect Direction
  pt-BR: Direção Perfeita
description:
  en: >-
    While in cyberspace, you can instantly return to any frame you've
    previously visited, bypassing any conduits or obstacles. You can
    transport willing creatures with you, with each creature
    requiring 1 additional Intellect point.
  pt-BR: 'Enquanto estiver no ciberespaço, você pode retornar instantaneamente a qualquer quadro que já tenha visitado, contornando quaisquer condutos ou obstáculos. Você pode transportar criaturas dispostas com você, cada criatura exigindo 1 ponto adicional de Intelecto.'
  # Note: source cost is printed as "5+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the baseline 5
  # Intellect points here, flagged for schema review (same approximation
  # used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: explores-cyberspace
    tier: 6
    cyberware: true
