id: contortionist
name:
  en: Contortionist
  pt-BR: Contorcionista
description:
  en: >-
    You can wriggle free from bindings or squeeze through a tight
    spot. You are trained in escaping. When you use an action to
    escape or move through a tight area, you can immediately use
    another action. You may use this action only to move.
  pt-BR: "Tradução em breve."
cost:
  pool: speed
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: stretches
    tier: 1
