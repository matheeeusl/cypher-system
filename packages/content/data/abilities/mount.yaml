id: mount
name:
  en: Mount
  pt-BR: Montaria
description:
  en: >-
    A level 3 creature serves you as a mount and follows your
    instructions. While you're mounted on it, the creature can move
    and you can attack on your turn, which provides an asset to your
    attack. You and the GM must work out the details of the creature,
    and you'll probably make rolls for it when it takes noncombat
    actions. The mount acts on your turn. If your mount dies, you can
    hunt in the wild for 3d6 days to find a new one.
  pt-BR: 'Uma criatura de nível 3 serve como sua montaria e segue suas instruções. Enquanto estiver montada nela, a criatura pode se mover e você pode atacar no seu turno, o que fornece um recurso ao seu ataque. Você e o Mestre devem definir os detalhes da criatura, e você provavelmente fará rolagens por ela quando realizar ações fora de combate. A montaria age no seu turno. Se sua montaria morrer, você pode caçar na natureza por 3d6 dias para encontrar uma nova.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 3
