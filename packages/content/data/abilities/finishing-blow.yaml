id: finishing-blow
name:
  en: Finishing Blow
  pt-BR: Golpe Final
description:
  en: >-
    If your foe is prone, stunned, or somehow helpless or
    incapacitated when you strike, you inflict 7 additional points of
    damage on a successful hit.
  pt-BR: 'Se seu inimigo estiver caído, atordoado, ou de alguma forma indefeso ou incapacitado quando você atacar, causa 7 pontos adicionais de dano em um acerto bem-sucedido.'
cost:
  pool: might
  amount: 5
action_type: enabler
sources:
  - type: type
    id: warrior
    tier: 6
  - type: focus
    id: feigns-no-fear
    tier: 6
