id: impart-ideal
name:
  en: Impart Ideal
  pt-BR: Transmitir Ideal
description:
  en: >-
    After interacting for at least one minute with a creature who can
    hear and understand you, you can attempt to temporarily impart an
    ideal to it that you could not otherwise convince it to adopt. An
    ideal is different than a specific suggestion or command; an ideal
    is an overarching value such as "All life is sacred," "My political
    party is the best," "Children should be seen, not heard," and so
    on. An ideal influences a creature's behavior but doesn't control
    it. The imparted ideal lasts as long as befits the situation, but
    usually at least a few hours. The ideal is jeopardized if someone
    friendly to the creature spends a minute or more bringing it back
    to its senses.
  pt-BR: 'Depois de interagir por pelo menos um minuto com uma criatura que consiga ouvi-lo e entendê-lo, você pode tentar transmitir temporariamente um ideal a ela que de outra forma não conseguiria convencê-la a adotar. Um ideal é diferente de uma sugestão ou comando específico; um ideal é um valor abrangente como "Toda vida é sagrada", "Meu partido político é o melhor", "Crianças devem ser vistas, não ouvidas", e assim por diante. Um ideal influencia o comportamento de uma criatura, mas não o controla. O ideal transmitido dura o tempo que a situação exigir, mas geralmente pelo menos algumas horas. O ideal fica em risco se alguém amigável à criatura passar um minuto ou mais tentando trazê-la de volta à razão.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: type
    id: speaker
    tier: 2
