id: asserting-your-privilege
name:
  en: Asserting Your Privilege
  pt-BR: Impondo Seu Privilégio
description:
  en: Acting as only a privileged person can, you verbally harangue a foe who can hear and understand you so forcefully that they are unable to take any action, including attacks, for one round. Whether you succeed or fail, the next action the target takes is hindered.
  pt-BR: Agindo como só uma pessoa privilegiada consegue, você repreende verbalmente um inimigo que possa ouvi-lo e entendê-lo com tanta força que ele fica incapaz de realizar qualquer ação, incluindo ataques, por uma rodada. Quer você tenha sucesso ou falhe, a próxima ação que o alvo realizar fica dificultada.
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: descends-from-nobility
    tier: 5
