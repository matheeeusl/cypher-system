id: repair-flesh
name:
  en: Repair Flesh
  pt-BR: Reparar Carne
description:
  en: When you touch an impaired or debilitated character, you can move them up one step on the damage track (for example, a debilitated PC becomes impaired, and an impaired one becomes hale). Alternatively, if you use this ability on a PC during a rest, you grant them a +2 bonus to their recovery roll.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: consorts-with-the-dead
    tier: 3
