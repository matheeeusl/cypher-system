id: lethal-vibration
name:
  en: Lethal Vibration
  pt-BR: Vibração Letal
description:
  en: >-
    You set up a lethal vibration in your own body and pass it to a
    creature you touch with a successful attack. If the target is
    level 2 or lower, it dies, exploding in a peal of thunder. If the
    target is level 3 or higher, it sustains 6 points of damage and is
    stunned on its next action. If the target is a PC of any tier,
    they move down one step on the damage track. In addition to the
    normal options for using Effort, you can choose to use Effort to
    affect a more powerful target (one level of Effort means a target
    of up to level 3 explodes and a target of level 4 or higher takes
    damage and is stunned, and so on).
  pt-BR: 'Você provoca uma vibração letal no seu próprio corpo e a transmite a uma criatura que tocar com um ataque bem-sucedido. Se o alvo for de nível 2 ou inferior, ele morre, explodindo em um estrondo de trovão. Se o alvo for de nível 3 ou superior, sofre 6 pontos de dano e fica atordoado na sua próxima ação. Se o alvo for um personagem de qualquer grau, ele desce um nível na trilha de dano. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para afetar um alvo mais poderoso (um nível de Esforço significa que um alvo de até nível 3 explode e um alvo de nível 4 ou superior sofre dano e fica atordoado, e assim por diante).'
cost:
  pool: might
  amount: 7
action_type: action
sources:
  - type: focus
    id: thunders
    tier: 6
