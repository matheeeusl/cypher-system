id: moon-shape
name:
  en: Moon Shape
  pt-BR: Forma Lunar
description:
  en: >-
    You change into a monstrous natural beast, such as a wolf, bear,
    or other terrestrial creature, for up to one hour. If you try to
    change during daylight hours when you are not deep underground
    (or otherwise away from the daylight), you must apply a level of
    Effort. In your new form, you add 8 points to your Might Pool,
    gain +2 to your Might Edge, add 2 points to your Speed Pool, and
    gain +2 to your Speed Edge. Reverting to your normal form is a
    difficulty 2 task. While in beast form, you are prone to fits of
    rage (triggered by GM intrusion), during which you attack every
    living creature within short range, and the only way to end the
    rage is to revert to your normal form. Either way, after you
    revert to your normal form, you take a -1 penalty to all rolls
    for one hour. If you did not kill and eat at least one
    substantial creature while in beast form, the penalty increases
    to -2 and affects all your rolls for the next day.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "4+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 4 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
  # Source tag is "Action to change; action to revert." — same
  # change-or-revert category as animal-shape/mist-form's "Action to
  # change or revert."
cost:
  pool: intellect
  amount: 4
action_type: action_to_change_or_revert
sources:
  - type: focus
    id: speaks-for-the-land
    tier: 4
