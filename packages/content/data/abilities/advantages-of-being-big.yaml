id: advantages-of-being-big
name:
  en: Advantages of Being Big
  pt-BR: Vantagens de Ser Grande
description:
  en: >-
    When you use Enlarge, you're so big that you can move massive
    objects more easily, climb buildings by using hand- and
    footholds unavailable to regular-sized people, and jump much
    farther. While you enjoy the effects of Enlarge, all climbing,
    lifting, and jumping tasks are eased.
  pt-BR: >-
    Ao usar *Ampliar*, você fica tão grande que consegue mover objetos
    enormes com mais facilidade, escalar prédios utilizando pontos de
    apoio para mãos e pés inacessíveis a pessoas de tamanho normal e saltar
    distâncias muito maiores. Enquanto você desfruta dos efeitos de *Ampliar*,
    todas as tarefas de escalar, levantar peso e saltar tornam-se mais fáceis.
cost: null
action_type: enabler
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 2
