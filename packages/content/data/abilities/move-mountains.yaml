id: move-mountains
name:
  en: Move Mountains
  pt-BR: Mover Montanhas
description:
  en: >-
    You exert a tremendous amount of physical force within 250 feet (75
    m) of you. You can push up to 10 tons (9 t) of material up to 50
    feet (15 m). This force can collapse buildings, redirect small
    rivers, or perform other dramatic effects.
  pt-BR: 'Você exerce uma quantidade tremenda de força física dentro de 75 metros (250 pés) de você. Você pode empurrar até 9 toneladas (10 toneladas) de material a até 15 metros (50 pés). Essa força pode derrubar edifícios, redirecionar pequenos rios, ou realizar outros efeitos dramáticos.'
cost:
  pool: intellect
  amount: 9
action_type: action
sources:
  - type: type
    id: adept
    tier: 6
