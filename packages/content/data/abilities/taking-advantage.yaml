id: taking-advantage
name:
  en: Taking Advantage
  pt-BR: Aproveitar a Vantagem
description:
  en: >-
    When your foe is weakened, dazed, stunned, moved down the damage
    track, or disadvantaged in some other way, your attacks against
    that foe are eased beyond any other modifications due to the
    disadvantage.
  pt-BR: 'Quando seu inimigo está enfraquecido, atordoado, aturdido, rebaixado no marcador de dano, ou em desvantagem de alguma outra forma, seus ataques contra esse inimigo são facilitados além de quaisquer outras modificações devido à desvantagem.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: sailed-beneath-the-jolly-roger
    tier: 2
  - type: focus
    id: scavenges
    tier: 3
