id: experienced-netrunner
name:
  en: Experienced Netrunner
  pt-BR: Netrunner Experiente
description:
  en: >-
    The more you practice netrunning, the more proficient you become.
    To flaunt your experience, roll a d6 when completing a netrunning
    task you have succeeded at previously. On an even result, the
    task you're attempting is eased by two steps. On a roll of 1, the
    task is hindered.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: explores-cyberspace
    tier: 3
