id: experienced-netrunner
name:
  en: Experienced Netrunner
  pt-BR: Netrunner Experiente
description:
  en: >-
    The more you practice netrunning, the more proficient you become.
    To flaunt your experience, roll a d6 when completing a netrunning
    task you have succeeded at previously. On an even result, the
    task you're attempting is eased by two steps. On a roll of 1, the
    task is hindered.
  pt-BR: 'Quanto mais você pratica netrunning, mais proficiente se torna. Para ostentar sua experiência, role 1d6 ao completar uma tarefa de netrunning na qual já teve sucesso anteriormente. Em um resultado par, a tarefa que está tentando é facilitada em dois níveis. Em uma rolagem de 1, a tarefa é dificultada.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: explores-cyberspace
    tier: 3
