id: iron-eye
name:
  en: Iron Eye
  pt-BR: Olho de Ferro
description:
  en: You inflict an additional 3 points of damage with any single-target attack spell cast through a firearm using Spell Bullet. If the attack spell doesn't inflict damage, you instead can modify the spell as if you had applied a level of Intellect Effort to it.
  pt-BR: 'Você causa 3 pontos adicionais de dano com qualquer feitiço de ataque de alvo único conjurado através de uma arma de fogo usando Bala de Feitiço. Se o feitiço de ataque não causar dano, você pode em vez disso modificá-lo como se tivesse aplicado um nível de Esforço de Intelecto a ele.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: conjures-bullets
    tier: 3
