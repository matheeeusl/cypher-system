id: flamboyant-boast
name:
  en: Flamboyant Boast
  pt-BR: Fanfarronice
description:
  en: >-
    You boastfully describe an act that you will accomplish, and then
    as part of the same action, you attempt it. If an average person
    would find the action difficult (or impossible) and you succeed
    on it, creatures who witnessed it who are not your allies are
    potentially dazed on their next turn, and all tasks they attempt
    are hindered. The GM will help you determine whether your boast is
    something that would impress onlookers so significantly. If you
    attempt the task you boast about but fail to accomplish it, all
    your attempts to affect or attack onlookers who saw you are
    hindered for about ten minutes.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: feigns-no-fear
    tier: 3
  - type: focus
    id: fights-with-panache
    tier: 3
