id: dreamcraft
name:
  en: Dreamcraft
  pt-BR: Ofício dos Sonhos
description:
  en: You pull an image from a dream into the waking world and place it somewhere within long range. The dream lasts for up to one minute, and it can be tiny or fill an area an immediate distance in diameter. Though it appears solid, the dream is intangible. The dream (a scene, a creature, or an object) is static unless you use your action each round to animate it. As part of that animation, you could move the dream up to a short distance each round, as long as it remains within long range. If you animate the dream, it can make sound but does not produce odor. Direct physical interaction or sustained interaction with the dream shatters it into dispersing mist. For example, attacking the dream shatters it, as does the strain of keeping up appearances when an NPC moves through a dream scene or engages a dream creature in conversation for more than a couple of rounds.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 1
# Note: source tag is "Action to initiate; action to animate." — not in
# the schema's action_type enum; approximated as action_to_initiate. See
# .population-status.md item 3.
action_type: action_to_initiate
sources:
  - type: focus
    id: awakens-dreams
    tier: 1
