id: dreamcraft
name:
  en: Dreamcraft
  pt-BR: Ofício dos Sonhos
description:
  en: You pull an image from a dream into the waking world and place it somewhere within long range. The dream lasts for up to one minute, and it can be tiny or fill an area an immediate distance in diameter. Though it appears solid, the dream is intangible. The dream (a scene, a creature, or an object) is static unless you use your action each round to animate it. As part of that animation, you could move the dream up to a short distance each round, as long as it remains within long range. If you animate the dream, it can make sound but does not produce odor. Direct physical interaction or sustained interaction with the dream shatters it into dispersing mist. For example, attacking the dream shatters it, as does the strain of keeping up appearances when an NPC moves through a dream scene or engages a dream creature in conversation for more than a couple of rounds.
  pt-BR: 'Você puxa uma imagem de um sonho para o mundo desperto e a coloca em algum lugar dentro de uma distância longa. O sonho dura até um minuto, e pode ser minúsculo ou preencher uma área com um diâmetro de distância imediata. Embora pareça sólido, o sonho é intangível. O sonho (uma cena, uma criatura ou um objeto) é estático a menos que você use sua ação a cada round para animá-lo. Como parte dessa animação, você poderia mover o sonho até uma distância curta a cada round, desde que permaneça dentro de uma distância longa. Se você animar o sonho, ele pode produzir som, mas não produz odor. Interação física direta ou interação sustentada com o sonho o despedaça em névoa que se dissipa. Por exemplo, atacar o sonho o despedaça, assim como o esforço de manter as aparências quando um PNJ se move através de uma cena onírica ou engaja uma criatura onírica em conversa por mais de alguns rounds.'
cost:
  pool: intellect
  amount: 1
# Note: source tag is "Action to initiate; action to animate."
action_type: action_to_initiate_and_animate
sources:
  - type: focus
    id: awakens-dreams
    tier: 1
