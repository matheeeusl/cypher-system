id: trapfinder
name:
  en: Trapfinder
  pt-BR: Caça-Armadilhas
description:
  en: >-
    You find any traps (like a floor that would give way beneath you)
    or mechanical triggers to a trap or defense system that might pose
    a threat. You can do this without setting them off and in lieu of
    making a roll to find them. This ability can find traps of level 4
    or below. In addition to the normal options for using Effort, you
    can choose to use Effort to increase the level of traps that can be
    found by 2, so using two levels of Effort can find all traps of
    level 8 or below.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: type
    id: explorer
    tier: 3
