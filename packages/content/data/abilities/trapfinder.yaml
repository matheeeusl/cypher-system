id: trapfinder
name:
  en: Trapfinder
  pt-BR: Caça-Armadilhas
description:
  en: >-
    You find any traps (like a floor that would give way beneath you)
    or mechanical triggers to a trap or defense system that might pose
    a threat. You can do this without setting them off and in lieu of
    making a roll to find them. This ability can find traps of level 4
    or below. In addition to the normal options for using Effort, you
    can choose to use Effort to increase the level of traps that can be
    found by 2, so using two levels of Effort can find all traps of
    level 8 or below.
  pt-BR: 'Você encontra quaisquer armadilhas (como um piso que cederia sob seus pés) ou gatilhos mecânicos de uma armadilha ou sistema de defesa que possa representar uma ameaça. Você pode fazer isso sem acioná-las e sem precisar fazer uma rolagem para encontrá-las. Esta habilidade consegue encontrar armadilhas de nível 4 ou inferior. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar em 2 o nível das armadilhas que podem ser encontradas, então usar dois níveis de Esforço permite encontrar todas as armadilhas de nível 8 ou inferior.'
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: type
    id: explorer
    tier: 3
