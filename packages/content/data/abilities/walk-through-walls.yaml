id: walk-through-walls
name:
  en: Walk Through Walls
  pt-BR: Atravessar Paredes
description:
  en: >-
    You can slowly pass through physical barriers at a rate of 1 inch
    (2.5 cm) per round (minimum of one round to pass through any
    barrier). You can't act (other than moving) or perceive anything
    until you pass entirely through the barrier. You can't pass
    through energy barriers.
  pt-BR: 'Você consegue atravessar lentamente barreiras físicas a uma taxa de 2,5 centímetros (1 polegada) por round (mínimo de um round para atravessar qualquer barreira). Você não pode agir (além de se mover) nem perceber nada até atravessar completamente a barreira. Você não pode atravessar barreiras de energia.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 3
