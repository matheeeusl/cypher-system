id: walk-through-walls
name:
  en: Walk Through Walls
  pt-BR: Atravessar Paredes
description:
  en: >-
    You can slowly pass through physical barriers at a rate of 1 inch
    (2.5 cm) per round (minimum of one round to pass through any
    barrier). You can't act (other than moving) or perceive anything
    until you pass entirely through the barrier. You can't pass
    through energy barriers.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 3
