id: one-with-the-wild
name:
  en: One With the Wild
  pt-BR: Um com a Natureza
description:
  en: >-
    For the next hour, natural animals and plants within long range
    will not knowingly harm you or those you designate. In addition,
    your Might Edge, Speed Edge, and Intellect Edge increase by 1, and
    if you make any recovery rolls during this period, you recover
    twice as many points.
  pt-BR: 'Pela próxima hora, animais e plantas naturais dentro de uma distância longa não a prejudicarão intencionalmente, nem a quem você designar. Além disso, sua Margem de Força, Margem de Velocidade e Margem de Intelecto aumentam em 1, e se você fizer alguma rolagem de recuperação durante esse período, recupera o dobro de pontos.'
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 6
