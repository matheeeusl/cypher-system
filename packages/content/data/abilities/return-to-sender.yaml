id: return-to-sender
name:
  en: Return to Sender
  pt-BR: Devolução ao Remetente
description:
  en: >-
    If you succeed at a Speed defense task against a melee attack, you
    can make an immediate melee attack against your foe. You can use
    this ability only once per round.
  pt-BR: 'Se você tiver sucesso em uma tarefa de defesa de Velocidade contra um ataque corpo a corpo, pode fazer um ataque corpo a corpo imediato contra seu inimigo. Você só pode usar esta habilidade uma vez por round.'
cost:
  pool: speed
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: fights-with-panache
    tier: 6
  - type: flavor
    id: stealth
    tier: 5
