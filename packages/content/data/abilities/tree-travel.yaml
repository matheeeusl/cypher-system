id: tree-travel
name:
  en: Tree Travel
  pt-BR: Viagem pelas Árvores
description:
  en: >-
    You enter one tree and instantaneously and safely emerge from
    another one within long distance. You don't need to specify which
    tree you're exiting from (if you know there are trees in that
    direction, you can decide how far to go and you will step out of
    a tree in that area). If the starting tree's trunk isn't as large
    as your body, you must apply a level of Effort to enter it. You
    can choose to use Effort to increase the distance you travel; one
    level of Effort used in this way increases the range to very
    long, two levels raise it to one mile (1.5 km), and each
    additional level of Effort beyond that increases it by an
    additional mile.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "4+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 4 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: walks-the-wild-woods
    tier: 4
