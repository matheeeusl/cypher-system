id: no-one-knows-better
name:
  en: No One Knows Better
  pt-BR: Ninguém Sabe Melhor
description:
  en: >-
    You are trained in two of the following skills: persuasion,
    deception, intimidation, research, knowledge in one area, or
    seeing through deception. If you choose a skill in which you're
    already trained, you become specialized in that skill instead.
  pt-BR: 'Você é treinada em duas das seguintes perícias: persuasão, decepção, intimidação, pesquisa, conhecimento em uma área, ou ver através de decepção. Se escolher uma perícia na qual já é treinada, torna-se especializada nela em vez disso.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: interprets-the-law
    tier: 5
