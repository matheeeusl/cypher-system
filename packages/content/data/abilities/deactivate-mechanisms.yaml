id: deactivate-mechanisms
name:
  en: Deactivate Mechanisms
  pt-BR: Desativar Mecanismos por Completo
description:
  en: You make a melee attack that inflicts no damage against a machine. Instead, if the attack hits, make a second Speed-based roll. If successful, a machine of level 3 or lower is deactivated for one minute. For each additional level of Effort applied, you can affect one higher level of machine or you can extend the duration for an additional minute. If you have the Scramble Machine or Disable Mechanisms ability (or an ability that works similarly), when you apply a level of Effort to any of them, you gain an additional free level of Effort.
  pt-BR: Você faz um ataque corpo a corpo que não causa dano contra uma máquina. Em vez disso, se o ataque acertar, faça uma segunda rolagem baseada em Agilidade. Se for bem-sucedida, uma máquina de nível 3 ou menor é desativada por um minuto. Para cada nível adicional de Esforço aplicado, você pode afetar uma máquina de nível mais alto ou estender a duração por mais um minuto. Se você tiver a habilidade Máquina Embaralhada ou Desativar Mecanismos (ou uma habilidade que funcione de forma semelhante), ao aplicar um nível de Esforço a qualquer uma delas, você ganha um nível adicional gratuito de Esforço.
cost:
  pool: speed
  amount: 5
action_type: action
sources:
  - type: focus
    id: battles-robots
    tier: 6
