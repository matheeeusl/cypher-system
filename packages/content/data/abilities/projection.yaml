id: projection
name:
  en: Projection
  pt-BR: Projeção
description:
  en: >-
    You project an image of yourself to any location you have seen or
    previously visited. Distance does not matter as long as the
    location is on the same world as you. The projection copies your
    appearance, movements, and any sounds you make for the next ten
    minutes. Anyone present at the location can see and hear you as if
    you were there. However, you do not perceive through your
    projection.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: type
    id: adept
    tier: 4
