id: tap-currents
name:
  en: Tap Currents
  pt-BR: Captar Correntes
description:
  en: >-
    You can draw energy from the earth itself into your body. If you
    concentrate and don't move from where you're standing for one
    minute, you restore 3 points to your Might or Speed Pool. Once
    you use this ability, you can't use it again until you've made a
    ten-hour recovery roll. If you have the Store Energy ability, you
    can instead use Tap Currents to add 3 points to your Siphon Pool.
    (This use of this ability is not limited to one use per ten-hour
    recovery roll.)
  pt-BR: 'Você pode extrair energia da própria terra para seu corpo. Se você se concentrar e não se mover de onde está por um minuto, restaura 3 pontos à sua Reserva de Força ou Velocidade. Uma vez que você usa esta habilidade, não pode usá-la novamente até ter feito uma rolagem de recuperação de dez horas. Se você tiver a habilidade Armazenar Energia, pode em vez disso usar Captar Correntes para adicionar 3 pontos à sua Reserva de Captação. (Esse uso desta habilidade não está limitado a uma vez por rolagem de recuperação de dez horas.)'
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: transmits-energy
    tier: 3
