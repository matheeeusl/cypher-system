id: shatter
name:
  en: Shatter
  pt-BR: Estilhaçar
description:
  en: >-
    You interrupt the fundamental force holding normal matter together
    for a moment, causing the detonation of an object you choose within
    long range. The object must be a small, mundane item composed of
    homogeneous matter (such as a clay cup, an iron ingot, a stone, and
    so on). The object explodes in an immediate radius, dealing 1 point
    of damage to all creatures and objects in the area. If you apply
    Effort to increase the damage, you deal 2 additional points of
    damage per level of Effort (instead of 3 points); targets in the
    area take 1 point of damage even if you fail the attack roll.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "2+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 2 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: adept
    tier: 1
