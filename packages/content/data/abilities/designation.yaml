id: designation
name:
  en: Designation
  pt-BR: Designação
description:
  en: >-
    You assign an innocent or guilty label to one creature within
    immediate range, based on your assessment of a given situation or
    a predominant feeling. In other words, someone who is labeled
    innocent can be innocent in a certain circumstance, or they can be
    generally innocent of terrible crimes (such as murder, major
    theft, and so on). Likewise, you can declare that a creature is
    guilty of a particular crime or of terrible deeds in general. The
    accuracy of your assessment isn't important as long as you believe
    it to be the truth; the GM may require you to give a rationale.
    Henceforth, your tasks to socially interact with someone you
    designate as innocent gain an asset, and your attacks against
    those you designate as guilty gain an asset. You can change your
    assessment, but it requires another designation action. The
    benefits of the designation last until you change it or until you
    are shown proof that it is wrong.
  pt-BR: 'Você atribui um rótulo de inocente ou culpado a uma criatura dentro de uma distância imediata, com base na sua avaliação de uma dada situação ou de um sentimento predominante. Em outras palavras, alguém rotulado como inocente pode ser inocente em determinada circunstância, ou pode ser geralmente inocente de crimes graves (como assassinato, grande roubo, e assim por diante). Da mesma forma, você pode declarar que uma criatura é culpada de um crime específico ou de atos terríveis em geral. A precisão da sua avaliação não importa, desde que você acredite ser a verdade; o Mestre pode exigir que você dê uma justificativa. Doravante, suas tarefas de interação social com alguém que você designar como inocente ganham um recurso, e seus ataques contra aqueles que você designar como culpados ganham um recurso. Você pode mudar sua avaliação, mas isso exige outra ação de designação. Os benefícios da designação duram até que você a mude ou até que lhe mostrem provas de que está errada.'
  # Note: source adds a further sentence outside the tier entry itself:
  # "The benefits provided by Designation apply to the character using
  # the ability, their allies, and anyone who hears or is told of their
  # judgment and believes their assessment." — folded into the
  # description above rather than kept as separate sidebar prose, since
  # the schema has no field for it.
cost: null
action_type: action
sources:
  - type: focus
    id: metes-out-justice
    tier: 1
