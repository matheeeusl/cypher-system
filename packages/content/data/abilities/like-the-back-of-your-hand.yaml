id: like-the-back-of-your-hand
name:
  en: Like the Back of Your Hand
  pt-BR: Como a Palma da Mão
description:
  en: All tasks directly related to a starcraft that you own or have a direct connection with are eased. Tasks include repair, refueling, finding a breach in the hull, finding a stowaway, and so on. The same goes for any attack or defense rolls you make within the starcraft against enemy boarders, as well as any attack or defense rolls you make with the ship against enemy ships.
  pt-BR: Todas as tarefas diretamente relacionadas a uma nave estelar que você possui ou com a qual tem uma conexão direta são facilitadas. As tarefas incluem reparo, reabastecimento, encontrar uma brecha no casco, encontrar um clandestino, e assim por diante. O mesmo vale para quaisquer rolagens de ataque ou defesa que você fizer dentro da nave contra invasores inimigos, assim como quaisquer rolagens de ataque ou defesa que fizer com a nave contra naves inimigas.
cost: null
action_type: enabler
sources:
  - type: focus
    id: pilots-starcraft
    tier: 5
