id: sensor
name:
  en: Sensor
  pt-BR: Sensor
description:
  en: You create an immobile, invisible sensor within immediate range that lasts for 24 hours. At any time during that duration, you can concentrate to see, hear, and smell through the sensor, no matter how far you move from it. The sensor doesn't grant you sensory capabilities beyond the norm. If you also have this ability from another source, it lasts twice as long.
  pt-BR: Você cria um sensor imóvel e invisível a alcance imediato que dura 24 horas. A qualquer momento durante essa duração, você pode se concentrar para ver, ouvir e sentir cheiros através do sensor, não importa a distância que se mova dele. O sensor não concede capacidades sensoriais além do normal. Se você também tiver esta habilidade de outra fonte, ela dura o dobro do tempo.
cost:
  pool: intellect
  amount: 4
# Note: source tag is "Action to create; action to check." Same tag as
# trail-sensor.
action_type: action_to_create_and_check
sources:
  - type: type
    id: adept
    tier: 3
  - type: focus
    id: sees-beyond
    tier: 3
  - type: focus
    id: separates-mind-from-body
    tier: 4
  - type: flavor
    id: divination
    tier: 4
  - type: flavor
    id: modern-magic
    tier: 3
