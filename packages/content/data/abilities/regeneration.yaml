id: regeneration
name:
  en: Regeneration
  pt-BR: Regeneração
description:
  en: >-
    You restore points to a target's Might or Speed Pool in one of
    two ways: either the chosen Pool regains up to 6 points, or it is
    restored to a total value of 12. You make this decision when you
    initiate this ability. Points are regenerated at a rate of 1
    point each round. You must remain within immediate range of the
    target the whole time, either touching them or conversing with
    them. In no case can this raise a Pool higher than its maximum.
  pt-BR: 'Você restaura pontos à Reserva de Força ou Velocidade de um alvo de uma de duas formas: ou a Reserva escolhida recupera até 6 pontos, ou é restaurada a um valor total de 12. Você toma essa decisão ao iniciar esta habilidade. Os pontos são regenerados a uma taxa de 1 ponto por round. Você deve permanecer dentro de uma distância imediata do alvo o tempo todo, tocando-o ou conversando com ele. Em nenhum caso isso pode elevar uma Reserva acima do seu máximo.'
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: type
    id: adept
    tier: 4
  - type: type
    id: speaker
    tier: 5
  - type: focus
    id: made-a-deal-with-death
    tier: 4
