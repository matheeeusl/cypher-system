id: escape-the-ruins
name:
  en: Escape the Ruins
  pt-BR: Escapar das Ruínas
description:
  en: >-
    While in any area containing ruins from before the apocalypse,
    you find or create a significant shortcut, secret entrance, or
    emergency escape route where it looked like none existed. Doing
    so requires that you succeed on an Intellect action whose
    difficulty is set by the GM based on the situation. You and the
    GM should work out the details.
  pt-BR: 'Enquanto estiver em qualquer área contendo ruínas de antes do apocalipse, você encontra ou cria um atalho significativo, entrada secreta ou rota de fuga de emergência onde parecia não haver nenhuma. Fazer isso exige sucesso em uma ação de Intelecto cuja dificuldade é definida pelo Mestre com base na situação. Você e o Mestre devem definir os detalhes.'
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: remembers-the-past
    tier: 6
