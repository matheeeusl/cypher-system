id: third-eye
name:
  en: Third Eye
  pt-BR: Terceiro Olho
description:
  en: >-
    You visualize a place within short range and cast your mind to
    that place, creating an immobile, invisible sensor for one minute
    or until you choose to end this ability. While using your third
    eye, you see through your sensor instead of your eyes using your
    normal visual abilities. You may perceive the area around your
    body using your other senses as normal.
  pt-BR: 'Você visualiza um local dentro de uma distância curta e projeta sua mente até lá, criando um sensor imóvel e invisível por um minuto ou até você optar por encerrar esta habilidade. Enquanto usa seu terceiro olho, você vê através do seu sensor em vez de seus olhos usando suas habilidades visuais normais. Você pode perceber a área ao redor do seu corpo usando seus outros sentidos normalmente.'
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: focus
    id: separates-mind-from-body
    tier: 1
