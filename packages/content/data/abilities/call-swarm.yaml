id: call-swarm
name:
  en: Call Swarm
  pt-BR: Chamar Enxame
description:
  en: >-
    If you're in a location where it's possible for the creatures
    from your Influence Swarm ability to come, you call a swarm of
    them for one hour. During this hour, they do as you
    telepathically command as long as they are within long range.
    They can swarm about and hinder any or all opponents' tasks.
    While the creatures are in long range, you can speak to them
    telepathically and perceive through their senses.
  pt-BR: 'Se você estiver em um local onde seja possível que as criaturas da sua habilidade Influenciar Enxame venham até você, você convoca um enxame delas por uma hora. Durante essa hora, elas fazem o que você comanda telepaticamente, desde que estejam dentro de uma distância longa. Elas podem se aglomerar e dificultar quaisquer tarefas de oponentes. Enquanto as criaturas estiverem dentro da distância longa, você pode falar com elas telepaticamente e perceber através de seus sentidos.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 4
