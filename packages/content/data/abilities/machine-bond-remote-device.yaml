# Not the same ability as `machine-bond` (Hacks the Network, tier 6): this flavor prints a different text under the same name.
id: machine-bond-remote-device
name:
  en: Machine Bond
  pt-BR: Vínculo com a Máquina
description:
  en: From very long range, you can activate and control a device (including a robot or
    vehicle) that you have bonded with. For example, you can detonate a manifest cypher
    even when it is held by someone else, or cause an automated turret to fire where you
    direct. Bonding is a process that requires 24 hours of meditation in the presence of
    the machine.
  pt-BR: De uma distância muito longa, você pode ativar e controlar um dispositivo
    (inclusive um robô ou veículo) ao qual esteja vinculado. Por exemplo, pode detonar uma
    cifra manifesta mesmo quando ela está nas mãos de outra pessoa, ou fazer uma torre
    automatizada disparar onde você mandar. O vínculo é um processo que exige 24 horas de
    meditação na presença da máquina.
cost: null
action_type: action
sources:
  - type: flavor
    id: technology
    tier: 4
