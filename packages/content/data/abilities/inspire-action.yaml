id: inspire-action
name:
  en: Inspire Action
  pt-BR: Inspirar Ação
description:
  en: >-
    If one ally can see and easily understand you, you can instruct
    that ally to take an action. If the ally chooses to take that
    exact action, they can do so as an additional action immediately.
    Doing so doesn't interfere with the ally taking a normal action on
    their turn.
  pt-BR: 'Se um aliado consegue vê-lo e entendê-lo facilmente, você pode instruí-lo a realizar uma ação. Se o aliado optar por realizar exatamente essa ação, pode fazê-lo como uma ação adicional imediatamente. Fazer isso não interfere no aliado realizar uma ação normal no seu turno.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: steers-the-coven
    tier: 3
  - type: focus
    id: works-miracles
    tier: 4
