id: frenzy
name:
  en: Frenzy
  pt-BR: Frenesi
description:
  en: >-
    When you wish, while in combat, you can enter a state of frenzy.
    While in this state, you can't use Intellect points, but you gain
    +1 to your Might Edge and your Speed Edge. This effect lasts as
    long as you wish, but it ends if no combat is taking place within
    range of your senses.
  pt-BR: 'Quando desejar, durante o combate, você pode entrar em um estado de frenesi. Nesse estado, não pode usar pontos de Intelecto, mas ganha +1 na sua Margem de Força e na sua Margem de Velocidade. Esse efeito dura enquanto você desejar, mas termina se nenhum combate estiver ocorrendo dentro do alcance dos seus sentidos.'
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: rages
    tier: 1
