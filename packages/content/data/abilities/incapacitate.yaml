id: incapacitate
name:
  en: Incapacitate
  pt-BR: Incapacitar
description:
  en: >-
    You use necromantic magic to make one creature in short range
    fall prone and be unable to take actions for one round.
  pt-BR: 'Você usa magia necromântica para fazer uma criatura dentro de uma distância curta cair no chão e ficar incapaz de realizar ações por um round.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: inks-spells-on-skin
    tier: 4
