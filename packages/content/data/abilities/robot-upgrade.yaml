id: robot-upgrade
name:
  en: Robot Upgrade
  pt-BR: Aprimoramento Robótico
description:
  en: >-
    You modify your artificial assistant from the Robot Assistant ability
    with one new capability. Standard options include the following. Work
    with your GM if you prefer a different capability. Cypher Pod: The
    robot can carry one extra manifest cypher for you. Flight: The robot
    can fly a long distance each round. It can carry you, but only for up
    to an hour between each of your ten-hour recovery rolls. Force Shield:
    The robot can erect an opaque level 5 force field around itself and
    anyone within 10 feet (3 m) of it for one minute (or until it is
    destroyed). It cannot do so again until after your next recovery roll.
    Mounted Laser Configuration: The robot can reconfigure itself and
    become an immobile laser weapon on a gimbal mount. In this
    configuration, the robot is a heavy weapon that deals 7 points of
    damage. If the robot acts as an autonomous turret, treat it as one
    level lower than its normal level. However, if the laser is fired by
    you or someone else who has your permission, the laser attacks are
    eased.
  pt-BR: 'Você modifica seu assistente artificial da habilidade Assistente Robótico com uma nova capacidade. As opções padrão incluem as seguintes. Combine com seu Mestre se preferir uma capacidade diferente. Compartimento de Cifras: O robô pode carregar uma cifra manifesta extra para você. Voo: O robô pode voar uma distância longa a cada round. Ele pode carregá-lo, mas apenas por até uma hora entre cada uma das suas rolagens de recuperação de dez horas. Escudo de Força: O robô pode erguer um campo de força opaco de nível 5 ao seu redor e ao redor de qualquer um dentro de 3 metros (10 pés) dele por um minuto (ou até ser destruído). Ele não pode fazer isso novamente até depois da sua próxima rolagem de recuperação. Configuração de Laser Montado: O robô pode se reconfigurar e se tornar uma arma de laser imóvel em um suporte giratório. Nessa configuração, o robô é uma arma pesada que causa 7 pontos de dano. Se o robô agir como uma torreta autônoma, trate-o como um nível abaixo do seu nível normal. Porém, se o laser for disparado por você ou por outra pessoa com sua permissão, os ataques de laser são facilitados.'
  # Note: each of the 4 upgrade options prints its own action_type tag
  # (Cypher Pod: Enabler. / Flight: Enabler. / Force Shield: Action. /
  # Mounted Laser Configuration: "Action to reconfigure; action to return
  # to normal robot configuration."), not one tag for the whole ability —
  # a per-option-tag shape the schema doesn't model. Recorded as enabler
  # (2 of the 4 options are enablers; the ability's baseline effect is
  # choosing a static modification), flagged for schema review.
cost: null
action_type: enabler
sources:
  - type: focus
    id: builds-robots
    tier: 4
  - type: focus
    id: builds-robots
    tier: 6
