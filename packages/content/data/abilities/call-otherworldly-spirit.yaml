id: call-otherworldly-spirit
name:
  en: Call Otherworldly Spirit
  pt-BR: Chamar Espírito de Outro Mundo
description:
  en: >-
    You summon a spirit creature that manifests for up to a day (or
    less, if it accomplishes something important to it before then),
    after which it fades away and cannot be summoned again. The
    spirit is a creature of level 6 or lower, and it can be
    substantial or insubstantial as it wishes (using an action to
    change). The spirit is not beholden to you, and it does not need
    to stay near you to remain manifest.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: shepherds-spirits
    tier: 6
