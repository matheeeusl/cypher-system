id: gain-unusual-companion
name:
  en: Gain Unusual Companion
  pt-BR: Ganhar Companheiro Incomum
description:
  en: >-
    You gain a special specimen as a constant companion. It is
    level 4, probably the size of a small dog, and follows your
    telepathic commands. You and the GM must work out the details of
    your creature, and you'll probably make rolls for it in combat
    or when it takes actions. The companion acts on your turn. If
    your companion dies, you can hunt in the wild for 1d6 days to
    find a new one.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: masters-the-swarm
    tier: 5
