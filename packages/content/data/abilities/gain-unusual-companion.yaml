id: gain-unusual-companion
name:
  en: Gain Unusual Companion
  pt-BR: Ganhar Companheiro Incomum
description:
  en: >-
    You gain a special specimen as a constant companion. It is
    level 4, probably the size of a small dog, and follows your
    telepathic commands. You and the GM must work out the details of
    your creature, and you'll probably make rolls for it in combat
    or when it takes actions. The companion acts on your turn. If
    your companion dies, you can hunt in the wild for 1d6 days to
    find a new one.
  pt-BR: 'Você ganha um espécime especial como companheiro constante. Ele é de nível 4, provavelmente do tamanho de um cão pequeno, e obedece seus comandos telepáticos. Você e o Mestre devem definir os detalhes da sua criatura, e você provavelmente fará rolagens por ela em combate ou quando realizar ações. O companheiro age no seu turno. Se seu companheiro morrer, você pode caçar na natureza por 1d6 dias para encontrar um novo.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: masters-the-swarm
    tier: 5
