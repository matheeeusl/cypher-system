id: escape
name:
  en: Escape
  pt-BR: Escapar
description:
  en: >-
    You slip your restraints, squeeze through the bars, break the grip
    of a creature holding you, pull free from sucking quicksand, or
    otherwise get loose from whatever is holding you in place.
  pt-BR: 'Você se solta de suas amarras, se espreme entre as grades, quebra o aperto de uma criatura que o segura, se liberta de areia movediça, ou de outra forma se solta do que quer que o esteja prendendo no lugar.'
cost:
  pool: speed
  amount: 2
action_type: action
sources:
  - type: type
    id: explorer
    tier: 2
