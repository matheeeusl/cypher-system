id: zero-dark-eyes
name:
  en: Zero Dark Eyes
  pt-BR: Olhos na Escuridão Total
description:
  en: >-
    Some people's eyes are degraded by constantly playing games. And
    maybe that'll happen to you, but not yet. You're still young and
    instead of degrading, your vision is actually better thanks to
    all your practice. You can see in very dim light as though it
    were bright light. You can see in total darkness as if it were
    very dim light.
  pt-BR: 'Os olhos de algumas pessoas se degradam de tanto jogar. E talvez isso aconteça com você também, mas ainda não. Você ainda é jovem e, em vez de degradar, sua visão na verdade melhorou graças a toda a sua prática. Você consegue enxergar em luz muito fraca como se fosse luz forte. Você consegue enxergar na escuridão total como se fosse luz muito fraca.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: plays-too-many-games
    tier: 2
