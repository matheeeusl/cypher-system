id: destined-for-greatness
name:
  en: Destined for Greatness
  pt-BR: Destinado à Grandeza
description:
  en: >-
    You enjoy uncanny luck as if something was watching over you and
    keeping you from harm. When you would otherwise descend a step on
    the damage track, make an Intellect defense roll versus the
    difficulty set by the level of the foe or effect. If you succeed,
    you do not descend that step. If the step was because you fell to
    0 points in a Pool, you are still at 0 points; you just don't
    suffer the negative effects of being impaired or debilitated. If
    you would otherwise descend the final step on the damage track to
    death, a successful defense roll keeps you at 1 point in one Pool,
    and you remain debilitated.
  pt-BR: "Tradução em breve."
  # Note: source text is near-identical to `courting-lady-luck`
  # (Gambles It All Away) — same mechanic, reworded intro sentence, and
  # a different printed name — kept as a separate ability per the
  # established different-name convention.
cost: null
action_type: enabler
sources:
  - type: focus
    id: made-a-deal-with-death
    tier: 2
