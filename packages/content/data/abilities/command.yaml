id: command
name:
  en: Command
  pt-BR: Comandar
description:
  en: >-
    Through sheer force of will, you can issue a simple imperative
    command to a single living creature, who then attempts to carry
    out your command as its next action. The creature must be within
    short range and able to understand you. The command can't inflict
    direct harm on the creature or its allies, so "Commit suicide"
    won't work, but "Flee" might. In addition, the command can require
    the creature to take only one action, so "Unlock the door" might
    work, but "Unlock the door and run through it" won't. A commanded
    creature can still defend itself normally and return an attack if
    one is made on it. If you possess another ability that allows you
    to command a creature, you can target two creatures at once as
    your base effect if you use either ability.
  pt-BR: 'Através de pura força de vontade, você pode dar uma ordem simples e imperativa a uma única criatura viva, que então tenta cumprir seu comando como sua próxima ação. A criatura deve estar dentro de uma distância curta e conseguir compreendê-lo. O comando não pode infligir dano direto à criatura ou a seus aliados, então "Cometa suicídio" não funcionaria, mas "Fuja" poderia. Além disso, o comando só pode exigir que a criatura realize uma única ação, então "Destranque a porta" poderia funcionar, mas "Destranque a porta e passe correndo por ela" não. Uma criatura comandada ainda pode se defender normalmente e revidar um ataque, se sofrer um. Se você possuir outra habilidade que permita comandar uma criatura, pode ter como alvo duas criaturas ao mesmo tempo como seu efeito base ao usar qualquer uma das habilidades.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: inks-spells-on-skin
    tier: 3
