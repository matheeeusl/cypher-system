id: necromancy
name:
  en: Necromancy
  pt-BR: Necromancia
description:
  en: >-
    You animate the body of a dead creature of approximately your
    size or smaller, creating a level 1 creature. It has none of the
    intelligence, memories, or special abilities that it had in life.
    The creature follows your verbal commands for one hour, after
    which it becomes an inert corpse. Unless the creature is killed by
    damage, you can reanimate it again when its time expires, but any
    damage it had when it became inert applies to its newly reanimated
    state. If you have access to multiple bodies, you can create an
    additional undead creature for each additional Intellect point you
    spend when you activate the ability.
  pt-BR: 'Você anima o corpo de uma criatura morta de tamanho aproximado ao seu ou menor, criando uma criatura de nível 1. Ela não tem nenhuma da inteligência, memórias ou habilidades especiais que tinha em vida. A criatura segue seus comandos verbais por uma hora, após o que se torna um cadáver inerte. A menos que a criatura seja morta por dano, você pode reanimá-la novamente quando seu tempo expirar, mas qualquer dano que tinha ao ficar inerte se aplica ao seu estado recém-reanimado. Se tiver acesso a múltiplos corpos, você pode criar uma criatura morta-viva adicional para cada ponto de Intelecto adicional que gastar ao ativar a habilidade.'
  # Note: source tag is "Action to animate." Also used (verbatim) by
  # greater-necromancy and true-necromancy in this same Focus.
  # Cost is printed as "3+ Intellect points" — the schema's cost field
  # can't represent an open-ended "+". Recorded as the baseline 3
  # Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action_to_animate
sources:
  - type: focus
    id: consorts-with-the-dead
    tier: 2
  - type: focus
    id: turns-decay-to-growth
    tier: 3
