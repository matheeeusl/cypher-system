id: assume-control
name:
  en: Assume Control
  pt-BR: Assumir Controle
description:
  en: >-
    You control the actions of another creature you have interacted
    with or studied for at least a round. This effect lasts for ten
    minutes. The target must be level 2 or lower. Once you have assumed
    control, the target acts as if it wants to accomplish your desire
    to the best of its ability, freely using its own best judgment
    unless you use an action to give it a specific instruction on an
    issue-by-issue basis. In addition to the normal options for using
    Effort, you can choose to use Effort to increase the maximum level
    of the target. Thus, to attempt to command a level 5 target (three
    levels above the normal limit), you must apply three levels of
    Effort. When the effect ends, the target remembers everything that
    happened and reacts according to its nature and your relationship
    to it; assuming control might have soured that relationship if it
    was previously a positive one.
  pt-BR: 'Você controla as ações de outra criatura com quem interagiu ou que estudou por pelo menos um round. Este efeito dura dez minutos. O alvo deve ser de nível 2 ou inferior. Uma vez assumido o controle, o alvo age como se quisesse realizar seu desejo da melhor forma possível, usando livremente seu próprio julgamento, a menos que você use uma ação para dar-lhe uma instrução específica caso a caso. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o nível máximo do alvo. Assim, para tentar comandar um alvo de nível 5 (três níveis acima do limite normal), você deve aplicar três níveis de Esforço. Quando o efeito termina, o alvo se lembra de tudo o que aconteceu e reage de acordo com sua natureza e sua relação com você; assumir o controle pode ter azedado essa relação, se ela era positiva anteriormente.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 6
