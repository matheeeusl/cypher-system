id: break-the-ranks
name:
  en: Break the Ranks
  pt-BR: Romper as Fileiras
description:
  en: >-
    You move up to a short distance and attack up to four different
    foes as a single action as long as they are all along your path.
    Any modifiers that apply to one attack apply to all the attacks
    you make. If you have another special ability that allows you to
    move and take an action, when you use Break the Ranks, you gain
    an asset to attacking these foes.
  pt-BR: 'Você se move até uma distância curta e ataca até quatro inimigos diferentes como uma única ação, desde que todos estejam ao longo do seu caminho. Quaisquer modificadores que se apliquem a um ataque se aplicam a todos os ataques que você faz. Se você tiver outra habilidade especial que permita se mover e realizar uma ação, ao usar Romper as Fileiras você ganha um recurso ao atacar esses inimigos.'
cost:
  pool: speed
  amount: 6
action_type: action
sources:
  - type: focus
    id: stretches
    tier: 6
attack: true
