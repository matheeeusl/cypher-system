id: break-the-ranks
name:
  en: Break the Ranks
  pt-BR: Romper as Fileiras
description:
  en: >-
    You move up to a short distance and attack up to four different
    foes as a single action as long as they are all along your path.
    Any modifiers that apply to one attack apply to all the attacks
    you make. If you have another special ability that allows you to
    move and take an action, when you use Break the Ranks, you gain
    an asset to attacking these foes.
  pt-BR: 'Tradução em breve.'
cost:
  pool: speed
  amount: 6
action_type: action
sources:
  - type: focus
    id: stretches
    tier: 6
