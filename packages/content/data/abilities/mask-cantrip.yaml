id: mask-cantrip
name:
  en: Mask Cantrip
  pt-BR: Truque da Máscara
description:
  en: You create a costume mask on the face of a creature you touch. The mask can be simple
    (like a domino mask), fancy (like a masquerade ball mask), or deceptive (like a
    Halloween costume mask of a monster or specific person). The mask is obviously just a
    mask, not a disguise, but a deceptive mask viewed from at least a short distance away
    might fool someone into thinking it's a real face, providing an asset to disguise
    tasks at this range. The mask lasts for about a minute. If removed, the mask
    immediately disappears.
  pt-BR: Você cria uma máscara de fantasia no rosto de uma criatura que tocar. A máscara
    pode ser simples (como uma máscara de dominó), elaborada (como uma máscara de baile de
    máscaras) ou enganosa (como uma máscara de Halloween de um monstro ou de uma pessoa
    específica). A máscara é obviamente apenas uma máscara, não um disfarce, mas uma
    máscara enganosa vista de pelo menos uma distância curta pode fazer alguém pensar que
    é um rosto de verdade, concedendo um recurso em tarefas de disfarce nessa distância. A
    máscara dura cerca de um minuto. Se for removida, desaparece imediatamente.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
