id: healing-pulse
name:
  en: Healing Pulse
  pt-BR: Pulso Curativo
description:
  en: You and all targets you choose within immediate range gain the immediate benefits of using one of their recovery rolls (as long as it is not their ten-hour recovery roll) without having to spend an action, ten minutes, or one hour. Targets regain points to their Pools immediately but mark off that recovery use. PCs who have already used up their one-action, ten-minute, and one-hour recovery rolls for the day gain no benefit from this ability. NPCs targeted by this ability regain a number of health points equal to their level.
  pt-BR: Você e todos os alvos que escolher a alcance imediato ganham os benefícios imediatos de usar uma de suas rolagens de recuperação (desde que não seja a rolagem de recuperação de dez horas), sem precisar gastar uma ação, dez minutos ou uma hora. Os alvos recuperam pontos em suas Reservas imediatamente, mas marcam aquele uso de recuperação. PJs que já tenham usado suas rolagens de recuperação de uma ação, dez minutos e uma hora no dia não obtêm nenhum benefício desta habilidade. PNJs afetados por esta habilidade recuperam um número de pontos de vida igual ao seu nível.
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: brandishes-an-exotic-shield
    tier: 3
