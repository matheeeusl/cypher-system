id: grab
name:
  en: Grab
  pt-BR: Agarrar
description:
  en: >-
    While you are using the Enlarge ability, you can attack by
    attempting to wrap your massive hands around a target the size of
    a normal human or smaller. While you maintain your hold as your
    action, you keep the target from moving or taking physical
    actions (other than attempts to escape). The target's escape
    attempt is hindered by two steps due to your size. If you wish,
    you can automatically inflict 3 points of damage each round on
    the target while you hold it, but you can also keep it protected
    (by taking all attacks otherwise meant for the target).
  pt-BR: 'Enquanto estiver usando a habilidade Ampliar, você pode atacar tentando envolver suas mãos enormes em torno de um alvo do tamanho de um humano comum ou menor. Enquanto mantiver o aperto como sua ação, você impede o alvo de se mover ou realizar ações físicas (exceto tentativas de escapar). A tentativa de escape do alvo é dificultada em dois níveis devido ao seu tamanho. Se desejar, você pode causar automaticamente 3 pontos de dano a cada round ao alvo enquanto o segurar, mas também pode mantê-lo protegido (recebendo todos os ataques que de outra forma seriam direcionados ao alvo).'
cost: null
action_type: action
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 4
attack: true
