id: car-magic
name:
  en: Car Magic
  pt-BR: Magia Automotiva
description:
  en: >-
    You can alter a magical ability you cast so it also affects the
    vehicle you're driving, as if it were a part of you. For example,
    if you're driving and you cast Hover on yourself, you and the car
    begin to float; if you cast Invisibility on yourself, you and the
    car turn invisible. Spells cast on a car this way tend to last
    only a few rounds before expiring (although the spell still lasts
    its full duration on you). The cost of Car Magic is added to the
    cost of the spell you're casting. In addition to the normal
    options for using Effort, you can use Effort to affect other
    creatures within the car; each level of Effort used in this way
    affects up to two additional creatures in the car.
  pt-BR: 'Você pode alterar uma habilidade mágica que conjura para que também afete o veículo que estiver dirigindo, como se ele fosse parte de você. Por exemplo, se você estiver dirigindo e conjurar Flutuar em si mesma, você e o carro começam a flutuar; se conjurar Invisibilidade em si mesma, você e o carro ficam invisíveis. Feitiços lançados sobre um carro dessa forma tendem a durar apenas alguns rounds antes de expirar (embora o feitiço ainda dure sua duração completa em você). O custo de Magia Automotiva é somado ao custo do feitiço que está sendo lançado. Além das opções normais de uso de Esforço, você pode usar Esforço para afetar outras criaturas dentro do carro; cada nível de Esforço usado dessa forma afeta até duas criaturas adicionais no carro.'
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: is-a-car-wizard
    tier: 2
