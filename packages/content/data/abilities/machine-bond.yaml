id: machine-bond
name:
  en: Machine Bond
  pt-BR: Vínculo com a Máquina
description:
  en: >-
    You can control the functions of any machine that you've
    previously exploited using Hack the Impossible, as long as it is
    networked to your current location. Additionally, if you use an
    action to concentrate on the machine, you are aware of what's
    going on around it (you see and hear as if you were standing
    beside it, no matter how far away you are). You must touch the
    machine to create the bond, but afterward, there is no range
    limitation. This bond lasts for a week. You can only bond with
    one machine at a time.
  pt-BR: 'Você pode controlar as funções de qualquer máquina que já tenha explorado usando Hackear o Impossível, desde que esteja conectada em rede ao seu local atual. Além disso, se você usar uma ação para se concentrar na máquina, fica ciente do que acontece ao seu redor (você vê e ouve como se estivesse ao lado dela, não importa a distância). Você deve tocar a máquina para criar o vínculo, mas depois disso não há limitação de alcance. Esse vínculo dura uma semana. Você só pode se vincular a uma máquina por vez.'
cost:
  pool: intellect
  amount: 8
action_type: action_to_initiate
sources:
  - type: focus
    id: hacks-the-network
    tier: 6
    cyberware: true
