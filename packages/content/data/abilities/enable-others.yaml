id: enable-others
name:
  en: Enable Others
  pt-BR: Auxiliar Outros
description:
  en: >-
    You can use the helping rules to provide a benefit to another
    character attempting a physical task. Unlike the normal helping
    rules, this doesn't require you to use your action helping the
    other character with the task. This requires no action on your
    part.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 2
