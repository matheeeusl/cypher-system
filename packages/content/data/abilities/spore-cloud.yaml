id: spore-cloud
name:
  en: Spore Cloud
  pt-BR: Nuvem de Esporos
description:
  en: >-
    You throw a handful of mushrooms that speed toward a target
    within long range. The attack inflicts 3 points of damage and
    envelops the target in a haze of toxic spores, which inflicts 1
    additional point of damage per round (ignores Armor) for the next
    minute or until the target uses an action to wash the spores
    away.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: focus
    id: turns-decay-to-growth
    tier: 1
