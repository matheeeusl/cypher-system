id: light-switch-cantrip
name:
  en: Light Switch Cantrip
  pt-BR: Truque do Interruptor
description:
  en: You toggle up to four light controls (such as a wall switch or a lamp's button, knob,
    or pull cord) within short range. You must be able to see these light controls or have
    a clear idea of where they are (such as turning on your front porch light and living
    room floor lamp from outside your home). You can toggle these switches on or off in
    any combination.
  pt-BR: Você aciona até quatro controles de luz (como um interruptor de parede ou o botão,
    o botão giratório ou o cordão de uma luminária) a distância curta. Você deve conseguir
    ver esses controles ou ter uma ideia clara de onde estão (como acender a luz da
    varanda e o abajur de chão da sala de fora da sua casa). Você pode ligar ou desligar
    esses interruptores em qualquer combinação.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
