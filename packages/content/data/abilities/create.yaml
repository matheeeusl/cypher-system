id: create
name:
  en: Create
  pt-BR: Criar
description:
  en: >-
    You create something from nothing. You can create any item you
    choose that would ordinarily have a difficulty of 5 or lower (using
    the crafting rules). Once created, the item lasts for a number of
    hours equal to 6 minus the difficulty to create it. Thus, if you
    create a set of sturdy manacles (difficulty 5), it would last for
    one hour.
  pt-BR: 'Você cria algo do nada. Pode criar qualquer item de sua escolha que normalmente teria dificuldade 5 ou menor (usando as regras de fabricação). Uma vez criado, o item dura um número de horas igual a 6 menos a dificuldade para criá-lo. Assim, se você criar um jogo de algemas resistentes (dificuldade 5), ele duraria uma hora.'
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: type
    id: adept
    tier: 5
  - type: flavor
    id: magic
    tier: 5
