id: nightmare
name:
  en: Nightmare
  pt-BR: Pesadelo
description:
  en: >-
    You pull a horrifying creature from your worst nightmare into the
    waking world and sic it on your foes. The nightmare (level 5)
    persists each round while you use your action concentrating on it
    (or until you disperse it or it is destroyed). It has one of the
    following abilities, which you choose when you call it:

    - Confusion. Instead of making a normal attack, the nightmare's
    attack confuses the target for one round. On its next action, the
    target attacks an ally.

    - Horrify. Instead of making a normal attack, the nightmare's
    attack horrifies the target, which drops to its knees (or similar
    appendages). The target takes 3 points of damage that ignore
    Armor and is dazed for one round, during which time all its tasks
    are hindered.

    - Pustule Eruption. Instead of making a normal attack, the
    nightmare's attack causes rancid, painful pustules to rise all
    over the target's skin for one minute. If the target takes a
    forceful action (such as attacking another creature or moving
    farther than an immediate distance), the pustules burst, dealing
    5 points of damage that ignore Armor.
  pt-BR: >-
    Você puxa uma criatura aterrorizante do seu pior pesadelo para o
    mundo desperto e a lança contra seus inimigos. O pesadelo (nível
    5) persiste a cada round enquanto você usar sua ação se
    concentrando nele (ou até dispersá-lo ou ele ser destruído). Ele
    tem uma das seguintes habilidades, que você escolhe ao invocá-lo:

    - Confusão. Em vez de fazer um ataque normal, o ataque do
    pesadelo confunde o alvo por um round. Na sua próxima ação, o
    alvo ataca um aliado.

    - Horrorizar. Em vez de fazer um ataque normal, o ataque do
    pesadelo horroriza o alvo, que cai de joelhos (ou apêndices
    semelhantes). O alvo sofre 3 pontos de dano que ignoram Armadura
    e fica atordoado por um round, durante o qual todas as suas
    tarefas são dificultadas.

    - Erupção de Pústulas. Em vez de fazer um ataque normal, o ataque
    do pesadelo faz surgir pústulas rançosas e dolorosas por toda a
    pele do alvo por um minuto. Se o alvo realizar uma ação
    vigorosa (como atacar outra criatura ou se mover mais do que uma
    distância imediata), as pústulas estouram, causando 5 pontos de
    dano que ignoram Armadura.
  # Note: source tag is "Action to initiate, action each round to
  # concentrate." — same tag as Sees Beyond's
  # find-the-hidden/remote-viewing/see-through-time.
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate_and_concentrate
sources:
  - type: focus
    id: lived-among-the-fey
    tier: 5
