id: castigate
name:
  en: Castigate
  pt-BR: Castigar
description:
  en: >-
    You intimidate any opponent within long range who understands
    speech (even if it is not your language) so much that they lose
    their next action and all the rest of their actions are hindered
    for one minute. Each additional time you attempt this ability
    against the same target, you must apply one more level of Effort
    than you applied on the previous attempt.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: interprets-the-law
    tier: 4
