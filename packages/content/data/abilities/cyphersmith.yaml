id: cyphersmith
name:
  en: Cyphersmith
  pt-BR: Ferreiro de Cifras
description:
  en: All manifest cyphers you use function at one level higher than normal. If given a week and the right tools, chemicals, and parts, you can tinker with one of your manifest cyphers, transforming it into another cypher of the same type that you had in the past. The GM and player should collaborate to ensure that the transformation is logical—for example, you probably can't transform a pill into a helmet.
  pt-BR: 'Todas as cifras manifestas que você usa funcionam em um nível acima do normal. Se tiver uma semana e as ferramentas, produtos químicos e peças certas, você pode mexer em uma de suas cifras manifestas, transformando-a em outra cifra do mesmo tipo que você teve no passado. O Mestre e o jogador devem colaborar para garantir que a transformação seja lógica — por exemplo, você provavelmente não consegue transformar um comprimido em um capacete.'
  # Note: source adds a trailing aside — "Cyphersmith works only in a
  # setting where the cyphers are physical objects. If this isn't the
  # case, this ability should probably be replaced with something akin to
  # Weird Science Breakthrough from the Conducts Weird Science focus." —
  # GM guidance, not core mechanical text; omitted per the established
  # convention of dropping such asides (see pathfinder-skills).
cost: null
action_type: enabler
sources:
  - type: focus
    id: crafts-unique-objects
    tier: 4
