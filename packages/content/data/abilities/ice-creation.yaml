id: ice-creation
name:
  en: Ice Creation
  pt-BR: Criação de Gelo
description:
  en: >-
    You create a solid object of ice that is your size or smaller.
    The object is crude and can have no moving parts, so you can make
    a sword, a shield, a short ladder, and so on. Your ice objects are
    as strong as iron, but if you're not in constant contact with
    them, they function for only 1d6 + 6 rounds before breaking or
    melting. For example, you can make and wield an ice sword, but if
    you give it to another PC, the sword won't last as long for that
    character. In addition to the normal options for using Effort,
    you can choose to use Effort to create objects larger than you.
    For each level of Effort used in this way, you can create an
    object up to twice again as large as you.
  pt-BR: 'Você cria um objeto sólido de gelo do seu tamanho ou menor. O objeto é rústico e não pode ter partes móveis, então você pode fazer uma espada, um escudo, uma escada curta, e assim por diante. Seus objetos de gelo são resistentes como ferro, mas se você não estiver em contato constante com eles, funcionam por apenas 1d6 + 6 rounds antes de quebrar ou derreter. Por exemplo, você pode fazer e empunhar uma espada de gelo, mas se der a outro personagem, a espada não durará tanto para esse personagem. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para criar objetos maiores que você. Para cada nível de Esforço usado dessa forma, você pode criar um objeto até duas vezes maior que você.'
  # Note: source cost is printed as "4+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 4 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: wears-a-sheen-of-ice
    tier: 3
