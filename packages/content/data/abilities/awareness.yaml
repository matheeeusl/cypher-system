id: awareness
name:
  en: Awareness
  pt-BR: Percepção Aguçada
description:
  en: >-
    You become hyperaware of your surroundings in order to better
    locate your target. For ten minutes, you are aware of all living
    things within long range (including their general position), and
    by concentrating (another action), you can attempt to learn the
    general health and power level of any one of them.
  pt-BR: 'Você se torna hiperconsciente do seu entorno para localizar melhor seu alvo. Por dez minutos, você percebe todos os seres vivos dentro de uma distância longa (incluindo sua posição geral) e, concentrando-se (outra ação), pode tentar descobrir a saúde geral e o nível de poder de qualquer um deles.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 3
    cyberware: true
  - type: focus
    id: infiltrates
    tier: 3
  - type: focus
    id: murders
    tier: 3
