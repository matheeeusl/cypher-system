id: master-machine
name:
  en: Master Machine
  pt-BR: Dominar Máquina
description:
  en: >-
    You can control the functions of a machine you have bonded with
    using Machine Bond, intelligent or otherwise. In addition, if you
    use an action to concentrate on a machine, you are aware of what
    is going on around it (you see and hear as if you were standing
    next to it, no matter how far away you are). You must touch the
    machine to create the bond, but afterward, there is no range
    limitation. This bond lasts for one week. You can bond with only
    one machine at a time.
  pt-BR: 'Você pode controlar as funções de uma máquina com a qual se vinculou usando Vínculo com a Máquina, inteligente ou não. Além disso, se você usar uma ação para se concentrar em uma máquina, fica ciente do que acontece ao seu redor (você vê e ouve como se estivesse ao lado dela, não importa a distância). Você deve tocar a máquina para criar o vínculo, mas depois disso não há limitação de alcance. Esse vínculo dura uma semana. Você só pode se vincular a uma máquina por vez.'
cost:
  pool: intellect
  amount: 8
action_type: action_to_initiate
sources:
  - type: focus
    id: merges-mind-with-machine
    tier: 6
  - type: flavor
    id: technology
    tier: 6
