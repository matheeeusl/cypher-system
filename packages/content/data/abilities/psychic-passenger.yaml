id: psychic-passenger
name:
  en: Psychic Passenger
  pt-BR: Passageira Psíquica
description:
  en: >-
    You place your mind into the body of a willing creature you
    choose within short range and remain in that body for up to one
    hour. Your own body falls down and becomes insensate until this
    ability ends. You see, hear, smell, touch, and taste using the
    senses of the creature whose body you inhabit. When you speak, the
    words come from your defenseless body, and the creature you
    inhabit hears those words in their mind. The creature you inhabit
    can use your Intellect Edge in place of their own. In addition,
    you and the creature have an asset on any task that involves
    perception. When you take an action, you use the creature's body
    to perform that action if they allow it.
  pt-BR: 'Você coloca sua mente no corpo de uma criatura disposta que escolher dentro de uma distância curta e permanece nesse corpo por até uma hora. Seu próprio corpo cai e fica inconsciente até esta habilidade terminar. Você vê, ouve, cheira, toca e prova usando os sentidos da criatura cujo corpo habita. Quando fala, as palavras vêm do seu corpo indefeso, e a criatura que você habita as ouve em sua mente. A criatura que você habita pode usar sua Margem de Intelecto no lugar da própria. Além disso, você e a criatura têm um recurso em qualquer tarefa envolvendo percepção. Quando realiza uma ação, você usa o corpo da criatura para realizá-la, se ela permitir.'
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: separates-mind-from-body
    tier: 5
