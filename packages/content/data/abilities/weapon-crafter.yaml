id: weapon-crafter
name:
  en: Weapon Crafter
  pt-BR: Artesão de Armas
description:
  en: >-
    You are trained in crafting tasks associated with your chosen
    weapon. For instance, if your weapon is a bow, you are trained in
    tasks related to crafting bows and fletching arrows; if your
    weapon is a sword, you are trained in tasks for forging swords
    and sharpening blades; and so on.
  pt-BR: 'Você é treinada em tarefas de fabricação associadas à sua arma escolhida. Por exemplo, se sua arma for um arco, você é treinada em tarefas relacionadas a fabricar arcos e emplumar flechas; se sua arma for uma espada, é treinada em tarefas para forjar espadas e afiar lâminas; e assim por diante.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: masters-weaponry
    tier: 1
