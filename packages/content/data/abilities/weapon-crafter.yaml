id: weapon-crafter
name:
  en: Weapon Crafter
  pt-BR: Artesão de Armas
description:
  en: >-
    You are trained in crafting tasks associated with your chosen
    weapon. For instance, if your weapon is a bow, you are trained in
    tasks related to crafting bows and fletching arrows; if your
    weapon is a sword, you are trained in tasks for forging swords
    and sharpening blades; and so on.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: masters-weaponry
    tier: 1
