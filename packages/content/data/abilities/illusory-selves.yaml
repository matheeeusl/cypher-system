id: illusory-selves
name:
  en: Illusory Selves
  pt-BR: Duplicatas Ilusórias
description:
  en: You create four holographic duplicates of yourself within short range. The duplicates last for one minute. You mentally direct their actions, and the duplicates aren't mirror images—each one can do different things. If struck violently, they either disappear permanently or freeze motionless (your choice).
  pt-BR: Você cria quatro duplicatas holográficas de si mesmo a alcance curto. As duplicatas duram um minuto. Você direciona mentalmente suas ações, e elas não são imagens espelhadas — cada uma pode fazer coisas diferentes. Se atingidas com violência, elas desaparecem permanentemente ou congelam imóveis (à sua escolha).
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: crafts-illusions
    tier: 4
