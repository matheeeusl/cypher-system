id: resource-seeker
name:
  en: Resource Seeker
  pt-BR: Buscador de Recursos
description:
  en: >-
    When you are looking for a specific inexpensive item you'd like
    to scavenge from nearby ruins, such as a candle, an aspirin, or a
    can of preserved chili, you can focus your attention on it so
    that you are more likely to find it. For the next ten minutes, if
    what you are seeking is within long range, you find it if you
    succeed on a difficulty 2 Intellect roll. Each time you use this
    ability again in the same area, the difficulty is hindered by one
    additional step. For each level of Effort you apply, you can
    attempt to find an object of one higher expense category, but the
    base difficulty of the Intellect roll also increases by 1 per
    higher expense category.
  pt-BR: 'Quando você está procurando um item barato específico que gostaria de vasculhar em ruínas próximas, como uma vela, uma aspirina, ou uma lata de chili conservado, pode concentrar sua atenção nele para ter mais chances de encontrá-lo. Pelos próximos dez minutos, se o que você procura estiver dentro de uma distância longa, você o encontra se tiver sucesso em uma rolagem de Intelecto de dificuldade 2. Cada vez que você usar esta habilidade novamente na mesma área, a dificuldade é dificultada em mais um nível. Para cada nível de Esforço que você aplicar, pode tentar encontrar um objeto de uma categoria de custo mais alta, mas a dificuldade base da rolagem de Intelecto também aumenta em 1 por categoria de custo mais alta.'
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: remembers-the-past
    tier: 3
