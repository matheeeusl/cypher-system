id: find-by-phone
name:
  en: Find by Phone
  pt-BR: Localizar por Telefone
description:
  en: >-
    If you know someone's full name, phone number, or some other
    identifier, you can determine the approximate location (within
    100 feet or 30 m) of their smartphone, computer, or other
    portable device.
  pt-BR: 'Se você souber o nome completo, número de telefone ou outro identificador de alguém, pode determinar a localização aproximada (dentro de 30 metros ou 100 pés) do smartphone, computador ou outro dispositivo portátil dela.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 4
    cyberware: true
