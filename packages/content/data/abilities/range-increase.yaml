id: range-increase
name:
  en: Range Increase
  pt-BR: Aumento de Alcance
description:
  en: >-
    Ranges for you increase by one step. Immediate becomes short, short
    becomes long, long becomes very long, and very long becomes 1,000
    feet (300 m).
  pt-BR: 'Suas distâncias aumentam em um nível. Imediata se torna curta, curta se torna longa, longa se torna muito longa, e muito longa se torna 300 metros (1.000 pés).'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 2
