id: command-machine
name:
  en: Command Machine
  pt-BR: Comandar Máquina
description:
  en: >-
    If you've charmed an unintelligent machine or have spoken
    telepathically with an intelligent machine, you can attempt to
    command it to take one action within its capabilities on its next
    turn. (If you use this ability to command an intelligent machine,
    it likely becomes hostile to you afterward.)
  pt-BR: 'Se você encantou uma máquina sem inteligência ou falou telepaticamente com uma máquina inteligente, pode tentar comandá-la a realizar uma ação dentro de suas capacidades no seu próximo turno. (Se você usar esta habilidade para comandar uma máquina inteligente, é provável que ela se torne hostil a você depois disso.)'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: talks-to-machines
    tier: 3
