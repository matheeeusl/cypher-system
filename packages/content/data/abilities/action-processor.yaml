id: action-processor
name:
  en: Action Processor
  pt-BR: Processador de Ações
description:
  en: >-
    Drawing upon stored information and the ability to process
    incoming data at amazing speeds, you are trained in one physical
    task of your choice for ten minutes. For example, you can choose
    running, climbing, swimming, Speed defense, or attacks with a
    specific weapon.
  pt-BR: >-
    Utilizando informações armazenadas e a capacidade de processar dados
    recebidos a velocidades incríveis, você é treinado em uma tarefa física
    de sua escolha por dez minutos. Por exemplo, você pode escolher correr,
    escalar, nadar, defesa rápida ou ataques com uma arma específica.
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: fuses-mind-and-machine
    tier: 3
  - type: focus
    id: knows-everything
    tier: 3
    cyberware: true
