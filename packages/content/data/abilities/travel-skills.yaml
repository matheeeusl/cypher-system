id: travel-skills
name:
  en: Travel Skills
  pt-BR: Perícias de Viagem
description:
  en: >-
    You are trained in two skills in which you are not already trained.
    Choose two of the following: navigation, riding, running, piloting,
    or vehicle driving. You can select this ability multiple times.
    Each time you select it, you must choose two different skills.
  pt-BR: 'Você fica treinada em duas perícias nas quais ainda não é treinada. Escolha duas das seguintes: navegação, equitação, corrida, pilotagem, ou condução de veículos. Você pode escolher esta habilidade múltiplas vezes. Cada vez que a escolher, deve escolher duas perícias diferentes.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 2
  - type: flavor
    id: skills-and-knowledge
    tier: 1
skill_grant:
  count: 2
  options:
    - navigation
    - riding
    - running
    - piloting
    - vehicle-driving
  repeatable: true
