id: trick-driver
name:
  en: Trick Driver
  pt-BR: Piloto de Acrobacias
description:
  en: >- 
    While driving a car, truck, or motorcycle, your Might Edge, Speed Edge, and Intellect Edge increase by 1.
    When you make a recovery roll while driving, you recover 5 additional points. When you attempt a driving task or an extreme trick -- such as
    jumping a ravine or other vehicle, spinning in the air, landing safely on another vehicle, and so on -- the task is eased.
  pt-BR: >-
    Ao dirigir um carro, caminhão ou motocicleta, seus Bônus de Força, Bônus de Agilidade e Bônus de Intelecto aumentam em 1.
    Ao realizar uma rolagem de recuperação enquanto dirige, você recupera 5 pontos adicionais. Ao tentar uma tarefa de direção ou uma manobra extrema — como
    saltar sobre um barranco ou outro veículo, girar no ar, aterrissar com segurança em outro veículo, e assim por diante — a tarefa é facilitada.
cost: null
action_type: enabler
sources:
