id: energy-resistance
name:
  en: Energy Resistance
  pt-BR: Resistência a Energia
description:
  en: >-
    Choose a discrete type of energy that you have experience with
    (such as heat, sonic, electricity, and so on). You gain +5 to Armor
    against damage from that type of energy. You must be familiar with
    the type of energy; for example, if you have no experience with a
    certain kind of extradimensional energy, you can't protect against
    it. You can select this ability more than once. Each time you
    select it, you must choose a different kind of energy.
  pt-BR: 'Escolha um tipo específico de energia com o qual tenha experiência (como calor, som, eletricidade, e assim por diante). Você ganha +5 de Armadura contra dano desse tipo de energia. Você deve estar familiarizada com o tipo de energia; por exemplo, se não tiver experiência com um certo tipo de energia extradimensional, não pode se proteger contra ela. Você pode escolher esta habilidade mais de uma vez. Cada vez que a escolher, deve escolher um tipo diferente de energia.'
cost: null
action_type: enabler
sources:
  - type: type
    id: warrior
    tier: 3
