id: venom-in-their-blood
name:
  en: Venom in Their Blood
  pt-BR: Veneno no Sangue
description:
  en: >-
    If you successfully attack a creature that you previously damaged
    with Venomous Strike, you deal 9 additional points of damage.
    Once you use this ability, you can't use it again during the
    current conflict.
  pt-BR: 'Se você atacar com sucesso uma criatura que já tenha danificado anteriormente com Golpe Venenoso, causa 9 pontos adicionais de dano. Uma vez que você usa esta habilidade, não pode usá-la novamente durante o conflito atual.'
cost:
  pool: speed
  amount: 5
action_type: enabler
sources:
  - type: focus
    id: strikes-like-a-rattler
    tier: 5
