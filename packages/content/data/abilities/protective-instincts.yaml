id: protective-instincts
name:
  en: Protective Instincts
  pt-BR: Instintos Protetores
description:
  en: >-
    When engaging in combat to defend your coven or home, you can
    attack up to five different foes with a single action as long as
    they are within immediate range of each other. All the attacks
    must be the same sort of attack (melee, ranged, or spell), and the
    point cost of this ability is deducted from whichever Pool the
    attack uses. Pay the costs (if any) separately for each attack,
    and make a separate attack roll for each foe. Anything that
    modifies your attack or damage applies to all attacks. You remain
    limited by the amount of Effort you can apply to one action. In
    addition to the normal options for using Effort, you can use
    Effort to increase the number of foes you can attack, with one
    additional foe per level of Effort.
  pt-BR: 'Ao entrar em combate para defender seu covil ou lar, você pode atacar até cinco inimigos diferentes com uma única ação, desde que estejam dentro de uma distância imediata uns dos outros. Todos os ataques devem ser do mesmo tipo (corpo a corpo, à distância ou feitiço), e o custo em pontos desta habilidade é deduzido de qualquer Reserva que o ataque use. Pague os custos (se houver) separadamente para cada ataque, e faça uma rolagem de ataque separada para cada inimigo. Qualquer coisa que modifique seu ataque ou dano se aplica a todos os ataques. Você permanece limitada pela quantidade de Esforço que pode aplicar em uma ação. Além das opções normais de uso de Esforço, você pode usar Esforço para aumentar o número de inimigos que pode atacar, com um inimigo adicional por nível de Esforço.'
  # Note: source cost is both open-ended and a choice-of-pool, "6+
  # Might, Speed, or Intellect points" — the schema's cost field can
  # represent neither. Recorded as the baseline 6 Might points
  # (first-listed pool), flagged for schema review (same approximation
  # used for extreme-mastery/flight-exertion combined with the
  # open-ended-"+" convention used for divine-intervention).
cost:
  pool: might
  amount: 6
action_type: enabler
sources:
  - type: focus
    id: steers-the-coven
    tier: 5
