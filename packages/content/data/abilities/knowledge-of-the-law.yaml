id: knowledge-of-the-law
name:
  en: Knowledge of the Law
  pt-BR: Conhecimento da Lei
description:
  en: >-
    You're trained in the law of the land. If you don't know the
    answer to a question of law, you know where and how to research
    it (a university's law library is a good place to start, but
    you've also got online sources).
  pt-BR: 'Você é treinada na lei da terra. Se não souber a resposta a uma questão jurídica, sabe onde e como pesquisá-la (uma biblioteca jurídica universitária é um bom lugar para começar, mas você também tem fontes online).'
