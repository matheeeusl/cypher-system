id: draw-conclusion
name:
  en: Draw Conclusion
  pt-BR: Tirar Conclusão
description:
  en: >-
    After careful observation and investigation (questioning one or
    more NPCs on a topic, searching an area or a file, and so on)
    lasting a few minutes, you can learn a pertinent fact. This
    ability is a difficulty 3 Intellect task. Each additional time you
    use this ability, the task is hindered by an additional step. The
    difficulty returns to 3 after you rest for ten hours.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: solves-mysteries
    tier: 4
