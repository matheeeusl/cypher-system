id: draw-conclusion
name:
  en: Draw Conclusion
  pt-BR: Tirar Conclusão
description:
  en: >-
    After careful observation and investigation (questioning one or
    more NPCs on a topic, searching an area or a file, and so on)
    lasting a few minutes, you can learn a pertinent fact. This
    ability is a difficulty 3 Intellect task. Each additional time you
    use this ability, the task is hindered by an additional step. The
    difficulty returns to 3 after you rest for ten hours.
  pt-BR: 'Após observação e investigação cuidadosas (questionar um ou mais PNJs sobre um assunto, vasculhar uma área ou arquivo, e assim por diante) durando alguns minutos, você pode descobrir um fato pertinente. Esta habilidade é uma tarefa de Intelecto de dificuldade 3. Cada vez adicional que você usar esta habilidade, a tarefa é dificultada em um nível adicional. A dificuldade volta a 3 depois que você descansar por dez horas.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: solves-mysteries
    tier: 4
