id: reading-decomposition
name:
  en: Reading Decomposition
  pt-BR: Leitura da Decomposição
description:
  en: >-
    You gain knowledge about an area by reading energy released by
    decomposition and decay. You can ask the GM a single,
    matter-of-fact question about the location and get an answer if
    you succeed on the Intellect roll. "What was the last ritual
    performed in this room?" is a good example of a simple question.
    "Why was this room used for a ritual?" is not an appropriate
    question, because it has more to do with the mindset of whoever
    performed the ritual than with qualities of the room. Simple
    questions usually have a difficulty of 2, but technical questions
    or those that involve facts meant to be kept secret can have a
    much higher difficulty.
  pt-BR: 'Você obtém conhecimento sobre uma área lendo a energia liberada pela decomposição e putrefação. Pode fazer ao Mestre uma única pergunta objetiva sobre o local e obter uma resposta se tiver sucesso na rolagem de Intelecto. "Qual foi o último ritual realizado nesta sala?" é um bom exemplo de pergunta simples. "Por que esta sala foi usada para um ritual?" não é uma pergunta apropriada, pois tem mais a ver com a mentalidade de quem realizou o ritual do que com as qualidades da sala. Perguntas simples geralmente têm dificuldade 2, mas perguntas técnicas ou que envolvam fatos destinados a serem mantidos em segredo podem ter uma dificuldade muito maior.'
  # Note: source adds a clarifying sidebar: "Unless an environment is
  # absolutely sterilized, there are enough microbes, fungal spores,
  # and other organic debris in an area to allow you to use Reading
  # Decomposition." — folded here as context.
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: turns-decay-to-growth
    tier: 3
