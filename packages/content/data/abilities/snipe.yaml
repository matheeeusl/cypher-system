id: snipe
name:
  en: Snipe
  pt-BR: Tiro de Precisão
description:
  en: >-
    If you spend one action aiming, in the next round you can make a
    precise ranged attack. You have an asset on this attack. If your
    attack is successful, it inflicts 4 additional points of damage.
  pt-BR: 'Se você gastar uma ação mirando, no round seguinte pode fazer um ataque à distância preciso. Você tem um recurso neste ataque. Se seu ataque for bem-sucedido, causa 4 pontos adicionais de dano.'
cost:
  pool: speed
  amount: 2
action_type: action
sources:
  - type: type
    id: warrior
    tier: 4
attack: true
