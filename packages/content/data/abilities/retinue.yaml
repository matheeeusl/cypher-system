id: retinue
name:
  en: Retinue
  pt-BR: Séquito
description:
  en: Four level 2 followers join you (and your first follower, if you have one). One of their modifications must be for tasks related to serving as your personal assistants. In addition to other tasks they might individually take on your behalf, they can also work together to run interference if you're trying to avoid someone, help hide you from the attention of others, help you muscle through a crowd, and so on. If a situation becomes physically violent, they provide an asset to your Speed defense tasks and, if you command it, try to hold a foe's attention while you escape.
  pt-BR: Quatro seguidores de nível 2 se juntam a você (e a seu primeiro seguidor, se tiver um). Uma de suas modificações deve ser para tarefas relacionadas a servir como seus assistentes pessoais. Além de outras tarefas que possam assumir individualmente em seu nome, eles também podem trabalhar juntos para atrapalhar alguém que você está tentando evitar, ajudar a escondê-lo da atenção alheia, ajudar a abrir caminho por uma multidão, e assim por diante. Se uma situação se tornar fisicamente violenta, eles fornecem um bônus em suas tarefas de defesa de Agilidade e, se você comandar, tentam prender a atenção de um inimigo enquanto você foge.
cost: null
action_type: enabler
sources:
  - type: focus
    id: descends-from-nobility
    tier: 1
