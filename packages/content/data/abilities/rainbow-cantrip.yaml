id: rainbow-cantrip
name:
  en: Rainbow Cantrip
  pt-BR: Truque do Arco-Íris
description:
  en: You create a softly glowing band of colors resembling a rainbow, extending from your
    hand to an object or willing creature within short range. The far end doesn't move (a
    creature could move away from it by going around a corner or out of range). You can
    anchor your end in place or allow it to move when your hand moves. The rainbow gives
    off light like a candle and lasts about a minute.
  pt-BR: Você cria uma faixa de cores suavemente brilhante, semelhante a um arco-íris, que
    se estende da sua mão até um objeto ou uma criatura disposta a distância curta. A
    ponta distante não se move (uma criatura poderia se afastar dela dobrando uma esquina
    ou saindo do alcance). Você pode fixar sua ponta no lugar ou deixá-la se mover quando
    sua mão se mover. O arco-íris emite luz como uma vela e dura cerca de um minuto.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
