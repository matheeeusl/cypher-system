id: reading-the-room
name:
  en: Reading the Room
  pt-BR: Lendo o Ambiente
description:
  en: You gain knowledge about an area by speaking with dead spirits or reading residual energies from the past. You can ask the GM a single, matter-of-fact question about the location and get an answer if you succeed on the Intellect roll. Simple questions usually have a difficulty of 2, but extremely technical questions or those that involve facts meant to be kept secret can have a much higher difficulty.
  pt-BR: 'Você obtém conhecimento sobre uma área falando com espíritos mortos ou lendo energias residuais do passado. Pode fazer ao Mestre uma única pergunta objetiva sobre o local e obter uma resposta se tiver sucesso na rolagem de Intelecto. Perguntas simples geralmente têm dificuldade 2, mas perguntas extremamente técnicas ou que envolvam fatos destinados a serem mantidos em segredo podem ter uma dificuldade muito maior.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: consorts-with-the-dead
    tier: 3
