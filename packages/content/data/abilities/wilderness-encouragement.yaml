id: wilderness-encouragement
name:
  en: Wilderness Encouragement
  pt-BR: Encorajamento da Natureza
description:
  en: >-
    While in the wilderness, or when talking about your time in the
    wilderness, your stirring words of encouragement grant a target
    within short range that can understand you 1d6 points to one
    Pool. You can't use this ability on the same creature again until
    they've made a recovery roll.
  pt-BR: 'Enquanto estiver na natureza selvagem, ou ao falar sobre seu tempo na natureza selvagem, suas palavras de encorajamento inspiradoras concedem a um alvo dentro de uma distância curta que consiga entendê-la 1d6 pontos para uma Reserva. Você não pode usar esta habilidade na mesma criatura novamente até ela fazer uma rolagem de recuperação.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 3
