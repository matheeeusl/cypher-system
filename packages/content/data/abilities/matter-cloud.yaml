id: matter-cloud
name:
  en: Matter Cloud
  pt-BR: Nuvem de Matéria
description:
  en: >-
    Pebbles, dirt, sand, and debris rise into the air around you to
    form a swirling cloud. The cloud extends out to immediate range,
    moves with you, and lasts for one minute. When it ends, all the
    materials fall to the ground around you. The cloud makes it harder
    for other creatures to attack you, giving you an asset on Speed
    defense rolls. In addition, while the cloud is around you, you can
    use an action to whip the material so that it abrades everything
    within immediate range, dealing 1 point of damage to each creature
    and object in the area.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: type
    id: adept
    tier: 4
