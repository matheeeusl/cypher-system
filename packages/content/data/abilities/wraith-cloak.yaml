id: wraith-cloak
name:
  en: Wraith Cloak
  pt-BR: Manto Espectral
description:
  en: >-
    At your command, the spirit from your Spirit Accomplice ability
    wraps itself around you for up to ten minutes. The spirit
    automatically inflicts 4 points of damage to anyone who tries to
    touch you or strike you with a melee attack. While the wraith
    cloak is active, all tasks to evade the perceptions of others are
    eased.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: shepherds-spirits
    tier: 4
