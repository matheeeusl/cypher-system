id: energize-creature
name:
  en: Energize Creature
  pt-BR: Energizar Criatura
description:
  en: You extend your Absorb Kinetic Energy ability to one creature within immediate range so that they also can absorb energy from physical attacks and impacts for one hour. That creature, however, cannot release excess energy as a blast. For each level of Effort you apply, you can increase the number of targets you affect by one. If you have Absorb Pure Energy or Improved Absorb Kinetic Energy, those abilities are also duplicated in your target when you use Energize Creature.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "6+ Might points" — the schema's cost
  # field can't represent an open-ended "+". Recorded as the baseline 6
  # Might points here, flagged for schema review (same approximation used
  # for divine-intervention).
cost:
  pool: might
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: absorbs-energy
    tier: 5
