id: improved-sculpt-light
name:
  en: Improved Sculpt Light
  pt-BR: Esculpir Luz Aprimorado
description:
  en: >-
    You create an object of solid light in any shape you can imagine
    whose base size can fit within a 10-foot (3 m) cube. The object
    appears in an area adjacent to you or floating freely in space up
    to a long distance away, and the object lasts for a few days. The
    object is crude and can have no moving parts, so you can make a
    wall segment, a block, a box, stairs, and so on. The sculpted
    object has the approximate mass of the real object and is level 6.
    If you apply Effort to increase the size of the object, each
    level applied increases the size by an additional 10-foot (3 m)
    cube.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "7+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 7 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: focus
    id: sculpts-hard-light
    tier: 5
