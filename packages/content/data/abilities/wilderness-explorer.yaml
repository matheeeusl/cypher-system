id: wilderness-explorer
name:
  en: Wilderness Explorer
  pt-BR: Explorador da Natureza
description:
  en: >-
    While taking any action (including fighting) in the wild, you
    ignore any penalties due to natural causes such as tall grass,
    thick brush, rugged terrain, weather, and so on.
  pt-BR: 'Ao realizar qualquer ação (incluindo lutar) na natureza selvagem, você ignora quaisquer penalidades devido a causas naturais, como grama alta, arbustos densos, terreno acidentado, clima, e assim por diante.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 2
  - type: focus
    id: turns-decay-to-growth
    tier: 2
