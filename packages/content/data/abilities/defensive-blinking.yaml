id: defensive-blinking
name:
  en: Defensive Blinking
  pt-BR: Piscar Defensivo
description:
  en: >-
    You enter a heightened reactive state so that when you are struck
    hard enough to take damage, you teleport an immediate distance in
    a random direction (not up or down) to help evade the brunt of
    the attack. Your Speed defense rolls are eased for one minute.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: ignores-physical-distance
    tier: 3
