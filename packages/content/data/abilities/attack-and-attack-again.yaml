id: attack-and-attack-again
name:
  en: Attack and Attack Again
  pt-BR: Atacar e Atacar de Novo
description:
  en: >-
    Rather than granting additional damage or a minor or major effect,
    a natural 17 or higher on your attack roll allows you the option
    of immediately making another attack.
  pt-BR: 'Em vez de conceder dano adicional ou um efeito menor ou maior, um 17 ou mais natural em sua rolagem de ataque lhe dá a opção de fazer imediatamente outro ataque.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: rages
    tier: 5
