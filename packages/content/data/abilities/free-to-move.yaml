id: free-to-move
name:
  en: Free to Move
  pt-BR: Livre para Mover-se
description:
  en: >-
    You ignore all movement penalties and adjustments due to terrain
    or other obstacles. You can fit through any space large enough to
    fit your head. Tasks involving breaking free of bonds, a
    creature's grip, or any similar impediment gain three free levels
    of Effort.
  pt-BR: 'Você ignora todas as penalidades e ajustes de movimento devido ao terreno ou outros obstáculos. Você consegue passar por qualquer espaço grande o suficiente para caber sua cabeça. Tarefas envolvendo se libertar de amarras, do aperto de uma criatura, ou de qualquer impedimento semelhante ganham três níveis gratuitos de Esforço.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 5
  - type: focus
    id: stretches
    tier: 5
