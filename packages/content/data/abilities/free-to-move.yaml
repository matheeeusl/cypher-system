id: free-to-move
name:
  en: Free to Move
  pt-BR: Livre para Mover-se
description:
  en: >-
    You ignore all movement penalties and adjustments due to terrain
    or other obstacles. You can fit through any space large enough to
    fit your head. Tasks involving breaking free of bonds, a
    creature's grip, or any similar impediment gain three free levels
    of Effort.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 5
  - type: focus
    id: stretches
    tier: 5
