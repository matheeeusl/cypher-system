id: up-to-speed
name:
  en: Up to Speed
  pt-BR: Em Alta Velocidade
description:
  en: >-
    If you do nothing but move for three actions in a row, you
    accelerate greatly and can move up to 200 mph (about 2,000 feet
    each round) for up to ten minutes (about 35 miles), after which
    you must stop and make a recovery roll. (Move up to 322 kph
    [about 600 m each round] for up to ten minutes [about 56 km].)
  pt-BR: 'Se você não fizer nada além de se mover por três ações seguidas, acelera enormemente e pode se mover a até 322 km/h (cerca de 600 metros a cada round) por até dez minutos (cerca de 56 km), após o que deve parar e fazer uma rolagem de recuperação.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: flies-faster-than-a-bullet
    tier: 4
  - type: focus
    id: soars-on-amazing-wings
    tier: 5
