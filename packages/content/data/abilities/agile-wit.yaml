id: agile-wit
name:
  en: Agile Wit
  pt-BR: Ardil Ágil
description:
  en: >-
    When attempting a Speed task, you instead can roll (and spend
    points) as if it were an Intellect action. If you apply Effort to
    this task, you can spend points from your Intellect Pool instead
    of your Speed Pool (in which case you also use your Intellect Edge
    instead of your Speed Edge).
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
