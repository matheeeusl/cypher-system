id: retrieve-memories
name:
  en: Retrieve Memories
  pt-BR: Recuperar Memórias
description:
  en: >-
    You touch the remains of a recently killed creature and make an
    Intellect-based roll to restore its mind to life long enough to
    learn information from it. The GM sets the difficulty based on the
    amount of time that has passed since the creature died. A creature
    that has been dead for only a few minutes is a difficulty 2 task,
    one that has been dead for an hour is a difficulty 4 task, and one
    that has been dead for a few days is a difficulty 9 task. If you
    succeed, you awaken the corpse, causing its head to animate and
    perceive things as if it were alive. This enables communication for
    about one minute, which is how long it takes for the creature to
    realize that it's dead. The creature is limited to what it knew in
    life, though it cannot recall minor memories, only big events of
    importance to it. When the effect ends, or if you fail the roll, the
    creature's brain dissolves to mush and cannot be awakened again.
  pt-BR: 'Você toca os restos de uma criatura recém-morta e faz uma rolagem baseada em Intelecto para restaurar sua mente à vida tempo suficiente para aprender informações dela. O Mestre define a dificuldade com base no tempo que passou desde que a criatura morreu. Uma criatura que está morta há apenas alguns minutos é uma tarefa de dificuldade 2, uma que está morta há uma hora é uma tarefa de dificuldade 4, e uma que está morta há alguns dias é uma tarefa de dificuldade 9. Se você tiver sucesso, desperta o cadáver, fazendo sua cabeça se animar e perceber as coisas como se estivesse viva. Isso permite comunicação por cerca de um minuto, tempo que a criatura leva para perceber que está morta. A criatura fica limitada ao que sabia em vida, embora não consiga se lembrar de memórias menores, apenas de grandes eventos importantes para ela. Quando o efeito termina, ou se você falhar na rolagem, o cérebro da criatura se dissolve em papa e não pode ser despertado novamente.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: type
    id: adept
    tier: 2
  - type: flavor
    id: divination
    tier: 3
