    To be able to put two and two together to reach a deduction, you
    have to know a few things. You are trained in two areas of
    knowledge of your choosing (as long as they are not physical
    actions or combat related) or specialized in one area.
  pt-BR: 'Para conseguir juntar as peças e chegar a uma dedução, você precisa saber algumas coisas. Você é treinada em duas áreas de conhecimento à sua escolha (desde que não sejam ações físicas ou relacionadas a combate) ou especializada em uma área.'
