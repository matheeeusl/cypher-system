id: find-the-hidden
name:
  en: Find the Hidden
  pt-BR: Encontrar o Oculto
description:
  en: You see the traceries of objects as they move through space and time. You can sense the distance and direction of any specific inanimate object that you once touched. This takes anywhere from one action to hours of concentration, depending on what the GM feels is appropriate due to time, distance, or other mitigating circumstances. However, you don't know in advance how long it will take. If you use at least two levels of Effort, once you have established the distance and direction, you remain in contact with the object for one hour per level of Effort used. Thus, if it moves, you are aware of its new position.
  pt-BR: Você vê os rastros de objetos conforme se movem pelo espaço e tempo. Você pode sentir a distância e direção de qualquer objeto inanimado específico que já tenha tocado. Isso leva de uma ação a horas de concentração, dependendo do que o Mestre considerar apropriado devido a tempo, distância, ou outras circunstâncias atenuantes. Porém, você não sabe de antemão quanto tempo levará. Se usar pelo menos dois níveis de Esforço, uma vez estabelecidas a distância e a direção, você permanece em contato com o objeto por uma hora por nível de Esforço usado. Assim, se ele se mover, você fica ciente de sua nova posição.
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: sees-beyond
    tier: 3
