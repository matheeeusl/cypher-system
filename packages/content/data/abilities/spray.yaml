id: spray
name:
  en: Spray
  pt-BR: Rajada
description:
  en: >-
    If a weapon has the ability to fire rapid shots without reloading
    (usually called a rapid-fire weapon, such as a crank crossbow or
    submachine gun), you can spray multiple shots around your target
    to increase the chance of hitting. This ability uses 1d6 + 1
    rounds of ammo (or all the ammo in the weapon, if it has less than
    the number rolled). You are trained in making this attack. If the
    attack is successful, it deals 1 less point of damage than normal.
    You can also use this ability on multiple thrown weapons (stones,
    shuriken, daggers, and so on) if you're carrying them on your
    person or they are all within reach.
  pt-BR: 'Se uma arma tem a capacidade de disparar tiros rápidos sem recarregar (geralmente chamada de arma de tiro rápido, como uma besta de manivela ou submetralhadora), você pode espalhar múltiplos tiros ao redor do seu alvo para aumentar a chance de acerto. Esta habilidade usa 1d6 + 1 rounds de munição (ou toda a munição da arma, se tiver menos que o número rolado). Você é treinada em fazer este ataque. Se o ataque for bem-sucedido, causa 1 ponto a menos de dano que o normal. Você também pode usar esta habilidade em múltiplas armas de arremesso (pedras, shurikens, adagas, e assim por diante) se estiver carregando-as consigo ou se todas estiverem ao alcance.'
cost:
  pool: speed
  amount: 2
action_type: action
sources:
  - type: type
    id: warrior
    tier: 3
  - type: focus
    id: is-licensed-to-carry
    tier: 3
attack: true
