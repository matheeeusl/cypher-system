id: field-of-gravity
name:
  en: Field of Gravity
  pt-BR: Campo de Gravidade
description:
  en: When you wish it, a field of manipulated gravity around you pulls incoming ranged projectile attacks to the ground. You are immune to such attacks until your turn in the next round. You must be aware of an attack to foil it. This ability does not work on energy attacks.
  pt-BR: Quando desejar, um campo de gravidade manipulada ao seu redor puxa para o chão ataques de projéteis à distância que se aproximam. Você fica imune a esses ataques até seu turno na rodada seguinte. Você precisa estar ciente de um ataque para frustrá-lo. Esta habilidade não funciona contra ataques de energia.
cost:
  pool: intellect
  amount: 4
action_type: enabler
sources:
  - type: focus
    id: controls-gravity
    tier: 4
