id: reshape
name:
  en: Reshape
  pt-BR: Remodelar
description:
  en: >-
    You reshape matter within short range in an area no larger than a
    5-foot (1.5 m) cube. If you use only one action on this ability,
    the changes you make are crude at best. If you spend at least ten
    minutes and succeed at a hindered appropriate crafting task, you
    can make complex changes to the material. You can't change the
    nature of the material, only its shape. Thus, you can make a hole
    in a wall or floor, or you can seal one up. You can fashion a
    rudimentary sword from a large piece of iron. You can break or
    repair a chain. With multiple uses of this ability, you could
    bring about large changes, making a bridge, a wall, or a similar
    structure.
  pt-BR: 'Você remodela matéria dentro de uma distância curta em uma área não maior que um cubo de 1,5 metro (5 pés). Se você usar apenas uma ação nesta habilidade, as mudanças que fizer serão, na melhor das hipóteses, grosseiras. Se gastar pelo menos dez minutos e tiver sucesso em uma tarefa de fabricação apropriada dificultada, pode fazer mudanças complexas no material. Você não pode mudar a natureza do material, apenas sua forma. Assim, pode fazer um buraco em uma parede ou piso, ou pode selar um. Pode fabricar uma espada rudimentar a partir de um grande pedaço de ferro. Pode quebrar ou consertar uma corrente. Com múltiplos usos desta habilidade, você poderia provocar grandes mudanças, fazendo uma ponte, uma parede, ou uma estrutura semelhante.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: type
    id: adept
    tier: 4
  - type: focus
    id: focuses-mind-over-matter
    tier: 6
