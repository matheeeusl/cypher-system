id: foil-danger
name:
  en: Foil Danger
  pt-BR: Frustrar Perigo
description:
  en: >-
    You negate one source of potential danger related to one creature
    or object that you are aware of within immediate distance for one
    round. This could be a weapon or device held by someone, a trap
    triggered by a pressure plate, or a creature's natural ability
    (something special, innate, and dangerous, like a dragon's fiery
    breath or a giant cobra's venom). You can also try to foil a foe's
    mundane action (such as an attack with a weapon or claw), so that
    the action isn't made this round. Make your roll against the level
    of the attack, danger, or creature.
  pt-BR: 'Você neutraliza uma fonte de perigo potencial relacionada a uma criatura ou objeto do qual esteja ciente dentro de uma distância imediata por um round. Isso pode ser uma arma ou dispositivo segurado por alguém, uma armadilha ativada por uma placa de pressão, ou a habilidade natural de uma criatura (algo especial, inato e perigoso, como o sopro flamejante de um dragão ou o veneno de uma cobra gigante). Você também pode tentar frustrar a ação comum de um inimigo (como um ataque com uma arma ou garra), de forma que a ação não seja realizada neste round. Faça sua rolagem contra o nível do ataque, perigo ou criatura.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: explorer
    tier: 2
