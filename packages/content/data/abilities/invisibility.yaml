id: invisibility
name:
  en: Invisibility
  pt-BR: Invisibilidade
description:
  en: >-
    You become invisible for ten minutes. While invisible, you are
    specialized in stealth and Speed defense tasks. This effect ends
    if you do something to reveal your presence or position—attacking,
    using an ability, moving a large object, and so on. If this
    occurs, you can regain the remaining invisibility effect by taking
    an action to hide your position. If you have another ability that
    also confers invisibility, using either one allows you to remain
    invisible for twice as long as the duration specified.
  pt-BR: >-
    Você se torna invisível por dez minutos. Enquanto invisível, você
    é especialista em tarefas de furtividade e defesa baseada em Velocidade. 
    Esse efeito termina se você fizer algo que revele sua presença ou
    posição — como atacar, usar uma habilidade, mover um objeto grande,
    e assim por diante. Se isso acontecer, você pode recuperar o tempo
    restante de invisibilidade realizando uma ação para ocultar sua
    posição. Se você possuir outra habilidade que também conceda
    invisibilidade, usar qualquer uma delas permite que você permaneça
    invisível pelo dobro da duração especificada.
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate_or_reinitiate
sources:
  - type: focus
    id: infiltrates
    tier: 4
  - type: focus
    id: wields-invisible-force
    tier: 4
