id: hidden-shield
name:
  en: Hidden Shield
  pt-BR: Escudo Oculto
description:
  en: You have a shield built into your body (probably your arm) made of a composite of metal and advanced polymers. The shield is concealed until you wish to use it. You are practiced in using the shield in one hand as a light melee weapon. Furthermore, as part of an attack action you can make a melee attack with the shield, but if you do so the main attack and shield attack are both hindered.
  pt-BR: Você tem um escudo incorporado ao seu corpo (provavelmente seu braço), feito de um compósito de metal e polímeros avançados. O escudo fica oculto até que você deseje usá-lo. Você é praticado no uso do escudo em uma mão como arma leve corpo a corpo. Além disso, como parte de uma ação de ataque, você pode fazer um ataque corpo a corpo com o escudo, mas se fizer isso, tanto o ataque principal quanto o ataque com o escudo ficam dificultados.
cost: null
action_type: enabler
sources:
  - type: focus
    id: is-a-walking-tank
    tier: 1
