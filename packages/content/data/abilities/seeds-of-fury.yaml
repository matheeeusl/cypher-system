id: seeds-of-fury
name:
  en: Seeds of Fury
  pt-BR: Sementes da Fúria
description:
  en: >-
    You throw a handful of seeds in the air that ignite and speed
    toward a target within long range, scratching the air with
    twisting smoke trails. The attack deals 3 points of damage and
    catches the target on fire, which inflicts 1 additional point of
    damage per round for up to a minute or until the target uses an
    action to douse the flames.
  pt-BR: 'Você arremessa um punhado de sementes no ar que se inflamam e disparam em direção a um alvo dentro de uma distância longa, riscando o ar com trilhas de fumaça retorcidas. O ataque causa 3 pontos de dano e incendeia o alvo, o que causa 1 ponto adicional de dano por round por até um minuto ou até o alvo usar uma ação para apagar as chamas.'
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: focus
    id: speaks-for-the-land
    tier: 1
attack: true
