id: misdirect
name:
  en: Misdirect
  pt-BR: Desviar
description:
  en: >-
    When an opponent misses you, you can redirect their attack to
    another target (a creature or object) of your choosing that's
    within immediate range of you. Make an unmodified attack roll
    against the new target (do not use any of your or the opponent's
    modifiers to the attack roll, but you can apply Effort for
    accuracy). If the attack hits, the target takes damage from your
    opponent's attack.
  pt-BR: 'Quando um oponente errar você, pode redirecionar o ataque dele para outro alvo (uma criatura ou objeto) à sua escolha que esteja dentro de uma distância imediata de você. Faça uma rolagem de ataque sem modificadores contra o novo alvo (não use nenhum dos seus modificadores ou do oponente na rolagem de ataque, mas pode aplicar Esforço para precisão). Se o ataque acertar, o alvo sofre o dano do ataque do seu oponente.'
cost:
  pool: speed
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: slays-monsters
    tier: 3
  - type: flavor
    id: combat
    tier: 4
  - type: flavor
    id: stealth
    tier: 3
