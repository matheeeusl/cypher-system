id: misdirect
name:
  en: Misdirect
  pt-BR: Desviar
description:
  en: >-
    When an opponent misses you, you can redirect their attack to
    another target (a creature or object) of your choosing that's
    within immediate range of you. Make an unmodified attack roll
    against the new target (do not use any of your or the opponent's
    modifiers to the attack roll, but you can apply Effort for
    accuracy). If the attack hits, the target takes damage from your
    opponent's attack.
  pt-BR: "Tradução em breve."
cost:
  pool: speed
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: hunts-witches
    tier: 3
