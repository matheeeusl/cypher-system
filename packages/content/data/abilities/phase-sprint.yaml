id: phase-sprint
name:
  en: Phase Sprint
  pt-BR: Sprint Fora de Fase
description:
  en: >-
    You can run up to a long distance as long as you take no other
    actions. During your action and until the beginning of your next
    turn, you are partially phased, and some attacks pass through you
    harmlessly. While phased, you gain an asset to your Speed defense
    tasks, but you lose any benefit from armor you wear. You don't
    have to run in one long, straight line when using Phase Sprint,
    but can instead zig and zag, curve, or even return to where you
    started. Other abilities can be used with Phase Sprint to unlock
    additional effects, including Disrupting Touch, Scratch Existence,
    Invisible Phasing, and Phase Detonation. These abilities are
    additive enablers, requiring the user to spend points for both
    abilities, and sometimes from two different Pools.
  pt-BR: 'Você pode correr até uma distância longa, desde que não realize outras ações. Durante sua ação e até o início do seu próximo turno, você fica parcialmente fora de fase, e alguns ataques passam por você inofensivamente. Enquanto fora de fase, você ganha um recurso em suas tarefas de defesa de Velocidade, mas perde qualquer benefício da armadura que estiver usando. Você não precisa correr em uma única linha reta longa ao usar Sprint Fora de Fase, podendo em vez disso zigue-zaguear, curvar, ou até retornar ao ponto de partida. Outras habilidades podem ser usadas com Sprint Fora de Fase para desbloquear efeitos adicionais, incluindo Toque Perturbador, Arranhar Existência, Fase Invisível e Detonação de Fase. Essas habilidades são habilitadoras aditivas, exigindo que a usuária gaste pontos para ambas as habilidades, e às vezes de duas Reservas diferentes.'
  # Note: source cost is printed as "1+ Speed points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 1 Speed point here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: speed
  amount: 1
action_type: action
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 1
