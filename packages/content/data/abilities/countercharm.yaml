id: countercharm
name:
  en: Countercharm
  pt-BR: Contraencanto
description:
  en: >-
    If you are affected by an unwanted ongoing magical condition or
    affliction (such as a curse, paralysis spell, withering hex, and
    so on) that gives you additional rolls to end it early, your
    rolls to end it early are eased by two steps until you break
    free.
  pt-BR: 'Se você for afetado por uma condição ou aflição mágica contínua indesejada (como uma maldição, um feitiço de paralisia, uma praga de definhamento, e assim por diante) que lhe dê rolagens adicionais para encerrá-la antecipadamente, suas rolagens para encerrá-la antecipadamente são facilitadas em dois níveis até que você se liberte.'
cost:
  pool: intellect
  amount: 5
action_type: enabler
sources:
  - type: focus
    id: hunts-witches
    tier: 4
