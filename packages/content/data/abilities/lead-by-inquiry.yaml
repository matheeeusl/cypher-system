id: lead-by-inquiry
name:
  en: Lead by Inquiry
  pt-BR: Liderar pelo Questionamento
description:
  en: >-
    You keep your allies on their toes with occasional questions,
    jokes, and even mock drills for those who care to join in. After
    spending 24 hours with you, your allies are treated as if trained
    in tasks related to perception. This benefit is ongoing while you
    remain in your allies' company. It ends if you leave, but it
    resumes if you return to the allies' company within 24 hours. If
    you leave the allies' company for more than 24 hours, you must
    spend another 24 hours together to reactivate the benefit.
  pt-BR: 'Você mantém seus aliados alertas com perguntas ocasionais, piadas e até exercícios simulados para aqueles que quiserem participar. Depois de passar 24 horas com você, seus aliados são tratados como se fossem treinados em tarefas relacionadas a percepção. Esse benefício é contínuo enquanto você permanecer na companhia dos aliados. Ele termina se você for embora, mas retorna se você voltar à companhia dos aliados dentro de 24 horas. Se você ficar longe da companhia dos aliados por mais de 24 horas, deve passar mais 24 horas juntos para reativar o benefício.'
cost: null
action_type: enabler
sources:
  - type: type
    id: speaker
    tier: 3
