id: sensing-package
name:
  en: Sensing Package
  pt-BR: Pacote de Sensores
description:
  en: >-
    You can see in dim light and darkness as if it were bright light,
    and you can see up to a short distance through fog, smoke, and
    other obscuring phenomena. In addition, if you apply a level of
    Effort to perception or searching tasks, you get a free level of
    Effort on that task.
  pt-BR: 'Você consegue enxergar em pouca luz e escuridão como se fosse luz forte, e consegue ver até uma distância curta através de neblina, fumaça e outros fenômenos obscurecedores. Além disso, se você aplicar um nível de Esforço a tarefas de percepção ou busca, ganha um nível gratuito de Esforço nessa tarefa.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: fuses-flesh-and-steel
    tier: 3
