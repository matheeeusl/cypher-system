id: onslaught
name:
  en: Onslaught
  pt-BR: Investida
description:
  en: >-
    You attack a foe using energies that assail either their physical
    form or their mind. In either case, you must be able to see your
    target. If the attack is physical, you emit a short-range ray of
    force that inflicts 4 points of damage. If the attack is mental, you
    focus your mental energy to blast the thought processes of another
    creature within short range. This mindslice inflicts 2 points of
    Intellect damage (ignores Armor). Some creatures without minds (such
    as robots) might be immune to your mindslice.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: type
    id: adept
    tier: 1
