id: task-specialization
name:
  en: Task Specialization
  pt-BR: Especialização em Tarefa
description:
  en: >-
    Choose one task (other than attacks or defense) that you are
    trained in. You become specialized in that task. (You can instead
    use this ability as Task Training to become trained in a task you
    aren't trained in.)
  pt-BR: 'Escolha uma tarefa (que não seja ataque ou defesa) na qual seja treinada. Você fica especializada nessa tarefa. (Você pode em vez disso usar esta habilidade como Treinamento em Tarefa para ficar treinada em uma tarefa na qual não é treinada.)'
cost: null
action_type: enabler
sources:
  - type: focus
    id: prepped-for-the-end
    tier: 5
skill_grant:
  count: 1
  options: noncombat
  mode: train_or_specialize
