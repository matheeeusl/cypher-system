id: vision-360
name:
  en: 360° Vision
  pt-BR: Visão 360°
description:
  en: >-
    You become aware of all security cameras, smartphones, computers,
    and other small surveillance device within long range. You can
    immediately hack such a device, either one you just detected or
    one you know of that is within 10 miles (16 km), allowing you to
    see from that camera's vantage point for one hour. In addition to
    the normal options for applying Effort, you can use Effort to
    affect additional cameras (one per level of Effort), increase the
    duration (one hour per level of Effort), or increase your range
    (another long distance of detection or 10 miles of access per
    level of Effort) in any combination.
  pt-BR: 'Você se torna consciente de todas as câmeras de segurança, smartphones, computadores e outros pequenos dispositivos de vigilância dentro de uma distância longa. Você pode invadir imediatamente um desses dispositivos, seja um que acabou de detectar ou um que já conheça dentro de 16 km (10 milhas), permitindo que veja do ponto de vista dessa câmera por uma hora. Além das opções normais de aplicação de Esforço, você pode usar Esforço para afetar câmeras adicionais (uma por nível de Esforço), aumentar a duração (uma hora por nível de Esforço), ou aumentar seu alcance (mais uma distância longa de detecção ou 16 km de acesso por nível de Esforço) em qualquer combinação.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
  # Source also carries a trailing errata note ("This document corrects
  # a suspected misprint in Neon Rain where Machine Enhancement is not
  # marked as a Cyberware-derived ability") — an editorial note about a
  # *different* ability, not part of 360° Vision's own mechanics;
  # omitted.
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 6
    cyberware: true
