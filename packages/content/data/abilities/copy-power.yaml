id: copy-power
name:
  en: Copy Power
  pt-BR: Copiar Poder
description:
  en: You can copy someone else's superpower for an hour, performing it as if it were natural for you. Within the past hour you must have touched the creature whose power you want to copy (an attack roll) and must have seen that ability used by them. Choose the power you want to copy, and the GM chooses an appropriate low-tier ability that most closely resembles that power. In addition to the point cost of Copy Power, you must pay the Might, Speed, or Intellect cost (if any) of the equivalent ability that the GM chose. You can copy only one power at a time; copying another one ends any other power you're copying with this ability. Copy Power doesn't copy effects of a power that permanently adds points to your Pools, such as Enhanced Body. In addition to the normal options for using Effort, you can choose to use Effort to copy an ability you saw longer than one hour ago; each level of Effort used in this way extends the time period by one hour.
  pt-BR: 'Você pode copiar o superpoder de outra pessoa por uma hora, realizando-o como se fosse natural para você. Na última hora você deve ter tocado a criatura cujo poder deseja copiar (uma rolagem de ataque) e deve ter visto essa habilidade sendo usada por ela. Escolha o poder que deseja copiar, e o Mestre escolhe uma habilidade apropriada de grau baixo que mais se assemelhe a esse poder. Além do custo em pontos de Copiar Poder, você deve pagar o custo de Força, Velocidade ou Intelecto (se houver) da habilidade equivalente escolhida pelo Mestre. Você só pode copiar um poder por vez; copiar outro encerra qualquer outro poder que esteja copiando com esta habilidade. Copiar Poder não copia efeitos de um poder que adiciona pontos permanentemente às suas Reservas, como Corpo Aprimorado. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para copiar uma habilidade que viu há mais de uma hora; cada nível de Esforço usado dessa forma estende o período por mais uma hora.'
  # Note: source cost is printed as "2+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 2 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: copies-superpowers
    tier: 2
