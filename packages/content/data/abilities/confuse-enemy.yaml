id: confuse-enemy
name:
  en: Confuse Enemy
  pt-BR: Confundir Inimigo
description:
  en: >-
    Through a clever bit of misdirection involving a flourish of your
    coat, ducking at just the right moment, or a similar stratagem,
    you can attempt to redirect a physical melee attack that would
    otherwise hit you. When you do, the misdirected attack hits
    another creature you choose within immediate range of both you
    and the attacking foe. This ability is a difficulty 2 Intellect
    task.
  pt-BR: >-
    Por meio de um golpe de misdireção envolvendo um floreio de seu
    casaco, um desvio no momento certo, ou uma estratégia semelhante,
    você pode tentar redirecionar um ataque corpo a corpo físico que
    de outra forma o acertaria. Ao fazer isso, o ataque desviado
    acerta outra criatura que você escolher, a alcance imediato tanto
    de você quanto do inimigo atacante. Esta habilidade é uma tarefa
    de Intelecto de dificuldade 2.
cost:
  pool: intellect
  amount: 4
action_type: enabler
sources:
  - type: focus
    id: works-the-system
    tier: 4
