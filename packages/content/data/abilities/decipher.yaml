id: decipher
name:
  en: Decipher
  pt-BR: Decifrar
description:
  en: >-
    If you spend one minute examining a piece of writing or code in a
    language you do not understand, you can make an Intellect roll of
    difficulty 3 (or higher, based on the complexity of the language or
    code) to get the gist of the message.
  pt-BR: 'Se você passar um minuto examinando um texto ou código escrito em um idioma que não entende, pode fazer uma rolagem de Intelecto de dificuldade 3 (ou maior, dependendo da complexidade do idioma ou código) para captar a essência da mensagem.'
cost:
  pool: intellect
  amount: 1
action_type: action_to_initiate
sources:
  - type: type
    id: explorer
    tier: 1
