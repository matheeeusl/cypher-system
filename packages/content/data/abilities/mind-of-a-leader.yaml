id: mind-of-a-leader
name:
  en: Mind of a Leader
  pt-BR: Mente de Líder
description:
  en: When you develop a course of action to deal with a future situation, you can ask the GM one very general question about what is likely to happen if you carry out the plan, and you will get a simple, brief answer.
  pt-BR: Quando você elabora um curso de ação para lidar com uma situação futura, pode fazer ao Mestre uma pergunta bem geral sobre o que provavelmente acontecerá se você executar o plano, e receberá uma resposta simples e breve.
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: descends-from-nobility
    tier: 6
