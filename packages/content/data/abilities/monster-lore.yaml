id: monster-lore
name:
  en: Monster Lore
  pt-BR: Conhecimento sobre Monstros
description:
  en: >-
    You are trained in the names, habits, suspected lairs, and
    related topics regarding the monsters of your world. You can make
    yourself understood in their languages (if they have one).
  pt-BR: 'Você é treinada nos nomes, hábitos, covis suspeitos e tópicos relacionados aos monstros do seu mundo. Você consegue se fazer entender em seus idiomas (se tiverem um).'
cost: null
action_type: enabler
sources:
  - type: focus
    id: slays-monsters
    tier: 1
