id: object-bond
name:
  en: Object Bond
  pt-BR: Vínculo com o Objeto
description:
  en: >-
    When you manifest the magic ally from your Bound Magic Creature
    ability, it can move up to 300 feet (90 m) from you before being
    returned to its bound object. Also, it can remain manifest for an
    extended period, lasting until the end of your next ten-hour
    recovery roll. Finally, if you give permission, the magic ally can
    emerge from and enter the bound object on its own initiative.
  pt-BR: 'Quando você manifesta a aliada mágica da sua habilidade Criatura Mágica Vinculada, ela pode se mover até 90 metros (300 pés) de você antes de ser devolvida ao seu objeto vinculado. Além disso, pode permanecer manifesta por um período estendido, durando até o fim da sua próxima rolagem de recuperação de dez horas. Por fim, se você conceder permissão, a aliada mágica pode emergir e entrar no objeto vinculado por iniciativa própria.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 2
