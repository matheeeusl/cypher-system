id: object-bond
name:
  en: Object Bond
  pt-BR: Vínculo com o Objeto
description:
  en: >-
    When you manifest the magic ally from your Bound Magic Creature
    ability, it can move up to 300 feet (90 m) from you before being
    returned to its bound object. Also, it can remain manifest for an
    extended period, lasting until the end of your next ten-hour
    recovery roll. Finally, if you give permission, the magic ally can
    emerge from and enter the bound object on its own initiative.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 2
