id: prepared-caches
name:
  en: Prepared Caches
  pt-BR: Reservas Preparadas
description:
  en: >-
    You have a prepped secret hideout with shelter and basic supplies
    capable of seeing you through a year or more, or up to six people
    through about three months. In addition, you have knowledge of
    three different secret supply caches you put together and hid
    before everything fell apart, chosen from the following. The
    caches are located no closer than about 5 miles (8 km) from each
    other.

    - Food cache (enough food for six people for twelve weeks)

    - Water cache (enough clean water for six people for twelve weeks)

    - Ammunition cache (400 shells or bullets for four different
    weapons)

    - Firearm cache (six firearms; a mix of light, medium, and heavy
    weapons, each usually found with about ten bullets or shells)
  pt-BR: >-
    Você tem um esconderijo secreto preparado com abrigo e suprimentos
    básicos capazes de sustentá-la por um ano ou mais, ou até seis
    pessoas por cerca de três meses. Além disso, você tem conhecimento
    de três reservas secretas de suprimentos diferentes que montou e
    escondeu antes de tudo desmoronar, escolhidas entre as seguintes.
    As reservas estão localizadas a não menos de cerca de 8 km (5
    milhas) uma da outra.

    - Reserva de comida (comida suficiente para seis pessoas por doze
    semanas)

    - Reserva de água (água limpa suficiente para seis pessoas por
    doze semanas)

    - Reserva de munição (400 cartuchos ou balas para quatro armas
    diferentes)

    - Reserva de armas de fogo (seis armas de fogo; uma mistura de
    armas leves, médias e pesadas, cada uma geralmente encontrada com
    cerca de dez balas ou cartuchos)
cost: null
action_type: enabler
sources:
  - type: focus
    id: prepped-for-the-end
    tier: 1
