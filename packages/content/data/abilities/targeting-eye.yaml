id: targeting-eye
name:
  en: Targeting Eye
  pt-BR: Olho Certeiro
description:
  en: >-
    You are trained in any physical ranged attack that is a character
    ability or comes from a device. For example, you are trained when
    using an Onslaught force blast because it's a physical attack, but
    not when using an Onslaught mindslice because it's a mental attack.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: type
    id: adept
    tier: 3
