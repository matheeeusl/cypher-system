id: vigilance
name:
  en: Vigilance
  pt-BR: Vigilância
description:
  en: >-
    You take a cautious approach to combat, focusing more on protecting
    yourself than on hurting your opponents. While this ability is
    active, you gain an asset on Speed defense rolls against melee and
    ranged attacks, and your melee and ranged attacks are hindered.
    This effect lasts for as long as you wish, but it ends if no combat
    is taking place within range of your senses.
  pt-BR: 'Você adota uma abordagem cautelosa no combate, concentrando-se mais em se proteger do que em ferir seus oponentes. Enquanto esta habilidade estiver ativa, você ganha um recurso em rolagens de defesa de Velocidade contra ataques corpo a corpo e à distância, e seus ataques corpo a corpo e à distância são dificultados. Esse efeito dura enquanto você desejar, mas termina se nenhum combate estiver ocorrendo dentro do alcance dos seus sentidos.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: warrior
    tier: 3
