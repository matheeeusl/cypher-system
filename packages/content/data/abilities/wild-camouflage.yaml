id: wild-camouflage
name:
  en: Wild Camouflage
  pt-BR: Camuflagem Selvagem
description:
  en: >-
    By drawing your clothing about you just so and using various
    tricks and your deep knowledge of your surroundings, you become
    invisible in the wilderness for ten minutes. While you are
    invisible, this asset eases your stealth and Speed defense tasks
    by two steps. This effect ends if you do something to reveal your
    presence or position—attacking, using an ability, moving a large
    object, and so on. If this occurs, you can regain the remaining
    invisibility effect by taking an action to focus on hiding your
    position.
  pt-BR: 'Ao ajeitar suas roupas de um certo jeito e usar vários truques e seu profundo conhecimento do ambiente, você fica invisível na natureza selvagem por dez minutos. Enquanto estiver invisível, esse recurso facilita suas tarefas de furtividade e defesa de Velocidade em dois níveis. Esse efeito termina se você fizer algo que revele sua presença ou posição — atacar, usar uma habilidade, mover um objeto grande, e assim por diante. Se isso ocorrer, você pode recuperar o efeito de invisibilidade restante usando uma ação para se concentrar em ocultar sua posição.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate_or_reinitiate
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 6
