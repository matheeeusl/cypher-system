id: store-energy
name:
  en: Store Energy
  pt-BR: Armazenar Energia
description:
  en: >-
    When you drain energy with your focus abilities, you can store
    some of it for later in a Siphon Pool. You can spend points from
    your Siphon Pool as if they were from your Might or Speed Pool, or
    use an action to spend them to restore an equal number of points
    to your Might or Speed Pool. Your Siphon Pool can safely store up
    to 3 points; each point beyond that hinders all of your tasks.
  pt-BR: 'Quando você drena energia com suas habilidades de foco, pode armazenar parte dela para depois em uma Reserva de Captação. Você pode gastar pontos da sua Reserva de Captação como se fossem da sua Reserva de Força ou Velocidade, ou usar uma ação para gastá-los restaurando um número igual de pontos à sua Reserva de Força ou Velocidade. Sua Reserva de Captação pode armazenar com segurança até 3 pontos; cada ponto além disso dificulta todas as suas tarefas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 4
  - type: focus
    id: siphons-power
    tier: 4
  - type: focus
    id: transmits-energy
    tier: 4
