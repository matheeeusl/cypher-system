id: drone-split
name:
  en: Drone Split
  pt-BR: Divisão de Drone
description:
  en: >-
    Your primary drone can split into two identical drones with all
    of the abilities of the primary drone. The split drones are each
    one level lower than the primary drone (so a level 4 primary
    drone becomes two level 3 drones). When they recombine, apply the
    damage from the more injured drone to the primary drone's health.
    If one of the two drones is destroyed, you can repair the primary
    drone as described in Drone Buddy.
  pt-BR: "Tradução em breve."
  # Note: source tag is "Action to split or recombine."
cost: null
action_type: action_to_split_or_recombine
sources:
  - type: focus
    id: has-a-custom-drone
    tier: 6
