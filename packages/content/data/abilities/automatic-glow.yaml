id: automatic-glow
name:
  en: Automatic Glow
  pt-BR: Brilho Automático
description:
  en: >-
    Hard light objects you create with your type and focus abilities
    shed light, illuminating everything in immediate range. Whenever
    you want, your body (entirely or just part of it) sheds light,
    illuminating everything in short range.
  pt-BR: 'Objetos de luz sólida que você cria com suas habilidades de tipo e foco emitem luz, iluminando tudo dentro de uma distância imediata. Sempre que quiser, seu corpo (inteiro ou apenas uma parte dele) emite luz, iluminando tudo dentro de uma distância curta.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: sculpts-hard-light
    tier: 1
