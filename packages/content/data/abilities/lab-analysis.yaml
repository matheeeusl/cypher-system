id: lab-analysis
name:
  en: Lab Analysis
  pt-BR: Análise Laboratorial
description:
  en: You analyze the scene of a crime, the site of a mysterious incident, or a series of unexplained phenomena, and maybe learn a surprising amount of information about the perpetrators, the participants, or the force(s) responsible. To do so, you must collect samples from the scene. Samples are paint or wood scrapings, dirt, photographs of the area, hair, an entire corpse, and so on. With samples in hand, you can discover up to three pertinent pieces of information about the scene, possibly clearing up a lesser mystery and pointing the way to solving a greater one. The GM will decide what you learn and what level of difficulty is needed to learn it. The task is eased if you take the time to transport the samples to a permanent lab (if you have access to one), as opposed to conducting the analysis with your field science kit.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
# Note: source tag is "Action to initiate, 2d20 minutes to complete." —
# the "2d20 minutes to complete" clause is a duration, not modeled by
# action_type.
action_type: action_to_initiate
sources:
  - type: focus
    id: conducts-weird-science
    tier: 1
