id: flavor-cantrip
name:
  en: Flavor Cantrip
  pt-BR: Truque do Sabor
description:
  en: You touch one plate or bowl of food or one large glass or mug of liquid, improving its
    flavor. This doesn't affect the nutritional value or texture, nor does it fix spoiled
    food; it just makes it taste more to your preference (so you could eat spoiled meat or
    moldy vegetables and they'd taste fine). You decide the sort of flavor change—more or
    less spicy, salty, savory, sweet, and so on, in any combination appropriate for food
    or drink.
  pt-BR: Você toca um prato ou tigela de comida, ou um copo grande ou caneca de líquido,
    melhorando o sabor. Isso não afeta o valor nutricional nem a textura, nem conserta
    comida estragada; apenas faz com que tenha um gosto mais ao seu agrado (então você
    poderia comer carne estragada ou legumes mofados e eles teriam um gosto bom). Você
    decide o tipo de mudança de sabor — mais ou menos picante, salgado, saboroso, doce e
    assim por diante, em qualquer combinação adequada a comida ou bebida.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
