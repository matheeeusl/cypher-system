id: fire-bloom
name:
  en: Fire Bloom
  pt-BR: Floração de Fogo
description:
  en: Fire blooms within long range, filling an area 10 feet (3 m) in radius and inflicting 3 points of damage on all affected targets. Effort applied to one attack counts for all attacks against targets in the area of the bloom. Even on an unsuccessful attack, a target in the area still takes 1 point of damage. Flammable objects in the area may catch fire.
  pt-BR: O fogo floresce a alcance longo, preenchendo uma área de 3 metros de raio e infligindo 3 pontos de dano a todos os alvos afetados. O Esforço aplicado a um ataque conta para todos os ataques contra alvos na área da floração. Mesmo em um ataque malsucedido, um alvo na área ainda sofre 1 ponto de dano. Objetos inflamáveis na área podem pegar fogo.
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: masters-spells
    tier: 3
  - type: focus
    id: channels-divine-blessings
    tier: 3
attack: true
