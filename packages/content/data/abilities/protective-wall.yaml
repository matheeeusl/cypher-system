id: protective-wall
name:
  en: Protective Wall
  pt-BR: Muralha Protetora
description:
  en: >-
    When engaging in combat that directly relates to defending a
    community you are associated with, you can attack up to five
    different foes as a single action as long as they are all within
    immediate range. If you hit an attacker, they are pushed back an
    immediate distance. All of the attacks have to be the same sort of
    attack (melee or ranged). Make a separate attack roll for each
    foe. You remain limited by the amount of Effort you can apply on
    one action. Anything that modifies your attack or damage applies
    to all of these attacks. In addition to the normal options for
    using Effort, you can choose to use Effort to increase the number
    of foes you can attack with this ability, one additional foe per
    level of Effort.
  pt-BR: 'Ao entrar em combate diretamente relacionado a defender uma comunidade à qual você está associada, você pode atacar até cinco inimigos diferentes como uma única ação, desde que todos estejam dentro de uma distância imediata. Se você acertar um atacante, ele é empurrado uma distância imediata para trás. Todos os ataques devem ser do mesmo tipo (corpo a corpo ou à distância). Faça uma rolagem de ataque separada para cada inimigo. Você permanece limitada pela quantidade de Esforço que pode aplicar em uma ação. Qualquer coisa que modifique seu ataque ou dano se aplica a todos esses ataques. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o número de inimigos que pode atacar com esta habilidade, um inimigo adicional por nível de Esforço.'
  # Note: source cost is printed as "6+ Might points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Might points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: might
  amount: 6
action_type: enabler
sources:
  - type: focus
    id: shepherds-the-community
    tier: 6
