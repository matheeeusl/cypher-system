id: sunlight
name:
  en: Sunlight
  pt-BR: Luz Solar
description:
  en: A mote of light travels from you to a spot you choose within long range. When the mote reaches that spot, it flares and casts bright light in a 200-foot (60 m) radius, and darkness within 1,000 feet (300 m) of the mote becomes dim light. The light lasts for one hour or until you use an action to dismiss it.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: blazes-with-radiance
    tier: 4
