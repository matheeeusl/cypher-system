id: sunlight
name:
  en: Sunlight
  pt-BR: Luz Solar
description:
  en: A mote of light travels from you to a spot you choose within long range. When the mote reaches that spot, it flares and casts bright light in a 200-foot (60 m) radius, and darkness within 1,000 feet (300 m) of the mote becomes dim light. The light lasts for one hour or until you use an action to dismiss it.
  pt-BR: 'Um ponto de luz viaja de você até um local que escolher dentro de uma distância longa. Quando o ponto de luz alcança esse local, ele se acende e lança luz forte em um raio de 60 metros (200 pés), e a escuridão dentro de 300 metros (1.000 pés) do ponto de luz se torna luz fraca. A luz dura uma hora ou até você usar uma ação para dispensá-la.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: blazes-with-radiance
    tier: 4
