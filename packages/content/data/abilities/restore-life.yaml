id: restore-life
name:
  en: Restore Life
  pt-BR: Restaurar a Vida
description:
  en: >-
    You can attempt to restore life to a dead creature of up to level
    3, as long as the corpse is no more than a day old and is mostly
    intact. You can also attempt to restore life to a corpse that is
    much older but is especially well preserved. The difficulty of
    the Intellect task is equal to the level of the creature you're
    attempting to restore to life. For each additional level of
    Effort applied, you can attempt to restore the life of a creature
    whose level is 1 higher. When first restored to life, a creature
    is dazed for at least a day, and all tasks they attempt are
    hindered.
  pt-BR: 'Você pode tentar restaurar a vida de uma criatura morta de até nível 3, desde que o cadáver tenha no máximo um dia e esteja, em sua maior parte, intacto. Você também pode tentar restaurar a vida de um cadáver muito mais antigo, mas especialmente bem preservado. A dificuldade da tarefa de Intelecto é igual ao nível da criatura que está tentando trazer de volta à vida. Para cada nível adicional de Esforço aplicado, você pode tentar restaurar a vida de uma criatura cujo nível seja 1 acima. Ao ser trazida de volta à vida pela primeira vez, a criatura fica atordoada por pelo menos um dia, e todas as tarefas que tentar são dificultadas.'
  # Note: source cost is printed as "9+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 9 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk). Source tag is "Action; one minute to initiate." — the
  # "one minute to initiate" clause is a duration, not modeled by
  # action_type.
cost:
  pool: intellect
  amount: 9
action_type: action_to_initiate
sources:
  - type: focus
    id: turns-decay-to-growth
    tier: 6
  - type: focus
    id: works-miracles
    tier: 6
