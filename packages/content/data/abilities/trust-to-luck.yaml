id: trust-to-luck
name:
  en: Trust to Luck
  pt-BR: Confiar na Sorte
description:
  en: >-
    Sometimes, you've just got to roll the dice and hope things add up
    in your favor. When you use Trust to Luck, roll a d6. On any even
    result, the task you're attempting is eased by two steps. On a
    roll of 1, the task is hindered.
  pt-BR: 'Às vezes, você só precisa rolar os dados e torcer para que as coisas se resolvam a seu favor. Ao usar Confiar na Sorte, role 1d6. Em qualquer resultado par, a tarefa que você está tentando é facilitada em dois níveis. Em uma rolagem de 1, a tarefa é dificultada.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 6
  - type: focus
    id: operates-undercover
    tier: 6
  - type: flavor
    id: modern-magic
    tier: 6
