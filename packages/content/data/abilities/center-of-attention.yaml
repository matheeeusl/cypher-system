id: center-of-attention
name:
  en: Center of Attention
  pt-BR: Centro das Atenções
description:
  en: >-
    A literal (or metaphorical, depending on the genre) beam of pure
    radiance descends from on high and spotlights you. All creatures
    you choose within immediate range fall to their knees and lose
    their next action. Affected targets cannot defend themselves and
    are treated as helpless.
  pt-BR: 'Um feixe literal (ou metafórico, dependendo do gênero) de pura radiância desce do alto e ilumina você. Todas as criaturas que você escolher dentro de uma distância imediata caem de joelhos e perdem sua próxima ação. Os alvos afetados não conseguem se defender e são tratados como indefesos.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: was-foretold
    tier: 4
