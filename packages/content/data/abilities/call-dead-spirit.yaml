id: call-dead-spirit
name:
  en: Call Dead Spirit
  pt-BR: Chamar Espírito Morto
description:
  en: >-
    At your touch, the remains of a creature dead no longer than
    seven days appears as a manifest (and apparently physical)
    spirit, whose level is the same as it had in life. The raised
    spirit persists for up to a day (or less, if it accomplishes
    something important to it before then), after which it fades away
    and cannot return again. The raised spirit remembers everything it
    knew in life and possesses most of its previous abilities (though
    not necessarily its equipment). In addition, it gains the ability
    to become insubstantial as an action for up to a minute at a time.
    The raised spirit is not beholden to you, and it does not need to
    stay near you to remain manifest.
  pt-BR: 'Ao seu toque, os restos mortais de uma criatura morta há no máximo sete dias surgem como um espírito manifesto (e aparentemente físico), cujo nível é o mesmo que tinha em vida. O espírito erguido persiste por até um dia (ou menos, se realizar algo importante para ele antes disso), após o que se desvanece e não pode retornar novamente. O espírito erguido se lembra de tudo o que sabia em vida e possui a maioria de suas habilidades anteriores (embora não necessariamente seu equipamento). Além disso, ganha a capacidade de se tornar incorpóreo como uma ação por até um minuto de cada vez. O espírito erguido não está subordinado a você e não precisa permanecer perto de você para continuar manifesto.'
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: shepherds-spirits
    tier: 5
