id: flying-companion
name:
  en: Flying Companion
  pt-BR: Companheiro Voador
description:
  en: >-
    You gain a level 3 companion creature that can fly at the same
    speed as you; depending on other aspects of your character, this
    might be a trained bird, a machine drone, or a helpful strange
    creature such as a familiar. This creature accompanies you and
    acts as you direct. As a level 3 companion, it has a target
    number of 9 and 9 health, and it inflicts 3 points of damage. If
    it's killed or destroyed, it takes you one month to find or
    create a suitable replacement.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: soars-on-amazing-wings
    tier: 3
