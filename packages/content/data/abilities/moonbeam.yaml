id: moonbeam
name:
  en: Moonbeam
  pt-BR: Raio de Luar
description:
  en: >-
    You emit a cone of pale, cool moonlight from your hand,
    illuminating up to a short distance with dim light, lasting for
    one minute. As your action or as part of the action of activating
    this ability, you can tighten the beam so it focuses on one
    creature, inflicting either 4 points of cold damage or 2 points of
    Intellect damage (ignores Armor), which immediately ends the
    spell. You automatically know if the struck creature is a
    shapechanger (such as a werewolf), although this doesn't tell you
    what kind of shapechanger they are or what their true form is.
  pt-BR: 'Você emite um cone de luar pálido e frio da sua mão, iluminando até uma distância curta com luz fraca, durando um minuto. Como sua ação ou como parte da ação de ativar esta habilidade, você pode concentrar o feixe para focá-lo em uma criatura, causando 4 pontos de dano de frio ou 2 pontos de dano de Intelecto (ignora Armadura), o que encerra imediatamente o feitiço. Você automaticamente sabe se a criatura atingida é uma metamorfa (como um lobisomem), embora isso não lhe diga que tipo de metamorfa ela é ou qual é sua verdadeira forma.'
  # Note: source cost is printed as "1+ Intellect point" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 1 Intellect point here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: focus
    id: practices-moon-magic
    tier: 1
