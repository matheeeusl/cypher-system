id: dark-matter-structure
name:
  en: Dark Matter Structure
  pt-BR: Estrutura de Matéria Escura
description:
  en: You can form dark matter into a large structure consisting of up to ten 10-foot (3 m) cubes. The structure can be somewhat complex, though everything has the same matte black color from which no light shines. Otherwise, the structure can possess different densities, textures, and capacities. This means it can include windows, doors with locks, furnishings, and even decor, as long as it is all black as pitch. For example, you could shape the dark matter into a large, defensible structure; a sturdy 100-foot (30 m) bridge; or anything similar. The structure is a level 6 creation and lasts for 24 hours. You can't keep more than one such structure solid at any one time.
  pt-BR: 'Você pode moldar matéria escura em uma estrutura grande, composta de até dez cubos de 3 metros (10 pés). A estrutura pode ser um tanto complexa, embora tudo tenha a mesma cor preto-fosco da qual nenhuma luz brilha. Fora isso, a estrutura pode ter diferentes densidades, texturas e capacidades. Isso significa que pode incluir janelas, portas com fechaduras, móveis e até decoração, desde que tudo seja preto como breu. Por exemplo, você poderia moldar a matéria escura em uma estrutura grande e defensável; uma ponte resistente de 30 metros (100 pés); ou qualquer coisa semelhante. A estrutura é uma criação de nível 6 e dura 24 horas. Você não pode manter mais de uma estrutura assim sólida ao mesmo tempo.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: befriends-the-black-dog
    tier: 5
  - type: focus
    id: dances-with-dark-matter
    tier: 6
