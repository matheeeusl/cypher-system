id: battle-management
name:
  en: Battle Management
  pt-BR: Gestão de Batalha
description:
  en: >-
    As long as you use your action each round giving orders or advice,
    attack and defense actions taken by your allies within short range
    are eased.
  pt-BR: 'Enquanto você usar sua ação a cada round dando ordens ou conselhos, as ações de ataque e defesa realizadas por seus aliados dentro de uma distância curta são facilitadas.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: type
    id: speaker
    tier: 6
