id: dark-explorer
name:
  en: Dark Explorer
  pt-BR: Explorador das Trevas
description:
  en: >-
    You ignore penalties for any action (including fighting) in
    extremely dim light or in cramped spaces. If you also have the
    Eyes Adjusted ability, you can act without penalty even in total
    darkness. You are trained in sneaking tasks while in dim or no
    light.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: explores-dark-places
    tier: 5
