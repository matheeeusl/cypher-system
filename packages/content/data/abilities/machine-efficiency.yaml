id: machine-efficiency
name:
  en: Machine Efficiency
  pt-BR: Eficiência de Máquina
description:
  en: You can make a blaster shoot farther, coax more speed from a skycycle, improve the
    clarity of a camera, jury-rig a light to be brighter, speed up a network connection,
    and so on. You increase an object’s level by 2 for one minute, or you treat the object
    as an asset that eases an associated task by two steps for one minute (your choice).
  pt-BR: Você pode fazer um blaster atirar mais longe, extrair mais velocidade de uma moto
    aérea, melhorar a nitidez de uma câmera, improvisar uma luz mais brilhante, acelerar
    uma conexão de rede e assim por diante. Você aumenta o nível de um objeto em 2 por um
    minuto, ou trata o objeto como um recurso que facilita uma tarefa associada em dois
    níveis por um minuto (à sua escolha).
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: flavor
    id: technology
    tier: 2
