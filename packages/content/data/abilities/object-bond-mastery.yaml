id: object-bond-mastery
name:
  en: Object Bond Mastery
  pt-BR: Maestria do Vínculo com o Objeto
description:
  en: >-
    When you manifest the magic ally from your Bound Magic Creature
    ability, it is now a level 7 creature. It can remain manifest for
    only three minutes, after which it must return to its object and
    rest for three days before you can manifest it again. The magic
    ally can make its own magic touch attacks (when it does, you roll
    for it). If it uses its pulse attack from Improved Object Bond,
    instead of deactivating items, it can take control of one item
    within short range for one minute, if applicable. Finally, the
    magic ally can transform into smoke and flame as its action,
    giving it +10 to Armor but rendering it incapable of attacking
    foes. In this form, it can fly a long distance each round, and the
    first time each day it returns to flesh (as an action), it regains
    25 points of health.
  pt-BR: 'Quando você manifesta a aliada mágica da sua habilidade Criatura Mágica Vinculada, ela agora é uma criatura de nível 7. Ela só pode permanecer manifesta por três minutos, após o que deve retornar ao seu objeto e descansar por três dias antes que você possa manifestá-la novamente. A aliada mágica pode fazer seus próprios ataques mágicos de toque (quando o faz, você rola por ela). Se usar seu ataque de pulso de Vínculo com o Objeto Aprimorado, em vez de desativar itens, pode assumir o controle de um item dentro de uma distância curta por um minuto, se aplicável. Por fim, a aliada mágica pode se transformar em fumaça e chamas como sua ação, ganhando +10 de Armadura, mas ficando incapaz de atacar inimigos. Nessa forma, pode voar uma distância longa a cada round, e na primeira vez em cada dia que retorna à carne (como uma ação), recupera 25 pontos de saúde.'
cost:
  pool: intellect
  amount: 7
action_type: enabler
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 6
