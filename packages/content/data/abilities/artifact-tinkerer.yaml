id: artifact-tinkerer
name:
  en: Artifact Tinkerer
  pt-BR: Adaptador de Artefatos
description:
  en: >-
    If you spend at least one day tinkering with an artifact in your possession, it functions at one level higher than normal.
    This applies to all artifacts in your possession, but they retain this bonus only for you.
  pt-BR: 'Se você passar pelo menos um dia mexendo em um artefato em sua posse, ele passa a funcionar em um nível acima do normal. Isso se aplica a todos os artefatos em sua posse, mas eles mantêm esse bônus apenas para você.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: crafts-unique-objects
    tier: 2
