id: special-shot
name:
  en: Special Shot
  pt-BR: Tiro Especial
description:
  en: >-
    When you hit a target with a gun attack, you can choose to reduce
    the damage by 1 point but hit the target in a precise spot. Some
    of the possible effects include (but are not limited to) the
    following:

    - You can shoot an object out of someone's hand.

    - You can shoot the leg, wing, or other limb it uses to move,
    reducing its maximum movement speed to immediate for a few days
    or until it receives expert medical care.

    - You can shoot a strap holding a backpack, armor, or a similarly
    strapped-on item so that it falls off.
  pt-BR: >-
    Quando você acerta um alvo com um ataque de arma de fogo, pode
    optar por reduzir o dano em 1 ponto, mas atingir o alvo em um
    ponto preciso. Alguns dos efeitos possíveis incluem (mas não se
    limitam a) os seguintes:

    - Você pode atirar em um objeto para tirá-lo da mão de alguém.

    - Você pode atirar na perna, asa ou outro membro que o alvo usa
    para se mover, reduzindo sua velocidade máxima de movimento para
    imediata por alguns dias ou até receber atendimento médico
    especializado.

    - Você pode atirar em uma alça que segura uma mochila, armadura,
    ou item preso de forma semelhante, fazendo com que caia.
cost: null
action_type: enabler
sources:
  - type: focus
    id: is-licensed-to-carry
    tier: 6
