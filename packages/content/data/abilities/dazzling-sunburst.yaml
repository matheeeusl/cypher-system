id: dazzling-sunburst
name:
  en: Dazzling Sunburst
  pt-BR: Explosão Solar Ofuscante
description:
  en: You send a barrage of dazzling colors at a creature within short range and, if successful, inflict 2 points of damage on the target. In addition, the creature's attacks are hindered on its next turn, unless the target relies primarily on senses other than sight.
  pt-BR: 'Você envia uma rajada de cores ofuscantes a uma criatura dentro de uma distância curta e, se bem-sucedido, causa 2 pontos de dano ao alvo. Além disso, os ataques da criatura são dificultados em seu próximo turno, a menos que o alvo dependa principalmente de sentidos que não a visão.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: blazes-with-radiance
    tier: 2
attack: true
