id: predictive-model
name:
  en: Predictive Model
  pt-BR: Modelo Preditivo
description:
  en: If you've used Predictive Equation on a creature, object, or location within the last few days, you can learn one random fact about the subject that is pertinent to a topic you designate. If you also have the magic flavor ability Premonition, one use of either ability grants you two random but related facts about the subject. In addition, you can use Predictive Model on the same subject multiple times (even if you've learned a creature's level), but each time you do, you must apply one additional level of Effort than on your previous use.
  pt-BR: 'Se você usou Equação Preditiva em uma criatura, objeto ou local nos últimos dias, pode descobrir um fato aleatório sobre o assunto pertinente a um tópico que designar. Se você também tiver a habilidade de perfil mágico Premonição, um uso de qualquer uma das habilidades lhe concede dois fatos aleatórios, mas relacionados, sobre o assunto. Além disso, você pode usar Modelo Preditivo no mesmo assunto múltiplas vezes (mesmo que já tenha descoberto o nível de uma criatura), mas cada vez que o fizer, deve aplicar um nível adicional de Esforço em relação ao uso anterior.'
  # Note: source cost is printed as "2+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 2 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: calculates-the-incalculable
    tier: 2
