id: horde-fighting
name:
  en: Horde Fighting
  pt-BR: Combate Contra Hordas
description:
  en: When two or more foes attack you at once in melee, you can use them against each other. You gain an asset to Speed defense rolls or attack rolls (your choice each round) against them.
  pt-BR: Quando dois ou mais inimigos o atacam ao mesmo tempo corpo a corpo, você pode usá-los uns contra os outros. Você ganha um bônus em rolagens de defesa de Agilidade ou em rolagens de ataque (à sua escolha a cada rodada) contra eles.
cost: null
action_type: enabler
sources:
