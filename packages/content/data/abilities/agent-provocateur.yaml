id: agent-provocateur
name:
  en: Agent Provocateur
  pt-BR: Agente Provocador
description:
  en: >-
    Choose one of the following to be trained in: attacking with a
    weapon of your choice, demolitions, or sneaking and lockpicking
    (if you choose this last option, you are trained in both).
  pt-BR: >-
    Escolha uma das seguintes opções para receber treinamento: atacar com
    uma arma de sua escolha, demolições ou furtividade e
    arrombamento de fechaduras (se escolher esta última opção,
    você recebe treinamento em ambas).
cost: null
action_type: enabler
sources:
  - type: focus
    id: operates-undercover
    tier: 3
