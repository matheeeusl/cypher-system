id: expert-follower
name:
  en: Expert Follower
  pt-BR: Seguidor Especialista
description:
  en: You gain a level 3 follower. They are not restricted on their modifications. You can take this ability multiple times, each time gaining another level 3 follower. Alternatively, you could choose to advance a level 2 follower you already have to level 3 and then gain a new level 2 follower.
  pt-BR: Você ganha um seguidor de nível 3. Ele não tem restrições em suas modificações. Você pode escolher esta habilidade várias vezes, ganhando outro seguidor de nível 3 a cada vez. Alternativamente, você pode optar por promover um seguidor de nível 2 que já tenha para o nível 3 e depois ganhar um novo seguidor de nível 2.
cost: null
