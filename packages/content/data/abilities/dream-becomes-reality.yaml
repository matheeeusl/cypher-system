id: dream-becomes-reality
name:
  en: Dream Becomes Reality
  pt-BR: O Sonho Se Torna Realidade
description:
  en: >-
    You create a dream object of any shape you can imagine that is
    your size or smaller, which takes on apparent substance and
    heft. The object is crude and can have no moving parts, so you
    can make a sword, a shield, a short ladder, and so on. The dream
    object has the approximate mass of the real object, if you
    choose. Your dream objects are as strong as iron, but if you do
    not remain within long range of them, they function for only one
    minute before fading away.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: lived-among-the-fey
    tier: 3
