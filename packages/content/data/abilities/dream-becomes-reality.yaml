id: dream-becomes-reality
name:
  en: Dream Becomes Reality
  pt-BR: O Sonho Se Torna Realidade
description:
  en: >-
    You create a dream object of any shape you can imagine that is
    your size or smaller, which takes on apparent substance and
    heft. The object is crude and can have no moving parts, so you
    can make a sword, a shield, a short ladder, and so on. The dream
    object has the approximate mass of the real object, if you
    choose. Your dream objects are as strong as iron, but if you do
    not remain within long range of them, they function for only one
    minute before fading away.
  pt-BR: 'Você cria um objeto onírico de qualquer forma que consiga imaginar, do seu tamanho ou menor, que assume substância e peso aparentes. O objeto é rústico e não pode ter partes móveis, então você pode fazer uma espada, um escudo, uma escada curta, e assim por diante. O objeto onírico tem aproximadamente a massa do objeto real, se você escolher. Seus objetos oníricos são resistentes como ferro, mas se você não permanecer dentro de uma distância longa deles, eles funcionam por apenas um minuto antes de desaparecer.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: lived-among-the-fey
    tier: 3
