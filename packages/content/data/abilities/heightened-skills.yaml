id: heightened-skills
name:
  en: Heightened Skills
  pt-BR: Perícias Aprimoradas
description:
  en: >-
    You are trained in two tasks of your choosing (other than attacks
    or defense). If you choose a task you're already trained in, you
    instead become specialized in that task. You can't choose a task
    you're already specialized in.
  pt-BR: 'Você fica treinada em duas tarefas à sua escolha (que não sejam ataque ou defesa). Se escolher uma tarefa na qual já é treinada, torna-se especializada nessa tarefa. Você não pode escolher uma tarefa na qual já é especializada.'
cost: null
action_type: enabler
sources:
  - type: type
    id: speaker
    tier: 4
