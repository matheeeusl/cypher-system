id: knock-out
name:
  en: Knock Out
  pt-BR: Nocautear
description:
  en: You make a melee attack that inflicts no damage. Instead, if the attack hits, make a second Might-based roll. If successful, a foe of level 3 or lower is knocked unconscious for one minute. For each level of Effort used, you can affect one higher level of foe, or you can extend the duration for an additional minute.
  pt-BR: Você faz um ataque corpo a corpo que não causa dano. Em vez disso, se o ataque acertar, faça uma segunda rolagem baseada em Força. Se for bem-sucedida, um inimigo de nível 3 ou menor é nocauteado por um minuto. Para cada nível de Esforço usado, você pode afetar um inimigo de nível mais alto, ou pode estender a duração por mais um minuto.
cost:
  pool: might
  amount: 5
action_type: action
sources:
  - type: focus
    id: collects-bounties
    tier: 6
