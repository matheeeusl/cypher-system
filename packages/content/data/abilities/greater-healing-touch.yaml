id: greater-healing-touch
name:
  en: Greater Healing Touch
  pt-BR: Toque Curativo Maior
description:
  en: >-
    You touch a creature and restore its Might Pool, Speed Pool, and
    Intellect Pool to their maximum values, as if it were fully
    rested. A single creature can benefit from this ability only once
    each day.
  pt-BR: >-
    Você toca em uma criatura e restaura sua Reserva de Força, Reserva
    de Velocidade e Reserva de Intelecto aos seus valores máximos,
    como se ela estivesse totalmente descansada. Uma única criatura
    pode se beneficiar desta habilidade apenas uma vez por dia.
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: works-miracles
    tier: 6
