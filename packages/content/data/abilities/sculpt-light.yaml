id: sculpt-light
name:
  en: Sculpt Light
  pt-BR: Esculpir Luz
description:
  en: >-
    You create an object of solid light in any shape you can imagine
    that is your size or smaller, and it persists for about an hour.
    The object appears in an area adjacent to you. It is crude and
    can have no moving parts, so you can make a sword, a shield, a
    short ladder, and so on. The object has the approximate mass of
    the real object and is level 4.
  pt-BR: 'Você cria um objeto de luz sólida em qualquer forma que consiga imaginar do seu tamanho ou menor, e ele persiste por cerca de uma hora. O objeto aparece em uma área adjacente a você. É rústico e não pode ter partes móveis, então você pode fazer uma espada, um escudo, uma escada curta, e assim por diante. O objeto tem aproximadamente a massa do objeto real e é de nível 4.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: sculpts-hard-light
    tier: 3
