id: sculpt-light
name:
  en: Sculpt Light
  pt-BR: Esculpir Luz
description:
  en: >-
    You create an object of solid light in any shape you can imagine
    that is your size or smaller, and it persists for about an hour.
    The object appears in an area adjacent to you. It is crude and
    can have no moving parts, so you can make a sword, a shield, a
    short ladder, and so on. The object has the approximate mass of
    the real object and is level 4.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: sculpts-hard-light
    tier: 3
