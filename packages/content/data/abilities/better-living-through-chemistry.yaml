id: better-living-through-chemistry
name:
  en: Better Living Through Chemistry
  pt-BR: Vida Melhor Através da Química
description:
  en: You've developed drug cocktails specifically designed to work with your own biochemistry. Depending on which one you inject, it makes you smarter, faster, or tougher, but when it wears off, the crash is a doozy, so you use it only in desperate situations. You gain 2 to your Might Edge, Speed Edge, or Intellect Edge for one minute, after which you can't gain the benefit again for one hour. During this follow-up hour, every time you spend points from a Pool, increase the cost by 1.
  pt-BR: 'Você desenvolveu coquetéis de drogas projetados especificamente para funcionar com sua própria bioquímica. Dependendo de qual deles você injeta, ele o torna mais inteligente, mais rápido ou mais resistente, mas quando o efeito passa, a ressaca é terrível, então você só o usa em situações desesperadoras. Você ganha 2 pontos na sua Margem de Força, Margem de Velocidade ou Margem de Intelecto por um minuto, após o qual não pode obter o benefício novamente por uma hora. Durante essa hora seguinte, toda vez que você gastar pontos de uma Reserva, aumente o custo em 1.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: conducts-weird-science
    tier: 3
