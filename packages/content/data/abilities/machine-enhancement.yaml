id: machine-enhancement
name:
  en: Machine Enhancement
  pt-BR: Aprimoramento de Máquina
description:
  en: >-
    Any time you use Effort on an Intellect action, add one of the
    following enhancements to the action (your choice):

    - Free level of Effort

    - Automatic minor effect
  pt-BR: "Tradução em breve."
