id: consequences-of-luck
name:
  en: Consequences of Luck
  pt-BR: Consequências da Sorte
description:
  en: >-
    It used to be easier to be lucky all the time. Now, it takes a
    toll. When you roll a 1, you can reroll. If you reroll and roll a
    1, 2, or 3, you must reroll again, this time expending a level of
    Effort plus the base Pool cost to activate this ability (5
    Intellect points). If you roll a 1–5 on the second reroll, you
    must reroll again, expending a level of Effort and spending the
    base cost again (5 Intellect points), too. This progression of
    forced rerolls coupled with an increasing failure range continues
    until you roll higher than the failure range or you run out of
    Intellect points. (If the target number you roll is below the
    failure range, you might succeed on the task, but the forced
    rerolling continues.)
  pt-BR: 'Antes era mais fácil ter sorte o tempo todo. Agora, isso tem um preço. Quando você rolar um 1, pode rolar novamente. Se rolar novamente e obtiver 1, 2 ou 3, deve rolar mais uma vez, desta vez gastando um nível de Esforço mais o custo base da Reserva para ativar esta habilidade (5 pontos de Intelecto). Se rolar entre 1 e 5 na segunda nova rolagem, deve rolar novamente, gastando um nível de Esforço e pagando o custo base outra vez (5 pontos de Intelecto). Essa progressão de novas rolagens forçadas, junto com uma faixa de falha crescente, continua até que você role acima da faixa de falha ou fique sem pontos de Intelecto. (Se o número-alvo que você rolar estiver abaixo da faixa de falha, você pode ter sucesso na tarefa, mas a nova rolagem forçada continua.)'
  # Note: source cost is printed as "5+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 5 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 5
action_type: enabler
sources:
  - type: focus
    id: gambles-it-all-away
    tier: 5
