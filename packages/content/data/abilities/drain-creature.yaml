id: drain-creature
name:
  en: Drain Creature
  pt-BR: Drenar Criatura
description:
  en: >-
    You can drain energy from a living creature you touch, inflicting
    3 points of damage and restoring 3 points to your Might or Speed
    Pool.
  pt-BR: 'Você pode drenar energia de uma criatura viva que tocar, causando 3 pontos de dano e restaurando 3 pontos à sua Reserva de Força ou Velocidade.'
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: siphons-power
    tier: 2
  - type: focus
    id: transmits-energy
    tier: 2
