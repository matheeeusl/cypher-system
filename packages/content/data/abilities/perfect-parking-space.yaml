id: perfect-parking-space
name:
  en: Perfect Parking Space
  pt-BR: Vaga de Estacionamento Perfeita
description:
  en: >-
    You can send your car into a pocket dimension that moves with you
    and is just large enough to hold it. Nobody other than you can
    perceive or access this space unless they have the ability to
    interact with transdimensional areas. The space is a part of you,
    so you can't use it to store the car if you and the car have more
    cyphers than your limit, a detonation cypher activated inside the
    car while it's in the space harms you, and so on. Storing or
    retrieving the car happens over one minute as it slowly (and
    visibly) vanishes or reappears; you can reduce this time to just
    one round if you succeed at a level 4 Intellect task.
  pt-BR: 'Você pode enviar seu carro para uma dimensão de bolso que se move com você e é grande o suficiente para contê-lo. Ninguém além de você consegue perceber ou acessar esse espaço, a menos que tenha a capacidade de interagir com áreas transdimensionais. O espaço é parte de você, então não pode usá-lo para guardar o carro se você e o carro tiverem mais cifras do que o seu limite, uma cifra de detonação ativada dentro do carro enquanto ele está no espaço o prejudica, e assim por diante. Guardar ou recuperar o carro acontece ao longo de um minuto, enquanto ele lentamente (e visivelmente) desaparece ou reaparece; você pode reduzir esse tempo a apenas um round se tiver sucesso em uma tarefa de Intelecto de nível 4.'
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: is-a-car-wizard
    tier: 3
