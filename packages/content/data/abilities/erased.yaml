id: erased
name:
  en: Erased
  pt-BR: Apagado
description:
  en: >-
    You infiltrated the networks so completely that networked
    cameras can't identify you. If your face comes up on automated
    recording devices, vulnerabilities you've previously exploited
    keep you from being recognized. When security officers recognize
    you, upon checking their records they're told that you're not who
    you seem to be, but rather someone unimportant, which you can use
    as an asset in any related persuasion or deception interaction.
  pt-BR: 'Você se infiltrou tão completamente nas redes que câmeras conectadas não conseguem identificá-lo. Se seu rosto aparecer em dispositivos automáticos de gravação, vulnerabilidades que você já explorou o impedem de ser reconhecido. Quando agentes de segurança o reconhecem, ao verificar seus registros são informados de que você não é quem parece ser, mas sim alguém sem importância, o que você pode usar como um recurso em qualquer interação relacionada de persuasão ou decepção.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: hacks-the-network
    tier: 4
