id: trick-shot
name:
  en: Trick Shot
  pt-BR: Tiro Ardiloso
description:
  en: >-
    As part of the same action, you make a ranged attack against two
    targets that are within immediate range of each other. Make a
    separate attack roll against each target. The attack rolls are
    hindered.
  pt-BR: 'Como parte da mesma ação, você faz um ataque à distância contra dois alvos que estejam dentro de uma distância imediata um do outro. Faça uma rolagem de ataque separada contra cada alvo. As rolagens de ataque são dificultadas.'
cost:
  pool: speed
  amount: 2
action_type: action
sources:
  - type: type
    id: warrior
    tier: 3
