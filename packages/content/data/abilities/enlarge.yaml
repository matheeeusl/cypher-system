id: enlarge
name:
  en: Enlarge
  pt-BR: Ampliar
description:
  en: >-
    You trigger an enzymatic reaction that draws additional mass from
    another dimension, and you (and your clothing or suit) grow
    larger. You achieve a height of 9 feet (3 m) and stay that way
    for about a minute. During that time, you add 4 points to your
    Might Pool, add +1 to Armor, and add +2 to your Might Edge. While
    you are larger than normal, your Speed defense rolls are
    hindered, and you are practiced in using your fists as heavy
    weapons. When the effects of Enlarge end, your Armor and Might
    Edge return to normal, and you subtract a number of points from
    your Might Pool equal to the number you gained (if this brings the
    Pool to 0, subtract the overflow first from your Speed Pool and
    then, if necessary, from your Intellect Pool). Each additional
    time you use Enlarge before your next ten-hour recovery roll, you
    must apply an additional level of Effort. Thus, the second time
    you use Enlarge, you must apply one level of Effort; the third
    time you use Enlarge, two levels of Effort; and so on.
  pt-BR: 'Você provoca uma reação enzimática que puxa massa adicional de outra dimensão, e você (e suas roupas ou traje) cresce. Você alcança uma altura de 3 metros (9 pés) e permanece assim por cerca de um minuto. Durante esse tempo, você adiciona 4 pontos à sua Reserva de Força, adiciona +1 à Armadura, e adiciona +2 à sua Margem de Força. Enquanto estiver maior que o normal, suas rolagens de defesa de Velocidade são dificultadas, e você é versada em usar seus punhos como armas pesadas. Quando os efeitos de Ampliar terminam, sua Armadura e Margem de Força retornam ao normal, e você subtrai da sua Reserva de Força um número de pontos igual ao que ganhou (se isso reduzir a Reserva a 0, subtraia o excedente primeiro da sua Reserva de Velocidade e depois, se necessário, da sua Reserva de Intelecto). Cada vez adicional que você usar Ampliar antes da sua próxima rolagem de recuperação de dez horas, deve aplicar um nível adicional de Esforço. Assim, na segunda vez que usar Ampliar, deve aplicar um nível de Esforço; na terceira vez, dois níveis de Esforço; e assim por diante.'
  # Note: source cost is printed as "1+ Might point" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 1 Might point here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
  # A sidebar note contrasts this Focus's Enlarge with Grows to
  # Towering Heights, saying a Shrinks to Minute Size character who
  # gains Enlarge will never be quite as big as one who Grows to
  # Towering Heights — flavor text, not folded into the mechanical
  # description above.
cost:
  pool: might
  amount: 1
action_type: action_to_initiate
sources:
  - type: focus
    id: shrinks-to-minute-size
    tier: 3
