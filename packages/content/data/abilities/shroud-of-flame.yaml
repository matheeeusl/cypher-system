id: shroud-of-flame
name:
  en: Shroud of Flame
  pt-BR: Manto de Chamas
description:
  en: At your command, your entire body becomes shrouded in flames that last up to ten minutes. The fire doesn't burn you, but it automatically inflicts 2 points of damage to anyone who tries to touch you or strike you with a melee attack. Flames from another source can still hurt you. While the shroud is active, you gain +2 Armor against damage from fire from another source.
  pt-BR: A seu comando, todo o seu corpo fica envolto em chamas que duram até dez minutos. O fogo não o queima, mas inflige automaticamente 2 pontos de dano a quem tentar tocá-lo ou atacá-lo corpo a corpo. Chamas de outra origem ainda podem feri-lo. Enquanto o manto estiver ativo, você ganha +2 na Armadura contra dano de fogo de outra origem.
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: bears-a-halo-of-fire
    tier: 1
