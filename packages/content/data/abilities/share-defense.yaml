id: share-defense
name:
  en: Share Defense
  pt-BR: Compartilhar Defesa
description:
  en: >-
    If your training in a defense task is greater than that of an ally
    within short range, your advice and insight allow them to
    substitute your training for that defense task.
  pt-BR: 'Se seu treinamento em uma tarefa de defesa for maior que o de um aliado dentro de uma distância curta, seu conselho e discernimento permitem que ele substitua seu treinamento por essa tarefa de defesa.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 6
