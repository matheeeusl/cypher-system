id: cutting-light
name:
  en: Cutting Light
  pt-BR: Luz Cortante
description:
  en: >-
    You emit a thin beam of energized light from your hand. This
    inflicts 5 points of damage to a single foe in immediate range. The
    beam is even more effective against immobile, nonliving targets,
    slicing up to 1 foot (30 cm) of any material that is level 6 or
    lower. The material can be up to 1 foot thick.
  pt-BR: 'Você emite um feixe fino de luz energizada da sua mão. Isso causa 5 pontos de dano a um único inimigo dentro de uma distância imediata. O feixe é ainda mais eficaz contra alvos imóveis e não vivos, cortando até 30 centímetros (1 pé) de qualquer material de nível 6 ou inferior. O material pode ter até 30 centímetros (1 pé) de espessura.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: adept
    tier: 2
attack: true
