id: drain-machine
name:
  en: Drain Machine
  pt-BR: Drenar Máquina
description:
  en: >-
    You can drain the power from an artifact or powered device you
    touch. If the target is a robot, you inflict 3 points of damage
    and restore 3 points to your Might or Speed Pool. If the target is
    an object, you restore points to your Might or Speed Pool equal
    to the level of the target. If the target is a manifest cypher, it
    is fully drained and useless. Artifacts and similar devices must
    immediately check for depletion (items with a depletion of "—" are
    either immune to this ability or have a depletion of 1 in 1d10
    when attacked with this ability).
  pt-BR: 'Você pode drenar o poder de um artefato ou dispositivo energizado que tocar. Se o alvo for um robô, você causa 3 pontos de dano e restaura 3 pontos à sua Reserva de Força ou Velocidade. Se o alvo for um objeto, você restaura pontos à sua Reserva de Força ou Velocidade iguais ao nível do alvo. Se o alvo for uma cifra manifesta, ela é totalmente drenada e inútil. Artefatos e dispositivos semelhantes devem verificar depleção imediatamente (itens com depleção "—" são imunes a esta habilidade ou têm depleção de 1 em 1d10 quando atacados com esta habilidade).'
  # Note: source adds a clarifying sidebar: "Robots and other living
  # machines are usually treated as creatures, not machines, for the
  # purposes of siphoning power from them." — folded here as context.
  # Cost is printed as "3+ Intellect points" — the schema's cost field
  # can't represent an open-ended "+". Recorded as the baseline 3
  # Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: siphons-power
    tier: 1
attack: true
