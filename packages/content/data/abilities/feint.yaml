id: feint
name:
  en: Feint
  pt-BR: Finta
description:
  en: >-
    If you use one action creating a misdirection or diversion, in the
    next round you can take advantage of your opponent's lowered
    defenses. Make a melee attack roll against that opponent. You gain
    an asset on this attack. If your attack is successful, it inflicts
    4 additional points of damage.
  pt-BR: 'Se você usar uma ação criando uma distração ou diversão, no round seguinte pode tirar proveito das defesas reduzidas do seu oponente. Faça uma rolagem de ataque corpo a corpo contra esse oponente. Você ganha um recurso neste ataque. Se seu ataque for bem-sucedido, causa 4 pontos adicionais de dano.'
cost:
  pool: speed
  amount: 2
action_type: action
sources:
  - type: type
    id: speaker
    tier: 4
  - type: type
    id: warrior
    tier: 4
