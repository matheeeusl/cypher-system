id: trick-rider
name:
  en: Trick Rider
  pt-BR: Cavaleira Acrobática
description:
  en: >-
    You can make an attack with a light or medium ranged weapon and
    attempt a riding task as a single action. Riding tasks could be as
    straightforward as keeping up with a fleeing foe or as tricky as
    hanging upside down beneath your galloping mount, standing upright
    on the saddle of your galloping mount, and so on.
  pt-BR: 'Você pode fazer um ataque com uma arma à distância leve ou média e tentar uma tarefa de montaria como uma única ação. Tarefas de montaria podem ser tão simples quanto acompanhar um inimigo em fuga ou tão arriscadas quanto pendurar-se de cabeça para baixo sob sua montaria em disparada, ficar de pé na sela da sua montaria em disparada, e assim por diante.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: rides-like-the-wind
    tier: 1
