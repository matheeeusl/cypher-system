id: punish-all-the-guilty
name:
  en: Punish All the Guilty
  pt-BR: Punir Todos os Culpados
description:
  en: >-
    You can attack up to five foes within immediate range that you
    have designated as guilty with your Designation ability, all as
    part of the same action in one round. Make separate attack rolls
    for each foe, but all attacks count as a single action in a single
    round. You remain limited by the amount of Effort you can apply on
    one action. Anything that modifies your attack or damage applies
    to all attacks. If you also have the Spin Attack ability, you
    inflict 1 additional point of damage when you use Punish All the
    Guilty.
  pt-BR: 'Você pode atacar até cinco inimigos dentro de uma distância imediata que você designou como culpados com sua habilidade Designação, todos como parte da mesma ação em um round. Faça rolagens de ataque separadas para cada inimigo, mas todos os ataques contam como uma única ação em um único round. Você permanece limitada pela quantidade de Esforço que pode aplicar em uma ação. Qualquer coisa que modifique seu ataque ou dano se aplica a todos os ataques. Se você também tiver a habilidade Ataque Giratório, causa 1 ponto adicional de dano ao usar Punir Todos os Culpados.'
cost:
  pool: speed
  amount: 3
action_type: action
sources:
  - type: focus
    id: metes-out-justice
    tier: 5
attack: true
