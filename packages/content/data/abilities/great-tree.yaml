id: great-tree
name:
  en: Great Tree
  pt-BR: Grande Árvore
description:
  en: >-
    When you use Wooden Body, you may grow to up to 12 feet (4 m) in
    height. In this larger form, you add 7 points to your Might Pool
    and +2 to your Might Edge. If you chose to grow, when Wooden Body
    ends you subtract 7 points from your Might Pool (if this brings
    the Pool to 0, subtract the overflow first from your Speed Pool
    and then, if necessary, from your Intellect Pool). When you use
    Wooden Body, whether or not you choose to grow, instead of
    looking like a wooden version of your normal self, you can take
    on the full appearance of a humanoid tree creature or an actual
    tree (including growing additional branches, extra foliage, and
    so on). This does not affect any of your abilities—in tree shape,
    you can use type abilities, other focus abilities, and so on. In
    tree shape, pretending to be a tree and hiding among normal trees
    are eased by two steps.
  pt-BR: 'Quando você usa Corpo de Madeira, pode crescer até 4 metros (12 pés) de altura. Nessa forma maior, você adiciona 7 pontos à sua Reserva de Força e +2 à sua Margem de Força. Se você optou por crescer, quando Corpo de Madeira termina, subtrai 7 pontos da sua Reserva de Força (se isso reduzir a Reserva a 0, subtraia o excedente primeiro da sua Reserva de Velocidade e depois, se necessário, da sua Reserva de Intelecto). Quando você usa Corpo de Madeira, quer opte por crescer ou não, em vez de parecer uma versão de madeira de si mesma, pode assumir a aparência completa de uma criatura arbórea humanoide ou uma árvore de fato (incluindo o crescimento de galhos adicionais, folhagem extra, e assim por diante). Isso não afeta nenhuma das suas habilidades — em forma de árvore, você pode usar habilidades de tipo, outras habilidades de foco, e assim por diante. Em forma de árvore, fingir ser uma árvore e se esconder entre árvores comuns são facilitados em dois níveis.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: walks-the-wild-woods
    tier: 5
