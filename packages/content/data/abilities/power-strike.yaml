id: power-strike
name:
  en: Power Strike
  pt-BR: Golpe Poderoso
description:
  en: >-
    If you successfully attack a target, you knock it prone in
    addition to inflicting damage. The target must be your size or
    smaller. You can knock down a target larger than you if you apply
    a level of Effort to do so (rather than to ease the attack).
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "3+ Might points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Might points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: might
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: rages
    tier: 3
