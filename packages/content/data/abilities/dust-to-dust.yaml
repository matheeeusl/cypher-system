id: dust-to-dust
name:
  en: Dust to Dust
  pt-BR: Pó ao Pó
description:
  en: >-
    You disintegrate one object that is smaller than you and whose
    level is less than or equal to your tier. You must touch the object
    to affect it. If the GM feels it appropriate to the circumstances,
    you can disintegrate a portion of an object (the total volume of
    which is smaller than you) rather than the entire thing.
  pt-BR: 'Você desintegra um objeto menor que você cujo nível seja igual ou inferior ao seu grau. Você deve tocar o objeto para afetá-lo. Se o Mestre considerar apropriado às circunstâncias, você pode desintegrar uma parte de um objeto (cujo volume total seja menor que você) em vez do objeto inteiro.'
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: type
    id: adept
    tier: 5
