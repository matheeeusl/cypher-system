id: restorative-bloom
name:
  en: Restorative Bloom
  pt-BR: Flor Restauradora
description:
  en: >-
    When Wooden Body or Great Tree is in effect, you produce a
    flower, acorn, fruit, or similar plant-based edible item. A
    creature that eats this food is nourished for a full day and
    restores their Might Pool, Speed Pool, and Intellect Pool to
    their maximum values, as if they were fully rested. Eating a
    second food produced by this ability in a day has no effect. If
    the food is not eaten within ten minutes, it spoils.
  pt-BR: 'Quando Corpo de Madeira ou Grande Árvore está em efeito, você produz uma flor, bolota, fruta ou item comestível semelhante à base de plantas. Uma criatura que comer esse alimento fica nutrida por um dia inteiro e restaura sua Reserva de Força, Reserva de Velocidade e Reserva de Intelecto aos seus valores máximos, como se estivesse completamente descansada. Comer um segundo alimento produzido por esta habilidade em um dia não tem efeito. Se o alimento não for consumido em dez minutos, estraga.'
  # Note: source tag is "Action to produce, action to eat."
cost:
  pool: might
  amount: 5
action_type: action_to_produce_and_consume
sources:
  - type: focus
    id: walks-the-wild-woods
    tier: 6
