id: living-off-the-land
name:
  en: Living Off the Land
  pt-BR: Vivendo da Terra
description:
  en: >-
    Given an hour or so, you can always find edible food and potable
    water in the wilderness. You can even find enough for a small
    group of people, if need be. Further, since you're so hardy and
    have gained resistance over time, you are trained in resisting the
    effects of natural poisons (such as those from plants or living
    creatures). You're also immune to natural diseases.
  pt-BR: 'Com cerca de uma hora, você sempre consegue encontrar comida comestível e água potável na natureza selvagem. Você consegue até encontrar o suficiente para um pequeno grupo de pessoas, se necessário. Além disso, já que é tão resistente e ganhou resistência ao longo do tempo, você é treinada em resistir aos efeitos de venenos naturais (como os de plantas ou criaturas vivas). Você também é imune a doenças naturais.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 2
