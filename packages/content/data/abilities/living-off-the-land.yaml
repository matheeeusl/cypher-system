id: living-off-the-land
name:
  en: Living Off the Land
  pt-BR: Vivendo da Terra
description:
  en: >-
    Given an hour or so, you can always find edible food and potable
    water in the wilderness. You can even find enough for a small
    group of people, if need be. Further, since you're so hardy and
    have gained resistance over time, you are trained in resisting the
    effects of natural poisons (such as those from plants or living
    creatures). You're also immune to natural diseases.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: lives-in-the-wilderness
    tier: 2
