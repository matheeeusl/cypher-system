id: greater-designation
name:
  en: Greater Designation
  pt-BR: Designação Maior
description:
  en: >-
    You can assign an innocent or guilty label to all creatures within
    immediate range when you use Designation. The one label applies to
    all affected creatures. This lasts until you use Greater
    Designation again.
  pt-BR: "Tradução em breve."
