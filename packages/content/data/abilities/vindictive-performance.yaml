id: vindictive-performance
name:
  en: Vindictive Performance
  pt-BR: Apresentação Vingativa
description:
  en: When you tell a joke, perform a song or poem, draw a picture, relate an anecdote, or otherwise provide entertainment, you can select one individual from the audience who is able to understand you. During your performance, you heap indirect but biting derision on this target. If you succeed, the target doesn't realize that they've become the victim of your performance until you wrap up the entertainment at a moment you choose in a way that strikes home. The target suffers 6 points of Intellect damage (ignores Armor) and loses their next turn.
  pt-BR: Quando você conta uma piada, executa uma canção ou poema, desenha uma imagem, relata uma anedota, ou de outra forma oferece entretenimento, pode selecionar um indivíduo da plateia que consiga entendê-lo. Durante sua apresentação, você despeja escárnio indireto, mas mordaz, sobre esse alvo. Se tiver sucesso, o alvo não percebe que se tornou vítima de sua apresentação até que você encerre o entretenimento no momento que escolher, de um jeito que acerte em cheio. O alvo sofre 6 pontos de dano de Intelecto (ignora Armadura) e perde seu próximo turno.
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: entertains
    tier: 6
