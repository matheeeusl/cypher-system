id: share-the-power
name:
  en: Share the Power
  pt-BR: Compartilhar o Poder
description:
  en: >-
    When you use Drain Creature or Drain Machine to drain energy, you
    can transfer it to another creature, restoring points to their
    Might or Speed Pools (or health for an NPC) instead of yourself.
    You can spend points from your Siphon Pool (from the Store Energy
    ability) in the same way. You must touch the creature you want to
    heal, unless you have the Drain at a Distance ability, in which
    case they can be up to a short distance away.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 5
  - type: focus
    id: siphons-power
    tier: 5
  - type: focus
    id: transmits-energy
    tier: 5
