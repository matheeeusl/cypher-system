id: absorb-kinetic-energy
name:
  en: Absorb Kinetic Energy
  pt-BR: Absorver Energia Cinética
description:
  en: >- 
    You absorb a portion of the energy of a physical attack or impact. You negate 1 point of damage you would have suffered and store that point as energy.
    Once you have absorbed 1 point of energy, you continue to negate 1 point of damage from any incoming blow or impact,
    but the residual energy bleeds off with a flare of harmless light (you cannot store more than 1 point at a time).
  pt-BR: >- 
    Você absorve uma parte da energia de um ataque físico ou impacto. Você anula 1 ponto de dano que sofreria e armazena esse ponto como energia.
    Depois de absorver 1 ponto de energia, você continua a anular 1 ponto de dano de qualquer golpe ou impacto recebido,
    mas a energia residual se dissipa na forma de um clarão de luz inofensivo (você não pode armazenar mais de 1 ponto por vez).
cost: null
action_type: enabler
sources:
  - type: focus
    id: absorbs-energy
    tier: 1
