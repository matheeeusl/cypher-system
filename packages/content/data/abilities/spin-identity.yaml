id: spin-identity
name:
  en: Spin Identity
  pt-BR: Forjar Identidade
description:
  en: >-
    You convince all intelligent creatures who can see, hear, and
    understand you that you are someone or something other than who
    you actually are. You don't impersonate a specific individual known
    to the victim. Instead, you convince the victim that you are
    someone they do not know belonging to a certain category of
    people. "We're from the government." "I'm just a simple farmer
    from the next town over." "Your commander sent me." A disguise
    isn't necessary, but a good disguise will almost certainly be an
    asset to the roll involved. If you attempt to convince more than
    one creature, the Intellect cost increases by 1 point per
    additional victim. Fooled creatures remain so for up to an hour,
    unless your actions or other circumstances reveal your true
    identity earlier.
  pt-BR: 'Você convence todas as criaturas inteligentes que conseguem vê-lo, ouvi-lo e entendê-lo de que você é alguém ou algo diferente do que realmente é. Você não se passa por um indivíduo específico conhecido pela vítima. Em vez disso, convence a vítima de que você é alguém que ela não conhece, pertencente a uma certa categoria de pessoas. "Somos do governo." "Sou apenas um simples fazendeiro da cidade vizinha." "Seu comandante me enviou." Um disfarce não é necessário, mas um bom disfarce quase certamente será um recurso na rolagem envolvida. Se você tentar convencer mais de uma criatura, o custo de Intelecto aumenta em 1 ponto por vítima adicional. Criaturas enganadas permanecem assim por até uma hora, a menos que suas ações ou outras circunstâncias revelem sua verdadeira identidade antes.'
  # Note: source cost is printed as "2+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 2 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: speaker
    tier: 1
