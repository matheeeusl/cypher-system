id: release-energy
name:
  en: Release Energy
  pt-BR: Liberar Energia
description:
  en: You release 1 point of energy you've absorbed with your Absorb Kinetic Energy ability, magnifying and focusing it into a blast of energy that strikes a single foe within long range for 4 points of damage. (If you don't have any kinetic energy absorbed, you can still use this ability, but it requires that you transform a fraction of yourself into the blast, which costs 1 point of Might.)
  pt-BR: 'Você libera 1 ponto de energia que absorveu com sua habilidade Absorver Energia Cinética, ampliando-a e concentrando-a em uma explosão de energia que atinge um único inimigo dentro de uma distância longa, causando 4 pontos de dano. (Se você não tiver nenhuma energia cinética absorvida, ainda pode usar esta habilidade, mas ela exige que você transforme uma fração de si mesma na explosão, o que custa 1 ponto de Força.)'
  # Note: cost is conditional, not flat — free if you have energy stored,
  # 1 Might point if you don't. The schema's single pool+amount `cost`
  # field can't represent a conditional cost, so recorded as null (the
  # common case) with the fallback cost folded into the prose above.
cost: null
action_type: action
sources:
  - type: focus
    id: absorbs-energy
    tier: 1
attack: true
