id: wrest-from-chance
name:
  en: Wrest From Chance
  pt-BR: Arrancar do Acaso
description:
  en: >-
    If you roll a natural 1 on a d20, you can reroll the die. If you
    reroll, you avoid a GM intrusion—unless you roll a second 1—and
    might succeed on your task. Once you use this ability, it is not
    available again until after you make a ten-hour recovery roll.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 3
