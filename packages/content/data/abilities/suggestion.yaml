id: suggestion
name:
  en: Suggestion
  pt-BR: Sugestão
description:
  en: >-
    You suggest an action to a creature within immediate range. If the
    action is something that the target might normally do anyway, it
    follows your suggestion. If the suggestion is something that is
    outside of the target's nature or express duty (such as asking a
    guard to let an intruder pass), the suggestion fails. The creature
    must be level 2 or lower. The effect of your suggestion lasts for
    up to a minute. In addition to the normal options for using Effort,
    you can choose to use Effort to increase the maximum level of the
    target you can affect by 1. Thus, to affect a level 5 target (three
    levels above the normal limit), you must apply three levels of
    Effort. When the effects of the ability end, the creature remembers
    following the suggestion but can be persuaded to believe that it
    chose to do so willingly.
  pt-BR: 'Você sugere uma ação a uma criatura dentro de uma distância imediata. Se a ação for algo que o alvo normalmente faria de qualquer forma, ele segue sua sugestão. Se a sugestão for algo fora da natureza ou dever expresso do alvo (como pedir a um guarda que deixe um intruso passar), a sugestão falha. A criatura deve ser de nível 2 ou inferior. O efeito da sua sugestão dura até um minuto. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar em 1 o nível máximo do alvo que pode afetar. Assim, para afetar um alvo de nível 5 (três níveis acima do limite normal), você deve aplicar três níveis de Esforço. Quando os efeitos da habilidade terminam, a criatura se lembra de ter seguido a sugestão, mas pode ser persuadida a acreditar que escolheu fazê-lo por vontade própria.'
  # Note: source cost is printed as "5+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 5 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 4
