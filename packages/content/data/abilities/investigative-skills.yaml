id: investigative-skills
name:
  en: Investigative Skills
  pt-BR: Perícias Investigativas
description:
  en: >-
    You are trained in two skills in which you are not already trained.
    Choose two of the following: perception, identifying, lockpicking,
    assessing danger, or tinkering with devices. You can select this
    ability multiple times. Each time you select it, you must choose
    two different skills.
  pt-BR: 'Você fica treinada em duas perícias nas quais ainda não é treinada. Escolha duas das seguintes: percepção, identificação, arrombamento de fechaduras, avaliação de perigo, ou mexer em dispositivos. Você pode escolher esta habilidade múltiplas vezes. Cada vez que a escolher, deve escolher duas perícias diferentes.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 2
