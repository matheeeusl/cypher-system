id: rally-to-me
name:
  en: Rally to Me
  pt-BR: Reúnam-se a Mim
description:
  en: You cry out, blow a battle horn, or otherwise signal to everyone within very long range that you require aid. All allied creatures who respond by moving to within an immediate distance of you within the next few rounds gain one asset on any one attack or defense task within the next hour that you suggest, such as "Hold the gate," "Charge that group of orcs," or something similar.
  pt-BR: Você grita, sopra uma trombeta de batalha ou sinaliza de outra forma a todos ao alcance de longa distância que precisa de ajuda. Todas as criaturas aliadas que responderem deslocando-se para uma distância imediata de você, dentro das próximas rodadas, ganham um recurso (*asset*) para qualquer tarefa de ataque ou defesa na próxima hora que você indicar — como "Segurem o portão", "Avancem contra aquele grupo de orcs" ou algo semelhante.
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: defends-the-gate
    tier: 1
