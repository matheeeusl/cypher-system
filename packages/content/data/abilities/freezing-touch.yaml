id: freezing-touch
name:
  en: Freezing Touch
  pt-BR: Toque Congelante
description:
  en: >-
    Your hands become so cold that your touch freezes solid a living
    target of your size or smaller, rendering it immobile for one
    round. If you have another cold ability activated by touch (such
    as Frost Touch), you can use it as part of the Freezing Touch
    attack.
  pt-BR: 'Suas mãos ficam tão frias que seu toque congela solidamente um alvo vivo do seu tamanho ou menor, tornando-o imóvel por um round. Se você tiver outra habilidade de frio ativada por toque (como Toque Gélido), pode usá-la como parte do ataque de Toque Congelante.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: wears-a-sheen-of-ice
    tier: 3
