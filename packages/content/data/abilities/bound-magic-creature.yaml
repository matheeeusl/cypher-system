id: bound-magic-creature
name:
  en: Bound Magic Creature
  pt-BR: Criatura Mágica Vinculada
description:
  en: >-
    You have a level 3 magic ally bound to a physical object (perhaps
    a minor djinn bound to a lamp, a lesser demon bound to a coin, or
    a spirit bound to a mirror). The magic ally doesn't yet have the
    full power that one of its kind could possess when mature.
    Normally, the ally remains quiescent in its bound object. When you
    use an action to manifest it, it appears next to you as a creature
    that can converse with you. The creature has its own personality
    determined by the GM and is a level higher than its base level for
    one area of knowledge (such as local history). The GM determines
    whether the magic ally has a long-term goal of its own. Each time
    the magic ally becomes physically manifest, it remains so for up
    to one hour. During that period, it accompanies you and follows
    your instructions. The magic ally must remain an immediate
    distance from you; if it moves farther away, it is yanked back
    into its object at the end of your following turn and cannot
    return until after your next ten-hour recovery roll. It doesn't
    attack creatures, but it can use its action to serve as an asset
    for any one attack you make on your turn. Otherwise, it can take
    actions on its own (though you'll likely roll for it). If the
    creature is reduced to 0 health, it dissipates. It reforms in its
    object in 1d6 + 2 days. If you lose the bound object, you retain a
    sense of the direction in which it lies.
  pt-BR: 'Você tem uma aliada mágica de nível 3 vinculada a um objeto físico (talvez um djinn menor vinculado a uma lamparina, um demônio inferior vinculado a uma moeda, ou um espírito vinculado a um espelho). A aliada mágica ainda não tem todo o poder que uma criatura de sua espécie poderia ter quando madura. Normalmente, a aliada permanece adormecida em seu objeto vinculado. Quando você usa uma ação para manifestá-la, ela aparece ao seu lado como uma criatura que pode conversar com você. A criatura tem sua própria personalidade determinada pelo Mestre e é um nível acima do seu nível base em uma área de conhecimento (como história local). O Mestre determina se a aliada mágica tem um objetivo próprio de longo prazo. Cada vez que a aliada mágica se manifesta fisicamente, ela permanece assim por até uma hora. Durante esse período, ela o acompanha e segue suas instruções. A aliada mágica deve permanecer a uma distância imediata de você; se ela se afastar mais, é puxada de volta para seu objeto no fim do seu turno seguinte e não pode retornar até depois da sua próxima rolagem de recuperação de dez horas. Ela não ataca criaturas, mas pode usar sua ação para servir de recurso em qualquer ataque que você faça no seu turno. Fora isso, ela pode realizar ações por conta própria (embora você provavelmente faça as rolagens por ela). Se a criatura for reduzida a 0 de saúde, ela se dissipa. Ela se reforma em seu objeto em 1d6 + 2 dias. Se você perder o objeto vinculado, mantém a percepção da direção em que ele se encontra.'
  # Note: source tag is "Action to manifest the magic creature."
cost: null
action_type: action_to_manifest
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 1
