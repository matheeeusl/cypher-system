id: seize-the-initiative
name:
  en: Seize the Initiative
  pt-BR: Tomar a Iniciativa
description:
  en: >-
    Within one minute of successfully using your Draw Conclusion
    ability, you can take one additional, immediate action, which you
    can take out of turn. After using this ability, you can't use it
    again until after your next ten-hour recovery roll.
  pt-BR: 'Dentro de um minuto após usar sua habilidade Tirar Conclusão com sucesso, você pode realizar uma ação adicional e imediata, que pode fazer fora do seu turno. Depois de usar esta habilidade, não pode usá-la novamente até depois da sua próxima rolagem de recuperação de dez horas.'
cost:
  pool: intellect
  amount: 5
action_type: enabler
sources:
  - type: focus
    id: solves-mysteries
    tier: 6
