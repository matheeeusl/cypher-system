id: scratch-existence
name:
  en: Scratch Existence
  pt-BR: Arranhar a Existência
description:
  en: >-
    You can choose to phase in a way that "scratches" normal matter in
    a long streak as you run using Phase Sprint. This tears a bit at
    you, too, reflected by the Might cost. When you use Phase Sprint,
    you inflict 2 points of damage (ignores Armor) to one target you
    select as you pass within immediate range, without triggering
    Disrupting Touch. In addition to the normal options for using
    Effort, you can choose to use Effort to increase the number of
    targets along your path that you can attack as part of the same
    action. Make a separate attack roll for each foe. You remain
    limited by the amount of Effort you can apply on one action.
    Anything that modifies your attack or damage applies to all of
    these attacks. Alternatively, if you apply Effort to increase the
    damage rather than ease the task, you deal 2 additional points of
    damage per level of Effort (instead of 3 points); the target takes
    1 point of damage even if you fail the attack roll.
  pt-BR: 'Você pode optar por entrar em fase de forma a "arranhar" a matéria normal em um longo rasgo enquanto corre usando Sprint Fora de Fase. Isso também o rasga um pouco, refletido pelo custo em Força. Ao usar Sprint Fora de Fase, você causa 2 pontos de dano (ignora Armadura) a um alvo que selecionar ao passar dentro de uma distância imediata, sem acionar Toque Perturbador. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o número de alvos ao longo do seu caminho que pode atacar como parte da mesma ação. Faça uma rolagem de ataque separada para cada inimigo. Você permanece limitada pela quantidade de Esforço que pode aplicar em uma ação. Qualquer coisa que modifique seu ataque ou dano se aplica a todos esses ataques. Alternativamente, se aplicar Esforço para aumentar o dano em vez de facilitar a tarefa, causa 2 pontos adicionais de dano por nível de Esforço (em vez de 3 pontos); o alvo sofre 1 ponto de dano mesmo que você falhe na rolagem de ataque.'
  # Note: source cost is printed as "1+ Might points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 1 Might point here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: might
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 2
