id: spell-bullet
name:
  en: Spell Bullet
  pt-BR: Bala Encantada
description:
  en: In your hands, a typical handgun or rifle never needs to be loaded because you can automatically conjure a standard bullet for it as part of your attack action with that weapon. Alternatively, instead of casting a spell in the normal manner, you can channel it through your handgun, firing it like a bullet. This is as loud as firing a normal bullet and uses the handgun's range (typically long) if that is longer than the spell's normal range. If the spell is an attack spell, instead of making an Intellect-based attack you make a Speed-based attack; assets and skill with guns apply to the attack, and you use your Speed Pool if you apply Effort to ease the attack. This means you use Intellect to cast the spell (and for applying Effort for additional effects or extra damage) and Speed for the attack roll (using Intellect Edge and Speed Edge for their respective Pools). You can use Spell Bullet to cast a spell that affects multiple targets. This might look like you're firing multiple times or the one shot is passing through or ricocheting off each target.
  pt-BR: 'Em suas mãos, uma pistola ou rifle comum nunca precisa ser recarregado, pois você pode conjurar automaticamente uma bala padrão para ele como parte da sua ação de ataque com essa arma. Alternativamente, em vez de conjurar um feitiço da forma normal, você pode canalizá-lo através da sua pistola, disparando-o como uma bala. Isso é tão alto quanto disparar uma bala normal e usa o alcance da pistola (geralmente longo) se este for maior que o alcance normal do feitiço. Se o feitiço for um feitiço de ataque, em vez de fazer um ataque baseado em Intelecto você faz um ataque baseado em Velocidade; recursos e habilidade com armas de fogo se aplicam ao ataque, e você usa sua Reserva de Velocidade se aplicar Esforço para facilitar o ataque. Isso significa que você usa Intelecto para conjurar o feitiço (e para aplicar Esforço para efeitos adicionais ou dano extra) e Velocidade para a rolagem de ataque (usando Margem de Intelecto e Margem de Velocidade para suas respectivas Reservas). Você pode usar Bala Encantada para conjurar um feitiço que afete múltiplos alvos. Isso pode parecer que você está disparando várias vezes ou que o único tiro está passando por ou ricocheteando em cada alvo.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: conjures-bullets
    tier: 1
