id: call-through-time
name:
  en: Call Through Time
  pt-BR: Chamar Através do Tempo
description:
  en: >-
    You call a creature or person of up to level 3 from the recent
    past, and it appears next to you. You can choose a creature that
    you've previously encountered (even if it is now dead), or (no
    more than once per day) you can allow the GM to determine the
    creature randomly. If you call a random creature, it has a 10
    percent chance of being a creature of up to level 5. The creature
    has no memory of anything before being called by you, though it
    can speak and has the general knowledge a creature of its type
    should possess. The time-shifted creature does your bidding for
    as long as you concentrate on it, but you must use your action
    each turn to direct it; otherwise it returns to the past. In
    addition to the normal options for using Effort, you can choose to
    use Effort to call a more powerful creature; each level of Effort
    used in this way increases the creature's level by 1. For example,
    applying one level of Effort calls a specific creature of up to
    level 4 or a random creature with a 10 percent chance of being up
    to level 6.
  pt-BR: 'Você invoca uma criatura ou pessoa de até nível 3 de um passado recente, e ela aparece ao seu lado. Você pode escolher uma criatura que já tenha encontrado antes (mesmo que agora esteja morta), ou (no máximo uma vez por dia) pode permitir que o Mestre determine a criatura aleatoriamente. Se invocar uma criatura aleatória, há 10% de chance de ser uma criatura de até nível 5. A criatura não tem memória de nada antes de ser invocada por você, embora consiga falar e tenha o conhecimento geral que uma criatura do seu tipo deveria possuir. A criatura deslocada no tempo obedece suas ordens enquanto você se concentrar nela, mas você deve usar sua ação a cada turno para direcioná-la; caso contrário, ela retorna ao passado. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para invocar uma criatura mais poderosa; cada nível de Esforço usado dessa forma aumenta o nível da criatura em 1. Por exemplo, aplicar um nível de Esforço invoca uma criatura específica de até nível 4 ou uma criatura aleatória com 10% de chance de ser de até nível 6.'
  # Note: source cost is printed as "6+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 6 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: travels-through-time
    tier: 6
