id: dreadwood
name:
  en: Dreadwood
  pt-BR: Bosque Pavoroso
description:
  en: >-
    You manipulate wind, mist, and shadows to embody the primordial
    fear of mysterious woods. For the next minute, you gain an asset
    on intimidation tasks. Creatures within short range may become
    frightened; make a separate Intellect attack roll for each
    creature (if you are larger than normal from using Great Tree or
    another source, these rolls are eased). Success means that they
    are frozen in fear, not moving or taking actions for one minute
    or until they are attacked. Some creatures without minds might be
    immune to this fear.
  pt-BR: 'Você manipula vento, névoa e sombras para incorporar o medo primordial dos bosques misteriosos. Pelo próximo minuto, você ganha um recurso em tarefas de intimidação. Criaturas dentro de uma distância curta podem ficar apavoradas; faça uma rolagem de ataque de Intelecto separada para cada criatura (se você estiver maior que o normal por usar Árvore Grande ou outra fonte, essas rolagens são facilitadas). O sucesso significa que elas ficam paralisadas de medo, sem se mover ou realizar ações por um minuto ou até serem atacadas. Algumas criaturas sem mente podem ser imunes a esse medo.'
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: walks-the-wild-woods
    tier: 6
