id: hand-cantrip
name:
  en: Hand Cantrip
  pt-BR: Truque da Mão
description:
  en: You levitate or manipulate an object of 10 pounds (4.5 kg) or less at up to a short
    distance. The effect is not particularly strong—about the same strength as trying to
    push, pull, or twist something just using the strength of your hand (without your
    arm).
  pt-BR: Você levita ou manipula um objeto de 10 libras (4,5 kg) ou menos a até uma
    distância curta. O efeito não é particularmente forte — aproximadamente a mesma força
    de tentar empurrar, puxar ou torcer algo usando apenas a força da mão (sem o braço).
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
