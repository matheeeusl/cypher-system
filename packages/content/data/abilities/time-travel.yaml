id: time-travel
name:
  en: Time Travel
  pt-BR: Viagem no Tempo
description:
  en: >-
    You and up to three willing characters you choose within
    immediate range travel to a point in time that you specify when
    you use this ability. The point in time must be within ten years
    of the present. For each level of Effort applied, you can travel
    ten more years or bring three more creatures with you. When you
    appear in the new moment in time, you do so in the same position
    you were in when you used this ability. Upon arriving at your
    temporal destination, you and the other time travelers are
    stunned for one minute. In order to return to your original time,
    you must use this ability again.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "10+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 10 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 10
action_type: action
sources:
  - type: focus
    id: travels-through-time
    tier: 6
