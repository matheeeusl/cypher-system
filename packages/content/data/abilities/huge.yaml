id: huge
name:
  en: Huge
  pt-BR: Enorme
description:
  en: >-
    When you use Enlarge, you can choose to grow up to 16 feet (5 m)
    in height. When you do, you add +1 to Armor (a total of +2 to
    Armor) and deal 2 additional points of damage with melee attacks.
  pt-BR: 'Quando você usa Ampliar, pode optar por crescer até 5 metros (16 pés) de altura. Ao fazer isso, adiciona +1 à Armadura (um total de +2 à Armadura) e causa 2 pontos adicionais de dano com ataques corpo a corpo.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 3
