id: daydream
name:
  en: Daydream
  pt-BR: Devaneio
description:
  en: You pull someone into a daydream, substituting a dream of your own creation for the target's reality for up to one minute. You can affect a target within long range that you can see, or a target within 10 miles (16 km) that you have hair or skin clippings from. To all outward appearances, an affected target stands (or lies) unmoving. But inside, the substituted reality (or dream within a dream, if the target was sleeping) is what the target experiences. If the target is under duress, it can attempt another Intellect defense roll each round to break free, though the target may not realize its state. Either the dream unfolds according to a script you prepared when you used this ability, or if you use your own actions (forcing you into a similar state as the target), you can direct the unfolding dream from round to round. Using this ability on a sleeping target eases the initial attack.
  pt-BR: 'Você puxa alguém para um devaneio, substituindo a realidade do alvo por um sonho de sua própria criação por até um minuto. Você pode afetar um alvo dentro de uma distância longa que consiga ver, ou um alvo dentro de 16 km (10 milhas) do qual tenha aparas de cabelo ou pele. Para todas as aparências externas, um alvo afetado permanece de pé (ou deitado) imóvel. Mas por dentro, a realidade substituída (ou sonho dentro de um sonho, se o alvo estava dormindo) é o que o alvo experimenta. Se o alvo estiver sob coação, pode tentar outra rolagem de defesa de Intelecto a cada round para se libertar, embora o alvo talvez não perceba seu estado. Ou o sonho se desenrola de acordo com um roteiro que você preparou ao usar esta habilidade, ou, se você usar suas próprias ações (forçando-se a um estado semelhante ao do alvo), pode direcionar o sonho em desenvolvimento round a round. Usar esta habilidade em um alvo adormecido facilita o ataque inicial.'
cost:
  pool: intellect
  amount: 4
# Note: source tag is "Action to initiate; if you direct the dream, action
# to direct per round."
action_type: action_to_initiate_and_direct_per_round
sources:
  - type: focus
    id: awakens-dreams
    tier: 4
