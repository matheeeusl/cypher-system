id: practiced-in-light-armor
name:
  en: Practiced in Light Armor
  pt-BR: Praticado em Armadura Leve
description:
  en: >-
    You can wear light armor for long periods of time without tiring
    and can compensate for slowed reactions from wearing light armor.
    You reduce the Speed cost for wearing light armor by 1. You start
    the game with a type of light armor available in the area, such
    as a leather jacket.
  pt-BR: 'Você consegue usar armadura leve por longos períodos sem se cansar e consegue compensar as reações mais lentas causadas por ela. Você reduz o custo de Velocidade para usar armadura leve em 1. Você começa o jogo com um tipo de armadura leve disponível na região, como uma jaqueta de couro.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: prepped-for-the-end
    tier: 1
