id: practiced-in-light-armor
name:
  en: Practiced in Light Armor
  pt-BR: Praticado em Armadura Leve
description:
  en: >-
    You can wear light armor for long periods of time without tiring
    and can compensate for slowed reactions from wearing light armor.
    You reduce the Speed cost for wearing light armor by 1. You start
    the game with a type of light armor available in the area, such
    as a leather jacket.
  pt-BR: 'Tradução em breve.'
