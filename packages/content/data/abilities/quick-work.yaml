id: quick-work
name:
  en: Quick Work
  pt-BR: Trabalho Rápido
description:
  en: One use of any artifact (or one minute of its continuous function) is increased by one level if you use it within the next minute. If you spend 4 additional Intellect points, the use is increased by two levels if you use it within the next minute.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: crafts-unique-objects
    tier: 2
