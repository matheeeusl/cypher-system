id: throw
name:
  en: Throw
  pt-BR: Arremessar
description:
  en: >-
    When you are using Enlarge and deal damage to a creature of your
    size or smaller with an unarmed attack, you can choose to throw
    that creature up to 1d20 feet away from you. The creature lands
    prone.
  pt-BR: 'Tradução em breve.'
  # Note: this is the 2019 Cypher System Rulebook misprint text (as
  # printed under Grows to Towering Heights) — see `throw-unarmed`
  # (Performs Feats of Strength) for the corrected 2015-text version
  # under the same printed name "Throw".
cost:
  pool: might
  amount: 2
action_type: enabler
sources:
  - type: focus
    id: grows-to-towering-heights
    tier: 3
