id: multiple-copying
name:
  en: Multiple Copying
  pt-BR: Cópia Múltipla
description:
  en: When you use Copy Power, you can copy two of the creature's abilities at the same time. In addition to the normal options for using Effort with Copy Power, you can apply levels of Effort to copy additional abilities, each level of Effort copying an additional ability beyond the initial two (three for one level of Effort, four for two levels, and so on).
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: copies-superpowers
    tier: 6
