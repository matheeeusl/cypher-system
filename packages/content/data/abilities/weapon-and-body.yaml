id: weapon-and-body
name:
  en: Weapon and Body
  pt-BR: Arma e Corpo
description:
  en: >-
    After making a melee weapon or ranged weapon attack, you follow up
    with a punch or kick as an additional attack, all as part of the
    same action in one round. The two attacks can be directed at
    different foes. Make a separate attack roll for each attack. You
    remain limited by the amount of Effort you can apply on one action.
    Anything that modifies your attack or damage applies to both
    attacks, unless it is tied specifically to your weapon.
  pt-BR: 'Tradução em breve.'
cost:
  pool: speed
  amount: 5
action_type: action
sources:
  - type: type
    id: warrior
    tier: 6
