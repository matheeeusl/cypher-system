id: terrifying-presence
name:
  en: Terrifying Presence
  pt-BR: Presença Aterrorizante
description:
  en: You convince one intelligent target of level 3 or lower that you are its worst nightmare. The target must be within short range and be able to understand you. For as long as you do nothing but speak (you can't even move), the target is paralyzed with fear, runs away, or takes some other action appropriate to the circumstances. In addition to the normal options for using Effort, you can choose to use Effort to increase the maximum level of the target. Thus, to terrorize a level 5 target (two levels above the normal limit), you must apply two levels of Effort.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "2+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 2 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: speaker
    tier: 1
  - type: focus
    id: curses-the-world
    tier: 1
