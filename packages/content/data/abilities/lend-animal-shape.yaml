id: lend-animal-shape
name:
  en: Lend Animal Shape
  pt-BR: Emprestar Forma Animal
description:
  en: You change into an animal, and one willing creature within immediate range also transforms into an animal of that type (bear, tiger, wolf, and so on) for ten minutes, as if they were using your Animal Shape ability. For each level of Effort applied, you can affect one additional creature. All creatures transforming with you must be your size or smaller. A creature can revert to its normal form as an action, but it cannot then change back into the animal form. One creature (whether you or someone else) changing form does not affect any other creature affected with this ability. A creature that takes animal form with Lend Animal Shape counts as an animal for the use of Animal Scrying. A character might be able to take the shape of a creature that is similar to a common animal, such as a unicorn instead of a horse or a basilisk instead of a lizard, but doing so should require applying at least one level of Effort to the change, and the character wouldn't gain any of the creature's magical abilities.
  pt-BR: 'Você se transforma em um animal, e uma criatura disposta dentro de uma distância imediata também se transforma em um animal desse tipo (urso, tigre, lobo, e assim por diante) por dez minutos, como se estivesse usando sua habilidade Forma Animal. Para cada nível de Esforço aplicado, você pode afetar uma criatura adicional. Todas as criaturas que se transformam com você devem ser do seu tamanho ou menores. Uma criatura pode reverter à sua forma normal como uma ação, mas não pode então voltar à forma animal. Uma criatura (seja você ou outra pessoa) mudando de forma não afeta nenhuma outra criatura afetada com esta habilidade. Uma criatura que assume forma animal com Emprestar Forma Animal conta como um animal para o uso de Vidência Animal. Um personagem pode conseguir assumir a forma de uma criatura semelhante a um animal comum, como um unicórnio em vez de um cavalo ou um basilisco em vez de um lagarto, mas fazer isso deve exigir aplicar pelo menos um nível de Esforço à mudança, e o personagem não ganharia nenhuma das habilidades mágicas da criatura.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the baseline
  # 6 Intellect points here, flagged for schema review (same approximation
  # used for divine-intervention).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: takes-animal-shape
    tier: 6
