id: curious
name:
  en: Curious
  pt-BR: Curioso
description:
  en: >-
    You're always curious about your surroundings, even on a
    subconscious level. Whenever you use Effort to attempt navigation,
    perception, or initiative tasks in an area that you've only rarely
    or never visited before, you can apply an additional free level of
    Effort.
  pt-BR: 'Você é sempre curiosa sobre seus arredores, mesmo em um nível subconsciente. Sempre que usar Esforço para tentar tarefas de navegação, percepção ou iniciativa em uma área que raramente ou nunca visitou antes, você pode aplicar um nível gratuito adicional de Esforço.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 2
