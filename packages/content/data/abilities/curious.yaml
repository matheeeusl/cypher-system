id: curious
name:
  en: Curious
  pt-BR: Curioso
description:
  en: >-
    You're always curious about your surroundings, even on a
    subconscious level. Whenever you use Effort to attempt navigation,
    perception, or initiative tasks in an area that you've only rarely
    or never visited before, you can apply an additional free level of
    Effort.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
