id: elastic-grip
name:
  en: Elastic Grip
  pt-BR: Aperto Elástico
description:
  en: >-
    Your attack with your stretchy limbs or body is eased. If you
    hit, you can grab the target, preventing it from moving on its
    next turn. While you hold the target, its attacks or attempts to
    break free are hindered. If the target attempts to break free
    instead of attacking, you must succeed at a Might-based task to
    maintain your grip. If the target fails to break free, you can
    continue to hold it each round as your subsequent actions,
    automatically inflicting 4 points of damage each round by
    squeezing.
  pt-BR: 'Seu ataque com seus membros ou corpo elásticos é facilitado. Se você acertar, pode agarrar o alvo, impedindo-o de se mover no seu próximo turno. Enquanto você segurar o alvo, os ataques dele ou tentativas de se libertar são dificultados. Se o alvo tentar se libertar em vez de atacar, você deve ter sucesso em uma tarefa baseada em Força para manter seu aperto. Se o alvo não conseguir se libertar, você pode continuar a segurá-lo a cada round como suas ações subsequentes, causando automaticamente 4 pontos de dano a cada round ao espremê-lo.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: stretches
    tier: 3
