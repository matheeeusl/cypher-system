id: drone-buddy
name:
  en: Drone Buddy
  pt-BR: Drone Companheiro
description:
  en: >-
    A robot drone about the size of a small dog (built by you)
    accompanies you and follows your instructions. When within long
    range, you can wirelessly communicate with and control the drone
    and it can transmit what it sees and hears to you. You and the GM
    must work out the physical details of your drone. You'll probably
    make rolls for it when it takes actions. A drone in combat
    usually doesn't make separate attacks but helps with yours. On
    your action, if the drone is next to you, it serves as an asset
    for one attack you make on your turn. If the drone is destroyed,
    you can repair the original with a few days' worth of tinkering,
    or build a new one with a week's worth of half-time labor.
    (Drone buddy: level 2; flies a short distance each round.)
  pt-BR: 'Um drone robótico do tamanho aproximado de um cão pequeno (construído por você) o acompanha e segue suas instruções. Quando dentro de uma distância longa, você pode se comunicar e controlar o drone sem fio, e ele pode transmitir o que vê e ouve para você. Você e o Mestre devem definir os detalhes físicos do seu drone. Você provavelmente fará rolagens por ele quando realizar ações. Um drone em combate geralmente não faz ataques separados, mas ajuda nos seus. Na sua ação, se o drone estiver ao seu lado, ele serve de recurso para um ataque que você fizer no seu turno. Se o drone for destruído, você pode reparar o original com alguns dias de trabalho manual, ou construir um novo com uma semana de trabalho em meio período. (Drone companheiro: nível 2; voa uma distância curta a cada round.)'
cost: null
action_type: enabler
sources:
  - type: focus
    id: has-a-custom-drone
    tier: 1
