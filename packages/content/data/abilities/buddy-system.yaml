id: buddy-system
name:
  en: Buddy System
  pt-BR: Sistema de Duplas
description:
  en: >-
    Choose one character standing next to you. That character becomes
    your buddy for ten minutes. You are trained in all tasks involving
    finding, healing, interacting with, and protecting your buddy.
    Also, while you stand next to your buddy, both of you have an
    asset on Speed defense tasks. You can have only one buddy at a
    time.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: transmits-energy
    tier: 3
