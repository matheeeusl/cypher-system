id: extra-fries-cantrip
name:
  en: Extra Fries Cantrip
  pt-BR: Truque da Batata Frita Extra
description:
  en: You update a recent fast food or delivery order so that when it arrives, it includes
    an additional order of French fries or other side available from the restaurant (tater
    tots, coleslaw, mashed potatoes, and so on). Sometimes this happens for free, and
    sometimes you have to pay an additional charge. Remember to tip your server.
  pt-BR: Você atualiza um pedido recente de fast food ou de entrega para que, quando chegar,
    inclua uma porção adicional de batata frita ou outro acompanhamento disponível no
    restaurante (batatinhas rústicas, salada de repolho, purê de batata e assim por
    diante). Às vezes isso acontece de graça, e às vezes você precisa pagar uma taxa
    adicional. Lembre-se de dar gorjeta ao atendente.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
