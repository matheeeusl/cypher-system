id: terrifying-gaze
name:
  en: Terrifying Gaze
  pt-BR: Olhar Aterrorizante
description:
  en: You project a chilling gaze at all living creatures within short range who can see you. Make a separate Intellect attack roll for each target. Success means that the creature is frozen in fear, not moving or taking actions for one minute or until it is attacked. Some creatures without minds (such as robots) might be immune to Terrifying Gaze.
  pt-BR: 'Você projeta um olhar arrepiante sobre todas as criaturas vivas dentro de uma distância curta que consigam vê-la. Faça uma rolagem de ataque de Intelecto separada para cada alvo. O sucesso significa que a criatura fica paralisada de medo, sem se mover ou realizar ações por um minuto ou até ser atacada. Algumas criaturas sem mente (como robôs) podem ser imunes ao Olhar Aterrorizante.'
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: consorts-with-the-dead
    tier: 5
