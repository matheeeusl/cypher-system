id: earthquake
name:
  en: Earthquake
  pt-BR: Terremoto
description:
  en: >-
    You direct your destructive resonance into the ground and trigger
    an earthquake centered on a spot you can see within very long
    range. The ground within short range of that spot heaves and
    shakes for five minutes, causing damage to structures and terrain
    in the area. Buildings and terrain features shed debris and
    rubble. Each round, creatures in the area take either 3 points of
    damage due to the general shaking, or 6 points of damage if in or
    adjacent to a structure or terrain feature shedding debris.
  pt-BR: "Tradução em breve."
cost:
  pool: might
  amount: 7
action_type: action_to_initiate
sources:
  - type: type
    id: adept
    tier: 6
  - type: focus
    id: speaks-for-the-land
    tier: 6
  - type: focus
    id: thunders
    tier: 6
