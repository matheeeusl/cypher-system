id: roaming-third-eye
name:
  en: Roaming Third Eye
  pt-BR: Terceiro Olho Errante
description:
  en: >-
    When you use your Third Eye ability, you can place the sensor
    anywhere within long range. In addition, until that ability ends,
    you can use an action to move the sensor anywhere within short
    range of its starting position.
  pt-BR: 'Quando você usa sua habilidade Terceiro Olho, pode colocar o sensor em qualquer lugar dentro de uma distância longa. Além disso, até essa habilidade terminar, você pode usar uma ação para mover o sensor para qualquer lugar dentro de uma distância curta da sua posição inicial.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: separates-mind-from-body
    tier: 3
