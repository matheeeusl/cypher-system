id: integrated-weapon
name:
  en: Integrated Weapon
  pt-BR: Arma Integrada
description:
  en: >-
    One light or medium melee weapon of your choice (such as a
    mantis blade or monowire) is built into one of your arms. The
    weapon is concealed until you wish to use it.
  pt-BR: 'Uma arma corpo a corpo leve ou média à sua escolha (como uma lâmina de louva-a-deus ou um monofio) é embutida em um dos seus braços. A arma fica oculta até que você deseje usá-la.'
