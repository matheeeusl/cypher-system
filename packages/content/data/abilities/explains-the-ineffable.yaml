id: explains-the-ineffable
name:
  en: Explains the Ineffable
  pt-BR: Explica o Inefável
description:
  en: >-
    Through anecdotes, historical retellings, and citing knowledge
    that few but you have previously understood, you enlighten your
    friends. After spending 24 hours with you, once per day, each of
    your friends can ease a particular task by two steps. This
    benefit is ongoing while you remain in your friends' company. It
    ends if you leave, but it resumes if you return to your friends'
    company within 24 hours. If you leave your friends' company for
    longer than that, you must spend another 24 hours together to
    reactivate the benefit.
  pt-BR: 'Através de anedotas, relatos históricos e citações de conhecimento que poucos além de você já compreenderam, você ilumina seus amigos. Depois de passar 24 horas com você, uma vez por dia, cada um dos seus amigos pode facilitar uma tarefa específica em dois níveis. Esse benefício é contínuo enquanto você permanecer na companhia dos seus amigos. Ele termina se você for embora, mas retorna se você voltar à companhia dos seus amigos dentro de 24 horas. Se você ficar longe da companhia dos seus amigos por mais tempo que isso, deve passar mais 24 horas juntos para reativar o benefício.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: lived-among-the-fey
    tier: 6
