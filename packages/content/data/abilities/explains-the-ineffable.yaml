id: explains-the-ineffable
name:
  en: Explains the Ineffable
  pt-BR: Explica o Inefável
description:
  en: >-
    Through anecdotes, historical retellings, and citing knowledge
    that few but you have previously understood, you enlighten your
    friends. After spending 24 hours with you, once per day, each of
    your friends can ease a particular task by two steps. This
    benefit is ongoing while you remain in your friends' company. It
    ends if you leave, but it resumes if you return to your friends'
    company within 24 hours. If you leave your friends' company for
    longer than that, you must spend another 24 hours together to
    reactivate the benefit.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: lived-among-the-fey
    tier: 6
