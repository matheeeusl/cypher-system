id: defuse-situation
name:
  en: Defuse Situation
  pt-BR: Neutralizar Situação
description:
  en: >-
    During the course of an investigation, your questions sometimes
    elicit an angry or even violent response. Through dissembling,
    verbal distraction, or similar evasion, you prevent a living foe
    from attacking anyone or anything for one round.
  pt-BR: 'No curso de uma investigação, suas perguntas às vezes provocam uma resposta raivosa ou até violenta. Através de dissimulação, distração verbal ou evasão semelhante, você impede que um inimigo vivo ataque qualquer pessoa ou coisa por um round.'
cost: null
action_type: action
sources:
  - type: focus
    id: solves-mysteries
    tier: 5
