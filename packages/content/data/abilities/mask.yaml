id: mask
name:
  en: Mask
  pt-BR: Máscara
description:
  en: You transform your body to become someone else. You can change any physical
    characteristic you wish, including coloration, height, weight, gender, and
    distinguishing markings. You can also change the appearance of whatever you are
    wearing or carrying. Your stats, as well as the stats of your items, do not change.
    You remain in this form for up to a day or until you use an action to resume your
    normal appearance.
  pt-BR: Você transforma seu corpo para se tornar outra pessoa. Pode mudar qualquer
    característica física que desejar, incluindo coloração, altura, peso, gênero e marcas
    distintivas. Também pode mudar a aparência do que estiver vestindo ou carregando. Seus
    atributos, assim como os de seus itens, não mudam. Você permanece nessa forma por até
    um dia ou até usar uma ação para retomar sua aparência normal.
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: flavor
    id: stealth
    tier: 5
