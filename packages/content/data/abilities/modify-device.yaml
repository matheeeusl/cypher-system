id: modify-device
name:
  en: Modify Device
  pt-BR: Modificar Dispositivo
description:
  en: You jury-rig a piece of mechanical or electrical equipment to make it function above its rated specs for a very limited time. To do so, you must use spare parts equal to an expensive item, have a field science kit (or a permanent lab, if you have access to one), and succeed at a difficulty 3 Intellect-based task. When complete, using the device eases all tasks performed in conjunction with the device, until the device inevitably breaks. Each use of the modified device requires a depletion roll of 1 − 5 on a d20.
  pt-BR: 'Você improvisa um reparo em uma peça de equipamento mecânico ou elétrico para fazê-lo funcionar acima de suas especificações nominais por um tempo muito limitado. Para isso, deve usar peças sobressalentes equivalentes a um item caro, ter um kit de ciência de campo (ou um laboratório permanente, se tiver acesso a um), e ter sucesso em uma tarefa baseada em Intelecto de dificuldade 3. Ao concluir, usar o dispositivo facilita todas as tarefas realizadas em conjunto com ele, até que ele inevitavelmente quebre. Cada uso do dispositivo modificado exige uma rolagem de depleção de 1 a 5 em 1d20.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: conducts-weird-science
    tier: 2
