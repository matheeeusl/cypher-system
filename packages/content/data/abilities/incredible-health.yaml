    exposure to strange radiation, or something else, you are now
    immune to diseases, viruses, and mutations of any kind.
  pt-BR: 'Graças a um mergulho em uma piscina mágica, uma injeção de anticorpos artificiais e nanorrobôs de defesa imunológica na sua corrente sanguínea, exposição a radiação estranha, ou algo mais, você agora é imune a doenças, vírus e mutações de qualquer tipo.'
cost: null
