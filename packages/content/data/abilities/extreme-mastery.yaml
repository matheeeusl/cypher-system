id: extreme-mastery
name:
  en: Extreme Mastery
  pt-BR: Maestria Extrema
description:
  en: >-
    When using your chosen weapon, you can reroll any attack roll you
    wish and take the better of the two results.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is a choice-of-pool, "6 Might or 6 Speed points" —
  # the schema's single `pool` field can't represent that. Recorded as
  # Might (first-listed option), same approximation used for
  # devoted-defender/true-guardian/true-defender.
cost:
  pool: might
  amount: 6
action_type: enabler
sources:
  - type: focus
    id: masters-weaponry
    tier: 5
  - type: focus
    id: weaponizes-chrome
    tier: 5
    cyberware: true
