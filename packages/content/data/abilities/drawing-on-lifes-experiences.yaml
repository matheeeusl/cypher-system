id: drawing-on-lifes-experiences
name:
  en: Drawing on Life's Experiences
  pt-BR: Aproveitando as Experiências de Vida
description:
  en: You've seen a lot and done a lot, and that experience comes in handy. Ask the GM one question, and you'll receive a general answer. The GM assigns a level to the question, so the more obscure the answer, the more difficult the task. Generally, knowledge that you could find by looking somewhere other than your current location is level 1, and obscure knowledge of the past is level 7.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: doesnt-do-much
    tier: 6
  - type: focus
    id: lived-among-the-fey
    tier: 6
