id: drawing-on-lifes-experiences
name:
  en: Drawing on Life's Experiences
  pt-BR: Aproveitando as Experiências de Vida
description:
  en: You've seen a lot and done a lot, and that experience comes in handy. Ask the GM one question, and you'll receive a general answer. The GM assigns a level to the question, so the more obscure the answer, the more difficult the task. Generally, knowledge that you could find by looking somewhere other than your current location is level 1, and obscure knowledge of the past is level 7.
  pt-BR: 'Você já viu e fez muita coisa, e essa experiência é útil. Faça uma pergunta ao Mestre, e receberá uma resposta geral. O Mestre atribui um nível à pergunta, então quanto mais obscura a resposta, mais difícil a tarefa. Em geral, um conhecimento que você poderia encontrar procurando em outro lugar que não sua localização atual é nível 1, e um conhecimento obscuro do passado é nível 7.'
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: doesnt-do-much
    tier: 6
  - type: focus
    id: lived-among-the-fey
    tier: 6
  - type: focus
    id: steers-the-coven
    tier: 6
