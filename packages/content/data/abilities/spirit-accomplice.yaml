id: spirit-accomplice
name:
  en: Spirit Accomplice
  pt-BR: Cúmplice Espiritual
description:
  en: >-
    A level 3 spirit accompanies you and follows your instructions.
    The spirit must remain within immediate range—if it moves farther
    away, it fades at the end of your following turn and cannot
    return for a day. You and the GM must work out the details of
    your spirit accomplice, and you'll probably make rolls for it
    when it takes actions. The spirit accomplice acts on your turn,
    can move a short distance each round, and exists partially out of
    phase (allowing it to move through walls, though it makes a poor
    porter). The spirit takes up residence in an object you
    designate, and it manifests as either an invisible presence or a
    ghostly shade. Your spirit accomplice is specialized in one
    knowledge skill the GM determines. The spirit is normally
    insubstantial, but if you use an action and spend 3 Intellect
    points, it accretes enough substance to affect the world around
    it. As a level 3 creature with substance, it has a target number
    of 9 and a health of 9. It doesn't attack creatures, but while
    substantial, it can use its action to serve as an asset for any
    one attack you make on your turn. While corporeal, the spirit
    can't move through objects or fly. A spirit remains corporeal for
    up to ten minutes at a time, but fades back to being insubstantial
    if not actively engaged. If your spirit accomplice is destroyed,
    it reforms in 1d6 days, or you can attract a new spirit in 2d6
    days.
  pt-BR: 'Um espírito de nível 3 a acompanha e segue suas instruções. O espírito deve permanecer dentro de uma distância imediata — se ele se afastar mais, se desvanece no fim do seu turno seguinte e não pode retornar por um dia. Você e o Mestre devem definir os detalhes do seu cúmplice espiritual, e você provavelmente fará rolagens por ele quando realizar ações. O cúmplice espiritual age no seu turno, pode se mover uma distância curta a cada round, e existe parcialmente fora de fase (permitindo que atravesse paredes, embora seja um péssimo carregador). O espírito habita um objeto que você designar, e se manifesta como uma presença invisível ou uma sombra fantasmagórica. Seu cúmplice espiritual é especializado em uma perícia de conhecimento determinada pelo Mestre. O espírito é normalmente incorpóreo, mas se você usar uma ação e gastar 3 pontos de Intelecto, ele acumula substância suficiente para afetar o mundo ao seu redor. Como uma criatura de nível 3 com substância, ele tem um número-alvo de 9 e 9 pontos de saúde. Ele não ataca criaturas, mas enquanto substancial, pode usar sua ação para servir de recurso em qualquer ataque que você faça no seu turno. Enquanto corpóreo, o espírito não pode atravessar objetos nem voar. Um espírito permanece corpóreo por até dez minutos de cada vez, mas volta a ser incorpóreo se não estiver ativamente engajado. Se seu cúmplice espiritual for destruído, ele se reforma em 1d6 dias, ou você pode atrair um novo espírito em 2d6 dias.'
  # Note: source has a trailing sidebar note: "An insubstantial
  # creature can't affect or be affected by anything unless indicated
  # otherwise, such as when an attack is made with a special weapon.
  # An insubstantial creature can pass through solid matter without
  # hindrance, but solid energy barriers, such as magical fields of
  # force, keep it at bay." — general insubstantiality rules text, not
  # specific to this ability; not folded into the description.
cost: null
action_type: enabler
sources:
  - type: focus
    id: shepherds-spirits
    tier: 2
