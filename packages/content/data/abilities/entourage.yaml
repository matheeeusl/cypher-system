id: entourage
name:
  en: Entourage
  pt-BR: Séquito
description:
  en: >-
    You gain an entourage of five level 1 twenty-somethings that
    accompanies you wherever you go unless you purposefully disband it
    for a particular outing. You can ask them to deliver things for
    you, run messages, pick up your dry cleaning—pretty much whatever
    you want, within reason. They can also run interference if you're
    trying to avoid someone, help hide you from media attention, help
    you muscle through a crowd, and so on. On the other hand, if a
    situation becomes physically violent, they retreat to safety.
  pt-BR: 'Você ganha um séquito de cinco jovens de vinte e poucos anos de nível 1 que o acompanham onde quer que vá, a menos que você propositalmente os dispense para uma saída específica. Você pode pedir que entreguem coisas para você, levem recados, peguem sua lavanderia — praticamente qualquer coisa que quiser, dentro do razoável. Eles também podem interferir se você estiver tentando evitar alguém, ajudar a escondê-lo da atenção da mídia, ajudá-lo a se abrir caminho por uma multidão, e assim por diante. Por outro lado, se uma situação se tornar fisicamente violenta, eles se retiram para a segurança.'
cost: null
action_type: enabler
sources:
