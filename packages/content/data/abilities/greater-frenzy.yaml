id: greater-frenzy
name:
  en: Greater Frenzy
  pt-BR: Frenesi Maior
description:
  en: >-
    When you wish, while in combat, you can enter a state of frenzy.
    While in this state, you can't use Intellect points, but you gain
    +2 to your Might Edge and your Speed Edge. This effect lasts as
    long as you wish, but it ends if no combat is taking place within
    range of your senses. If you have the Frenzy ability, you can use
    it or this ability, but you can't use both at the same time.
  pt-BR: 'Quando desejar, durante o combate, você pode entrar em um estado de frenesi. Nesse estado, não pode usar pontos de Intelecto, mas ganha +2 na sua Margem de Força e na sua Margem de Velocidade. Esse efeito dura enquanto você desejar, mas termina se nenhum combate estiver ocorrendo dentro do alcance dos seus sentidos. Se você tiver a habilidade Frenesi, pode usá-la ou esta habilidade, mas não pode usar ambas ao mesmo tempo.'
cost:
  pool: intellect
  amount: 4
action_type: enabler
sources:
  - type: focus
    id: rages
    tier: 4
  - type: focus
    id: raids
    tier: 4
