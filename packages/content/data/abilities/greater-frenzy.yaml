id: greater-frenzy
name:
  en: Greater Frenzy
  pt-BR: Frenesi Maior
description:
  en: >-
    When you wish, while in combat, you can enter a state of frenzy.
    While in this state, you can't use Intellect points, but you gain
    +2 to your Might Edge and your Speed Edge. This effect lasts as
    long as you wish, but it ends if no combat is taking place within
    range of your senses. If you have the Frenzy ability, you can use
    it or this ability, but you can't use both at the same time.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: enabler
sources:
  - type: focus
    id: rages
    tier: 4
  - type: focus
    id: raids
    tier: 4
