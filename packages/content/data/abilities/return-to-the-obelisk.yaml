id: return-to-the-obelisk
name:
  en: Return to the Obelisk
  pt-BR: Retorno ao Obelisco
description:
  en: >-
    You transfer your body and personal possessions into a
    crystal of any size that you can touch, and you exit from
    another crystal of any size, including any crystal obelisks
    that you are aware of. You must know of the crystal you
    are going to use as an exit before you enter the first
    crystal. You can take one additional creature with you
    for each level of Effort applied.
  # Note: source cost is printed as "7+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 7 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
  pt-BR: >-
    Você transfere seu corpo e seus pertences pessoais para um
    cristal de qualquer tamanho que você possa tocar, e sai de
    outro cristal de qualquer tamanho, incluindo quaisquer obeliscos
    de cristal dos quais você tenha conhecimento. Você deve saber qual cristal
    vai usar como saída antes de entrar no primeiro
    cristal. Você pode levar uma criatura adicional com você
    para cada nível de Esforço aplicado.
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: focus
    id: emerged-from-the-obelisk
    tier: 6
