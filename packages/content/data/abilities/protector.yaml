id: protector
name:
  en: Protector
  pt-BR: Protetor
description:
  en: >-
    You designate a single character to be your charge. You can
    change this freely every round, but you can have only one charge
    at a time. As long as that charge is within immediate range, they
    gain an asset for Speed defense tasks because you have their back.
  pt-BR: 'Você designa um único personagem como sua protegida. Pode mudar isso livremente a cada round, mas só pode ter uma protegida por vez. Enquanto essa protegida estiver dentro de uma distância imediata, ela ganha um recurso em tarefas de defesa de Velocidade porque você está cuidando dela.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: looks-for-trouble
    tier: 2
