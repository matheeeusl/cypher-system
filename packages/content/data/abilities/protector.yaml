id: protector
name:
  en: Protector
  pt-BR: Protetor
description:
  en: >-
    You designate a single character to be your charge. You can
    change this freely every round, but you can have only one charge
    at a time. As long as that charge is within immediate range, they
    gain an asset for Speed defense tasks because you have their back.
  pt-BR: 'Tradução em breve.'
