id: open-mind
name:
  en: Open Mind
  pt-BR: Mente Aberta
description:
  en: >-
    You open your mind to increase your awareness. You gain an asset
    to any task involving perception. While you have this asset and
    you are conscious and able to take actions, other characters gain
    no benefit from surprising you. The effect lasts for one hour.
  pt-BR: 'Você abre sua mente para aumentar sua percepção. Você ganha um recurso em qualquer tarefa envolvendo percepção. Enquanto tiver esse recurso e estiver consciente e capaz de realizar ações, outros personagens não obtêm nenhum benefício ao tentar surpreendê-la. O efeito dura uma hora.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: separates-mind-from-body
    tier: 2
  - type: flavor
    id: divination
    tier: 2
