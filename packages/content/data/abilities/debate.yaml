id: debate
name:
  en: Debate
  pt-BR: Debate
description:
  en: >-
    In any gathering of two or more people trying to establish the
    truth or come to a decision, you can sway the verdict with
    masterful rhetoric. If you are given one minute or more to argue
    your point, either the decision goes your way or, if someone else
    effectively argues a competing point, any associated persuasion or
    deception task is eased by two steps.
  pt-BR: 'Em qualquer reunião de duas ou mais pessoas tentando estabelecer a verdade ou chegar a uma decisão, você pode influenciar o veredito com retórica magistral. Se lhe derem um minuto ou mais para defender seu ponto de vista, ou a decisão pende a seu favor, ou, se outra pessoa argumentar efetivamente um ponto concorrente, qualquer tarefa associada de persuasão ou decepção é facilitada em dois níveis.'
  # Note: source tag is "Action to initiate; one minute to complete." —
  # the "one minute to complete" clause is a duration, not modeled by
  # action_type.
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: interprets-the-law
    tier: 2
