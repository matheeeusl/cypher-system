id: trail-sensor
name:
  en: Trail Sensor
  pt-BR: Sensor de Trilha
description:
  en: You imbue a newly created blaze symbol (or replace a blaze symbol you've previously created) with a spiritual connection to your mind's eye. For the next 24 hours, you can concentrate to see, hear, and smell through the sensor, no matter how far you move from it. If you also have a similar ability from another source, this effect lasts twice as long. The sensor doesn't grant you sensory capabilities beyond the norm.
  pt-BR: Você imbui um símbolo de trilha recém-criado (ou substitui um símbolo de trilha criado anteriormente) com uma conexão espiritual com o olho de sua mente. Pelas próximas 24 horas, você pode se concentrar para ver, ouvir e sentir cheiros através do sensor, não importa a distância que se mova dele. Se você também tiver uma habilidade semelhante de outra fonte, este efeito dura o dobro do tempo. O sensor não concede capacidades sensoriais além do normal.
cost:
  pool: intellect
  amount: 3
# Note: source tag is "A few rounds to create the enhanced blaze
# symbol; action to check." — not covered by the current action_type
# enum. Approximated as action_to_initiate; flagged for schema review.
action_type: action_to_initiate
sources:
  - type: focus
    id: blazes-paths
    tier: 3
