id: distant-interface
name:
  en: Distant Interface
  pt-BR: Interface à Distância
description:
  en: >-
    You can activate, deactivate, or control a machine at long range
    as if you were next to it, even if normally you would have to
    touch or manually operate it. If you have never interacted with
    the particular machine before, the task is hindered by two steps.
    To use this ability, you must understand the function of the
    machine, it must be your size or smaller, and it can't be
    connected to another intelligence (or be intelligent itself).
  pt-BR: 'Você pode ativar, desativar ou controlar uma máquina a uma distância longa como se estivesse ao lado dela, mesmo que normalmente precisasse tocá-la ou operá-la manualmente. Se você nunca interagiu com aquela máquina específica antes, a tarefa é dificultada em dois níveis. Para usar esta habilidade, você deve entender a função da máquina, ela deve ser do seu tamanho ou menor, e não pode estar conectada a outra inteligência (nem ser inteligente por si só).'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: talks-to-machines
    tier: 1
