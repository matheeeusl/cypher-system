id: crowd-control
name:
  en: Crowd Control
  pt-BR: Controle de Multidão
description:
  en: >-
    You control the actions of up to five creatures in short range.
    This effect lasts for one minute. All targets must be level 2 or
    lower. Your control is limited to simple verbal commands like
    "Stop," "Run away," "Follow that guard," "Look over there," or "Get
    out of my way." All affected creatures respond to the command
    unless you specifically command them otherwise. In addition to the
    normal options for using Effort, you can choose to use Effort to
    increase the maximum level of the targets or affect an additional
    five people. Thus, to control a group that has a level 4 target
    (two levels above the normal limit) or a group of fifteen people,
    you must apply two levels of Effort. When the Crowd Control ability
    ends, the creatures remember your commands but don't remember being
    controlled—your commands seemed reasonable at the time.
  pt-BR: 'Tradução em breve.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here (same approximation used for
  # teleportation.yaml).
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 6
