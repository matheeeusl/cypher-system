id: living-wall
name:
  en: Living Wall
  pt-BR: Muralha Viva
description:
  en: >-
    You specify a confined area—such as an open doorway, a hallway,
    or a space between two trees—where you stand. For the next ten
    minutes, if anyone attempts to enter or pass through that area
    and you don't wish it, you make an automatic attack against them.
    If you hit, not only do you inflict damage, but they must also
    stop their movement.
  pt-BR: 'Tradução em breve.'
cost:
  pool: might
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: stands-like-a-bastion
    tier: 4
