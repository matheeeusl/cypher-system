id: find-the-way
name:
  en: Find the Way
  pt-BR: Encontrar o Caminho
description:
  en: >-
    When you apply Effort to a navigation task because you don't know
    the way, are lost, are attempting to blaze a new route, need to
    choose between two or more otherwise similar paths to take, or
    something very similar, you can apply a free level of Effort.
  pt-BR: 'Quando você aplica Esforço a uma tarefa de navegação porque não conhece o caminho, está perdida, está tentando abrir uma nova rota, precisa escolher entre dois ou mais caminhos semelhantes, ou algo muito parecido, você pode aplicar um nível gratuito de Esforço.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 1
