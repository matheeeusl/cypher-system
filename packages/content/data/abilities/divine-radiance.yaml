id: divine-radiance
name:
  en: Divine Radiance
  pt-BR: Radiância Divina
description:
  en: >-
    Your prayer calls divine radiance from the heavens to punish an
    unworthy target within long range, inflicting 4 points of damage.
    If the target is a demon, spirit, or something similar, it also
    stands in unwilling awe of the divine energy coursing through it
    and is unable to act on its next turn. Once exposed to this
    blessing, the target can't be awed by this attack again for several
    hours.
  pt-BR: >-
    Sua prece invoca radiância divina dos céus para punir um alvo
    indigno a alcance longo, infligindo 4 pontos de dano. Se o alvo for
    um demônio, espírito, ou algo semelhante, ele também fica tomado
    por um assombro involuntário diante da energia divina que o
    percorre e é incapaz de agir em seu próximo turno. Uma vez exposto
    a essa bênção, o alvo não pode ser assombrado por esse ataque
    novamente por várias horas.
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: channels-divine-blessings
    tier: 3
