id: quick-switch
name:
  en: Quick Switch
  pt-BR: Troca Rápida
description:
  en: >-
    You can activate Shrink as part of another action (the ability is
    now an enabler for you instead of an action). While the one-minute
    duration of Shrink is active, on your turn you can change size
    once before taking an action and once after taking an action. For
    example, on your turn you could change to small size, make an
    attack, and then return to your normal size, or you could change
    to your normal size, use your action to move a short distance, and
    then return to small size.
  pt-BR: 'Tradução em breve.'
  # Note: source adds a trailing clarification: "The increased Effort
  # cost for repeat uses of Shrink between ten-hour recovery rolls only
  # applies to new activations of Shrink, not to multiple size changes
  # within one use of Shrink enabled by Quick Switch." — folded here as
  # context, not part of the ability's own mechanical grant.
cost: null
action_type: enabler
sources:
  - type: focus
    id: shrinks-to-minute-size
    tier: 3
