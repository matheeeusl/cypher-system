id: advantages-of-being-small
name:
  en: Advantages of Being Small
  pt-BR: Vantagens de Ser Pequena
description:
  en: >-
    You've learned how to leverage your strength and accuracy in
    proportion to your size. Your damage is no longer halved when
    using Shrink, and climbing and jumping tasks are eased.
  pt-BR: 'Você aprendeu a aproveitar sua força e precisão na proporção do seu tamanho. Seu dano não é mais reduzido à metade ao usar Encolher, e tarefas de escalada e salto são facilitadas.'
