id: sea-legs
name:
  en: Sea Legs
  pt-BR: Pernas de Marinheira
description:
  en: >-
    You have gotten used to rough seas and unexpected surges. You are
    trained in balance. Any movement task that would be hindered by a
    pitching deck, moving through rigging, and so on is a routine task
    for you.
  pt-BR: 'Você se acostumou com mares agitados e ondas inesperadas. Você é treinada em equilíbrio. Qualquer tarefa de movimento que seria dificultada por um convés balançando, mover-se pelo cordame, e assim por diante, é uma tarefa rotineira para você.'
cost: null
action_type: enabler
sources:
