id: stupefying-rattle
name:
  en: Stupefying Rattle
  pt-BR: Chocalho Estupefaciente
description:
  en: >-
    With a slithering flourish and a ghost rattle echoing from some
    otherworldly source, you redirect a melee attack that would
    otherwise hit you if you succeed on a difficulty 2 Speed task.
    When you do, the misdirected attack hits another creature you
    choose within immediate range of both you and the attacking foe.
  pt-BR: 'Com um floreio serpenteante e um chocalho fantasmagórico ecoando de alguma fonte de outro mundo, você redireciona um ataque corpo a corpo que de outra forma a atingiria, se tiver sucesso em uma tarefa de Velocidade de dificuldade 2. Ao fazer isso, o ataque desviado atinge outra criatura que você escolher dentro de uma distância imediata tanto de você quanto do inimigo atacante.'
cost:
  pool: speed
  amount: 4
action_type: enabler
sources:
  - type: focus
    id: strikes-like-a-rattler
    tier: 3
