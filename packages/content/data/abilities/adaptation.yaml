id: adaptation
name:
  en: Adaptation
  pt-BR: Adaptação
description:
  en: >-
    Thanks to a latent mutation, a device implanted in your spine, a
    ritual performed with dragon's blood, or some other gift, you now
    remain at a comfortable temperature; never need to worry about
    dangerous radiation, diseases, or gases; and can always breathe in
    any environment (even the vacuum of space).
  pt-BR: 'Graças a uma mutação latente, um dispositivo implantado em sua espinha, um ritual realizado com sangue de dragão, ou algum outro dom, você agora se mantém em uma temperatura confortável; nunca precisa se preocupar com radiação perigosa, doenças ou gases; e sempre consegue respirar em qualquer ambiente (mesmo no vácuo do espaço).'
cost: null
action_type: enabler
sources:
  - type: type
    id: adept
    tier: 2
