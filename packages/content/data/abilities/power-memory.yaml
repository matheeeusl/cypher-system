id: power-memory
name:
  en: Power Memory
  pt-BR: Memória de Poder
description:
  en: When you use Copy Power, you only need to have seen the ability used within the past day (instead of the past hour), and using Effort extends how long ago your copying can reach to one day per level of Effort (instead of one hour per level).
  pt-BR: 'Quando você usa Copiar Poder, só precisa ter visto a habilidade sendo usada no último dia (em vez da última hora), e usar Esforço estende o quão distante no passado sua cópia pode alcançar para um dia por nível de Esforço (em vez de uma hora por nível).'
cost: null
action_type: enabler
sources:
