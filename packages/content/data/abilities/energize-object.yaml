id: energize-object
name:
  en: Energize Object
  pt-BR: Energizar Objeto
description:
  en: By focusing your Absorb Kinetic Energy ability on an object (like a weapon), you infuse it with your power. The object holds the energy until it is touched by anyone but you, so putting it into your melee weapon or the ammo of a ranged weapon allows the weapon to trigger the energy in combat. The energy inflicts 3 points of damage on the creature touched in addition to any damage the weapon itself might do. You cannot have more than one energized object on your person at a time.
  pt-BR: 'Ao focar sua habilidade Absorver Energia Cinética em um objeto (como uma arma), você o infunde com seu poder. O objeto retém a energia até ser tocado por qualquer um além de você, então colocá-la em sua arma corpo a corpo ou na munição de uma arma à distância permite que a arma dispare a energia em combate. A energia causa 3 pontos de dano à criatura tocada além de qualquer dano que a própria arma possa causar. Você não pode ter mais de um objeto energizado consigo ao mesmo tempo.'
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: absorbs-energy
    tier: 2
