id: energize-object
name:
  en: Energize Object
  pt-BR: Energizar Objeto
description:
  en: By focusing your Absorb Kinetic Energy ability on an object (like a weapon), you infuse it with your power. The object holds the energy until it is touched by anyone but you, so putting it into your melee weapon or the ammo of a ranged weapon allows the weapon to trigger the energy in combat. The energy inflicts 3 points of damage on the creature touched in addition to any damage the weapon itself might do. You cannot have more than one energized object on your person at a time.
  pt-BR: "Tradução em breve."
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: absorbs-energy
    tier: 2
