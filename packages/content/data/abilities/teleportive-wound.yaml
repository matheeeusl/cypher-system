id: teleportive-wound
name:
  en: Teleportive Wound
  pt-BR: Ferida Teletransportadora
description:
  en: >-
    You touch a creature and, if your attack succeeds, you teleport
    away (up to your normal maximum teleportation distance) with a
    significant portion of their body. If the target is level 2 or
    lower, it dies. If the target is level 3 or higher, it takes 6
    points of damage and is stunned on its next action. If the target
    is a PC of any tier, they move down one step on the damage track.
    In addition to the normal options for using Effort, you can
    choose to use Effort to affect a more powerful target (one level
    of Effort means a target of up to level 3 dies or a target of
    level 4 or higher takes damage and is stunned, and so on).
  pt-BR: 'Você toca uma criatura e, se seu ataque for bem-sucedido, se teleporta para longe (até sua distância máxima normal de teletransporte) com uma porção significativa do corpo dela. Se o alvo for de nível 2 ou inferior, ele morre. Se o alvo for de nível 3 ou superior, sofre 6 pontos de dano e fica atordoado na sua próxima ação. Se o alvo for um personagem de qualquer grau, ele desce um nível no marcador de dano. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para afetar um alvo mais poderoso (um nível de Esforço significa que um alvo de até nível 3 morre ou um alvo de nível 4 ou superior sofre dano e fica atordoado, e assim por diante).'
  # Note: source cost is printed as "7+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 7 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: focus
    id: ignores-physical-distance
    tier: 6
attack: true
