id: steal-power
name:
  en: Steal Power
  pt-BR: Roubar Poder
description:
  en: When you use Copy Power to copy an ability, the creature you copied it from loses access to that ability for about a minute. While you have their ability, any attempt by the creature to use their ability requires them to succeed at a task (Might, Speed, or Intellect, as appropriate to the stolen ability) opposed by your eased Intellect task. If they succeed, they regain the use of their ability and you lose it.
  pt-BR: 'Quando você usa Copiar Poder para copiar uma habilidade, a criatura de quem a copiou perde acesso a essa habilidade por cerca de um minuto. Enquanto você tiver a habilidade dela, qualquer tentativa da criatura de usar sua própria habilidade exige que ela tenha sucesso em uma tarefa (Força, Velocidade ou Intelecto, conforme apropriado à habilidade roubada) oposta à sua tarefa de Intelecto facilitada. Se ela tiver sucesso, recupera o uso da habilidade e você a perde.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: copies-superpowers
    tier: 3
