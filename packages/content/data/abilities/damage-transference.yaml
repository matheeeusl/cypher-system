id: damage-transference
name:
  en: Damage Transference
  pt-BR: Transferência de Dano
description:
  en: >-
    When you or your duplicate (from the Duplicate ability) would take damage,
    you can transfer 1 point of damage from one to the other
    provided that you and your duplicate are within 1 mile
    (1.5 km) of each other.
  pt-BR: >-
    Quando você ou sua duplicata (da habilidade Duplicar) sofrer dano,
    você pode transferir 1 ponto de dano de um para o outro
    desde que você e sua duplicata estejam dentro de 1 milha
    (1.5 km) um do outro.
cost: null
action_type: enabler
sources:
  - type: focus
    id: exists-in-two-places-at-once
    tier: 4
