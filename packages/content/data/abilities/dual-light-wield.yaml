id: dual-light-wield
name:
  en: Dual Light Wield
  pt-BR: Empunhadura Dupla de Leve
description:
  en: >-
    You can use two light weapons at the same time, making two
    separate attacks on your turn as a single action. You remain
    limited by the amount of Effort you can apply on one action,
    but because you make separate attacks, your opponent's Armor
    applies to both. Anything that modifies your attack or damage
    applies to both attacks, unless it's specifically tied to one
    of the weapons.
  pt-BR: >-
    Você pode usar duas armas leves ao mesmo tempo, realizando dois
    ataques separados em seu turno como uma única ação. Você continua
    limitado pela quantidade de Esforço que pode aplicar em uma única
    ação, mas, como realiza ataques separados, a Armadura do seu
    oponente se aplica a ambos. Qualquer coisa que modifique seu
    ataque ou dano se aplica a ambos os ataques, a menos que esteja
    especificamente atrelada a uma das armas.
cost: null
action_type: enabler
sources:
  - type: focus
    id: wields-two-weapons-at-once
    tier: 1
