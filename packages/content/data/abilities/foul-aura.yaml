id: foul-aura
name:
  en: Foul Aura
  pt-BR: Aura Repugnante
description:
  en: Your words, gestures, and touch invest an object no larger than yourself with an aura of doom, fear, and doubt for one day. Creatures that can hear and understand you feel an urge to move at least a short distance away from the object. If a creature does not move away, all tasks, attacks, and defenses it attempts while within the aura are hindered. The duration of the aura is extended by one day per level of Effort applied. The aura is temporarily blocked while the object is covered or contained.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "5+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 5 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention).
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: curses-the-world
    tier: 5
