id: magical-repertoire
name:
  en: Magical Repertoire
  pt-BR: Repertório Mágico
description:
  en: >-
    The number of subtle cyphers you can bear at the same time
    increases by two. If you spend one hour preparing your magic, you
    can fill any of your open cypher slots with subtle cyphers chosen
    randomly by the GM (this hour can be part of a one-hour or
    ten-hour recovery action if you are awake for the entire time). As
    part of this preparation process, you may discard any number of
    subtle cyphers you carry to make room for more subtle cyphers.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: uses-wild-magic
    tier: 1
