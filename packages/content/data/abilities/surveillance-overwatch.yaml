id: surveillance-overwatch
name:
  en: Surveillance Overwatch
  pt-BR: Vigilância Contínua
description:
  en: >-
    When you use your Camera Sight ability to assess a situation and
    warn another character of an impending threat, that character's
    next defense roll against the threat you've spotted is eased.
    Likewise, if you use Camera Sight to advise a character of a
    foe's weakness, that character's next attack roll against that
    foe is eased.
  pt-BR: 'Quando você usa sua habilidade Visão por Câmeras para avaliar uma situação e avisar outro personagem sobre uma ameaça iminente, a próxima rolagem de defesa desse personagem contra a ameaça que você detectou é facilitada. Da mesma forma, se você usar Visão por Câmeras para avisar um personagem sobre a fraqueza de um inimigo, a próxima rolagem de ataque desse personagem contra esse inimigo é facilitada.'
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 3
    cyberware: true
