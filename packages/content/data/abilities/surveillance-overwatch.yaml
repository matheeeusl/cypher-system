id: surveillance-overwatch
name:
  en: Surveillance Overwatch
  pt-BR: Vigilância Contínua
description:
  en: >-
    When you use your Camera Sight ability to assess a situation and
    warn another character of an impending threat, that character's
    next defense roll against the threat you've spotted is eased.
    Likewise, if you use Camera Sight to advise a character of a
    foe's weakness, that character's next attack roll against that
    foe is eased.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 3
    cyberware: true
