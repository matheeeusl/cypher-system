id: true-senses
name:
  en: True Senses
  pt-BR: Sentidos Verdadeiros
description:
  en: >-
    You can see in complete darkness up to 50 feet (15 m) as if it
    were dim light. You recognize holograms, disguises, optical
    illusions, sound mimicry, and other such tricks (for all senses)
    for what they are.
  pt-BR: 'Você consegue enxergar na escuridão total até 15 metros (50 pés) como se fosse luz fraca. Você reconhece hologramas, disfarces, ilusões de ótica, imitações de som e outros truques semelhantes (para todos os sentidos) pelo que realmente são.'
cost: null
action_type: enabler
