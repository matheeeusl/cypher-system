id: tree-companion
name:
  en: Tree Companion
  pt-BR: Companheira Arbórea
description:
  en: >-
    You animate a tree of approximately your size or smaller,
    creating a level 3 creature with 1 Armor. The tree follows your
    verbal commands for one hour, after which it reverts to a normal
    tree (and roots itself where it stands). Unless the tree is
    killed by damage, you can animate it again when the ability
    duration expires, but any damage it has carries over to its newly
    animated state. In addition to the normal options for using
    Effort, you can choose to use Effort to affect more trees; each
    level of Effort used affects one additional tree.
  pt-BR: 'Você anima uma árvore de tamanho aproximado ao seu ou menor, criando uma criatura de nível 3 com 1 de Armadura. A árvore segue seus comandos verbais por uma hora, após o que reverte a uma árvore normal (e se enraíza onde estiver). A menos que a árvore seja morta por dano, você pode animá-la novamente quando a duração da habilidade expirar, mas qualquer dano que tiver se mantém no seu novo estado animado. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para afetar mais árvores; cada nível de Esforço usado afeta uma árvore adicional.'
  # Note: source cost is printed as "5+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 5 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: walks-the-wild-woods
    tier: 3
