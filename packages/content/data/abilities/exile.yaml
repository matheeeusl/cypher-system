id: exile
name:
  en: Exile
  pt-BR: Exílio
description:
  en: >-
    You send a target that you touch hurtling into another random
    dimension or universe, where it remains for ten minutes. You have
    no idea what happens to the target while it's gone, but at the end
    of ten minutes, it returns to the precise spot it left.
  pt-BR: 'Você envia um alvo que tocar arremessando-o para outra dimensão ou universo aleatório, onde ele permanece por dez minutos. Você não tem ideia do que acontece ao alvo enquanto está fora, mas ao fim de dez minutos, ele retorna ao ponto exato de onde saiu.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: type
    id: adept
    tier: 4
