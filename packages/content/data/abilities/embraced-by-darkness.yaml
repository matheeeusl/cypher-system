id: embraced-by-darkness
name:
  en: Embraced by Darkness
  pt-BR: Abraçado pela Escuridão
description:
  en: For the next hour, you take on some characteristics of a shadow thanks to a fundamental adaptation of your flesh or a device you've kept secret. Your appearance is a dark silhouette. When you apply a level of Effort to sneaking tasks, you get a free level of Effort on the task. During this time, you can move through the air at a rate of a short distance per round, and you can move through solid barriers (even those that are sealed to prevent the passage of light or shadow), but not energy barriers, at a rate of 1 foot (30 cm) per round. You can perceive while passing through a barrier or object, which allows you to peek through walls. As a shadow, you can't affect or be affected by normal matter. Likewise, you can't attack, touch, or otherwise affect anything. However, attacks and effects that rely on light can affect you, and sudden bursts of light can potentially make you lose your next turn.
  pt-BR: 'Pela próxima hora, você adquire algumas características de uma sombra graças a uma adaptação fundamental da sua carne ou de um dispositivo que manteve em segredo. Sua aparência se torna uma silhueta escura. Quando aplica um nível de Esforço a tarefas de furtividade, ganha um nível gratuito de Esforço na tarefa. Durante esse tempo, você pode se mover pelo ar a uma taxa de uma distância curta por round, e pode se mover através de barreiras sólidas (mesmo aquelas seladas para impedir a passagem de luz ou sombra), mas não barreiras de energia, a uma taxa de 30 centímetros (1 pé) por round. Você consegue perceber enquanto passa por uma barreira ou objeto, o que lhe permite espiar através de paredes. Como uma sombra, você não pode afetar nem ser afetada por matéria normal. Da mesma forma, você não pode atacar, tocar ou de outra forma afetar nada. Porém, ataques e efeitos que dependem de luz podem afetá-la, e explosões súbitas de luz podem potencialmente fazê-la perder seu próximo turno.'
  # Note: source text prints a trailing "(133)" after the action_type tag
  # — an internal OG-CSPG page cross-reference, not part of the ability's
  # mechanical text. Omitted here; not resolved to what it points at.
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: befriends-the-black-dog
    tier: 6
  - type: focus
    id: explores-dark-places
    tier: 6
