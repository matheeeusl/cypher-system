id: supernatural-jump
name:
  en: Supernatural Jump
  pt-BR: Salto Sobrenatural
description:
  en: >-
    You can use this ability in one of two ways. If you're on your
    mount, you can move a long distance from one location to another
    almost instantaneously, carried by the creature you ride. You
    must be able to see the new location, and there must be no
    intervening barriers. Alternatively, you can use this ability to
    summon your mount from wherever it happens to be, leap up into
    the saddle, and use Trick Rider to make an attack or attempt a
    riding task. (Your mount can usually reach you even if you are
    deep underground, high in the air, or in another dimension,
    because your connection to your mount transcends the natural.)
  pt-BR: 'Tradução em breve.'
cost:
  pool: speed
  amount: 4
action_type: action
sources:
  - type: focus
    id: rides-like-the-wind
    tier: 2
