id: erase-memories
name:
  en: Erase Memories
  pt-BR: Apagar Memórias
description:
  en: You reach into the mind of a creature within immediate range and make an Intellect roll. On a success, you erase up to the last five minutes of its memory.
  pt-BR: 'Você alcança a mente de uma criatura dentro de uma distância imediata e faz uma rolagem de Intelecto. Em um sucesso, você apaga até os últimos cinco minutos de sua memória.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: type
    id: adept
    tier: 1
  - type: type
    id: speaker
    tier: 1
  - type: focus
    id: curses-the-world
    tier: 2
