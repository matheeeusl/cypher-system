id: coordinated-actions
name:
  en: Coordinated Actions
  pt-BR: Ações Coordenadas
description:
  en: >-
    When you and your drone from the Drone Buddy ability are within
    immediate distance of each other, you inflict 2 additional points
    of damage when you attack and both of you gain an asset to
    defense actions.
  pt-BR: 'Quando você e seu drone da habilidade Drone Companheiro estão dentro de uma distância imediata um do outro, você causa 2 pontos adicionais de dano ao atacar e ambos ganham um recurso em ações de defesa.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: has-a-custom-drone
    tier: 3
