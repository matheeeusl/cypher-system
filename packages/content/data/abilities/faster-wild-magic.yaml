id: faster-wild-magic
name:
  en: Faster Wild Magic
  pt-BR: Magia Selvagem Mais Rápida
description:
  en: >-
    If you spend ten minutes preparing your magic, you can fill any
    of your open cypher slots with subtle cyphers chosen randomly by
    the GM (this time can be part of a ten-minute, one-hour, or
    ten-hour recovery action if you are awake for the entire time).
    You can't use this ability again until after you've taken a
    ten-hour recovery action. You can still use Magical Repertoire to
    fill your cypher slots.
  pt-BR: "Tradução em breve."
  # Note: source tag is "Action to initiate, ten minutes to complete."
  # — the "ten minutes to complete" clause is a duration, not modeled by
  # action_type.
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: uses-wild-magic
    tier: 3
