id: flight
name:
  en: Flight
  pt-BR: Voo
description:
  en: You can float and fly through the air for one hour. For each level of Effort applied, you can affect one additional creature of your size or smaller. You must touch the creature to bestow the power of flight. You direct the other creature's movement, and while flying, it must remain within sight of you or fall. In terms of overland movement, a flying creature moves about 20 miles (32 km) per hour and is not affected by terrain.
  pt-BR: Você pode flutuar e voar pelo ar por uma hora. Para cada nível de Esforço aplicado, você pode afetar uma criatura adicional de seu tamanho ou menor. Você precisa tocar a criatura para conceder o poder de voo. Você direciona o movimento da outra criatura, e enquanto voa, ela deve permanecer à sua vista ou cai. Em termos de deslocamento no terreno, uma criatura voadora se move cerca de 32 quilômetros por hora e não é afetada pelo terreno.
  # Note: source cost is printed as "4+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 4 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: controls-gravity
    tier: 5
  - type: focus
    id: sculpts-hard-light
    tier: 6
