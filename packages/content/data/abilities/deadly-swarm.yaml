id: deadly-swarm
name:
  en: Deadly Swarm
  pt-BR: Enxame Mortal
description:
  en: >-
    If you're in a location where it's possible for your swarm of
    creatures from your Influence Swarm ability to come, you call a
    swarm of them for ten minutes. During this time, they do as you
    telepathically command as long as they are within long range.
    They can swarm about and hinder any or all opponents' tasks, or
    they can focus the swarm and attack all opponents within
    immediate range of each other (all within long range of you).
    The attacking swarm inflicts 4 points of damage. While the
    creatures are in long range, you can speak to them telepathically
    and perceive through their senses. (Swarms don't usually have
    game stats, but if needed, a typical swarm is level 2. Only
    attacks that affect a large area affect the swarm.)
  pt-BR: 'Se você estiver em um local onde seja possível que seu enxame de criaturas da habilidade Influenciar Enxame venha até você, você convoca um enxame delas por dez minutos. Durante esse tempo, elas fazem o que você comanda telepaticamente, desde que estejam dentro de uma distância longa. Elas podem se aglomerar e dificultar quaisquer tarefas de oponentes, ou podem concentrar o enxame e atacar todos os oponentes dentro de uma distância imediata uns dos outros (todos dentro de uma distância longa de você). O enxame atacante causa 4 pontos de dano. Enquanto as criaturas estiverem dentro da distância longa, você pode falar com elas telepaticamente e perceber através de seus sentidos. (Enxames geralmente não têm atributos de jogo, mas se necessário, um enxame típico é de nível 2. Apenas ataques que afetam uma área grande afetam o enxame.)'
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 6
