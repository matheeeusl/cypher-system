id: deadly-swarm
name:
  en: Deadly Swarm
  pt-BR: Enxame Mortal
description:
  en: >-
    If you're in a location where it's possible for your swarm of
    creatures from your Influence Swarm ability to come, you call a
    swarm of them for ten minutes. During this time, they do as you
    telepathically command as long as they are within long range.
    They can swarm about and hinder any or all opponents' tasks, or
    they can focus the swarm and attack all opponents within
    immediate range of each other (all within long range of you).
    The attacking swarm inflicts 4 points of damage. While the
    creatures are in long range, you can speak to them telepathically
    and perceive through their senses. (Swarms don't usually have
    game stats, but if needed, a typical swarm is level 2. Only
    attacks that affect a large area affect the swarm.)
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 6
