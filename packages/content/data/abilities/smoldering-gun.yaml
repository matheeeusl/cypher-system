id: smoldering-gun
name:
  en: Smoldering Gun
  pt-BR: Arma em Brasa
description:
  en: >-
    Your gun blazes with flame for ten minutes, glowing red and
    discharging a tendril of smoke from the barrel. The flames don't
    burn you, but you inflict 1 additional point of damage with the
    gun while it burns. While the gun burns, it automatically flares
    when anyone tries to touch you or strike you with a melee attack,
    dealing 2 points of damage to them. Flames from another source can
    still hurt you. While your gun smolders, you gain +1 Armor against
    damage from fire from another source. If you'd prefer another
    element or energy source, such as ice or necrotic energy, work
    with your GM to adjust this and related abilities.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: spits-fire-and-lead
    tier: 1
