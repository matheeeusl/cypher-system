id: smoldering-gun
name:
  en: Smoldering Gun
  pt-BR: Arma em Brasa
description:
  en: >-
    Your gun blazes with flame for ten minutes, glowing red and
    discharging a tendril of smoke from the barrel. The flames don't
    burn you, but you inflict 1 additional point of damage with the
    gun while it burns. While the gun burns, it automatically flares
    when anyone tries to touch you or strike you with a melee attack,
    dealing 2 points of damage to them. Flames from another source can
    still hurt you. While your gun smolders, you gain +1 Armor against
    damage from fire from another source. If you'd prefer another
    element or energy source, such as ice or necrotic energy, work
    with your GM to adjust this and related abilities.
  pt-BR: 'Sua arma de fogo arde em chamas por dez minutos, brilhando em vermelho e liberando uma fina fumaça pelo cano. As chamas não a queimam, mas você causa 1 ponto adicional de dano com a arma enquanto ela arde. Enquanto a arma arde, ela dispara automaticamente sempre que alguém tenta tocá-la ou atingi-la com um ataque corpo a corpo, causando 2 pontos de dano a essa pessoa. Chamas de outra fonte ainda podem machucá-la. Enquanto sua arma arde, você ganha +1 de Armadura contra dano de fogo de outra fonte. Se preferir outro elemento ou fonte de energia, como gelo ou energia necrótica, combine com seu Mestre para ajustar esta habilidade e as relacionadas.'
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: spits-fire-and-lead
    tier: 1
