id: pry-open
name:
  en: Pry Open
  pt-BR: Arrombar
description:
  en: >-
    You tear apart the defenses of a creature within long range. Any
    energy-based defenses it has (such as a force field or a Ward
    ability) are negated for 1d6 + 1 rounds. If the creature has no
    energy defenses, its Armor is reduced by 2 for one minute. If it
    has no energy-based defenses or Armor, attacks against it are eased
    for one minute.
  pt-BR: 'Você despedaça as defesas de uma criatura dentro de uma distância longa. Quaisquer defesas baseadas em energia que ela tenha (como um campo de força ou uma habilidade de Proteção) são anuladas por 1d6 + 1 rounds. Se a criatura não tiver defesas de energia, sua Armadura é reduzida em 2 por um minuto. Se não tiver defesas baseadas em energia nem Armadura, os ataques contra ela são facilitados por um minuto.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: type
    id: warrior
    tier: 4
  - type: flavor
    id: magic
    tier: 4
