id: pry-open
name:
  en: Pry Open
  pt-BR: Arrombar
description:
  en: >-
    You tear apart the defenses of a creature within long range. Any
    energy-based defenses it has (such as a force field or a Ward
    ability) are negated for 1d6 + 1 rounds. If the creature has no
    energy defenses, its Armor is reduced by 2 for one minute. If it
    has no energy-based defenses or Armor, attacks against it are eased
    for one minute.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: type
    id: warrior
    tier: 4
