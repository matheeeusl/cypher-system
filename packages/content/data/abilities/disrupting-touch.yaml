id: disrupting-touch
name:
  en: Disrupting Touch
  pt-BR: Toque Perturbador
description:
  en: >-
    You can turn your Phase Sprint into a melee attack by purposefully
    grazing another creature as you run. When you do, the touch
    releases a violent blast of energy that inflicts 2 points of
    damage to the target (ignores Armor). Whether you hit or miss,
    your movement (and turn) ends immediately, which puts you within
    immediate distance of your target. If you apply Effort to increase
    damage rather than to ease the task, you deal 2 additional points
    of damage per level of Effort (instead of 3 points); the target
    takes 1 point of damage even if you fail the attack roll.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "1+ Might points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 1 Might point here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: might
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: shreds-the-walls-of-the-world
    tier: 1
