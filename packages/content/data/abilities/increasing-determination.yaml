id: increasing-determination
name:
  en: Increasing Determination
  pt-BR: Determinação Crescente
description:
  en: If you fail at a noncombat physical task (pushing open a door or climbing a cliff, for example) and then retry the task, the task is eased. If you fail again, you gain no special benefits.
  pt-BR: Se você falhar em uma tarefa física fora de combate (empurrar uma porta para abri-la ou escalar um penhasco, por exemplo) e depois tentar novamente, a tarefa é facilitada. Se falhar de novo, você não ganha nenhum benefício especial.
cost: null
action_type: enabler
sources:
  - type: focus
    id: never-says-die
    tier: 4
  - type: focus
    id: runs-away
    tier: 4
