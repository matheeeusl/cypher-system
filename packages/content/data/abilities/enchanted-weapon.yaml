id: enchanted-weapon
name:
  en: Enchanted Weapon
  pt-BR: Arma Encantada
description:
  en: >-
    You attune yourself to a physical weapon, such as a sword,
    hammer, or bow. You know exactly where it is if it is
    within a short distance of you, and you know its general
    direction and distance if farther away. All of your other
    focus abilities require you to be holding or wielding this
    weapon. You can be attuned to only one weapon at a
    time; attuning yourself to a second weapon loses the
    attunement to the first one. Action to initiate, ten
    minutes to complete.
    - If you attune yourself to a different weapon, come up with a
    story reason for why you are able to do that and why you
    chose this new weapon.
  pt-BR: >-
    Você se sintoniza a uma arma física, como uma espada,
    um martelo ou um arco. Você sabe exatamente onde ela
    está se ela estiver a uma curta distância de você, e sabe
    sua direção e distância aproximadas se estiver mais
    longe. Todas as suas outras habilidades de foco exigem
    que você esteja segurando ou empunhando essa arma. 
    Você só pode estar sintonizado a uma arma por vez; 
    sintonizar-se a uma segunda arma faz com que você
    perca a sintonia com a primeira. Ação para iniciar, dez
    minutos para concluir. 
    - Se você se sintonizar a uma arma diferente, crie uma
    justificativa narrativa para o motivo de conseguir fazer
    isso e por que escolheu essa nova arma.
  # Note: source tag is "Action to initiate, ten minutes to complete."
  # — a non-standard tag, approximated as `enabler` (see schema gap
  # item 3).
cost:
  pool: intellect
  amount: 1
action_type: enabler
sources:
  - type: focus
    id: wields-an-enchanted-weapon
    tier: 1
