id: phase-door
name:
  en: Phase Door
  pt-BR: Porta Faseada
description:
  en: >-
    You can phase into a solid object's surface and then phase out
    of any other solid object within long range of the first, even
    if the two objects are not connected. There must be no
    intervening barriers between the two objects, and you must be
    aware of or able to see the destination object.
  pt-BR: >-
    Você pode entrar em fase na superfície de um objeto sólido e sair
    em fase de qualquer outro objeto sólido a longo alcance do primeiro,
    mesmo que os dois objetos não estejam conectados. Não pode haver
    barreiras interpostas entre os dois objetos, e você precisa estar
    ciente ou ser capaz de ver o objeto de destino.
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: exists-partially-out-of-phase
    tier: 3
