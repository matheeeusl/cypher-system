id: background-music
name:
  en: Background Music
  pt-BR: Música de Fundo
description:
  en: You create quiet background music in a short area, loud enough to be heard in a room
    with normal conversation, but not so loud to be distracting or overwhelming. The music
    repeats through up to ten songs you know, lasting up to an hour. In addition to the
    normal options for using Effort, you can use Effort to increase the duration; each
    level of Effort adds one hour to the play time and five songs to the playlist.
  pt-BR: 'Você cria uma música de fundo suave em uma área curta, alta o bastante para ser
    ouvida em uma sala com conversa normal, mas não tão alta a ponto de distrair ou
    sobrecarregar. A música repete até dez canções que você conhece, durando até uma hora.
    Além das opções normais de uso do Esforço, você pode usar Esforço para aumentar a
    duração: cada nível de Esforço acrescenta uma hora de execução e cinco canções à
    lista.'
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: flavor
    id: charms-and-figments
    tier: 1
