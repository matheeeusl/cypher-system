id: obstacle-running
name:
  en: Obstacle Running
  pt-BR: Corrida de Obstáculos
description:
  en: >-
    For the next minute, you can ignore obstacles that slow your
    movement, allowing you to travel at normal speed through areas with
    rubble, fences, tables, and similar objects that you would have to
    climb over or move around. This movement might include sliding on a
    railing, briefly running along a wall, or even stepping on a
    creature to boost yourself over something. If an obstacle would
    normally require a Might or Speed task to overcome, such as
    swinging on a rope, balancing on a rope, or jumping over a hole,
    you are trained in that task.
  pt-BR: 'Pelo próximo minuto, você pode ignorar obstáculos que retardam seu movimento, permitindo viajar à velocidade normal por áreas com entulho, cercas, mesas e objetos semelhantes que precisaria escalar ou contornar. Esse movimento pode incluir deslizar em um corrimão, correr brevemente ao longo de uma parede, ou até pisar em uma criatura para se impulsionar sobre algo. Se um obstáculo normalmente exigisse uma tarefa de Força ou Velocidade para superar, como balançar em uma corda, equilibrar-se em uma corda, ou pular sobre um buraco, você fica treinada nessa tarefa.'
cost:
  pool: speed
  amount: 3
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 3
