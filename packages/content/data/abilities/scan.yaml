id: scan
name:
  en: Scan
  pt-BR: Varredura
description:
  en: >-
    You scan an area equal in size to a 10-foot (3 m) cube, including
    all objects or creatures within that area. The area must be
    within short range. Scanning a creature or object always reveals
    its level. You also learn whatever facts the GM feels are
    pertinent about the matter and energy in that area. For example,
    you might learn that the wooden box contains a device of metal
    and plastic. You might learn that the glass cylinder is full of
    poisonous gas, and that its metal stand has an electrical field
    running through it that connects to a metal mesh in the floor.
    You might learn that the creature standing before you is a mammal
    with a small brain. However, this ability doesn't tell you what
    the information means. Thus, in the first example, you don't know
    what the metal and plastic device does. In the second, you don't
    know if stepping on the floor causes the cylinder to release the
    gas. In the third, you might suspect that the creature is not
    very intelligent, but scans, like looks, can be deceiving. Many
    materials and energy fields prevent or resist scanning.
  pt-BR: 'Você faz uma varredura em uma área do tamanho de um cubo de 3 metros (10 pés), incluindo todos os objetos ou criaturas dentro dessa área. A área deve estar dentro de uma distância curta. Fazer a varredura de uma criatura ou objeto sempre revela seu nível. Você também descobre quaisquer fatos que o Mestre considere pertinentes sobre a matéria e energia naquela área. Por exemplo, você pode descobrir que a caixa de madeira contém um dispositivo de metal e plástico. Pode descobrir que o cilindro de vidro está cheio de gás venenoso, e que seu suporte metálico tem um campo elétrico percorrendo-o que se conecta a uma malha metálica no chão. Pode descobrir que a criatura à sua frente é um mamífero com um cérebro pequeno. Porém, esta habilidade não lhe diz o que a informação significa. Assim, no primeiro exemplo, você não sabe o que o dispositivo de metal e plástico faz. No segundo, não sabe se pisar no chão faz o cilindro liberar o gás. No terceiro, você pode suspeitar que a criatura não é muito inteligente, mas varreduras, como aparências, podem enganar. Muitos materiais e campos de energia impedem ou resistem à varredura.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: type
    id: adept
    tier: 1
  - type: focus
    id: knows-everything
    tier: 2
    cyberware: true
