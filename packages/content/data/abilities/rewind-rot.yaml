id: rewind-rot
name:
  en: Rewind Rot
  pt-BR: Reverter a Podridão
description:
  en: >-
    Your grasp on life and death energy means that you can heal—even
    from death—as long as your head, heart, and hands remain intact.
    One minute after descending a step on the damage track, you
    regain 2 Pool points. However, if you return from death, it is
    with a permanent 2-point reduction in your Intellect Pool.
  pt-BR: "Tradução em breve."
  # Note: this ability and `greater-necromancy` are printed under a
  # shared Tier 4 heading: "If you have Necromancy, you gain Greater
  # Necromancy. If you have Reading Decomposition, you gain Rewind
  # Rot." — a conditional grant depending on the Tier 3 choice made.
  # The schema's plain `granted` entry can't express that
  # conditionality; both are modeled as unconditionally granted at
  # Tier 4, flagged here (same treatment as Made a Deal with Death's
  # GM-discretion Tier 1 grant).
cost: null
action_type: enabler
sources:
  - type: focus
    id: turns-decay-to-growth
    tier: 4
