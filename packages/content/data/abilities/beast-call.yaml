id: beast-call
name:
  en: Beast Call
  pt-BR: Chamado da Fera
description:
  en: You summon a horde of small animals or a single level 4 beast to help you temporarily. These creatures do your bidding for as long as you focus your attention, but you must use your action each turn to direct them. Creatures are native to the area and arrive under their own power, so if you're in an unreachable place, this ability won't work.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: controls-beasts
    tier: 5
