id: using-whats-available
name:
  en: Using What's Available
  pt-BR: Usando o que Está Disponível
description:
  en: >-
    If you have the time and the freedom to scrounge for everyday
    materials in your environment, you can fashion a temporary asset
    that will aid you once to accomplish a specific task. For example,
    if you need to climb a wall, you could create some sort of
    climbing assistance device; if you need to break out of a cell,
    you can find something to use as a lockpick; if you need to create
    a small distraction, you could put together something to make a
    loud bang and flash; and so on. The asset lasts for a maximum of
    one minute, or until used for the intended purpose.
  pt-BR: "Tradução em breve."
  # Note: source tag is "One minute to assemble materials; action to
  # create asset." — the "one minute to assemble" clause is a duration,
  # not modeled by action_type (preserved here in this comment); the
  # action itself is to create.
cost:
  pool: intellect
  amount: 4
action_type: action_to_create
sources:
  - type: focus
    id: operates-undercover
    tier: 5
  - type: focus
    id: walks-the-wasteland
    tier: 6
