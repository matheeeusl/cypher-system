id: perks-of-stardom
name:
  en: Perks of Stardom
  pt-BR: Vantagens do Estrelato
description:
  en: >-
    You are adept at claiming the rewards that fame can generate. When
    you are recognized, you can be seated at any restaurant, be let
    into any government building, be invited to any show or sports
    event (even if they're sold out), get a seat at a private function
    of any sort, or get into any club, no matter how exclusive. When
    dealing with someone who can't or won't immediately give in to
    your desire, you gain an asset on all tasks related to persuasion
    if that person recognizes you or is convinced that you're a
    celebrity even if they don't recognize you.
  pt-BR: 'Você é hábil em reivindicar as recompensas que a fama pode gerar. Quando é reconhecida, pode ser sentada em qualquer restaurante, ser admitida em qualquer prédio governamental, ser convidada para qualquer show ou evento esportivo (mesmo que estejam esgotados), conseguir um lugar em um evento privado de qualquer tipo, ou entrar em qualquer clube, por mais exclusivo que seja. Ao lidar com alguém que não pode ou não quer ceder imediatamente ao seu desejo, você ganha um recurso em todas as tarefas relacionadas a persuasão se essa pessoa a reconhecer ou estiver convencida de que você é uma celebridade, mesmo que não a reconheça.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: is-idolized-by-millions
    tier: 2
