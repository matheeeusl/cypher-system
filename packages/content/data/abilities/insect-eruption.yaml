id: insect-eruption
name:
  en: Insect Eruption
  pt-BR: Erupção de Insetos
description:
  en: >-
    You call a swarm of insects in a place where it is possible for
    insects to appear. They remain for one minute, and during this
    time, they do as you command while they are within long range.
    They can swarm about and hinder any or all creatures' tasks, or
    you can focus the swarm and attack all targets within immediate
    range of each other (all within long range of you). The attacking
    swarm inflicts 2 points of damage per round. You can also command
    the swarm to move heavy objects through collective effort, eat
    through wooden walls, and perform other actions suitable for a
    supernatural swarm.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: speaks-for-the-land
    tier: 5
  - type: focus
    id: turns-decay-to-growth
    tier: 5
