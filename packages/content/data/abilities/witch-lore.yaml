id: witch-lore
name:
  en: Witch Lore
  pt-BR: Conhecimento de Bruxas
description:
  en: >-
    You are trained in the traditional names, habits, suspected
    lairs, and related topics regarding the witches of your world.
    You know enough of at least one quasi-magical language (such as
    Latin or Ancient Greek) that you can make yourself understood to
    them.
  pt-BR: 'Você é treinada nos nomes tradicionais, hábitos, covis suspeitos e tópicos relacionados às bruxas do seu mundo. Você conhece o suficiente de pelo menos um idioma quase mágico (como latim ou grego antigo) para se fazer entender por elas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: hunts-witches
    tier: 1
