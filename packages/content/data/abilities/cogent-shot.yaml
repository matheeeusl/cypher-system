id: cogent-shot
name:
  en: Cogent Shot
  pt-BR: Tiro Cogente
description:
  en: >-
    You can spend points from either your Speed Pool or your
    Intellect Pool to apply Effort to hit a target with a gun or
    increase the damage inflicted doing so.
  pt-BR: 'Você pode gastar pontos da sua Reserva de Velocidade ou da sua Reserva de Intelecto para aplicar Esforço a fim de acertar um alvo com uma arma de fogo ou aumentar o dano causado ao fazê-lo.'
  # Note: source prints this Focus's Type Swap Option as two abilities
  # (Cogent Shot and Reload) under one "TYPE SWAP OPTION" heading, both
  # granted together — see `spits-fire-and-lead`'s `type_swap_option`
  # (now `ability_ids`, plural).
cost: null
action_type: enabler
sources:
  - type: focus
    id: spits-fire-and-lead
    tier: 1
