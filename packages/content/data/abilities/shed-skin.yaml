id: shed-skin
name:
  en: Shed Skin
  pt-BR: Muda de Pele
description:
  en: >-
    You shed your normal likeness, revealing a terrifying 30-foot
    (9 m) long rattlesnake. For one minute, your abilities change as
    follows: You add 8 points to your Speed Pool, 1 point to your
    Speed Edge, 2 points to your Intellect Pool, and 1 point to your
    Intellect Edge; and you gain the "air gliding" ability (you can
    fly a long distance each round). After reverting to your normal
    form, you lose the benefit of air gliding, your Edge values
    return to normal, and you must subtract the same number of points
    you gained in your Pools (if this brings a Pool to 0, subtract the
    overflow first from your Might Pool, then your Speed Pool, and
    then, if necessary, from your Intellect Pool). While the ability
    was active, if you did not deal damage with Venomous Strike, your
    rolls are hindered by two steps until after your next ten-hour
    recovery roll. Each additional time you use Shed Skin before your
    next ten-hour recovery roll, you must apply an additional level of
    Effort.
  pt-BR: 'Você abandona sua aparência normal, revelando uma cascavel aterrorizante de 9 metros (30 pés) de comprimento. Por um minuto, suas habilidades mudam da seguinte forma: você adiciona 8 pontos à sua Reserva de Velocidade, 1 ponto à sua Margem de Velocidade, 2 pontos à sua Reserva de Intelecto, e 1 ponto à sua Margem de Intelecto; e ganha a habilidade de "deslizar pelo ar" (pode voar uma distância longa a cada round). Após reverter à sua forma normal, você perde o benefício de deslizar pelo ar, seus valores de Margem retornam ao normal, e deve subtrair o mesmo número de pontos que ganhou nas suas Reservas (se isso reduzir uma Reserva a 0, subtraia o excedente primeiro da sua Reserva de Força, depois da sua Reserva de Velocidade, e depois, se necessário, da sua Reserva de Intelecto). Enquanto a habilidade estava ativa, se você não causou dano com Golpe Venenoso, suas rolagens são dificultadas em dois níveis até depois da sua próxima rolagem de recuperação de dez horas. Cada vez adicional que você usar Muda de Pele antes da sua próxima rolagem de recuperação de dez horas, deve aplicar um nível adicional de Esforço.'
  # Note: source cost is printed as "7+ Speed points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 7 Speed points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: speed
  amount: 7
action_type: action_to_initiate
sources:
  - type: focus
    id: strikes-like-a-rattler
    tier: 6
