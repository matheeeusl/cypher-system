id: camera-sight
name:
  en: Camera Sight
  pt-BR: Visão por Câmeras
description:
  en: >-
    This ability has two different options:

    - One, you become aware of all security cameras within long
    range.

    - Two, you can hack a security camera that you are aware of that
    is within one mile (1.5 km), allowing you to see through the
    camera's vantage point for up to 10 minutes.

    If you activate this ability and apply a level of Effort, you can
    gain the benefit of both options at once.
  pt-BR: "Tradução em breve."
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 2
    cyberware: true
