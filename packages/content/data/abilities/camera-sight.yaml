id: camera-sight
name:
  en: Camera Sight
  pt-BR: Visão por Câmeras
description:
  en: >-
    This ability has two different options:

    - One, you become aware of all security cameras within long
    range.

    - Two, you can hack a security camera that you are aware of that
    is within one mile (1.5 km), allowing you to see through the
    camera's vantage point for up to 10 minutes.

    If you activate this ability and apply a level of Effort, you can
    gain the benefit of both options at once.
  pt-BR: >-
    Esta habilidade tem duas opções diferentes:

    - Uma, você se torna consciente de todas as câmeras de segurança
    dentro de uma distância longa.

    - Duas, você pode invadir uma câmera de segurança da qual esteja
    ciente que esteja dentro de 1,5 km (uma milha), permitindo que veja
    através do ponto de vista da câmera por até 10 minutos.

    Se você ativar esta habilidade e aplicar um nível de Esforço, pode
    obter o benefício de ambas as opções ao mesmo tempo.
  # Note: source cost is printed as "3+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 3 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 3
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 2
    cyberware: true
