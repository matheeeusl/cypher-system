id: bypass-barrier
name:
  en: Bypass Barrier
  pt-BR: Contornar Barreira
description:
  en: >-
    You get past a door, force field, or other barrier up to 3 feet
    (1 m) thick that is blocking your way. Depending on the barrier,
    this might involve finding a weak spot you can push through,
    pressing the right button by luck, just breaking through, or even
    weirder explanations like touching a thin place between dimensions
    or an unexpected interaction with your equipment. The difficulty
    of the task is the level of the barrier. This ability allows you
    alone to pass through, not anyone else, and the way through closes
    at the end of your turn (which might mean you're trapped on the
    far side). You have an asset in any attempts to get through it
    again. In addition to the normal options for using Effort, you can
    choose to use Effort to increase the maximum thickness of the
    barrier, each level adding 3 feet (1 m).
  pt-BR: 'Você consegue passar por uma porta, campo de força ou outra barreira de até 1 metro (3 pés) de espessura que esteja bloqueando seu caminho. Dependendo da barreira, isso pode envolver encontrar um ponto fraco pelo qual empurrar, apertar o botão certo por sorte, simplesmente arrombar, ou até explicações mais estranhas, como tocar um ponto tênue entre dimensões ou uma interação inesperada com seu equipamento. A dificuldade da tarefa é o nível da barreira. Esta habilidade permite que apenas você passe, e não mais ninguém, e a passagem se fecha no fim do seu turno (o que pode significar que você fica preso do outro lado). Você tem um recurso em qualquer nova tentativa de atravessá-la. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar a espessura máxima da barreira, cada nível adicionando 1 metro (3 pés).'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: inks-spells-on-skin
    tier: 5
