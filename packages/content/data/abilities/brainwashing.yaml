id: brainwashing
name:
  en: Brainwashing
  pt-BR: Lavagem Cerebral
description:
  en: >-
    You use trickery, well-spoken lies, and mind-affecting chemicals
    (or other means, like magic or high technology) to make others
    temporarily do what you want them to do. You control the actions
    of another creature you touch. This effect lasts for one minute.
    The target must be level 3 or lower. You can allow it to act
    freely or override its control on a case-by-case basis as long as
    you can see it. In addition to the normal options for using
    Effort, you can choose to use Effort to increase the maximum
    level of the target or increase the duration by one minute. Thus,
    to control the mind of a level 6 target (three levels above the
    normal limit) or control a target for four minutes (three minutes
    above the normal duration), you must apply three levels of
    Effort. When the duration ends, the creature doesn't remember
    being controlled or anything it did while under your influence.
  pt-BR: 'Você usa trapaça, mentiras bem articuladas e substâncias que afetam a mente (ou outros meios, como magia ou alta tecnologia) para fazer os outros temporariamente fazerem o que você quer. Você controla as ações de outra criatura que tocar. Este efeito dura um minuto. O alvo deve ser de nível 3 ou inferior. Você pode permitir que ela aja livremente ou anular seu controle caso a caso, desde que consiga vê-la. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o nível máximo do alvo ou aumentar a duração em um minuto. Assim, para controlar a mente de um alvo de nível 6 (três níveis acima do limite normal) ou controlar um alvo por quatro minutos (três minutos acima da duração normal), você deve aplicar três níveis de Esforço. Quando a duração termina, a criatura não se lembra de ter sido controlada nem de nada que fez sob sua influência.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: infiltrates
    tier: 6
