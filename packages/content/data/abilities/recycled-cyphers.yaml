id: recycled-cyphers
name:
  en: Recycled Cyphers
  pt-BR: Cifras Recicladas
description:
  en: >-
    All manifest cyphers you use function at one level higher than
    normal. In addition, if given a week and at least ten items of
    junk from the Junk table, you can tinker with one of your manifest
    cyphers, transforming it into another cypher of the same type
    that you had in the past. The GM and player should collaborate to
    ensure that the transformation is logical—for example, you
    probably can't transform a pill into a helmet.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: scavenges
    tier: 5
