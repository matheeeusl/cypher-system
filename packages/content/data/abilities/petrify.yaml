id: petrify
name:
  en: Petrify
  pt-BR: Petrificar
description:
  en: >-
    You slowly transform a creature within short range into lifeless
    stone. The target must be level 2 or lower. If your attack
    succeeds, the creature takes 6 points of damage and moves one step
    down the damage track as their flesh begins to mineralize. If the
    transformation is not interrupted by the end of your next turn,
    the creature fully becomes a harmless stone statue. You can cast
    this spell to restore a petrified target back into their living
    self. In addition to the normal options for using Effort, you can
    use Effort to increase the maximum level of the target. Thus, to
    petrify a level 6 target (four levels above the normal limit), you
    must apply four levels of Effort.
  pt-BR: 'Você transforma lentamente uma criatura dentro de uma distância curta em pedra sem vida. O alvo deve ser de nível 2 ou inferior. Se seu ataque for bem-sucedido, a criatura sofre 6 pontos de dano e desce um nível na trilha de dano enquanto sua carne começa a se mineralizar. Se a transformação não for interrompida até o fim do seu próximo turno, a criatura se torna totalmente uma estátua de pedra inofensiva. Você pode conjurar este feitiço para restaurar um alvo petrificado de volta ao seu estado vivo. Além das opções normais de uso de Esforço, você pode usar Esforço para aumentar o nível máximo do alvo. Assim, para petrificar um alvo de nível 6 (quatro níveis acima do limite normal), você deve aplicar quatro níveis de Esforço.'
  # Note: source cost is printed as "6+ Intellect points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Intellect points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: inks-spells-on-skin
    tier: 6
