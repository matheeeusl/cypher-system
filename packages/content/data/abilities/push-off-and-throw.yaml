id: push-off-and-throw
name:
  en: Push Off and Throw
  pt-BR: Empurrar e Arremessar
description:
  en: You can make precise, point-to-point jumps in microgravity, which means you can move up to a long distance and make a melee attack or attempt to grab a foe of your size or smaller. If you successfully grab your foe, you move your foe up to a short distance from its original position. Alternatively, while you come to a standstill (or move off in an immediate distance per round in any direction you choose) you can launch your foe in a chosen direction through space at a rate of a short distance per round.
  pt-BR: Você pode fazer saltos precisos de ponto a ponto em microgravidade, o que significa que pode se mover até uma distância longa e fazer um ataque corpo a corpo ou tentar agarrar um inimigo de seu tamanho ou menor. Se agarrar seu inimigo com sucesso, você o move até uma distância curta de sua posição original. Alternativamente, enquanto fica parado (ou se move a uma distância imediata por rodada em qualquer direção que escolher), você pode lançar seu inimigo em uma direção escolhida através do espaço, a uma taxa de uma distância curta por rodada.
cost:
  pool: speed
  amount: 3
action_type: action
sources:
  - type: focus
    id: loves-the-void
    tier: 4
