id: wings-of-fire
name:
  en: Wings of Fire
  pt-BR: Asas de Fogo
description:
  en: While your Shroud of Flame is active, you can spread wings of fire and can levitate, moving at a rate of up to 20 feet (6 m) per round in any direction for one minute. You can also take one other non-movement action on your turn.
  pt-BR: Enquanto seu Manto de Chamas estiver ativo, você pode estender asas de fogo e levitar, movendo-se a uma taxa de até 6 metros por rodada em qualquer direção por um minuto. Você também pode realizar outra ação que não seja de movimento em seu turno.
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
