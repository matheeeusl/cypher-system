id: control-swarm
name:
  en: Control Swarm
  pt-BR: Controlar Enxame
description:
  en: >-
    Your swarm creatures from your Influence Swarm ability within
    short range do as you telepathically command for ten minutes.
    Even common insects (level 0) in large enough numbers can swarm
    about a single creature and hinder its tasks.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 2
