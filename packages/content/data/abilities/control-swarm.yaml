id: control-swarm
name:
  en: Control Swarm
  pt-BR: Controlar Enxame
description:
  en: >-
    Your swarm creatures from your Influence Swarm ability within
    short range do as you telepathically command for ten minutes.
    Even common insects (level 0) in large enough numbers can swarm
    about a single creature and hinder its tasks.
  pt-BR: 'Suas criaturas de enxame da habilidade Influenciar Enxame dentro de uma distância curta obedecem seu comando telepático por dez minutos. Mesmo insetos comuns (nível 0) em números suficientes podem enxamear em torno de uma única criatura e dificultar suas tarefas.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: masters-the-swarm
    tier: 2
