id: network-tap
name:
  en: Network Tap
  pt-BR: Grampo de Rede
description:
  en: >-
    You can ask the GM one question and get a very short answer if you
    succeed on an Intellect roll against a difficulty assigned by the
    GM. The more obscure the answer, the more difficult the task. On a
    failed roll, feedback or perhaps some defense from the network
    you're accessing inflicts 4 points of Intellect damage on you
    (ignores Armor).
  pt-BR: 'Você pode fazer uma pergunta ao Mestre e obter uma resposta muito breve se tiver sucesso em uma rolagem de Intelecto contra uma dificuldade atribuída pelo Mestre. Quanto mais obscura a resposta, mais difícil a tarefa. Em uma rolagem malsucedida, uma reação ou talvez alguma defesa da rede que você está acessando causa 4 pontos de dano de Intelecto em você (ignora Armadura).'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: fuses-mind-and-machine
    tier: 2
  - type: focus
    id: hacks-the-network
    tier: 3
    cyberware: true
  - type: focus
    id: knows-everything
    tier: 3
    cyberware: true
  - type: focus
    id: merges-mind-with-machine
    tier: 4
  - type: flavor
    id: modern-magic
    tier: 3
