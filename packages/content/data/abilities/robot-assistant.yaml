id: robot-assistant
name:
  en: Robot Assistant
  pt-BR: Assistente Robótico
description:
  en: A level 2 robot of your size or smaller (built by you) accompanies you and follows your instructions. You and the GM must work out the details of your robot. You'll probably make rolls for it when it takes actions. A robot assistant in combat usually doesn't make separate attacks but helps with yours. On your action, if the artificial assistant is next to you, it serves as an asset for one attack you make on your turn. If the robot is destroyed, you can repair the original with a few days' worth of tinkering, or build a new one with a week's worth of half-time labor.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: builds-robots
    tier: 1
  - type: focus
    id: merges-mind-with-machine
    tier: 1
