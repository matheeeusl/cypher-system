id: robot-assistant
name:
  en: Robot Assistant
  pt-BR: Assistente Robótico
description:
  en: A level 2 robot of your size or smaller (built by you) accompanies you and follows your instructions. You and the GM must work out the details of your robot. You'll probably make rolls for it when it takes actions. A robot assistant in combat usually doesn't make separate attacks but helps with yours. On your action, if the artificial assistant is next to you, it serves as an asset for one attack you make on your turn. If the robot is destroyed, you can repair the original with a few days' worth of tinkering, or build a new one with a week's worth of half-time labor.
  pt-BR: 'Um robô de nível 2 do seu tamanho ou menor (construído por você) o acompanha e segue suas instruções. Você e o Mestre devem definir os detalhes do seu robô. Você provavelmente fará rolagens por ele quando realizar ações. Um assistente robótico em combate geralmente não faz ataques separados, mas ajuda nos seus. Na sua ação, se o assistente artificial estiver ao seu lado, ele serve de recurso para um ataque que você fizer no seu turno. Se o robô for destruído, você pode reparar o original com alguns dias de trabalho manual, ou construir um novo com uma semana de trabalho em meio período.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: builds-robots
    tier: 1
  - type: focus
    id: merges-mind-with-machine
    tier: 1
