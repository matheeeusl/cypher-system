description:
  en: They usually don't give up without a fight. You are trained in Speed defense tasks. If your foe is someone you've successfully interacted with (as noted under Know Where It Hurts), your Speed defense tasks against them also gain an asset.
  pt-BR: Eles geralmente não desistem sem lutar. Você é treinado em tarefas de defesa de Velocidade. Se seu inimigo for alguém com quem você interagiu com sucesso (conforme descrito em Saber Onde Dói), suas tarefas de defesa de Velocidade contra ele também ganham um bônus.
