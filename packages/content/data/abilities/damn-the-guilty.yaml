id: damn-the-guilty
name:
  en: Damn the Guilty
  pt-BR: Condenar o Culpado
description:
  en: >-
    You speak words of revelation and judgment to everyone within
    close range. Those whom you have designated as guilty with your
    Designation ability take an additional 3 points of damage from any
    attack they receive from anyone who heard your judgment. This
    judgment lasts for up to one minute or until they move at least a
    long distance away from you.
  pt-BR: 'Você profere palavras de revelação e julgamento a todos dentro de uma distância próxima. Aqueles que você designou como culpados com sua habilidade Designação sofrem 3 pontos adicionais de dano em qualquer ataque que receberem de alguém que tenha ouvido seu julgamento. Esse julgamento dura até um minuto ou até que se afastem de você por ao menos uma distância longa.'
cost:
  pool: intellect
  amount: 3
action_type: action
sources:
  - type: focus
    id: metes-out-justice
    tier: 6
attack: true
