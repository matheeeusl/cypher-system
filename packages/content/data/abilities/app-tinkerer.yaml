id: app-tinkerer
name:
  en: App Tinkerer
  pt-BR: Ajustador de Aplicativos
description:
  en: If you spend at least one day tinkering with a magical app in your possession, it functions at one level higher than normal. This applies to all magical apps in your possession, but they retain this bonus only for you.
  pt-BR: Se você passar pelo menos um dia ajustando um aplicativo mágico em sua posse, ele passa a funcionar em um nível acima do normal. Isso se aplica a todos os aplicativos mágicos em sua posse, mas eles mantêm esse bônus apenas para você.
cost: null
action_type: enabler
sources:
  - type: focus
    id: codes-magic-apps
    tier: 2
