id: phase-foe
name:
  en: Phase Foe
  pt-BR: Desfasar Inimigo
description:
  en: >-
    You gather disrupting energy in your fingertip and touch a creature.
    If the target is an NPC or a creature of level 3 or lower, it
    becomes phased as if it had used the Ghost ability.
    However, unless it can figure out how to control its
    movement while being phased, which most creatures
    have no experience with, it begins to sink through solid
    matter. If it can't control itself or end the effect, it might
    be gone for good because when it becomes solid again
    after ten minutes, it's probably deep in the earth. For
    each additional level of Effort you apply, you can
    attempt to affect a target of one level higher
  pt-BR: >-
    Você concentra energia desestabilizadora na ponta do dedo e toca uma criatura. 
    Se o alvo for um NPC ou uma criatura de nível 3 ou inferior, ele
    entra em estado de desfasagem, como se tivesse usado a habilidade Fantasma. 
    No entanto, a menos que consiga descobrir como controlar seu
    movimento enquanto desfasado — algo com que a maioria das criaturas
    não tem experiência —, ele começa a afundar através de matéria sólida. 
    Se não conseguir controlar a situação ou encerrar o efeito, poderá
    desaparecer para sempre, pois, ao voltar ao estado sólido
    após dez minutos, provavelmente estará nas profundezas da terra. Para
    cada nível adicional de Esforço aplicado, você pode
    tentar afetar um alvo de um nível superior.
# Note: source cost is printed as "6+ Intellect points" — the schema's
# cost field can't represent an open-ended "+". Recorded as the
# baseline 6 Intellect points here, flagged for schema review (same
# approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: exists-partially-out-of-phase
    tier: 6
