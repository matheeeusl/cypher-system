id: telekinesis
name:
  en: Telekinesis
  pt-BR: Telecinese
description:
  en: >-
    You can exert force on objects within short range. Once activated,
    your power has an effective Might Pool of 10, a Might Edge of 1,
    and an Effort of 2 (approximately equal to the strength of a fit,
    capable adult human), and you can use it to move objects, push
    against objects, and so on. For example, you could lift and pull a
    light object anywhere within range to yourself or move a heavy
    object (like a piece of furniture) about 10 feet (3 m). This power
    lacks the fine control to wield a weapon or move objects with much
    speed, so in most situations, it's not a means of attack. You
    can't use this ability on your own body. The power lasts for one
    hour or until its Might Pool is depleted, whichever comes first.
  pt-BR: 'Você pode exercer força sobre objetos dentro de uma distância curta. Uma vez ativado, seu poder tem uma Reserva de Força efetiva de 10, uma Margem de Força de 1, e um Esforço de 2 (aproximadamente igual à força de um humano adulto capaz e em forma), e você pode usá-lo para mover objetos, empurrar objetos, e assim por diante. Por exemplo, você poderia levantar e puxar um objeto leve de qualquer lugar dentro do alcance até você, ou mover um objeto pesado (como um móvel) cerca de 3 metros (10 pés). Esse poder carece do controle fino para empunhar uma arma ou mover objetos com muita velocidade, então na maioria das situações não é um meio de ataque. Você não pode usar esta habilidade em seu próprio corpo. O poder dura uma hora ou até sua Reserva de Força se esgotar, o que ocorrer primeiro.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: focuses-mind-over-matter
    tier: 2
