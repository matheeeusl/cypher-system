id: flex-skill
name:
  en: Flex Skill
  pt-BR: Perícia Flexível
description:
  en: At the beginning of each day, choose one task (other than attacks or defense) on which you will concentrate. For the rest of that day, you're trained in that task. You can't use this ability with a skill in which you're already trained to become specialized.
  pt-BR: 'No início de cada dia, escolha uma tarefa (que não seja ataque ou defesa) na qual se concentrará. Pelo resto daquele dia, você fica treinada nessa tarefa. Você não pode usar esta habilidade com uma perícia na qual já é treinada para se tornar especializada.'
  # Note: source prints this ability's full text twice at Tier 1, plus an
  # explicit aside confirming it's intentional ("You might be wondering if
  # you get two flex skills at Tier 1. Yes, you do!") — modeled as two
  # `granted` entries at tier 1 in the Focus file, both pointing here.
cost: null
action_type: enabler
sources:
  - type: focus
    id: copies-superpowers
    tier: 1
  - type: focus
    id: learned-from-the-classics
    tier: 2
  - type: focus
    id: would-rather-be-reading
    tier: 3
