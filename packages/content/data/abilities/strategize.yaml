id: strategize
name:
  en: Strategize
  pt-BR: Estrategizar
description:
  en: >-
    Having an action plan in place before facing a challenge improves
    the odds of success, even if that plan is eventually changed or
    discarded once it's put into play. If you and your allies spend at
    least ten minutes going over a plan of action, all of you gain one
    free level of Effort that can be applied to one task you attempt
    during the execution of that plan within the next 24 hours. The
    plan of action must be something concrete and executable in order
    to gain this benefit.
  pt-BR: 'Ter um plano de ação estabelecido antes de enfrentar um desafio melhora as chances de sucesso, mesmo que esse plano seja eventualmente mudado ou descartado assim que colocado em prática. Se você e seus aliados passarem pelo menos dez minutos revisando um plano de ação, todos vocês ganham um nível gratuito de Esforço que pode ser aplicado a uma tarefa que tentarem durante a execução desse plano nas próximas 24 horas. O plano de ação deve ser algo concreto e executável para obter esse benefício.'
  # Note: source tag is "Action to initiate, ten minutes to complete."
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 4
