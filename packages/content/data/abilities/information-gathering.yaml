id: information-gathering
name:
  en: Information Gathering
  pt-BR: Coleta de Informações
description:
  en: >-
    You speak telepathically with any or all machines within 1 mile
    (1.5 km). You can ask one basic question about themselves or
    anything happening near them and receive a simple answer. For
    example, while in an area with many machines, you could ask about
    the location of a specific creature or individual, and if they
    are within a mile of you, one or more machines will probably
    provide the answer.
  pt-BR: 'Você fala telepaticamente com qualquer ou todas as máquinas dentro de 1,5 km (1 milha). Você pode fazer uma pergunta básica sobre elas ou sobre algo acontecendo perto delas e receber uma resposta simples. Por exemplo, em uma área com muitas máquinas, você poderia perguntar sobre a localização de uma criatura ou indivíduo específico, e se estiverem dentro de uma milha de você, uma ou mais máquinas provavelmente fornecerão a resposta.'
cost:
  pool: intellect
  amount: 5
action_type: action
sources:
  - type: focus
    id: explores-cyberspace
    tier: 5
    cyberware: true
  - type: focus
    id: knows-everything
    tier: 5
    cyberware: true
  - type: focus
    id: talks-to-machines
    tier: 5
  - type: flavor
    id: technology
    tier: 6
  - type: flavor
    id: modern-magic
    tier: 6
