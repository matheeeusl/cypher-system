id: mastery-with-defense
name:
  en: Mastery With Defense
  pt-BR: Maestria em Defesa
description:
  en: >-
    Choose one type of defense task in which you are trained: Might,
    Speed, or Intellect. You are specialized in defense tasks of that
    type. You can select this ability up to three times. Each time
    you select it, you must choose a different type of defense task.
  pt-BR: 'Escolha um tipo de tarefa de defesa no qual seja treinada: Força, Velocidade ou Intelecto. Você fica especializada em tarefas de defesa desse tipo. Você pode escolher esta habilidade até três vezes. Cada vez que a escolher, deve escolher um tipo diferente de tarefa de defesa.'
cost: null
action_type: enabler
sources:
