id: ai-assistant
name:
  en: AI Assistant
  pt-BR: Assistente de IA
description:
  en: >-
    While in cyberspace, you summon an AI assistant that appears at
    any point you can see within a short range. The AI is a level 3
    NPC with 15 health. The AI obeys your commands and does as you
    direct it. The AI remains until you dismiss it as an action or
    until it is killed. If the AI disappears because it was killed,
    you take 4 points of damage that ignore Armor and cannot summon
    the AI again until the next time you jack in.
  pt-BR: >-
    Enquanto estiver no ciberespaço, você invoca uma IA assistente
    que surge em qualquer ponto visível a curta distância.
    A IA é um NPC de nível 3 com 15 pontos de vida. Ela obedece aos
    seus comandos e age conforme suas instruções. A IA permanece ativa
    até que você a dispense (usando uma ação) ou até que ela seja destruída.
    Se a IA desaparecer por ter sido destruída, você sofre 4 pontos de
    dano que ignoram a Armadura e não poderá invocá-la novamente até a
    próxima vez que se conectar à rede.
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: explores-cyberspace
    tier: 3
    cyberware: true
