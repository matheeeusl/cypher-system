id: heavy-integrated-weapon
name:
  en: Heavy Integrated Weapon
  pt-BR: Arma Pesada Integrada
description:
  en: >-
    You must have at least one gorilla arm to select this ability.
    One heavy melee weapon of your choice (such as a chainsaw or
    omega bat) is built into your gorilla arm. The weapon is
    concealed until you wish to use it.
  pt-BR: "Tradução em breve."
  # Note: source marks this ability with "~" (a cyberware-derived
  # ability marker, not modeled — see schema gap item 6). Also has a
  # trailing note: "If you have both Integrated Weapon and Heavy
  # Integrated Weapon, each weapon is built into a different arm." —
  # folded here as context.
cost: null
action_type: enabler
sources:
