id: enhanced-camera-sight
name:
  en: Enhanced Camera Sight
  pt-BR: Visão por Câmeras Aprimorada
description:
  en: >-
    Using your Camera Sight ability, you can either look through two
    security cameras simultaneously, look through one security camera
    that is up to 5 miles (8 km) away, or look through one camera for
    up to 30 minutes.
  pt-BR: 'Usando sua habilidade Visão por Câmeras, você pode olhar através de duas câmeras de segurança simultaneamente, olhar através de uma câmera de segurança a até 8 km (5 milhas) de distância, ou olhar através de uma câmera por até 30 minutos.'
cost:
  pool: intellect
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: has-eyes-everywhere
    tier: 5
    cyberware: true
