id: defend-the-innocent
name:
  en: Defend the Innocent
  pt-BR: Defender o Inocente
description:
  en: >-
    For the next ten minutes, if someone you have designated as
    innocent with the Designation ability stands next to you, that
    creature shares any defensive advantages that you might have,
    other than mundane armor. These advantages include the Speed
    defense from your shield, the Armor offered from a force field,
    and so on. In addition, Speed defense rolls made by the innocent
    creature gain an asset. You can protect only one innocent creature
    at a time.
  pt-BR: 'Pelos próximos dez minutos, se alguém que você designou como inocente com a habilidade Designação estiver ao seu lado, essa criatura compartilha quaisquer vantagens defensivas que você possa ter, exceto armadura comum. Essas vantagens incluem a defesa de Velocidade do seu escudo, a Armadura oferecida por um campo de força, e assim por diante. Além disso, as rolagens de defesa de Velocidade feitas pela criatura inocente ganham um recurso. Você só pode proteger uma criatura inocente por vez.'
  # Note: printed identically at both Tier 2 (granted) and Tier 3
  # (choice option) of this same Focus — same-focus multi-tier reuse
  # pattern, modeled as two `sources[]` entries at different tiers.
cost:
  pool: speed
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: metes-out-justice
    tier: 2
  - type: focus
    id: metes-out-justice
    tier: 3
