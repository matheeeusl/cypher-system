id: reliable-weaponry
name:
  en: Reliable Weaponry
  pt-BR: Armamento Confiável
description:
  en: >-
    Choose one of your weapons. If you roll a natural 1 when
    attacking with that weapon, you can ignore or countermand the GM
    intrusion for that roll. If it isn't an embedded weapon, you can
    never be disarmed of it, nor will you ever drop it accidentally.
    If it is an embedded weapon, it can't be damaged or destroyed
    unless you allow it or you deliberately attempt to do so (such as
    sticking it in molten steel).
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: focus
    id: weaponizes-chrome
    tier: 4
