id: time-doppelganger
name:
  en: Time Doppelganger
  pt-BR: Sósia Temporal
description:
  en: >-
    A perfect copy of you appears within an immediate distance. This
    doppelganger is probably a version of you from another timeline
    or the past. The doppelganger is a level 5 NPC with 15 health. It
    has your mind and memories, and you control it as if it were you
    in another body. In effect, while this ability is active, you
    have two bodies. If the doppelganger uses any of your abilities
    that cost points, those points come from your Pools (including
    spending Effort). Controlling two bodies at once is difficult and
    distracting; while this ability is active, all tasks performed by
    you or the doppelganger are hindered. The doppelganger has no
    equipment other than simple clothing. It remains for up to one
    minute, but disappears if killed or if you use an action to
    dismiss it. If the doppelganger is killed, you take 5 points of
    damage that ignore Armor, and you lose your next action. If you
    are killed while the doppelganger is present, you live on as the
    doppelganger (it becomes your character instead of being an NPC
    that disappears). In addition to the normal options for using
    Effort, you can choose to use Effort to increase the duration of
    this ability; each level of Effort used in this way adds one
    minute to the doppelganger's existence. If you also have this
    ability from another source, you may use either ability, the
    doppelganger is 1 level higher, and it has 3 additional health.
  pt-BR: 'Uma cópia perfeita de você aparece dentro de uma distância imediata. Essa sósia é provavelmente uma versão sua de outra linha do tempo ou do passado. A sósia é uma PNJ de nível 5 com 15 pontos de saúde. Ela tem sua mente e memórias, e você a controla como se fosse você em outro corpo. Na prática, enquanto esta habilidade estiver ativa, você tem dois corpos. Se a sósia usar qualquer uma das suas habilidades que custam pontos, esses pontos vêm das suas Reservas (incluindo gastar Esforço). Controlar dois corpos ao mesmo tempo é difícil e distrativo; enquanto esta habilidade estiver ativa, todas as tarefas realizadas por você ou pela sósia são dificultadas. A sósia não tem equipamento além de roupas simples. Ela permanece por até um minuto, mas desaparece se morta ou se você usar uma ação para dispensá-la. Se a sósia for morta, você sofre 5 pontos de dano que ignoram Armadura, e perde sua próxima ação. Se você for morta enquanto a sósia estiver presente, você continua vivendo como a sósia (ela se torna sua personagem em vez de ser uma PNJ que desaparece). Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar a duração desta habilidade; cada nível de Esforço usado dessa forma adiciona um minuto à existência da sósia. Se você também tiver esta habilidade de outra fonte, pode usar qualquer uma delas, a sósia fica 1 nível acima, e tem 3 pontos adicionais de saúde.'
  # Note: source cost is printed as "6+ Intellect points" — the
  # schema's cost field can't represent an open-ended "+". Recorded as
  # the baseline 6 Intellect points here, flagged for schema review
  # (same approximation used for divine-intervention/return-to-the-
  # obelisk).
cost:
  pool: intellect
  amount: 6
action_type: action
sources:
  - type: focus
    id: travels-through-time
    tier: 5
