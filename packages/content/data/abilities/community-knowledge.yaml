id: community-knowledge
name:
  en: Community Knowledge
  pt-BR: Conhecimento da Comunidade
description:
  en: >-
    If you've invested yourself in a community and have spent at
    least a few months living there, you can learn things about it
    through a variety of methods. Sometimes contacts slip the
    information to you. Other times, you're able to draw conclusions
    simply by what you can see and hear. When you use this ability,
    you can ask the GM one question about the community and get a
    very short answer.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: shepherds-the-community
    tier: 1
  - type: focus
    id: steers-the-coven
    tier: 1
