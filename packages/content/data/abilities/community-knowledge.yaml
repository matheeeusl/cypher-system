id: community-knowledge
name:
  en: Community Knowledge
  pt-BR: Conhecimento da Comunidade
description:
  en: >-
    If you've invested yourself in a community and have spent at
    least a few months living there, you can learn things about it
    through a variety of methods. Sometimes contacts slip the
    information to you. Other times, you're able to draw conclusions
    simply by what you can see and hear. When you use this ability,
    you can ask the GM one question about the community and get a
    very short answer.
  pt-BR: 'Se você se dedicou a uma comunidade e passou pelo menos alguns meses morando lá, pode aprender coisas sobre ela através de diversos métodos. Às vezes contatos lhe passam a informação. Outras vezes, você consegue tirar conclusões simplesmente pelo que vê e ouve. Ao usar esta habilidade, você pode fazer uma pergunta ao Mestre sobre a comunidade e obter uma resposta muito breve.'
cost:
  pool: intellect
  amount: 2
action_type: action
sources:
  - type: focus
    id: shepherds-the-community
    tier: 1
  - type: focus
    id: steers-the-coven
    tier: 1
