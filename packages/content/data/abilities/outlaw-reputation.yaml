id: outlaw-reputation
name:
  en: Outlaw Reputation
  pt-BR: Reputação de Fora da Lei
description:
  en: >-
    People know of your notorious exploits, which have been told and
    retold so many times that they bear little resemblance to
    reality. But people fear your name when they recognize you (or
    you declare yourself). They become so afraid that all attacks
    made against you by affected targets within earshot are hindered
    until one or more of them successfully inflicts damage on you or
    one of your allies, at which time their fear abates.
  pt-BR: 'As pessoas conhecem seus feitos notórios, que foram contados e recontados tantas vezes que pouco se assemelham à realidade. Mas as pessoas temem seu nome quando a reconhecem (ou você se declara). Elas ficam tão amedrontadas que todos os ataques feitos contra você por alvos afetados dentro do alcance auditivo são dificultados até que um ou mais deles cause dano com sucesso em você ou em um de seus aliados, momento em que o medo se dissipa.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: feigns-no-fear
    tier: 3
  - type: focus
    id: is-wanted-by-the-law
    tier: 3
