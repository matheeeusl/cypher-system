id: inspire-aggression
name:
  en: Inspire Aggression
  pt-BR: Inspirar Agressão
description:
  en: >-
    Your words twist the mind of a character within short range who
    is able to understand you, unlocking their more primitive
    instincts. As a result, they gain an asset on their Might-based
    attack rolls for one minute.
  pt-BR: 'Suas palavras distorcem a mente de um personagem dentro de uma distância curta capaz de entendê-lo, destravando seus instintos mais primitivos. Como resultado, ele ganha um recurso em suas rolagens de ataque baseadas em Força por um minuto.'
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 1
  - type: focus
    id: practices-moon-magic
    tier: 2
