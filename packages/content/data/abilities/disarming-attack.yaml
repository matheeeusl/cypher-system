id: disarming-attack
name:
  en: Disarming Attack
  pt-BR: Ataque Desarmante
description:
  en: >-
    You attempt a Speed task to disarm a foe as part of your melee attack.
    If you succeed, your attack inflicts 3 additional points of
    damage and the target's weapon is knocked from their
    grip, landing up to 20 feet (6 m) away. If you fail, you
    still attempt your normal attack, but you don't inflict the
    extra damage or disarm the opponent if you hit.
  pt-BR: >-
    Você tenta uma tarefa de Velocidade para desarmar um oponente como parte de seu ataque corpo a corpo.
    Se obtiver sucesso, seu ataque causa 3 pontos de dano adicionais
     e a arma do alvo é arrancada de sua mão, caindo a uma distância de até 6 metros (20 pés).
     Se falhar, você ainda realiza seu ataque normal, mas não causa o dano extra nem desarma
     o oponente caso acerte.
cost:
  pool: speed
  amount: 5
action_type: action
sources:
  - type: focus
    id: wields-two-weapons-at-once
    tier: 6
