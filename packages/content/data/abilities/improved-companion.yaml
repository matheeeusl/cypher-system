id: improved-companion
name:
  en: Improved Companion
  pt-BR: Companheiro Aprimorado
description:
  en: Your companion (such as a controlled beast) or follower increases to level 4. As a level 4 creature, it has a target number of 12 and 12 health, and it inflicts 4 points of damage (though in most cases, instead of attacking, it provides an asset to your attacks). You can gain this ability once per tier. Each additional time you select it, it increases your companion or follower's level by 1.
  pt-BR: 'Seu companheiro (como uma fera controlada) ou seguidor aumenta para nível 4. Como uma criatura de nível 4, ela tem um número-alvo de 12 e 12 pontos de saúde, e causa 4 pontos de dano (embora, na maioria dos casos, em vez de atacar, ela forneça um recurso aos seus ataques). Você pode obter esta habilidade uma vez por grau. Cada vez adicional que a escolher, aumenta o nível do seu companheiro ou seguidor em 1.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: befriends-the-black-dog
    tier: 4
  - type: focus
    id: controls-beasts
    tier: 4
  - type: focus
    id: is-idolized-by-millions
    tier: 6
