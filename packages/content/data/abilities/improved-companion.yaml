id: improved-companion
name:
  en: Improved Companion
  pt-BR: Companheiro Aprimorado
description:
  en: Your companion (such as a controlled beast) or follower increases to level 4. As a level 4 creature, it has a target number of 12 and 12 health, and it inflicts 4 points of damage (though in most cases, instead of attacking, it provides an asset to your attacks). You can gain this ability once per tier. Each additional time you select it, it increases your companion or follower's level by 1.
  pt-BR: "Tradução em breve."
cost: null
