id: lost-in-the-chaos
name:
  en: Lost in the Chaos
  pt-BR: Perdido no Caos
description:
  en: >-
    When faced with several foes at once, you have developed tactics
    for using their numbers against them. When two or more foes
    attack you at once in melee, you play one off the other. Speed
    defense rolls or attack rolls (your choice) against them are
    eased.
  pt-BR: 'Ao enfrentar vários inimigos ao mesmo tempo, você desenvolveu táticas para usar o número deles contra eles mesmos. Quando dois ou mais inimigos o atacam ao mesmo tempo corpo a corpo, você os coloca uns contra os outros. Rolagens de defesa de Velocidade ou rolagens de ataque (à sua escolha) contra eles são facilitadas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: sailed-beneath-the-jolly-roger
    tier: 5
