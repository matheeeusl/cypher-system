id: time-loop
name:
  en: Time Loop
  pt-BR: Loop Temporal
description:
  en: >-
    You call yourself from a few moments in the future to help you in
    the present. On the round you use this ability, your future self
    appears anywhere you choose within immediate range and takes an
    action. On the second round, you and your future self both take
    actions, and your future self's action is eased. On the third
    round, you and your future self both disappear. On the fourth
    round, you catch up to your future self, reappear wherever your
    future self initially appeared in the first round, and can take
    your actions normally. Your future self shares your stats, so any
    damage that either of you takes applies to the same stat Pools.
    If your future self is killed, you and your future self disappear
    in the third round (as normal) and you reappear, dead, in the
    fourth round. Neither you nor your future self can use Time Loop
    again until you reappear as your future self in the fourth round.
  pt-BR: 'Você invoca a si mesma de alguns momentos no futuro para ajudá-la no presente. No round em que você usa esta habilidade, seu eu futuro aparece em qualquer lugar que escolher dentro de uma distância imediata e realiza uma ação. No segundo round, você e seu eu futuro realizam ações, e a ação do seu eu futuro é facilitada. No terceiro round, você e seu eu futuro desaparecem. No quarto round, você alcança seu eu futuro, reaparece onde ele apareceu inicialmente no primeiro round, e pode realizar suas ações normalmente. Seu eu futuro compartilha seus atributos, então qualquer dano que qualquer um dos dois sofra se aplica às mesmas Reservas de atributos. Se seu eu futuro for morto, você e seu eu futuro desaparecem no terceiro round (normalmente) e você reaparece, morta, no quarto round. Nem você nem seu eu futuro podem usar Loop Temporal novamente até você reaparecer como seu eu futuro no quarto round.'
  # Note: source adds a summary sidebar: "In effect, Time Loop lets
  # 'you' take an action on the round you use it, two actions on the
  # second round, and zero actions on the third round, and then you're
  # back to normal after that." — folded here as context.
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: focus
    id: travels-through-time
    tier: 3
