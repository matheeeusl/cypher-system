id: babel
name:
  en: Babel
  pt-BR: Babel
description:
  en: >-
    After hearing a language spoken for a few minutes, you can speak it
    and make yourself understood. If you continue to use the language
    to interact with native speakers, your skills improve rapidly, to
    the point where you might be mistaken for a native speaker after
    just a few hours of speaking the new language.
  pt-BR: 'Depois de ouvir um idioma sendo falado por alguns minutos, você consegue falá-lo e se fazer entender. Se continuar usando o idioma para interagir com falantes nativos, suas habilidades melhoram rapidamente, a ponto de você poder ser confundida com uma falante nativa após apenas algumas horas falando o novo idioma.'
cost: null
action_type: enabler
sources:
