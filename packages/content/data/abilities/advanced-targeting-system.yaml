id: advanced-targeting-system
name:
  en: Advanced Targeting System
  pt-BR: Sistema de Mira Avançado
description:
  en: >-
    You gain a limited AI that assists you in eliminating a chosen
    foe. Choose one target you can see within very long range. For
    the next ten minutes, you gain an asset to all tasks (including
    attacks and defenses) involving that target. You can only use the
    advanced targeting system against one creature at a time.
  pt-BR: >-
    Você obtém uma IA limitada que o auxilia a eliminar um inimigo escolhido.
    Escolha um alvo que você possa ver a um alcance muito longo.
    Pelos próximos dez minutos, você recebe um bônus em todas as tarefas
    (incluindo ataques e defesas) que envolvam esse alvo. Você só pode usar
    o sistema de mira avançada contra uma criatura por vez.
cost:
  pool: intellect
  amount: 5
action_type: enabler
sources:
  - type: focus
    id: packs-chromed-heat
    tier: 6
    cyberware: true
