id: shepherds-fury
name:
  en: Shepherd's Fury
  pt-BR: Fúria da Pastora
description:
  en: >-
    You inflict 3 additional points of damage when engaging in combat
    that directly relates to advancing the needs of a community you
    are associated with. (You and the GM can decide whether a
    particular situation warrants the additional damage.)
  pt-BR: 'Você causa 3 pontos adicionais de dano ao entrar em combate diretamente relacionado a atender às necessidades de uma comunidade à qual está associada. (Você e o Mestre podem decidir se uma situação específica justifica o dano adicional.)'
cost: null
action_type: enabler
sources:
  - type: focus
    id: shepherds-the-community
    tier: 3
  - type: focus
    id: steers-the-coven
    tier: 2
