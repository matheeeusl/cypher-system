id: still-as-a-statue
name:
  en: Still As a Statue
  pt-BR: Imóvel Como uma Estátua
description:
  en: Drawing upon the power of your Golem Body, you freeze in place, burying your essence deep in your stone core. During this time, you lose all mobility as well as the ability to take physical actions. You cannot sense what's happening around you, and no time seems to pass for you. While Still As a Statue, you gain +10 to Armor against damage of all sorts. Under normal circumstances, you automatically rouse to normal wakefulness and mobility a day later. If an ally you trust shakes you hard enough (with a minimum cost of 2 Might points), you rouse earlier.
  pt-BR: Recorrendo ao poder de seu Corpo de Golem, você congela no lugar, enterrando sua essência no fundo de seu núcleo de pedra. Durante esse tempo, você perde toda a mobilidade, assim como a capacidade de realizar ações físicas. Você não consegue perceber o que acontece ao seu redor, e nenhum tempo parece passar para você. Enquanto estiver Imóvel Como uma Estátua, você ganha +10 na Armadura contra danos de todos os tipos. Em circunstâncias normais, você desperta automaticamente para a vigília e a mobilidade normais um dia depois. Se um aliado de confiança sacudir você com força suficiente (a um custo mínimo de 2 pontos de Força), você desperta mais cedo.
cost:
  pool: might
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: abides-in-stone
    tier: 5
