id: reshape-cantrip
name:
  en: Reshape Cantrip
  pt-BR: Truque de Remodelar
description:
  en: You change the shape of a metal, glass, or stone object you touch into a different
    shape. For example, you could turn a coin into a ring, a cup into a plate, or a piece
    of glass into something resembling a gemstone. This normally lasts about a minute, but
    the object tends to revert early if anyone else touches or examines it too closely.
  pt-BR: Você muda a forma de um objeto de metal, vidro ou pedra que tocar para outra forma.
    Por exemplo, você poderia transformar uma moeda em um anel, uma xícara em um prato ou
    um pedaço de vidro em algo parecido com uma pedra preciosa. Isso normalmente dura
    cerca de um minuto, mas o objeto tende a reverter antes se outra pessoa o tocar ou
    examinar de perto demais.
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: ability
    id: cantrips
    tier: 1
