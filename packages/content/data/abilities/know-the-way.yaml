id: know-the-way
name:
  en: Know the Way
  pt-BR: Conhecer o Caminho
description:
  en: >-
    You are familiar with before-times buildings and other structures,
    which extends to ruins of the same. You are trained in tasks
    related to getting around inside those buildings quickly, finding
    alternate routes, finding places to hide, and other tasks
    associated with gaining a benefit by being able to picture a
    likely floor plan of any given building.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
