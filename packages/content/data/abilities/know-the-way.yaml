id: know-the-way
name:
  en: Know the Way
  pt-BR: Conhecer o Caminho
description:
  en: >-
    You are familiar with before-times buildings and other structures,
    which extends to ruins of the same. You are trained in tasks
    related to getting around inside those buildings quickly, finding
    alternate routes, finding places to hide, and other tasks
    associated with gaining a benefit by being able to picture a
    likely floor plan of any given building.
  pt-BR: 'Você é familiarizada com edifícios de antes e outras estruturas, o que se estende a ruínas das mesmas. Você é treinada em tarefas relacionadas a se locomover rapidamente dentro desses edifícios, encontrar rotas alternativas, encontrar lugares para se esconder, e outras tarefas associadas a obter um benefício por conseguir visualizar uma planta provável de qualquer edifício.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: remembers-the-past
    tier: 2
