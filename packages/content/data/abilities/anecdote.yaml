id: anecdote
name:
  en: Anecdote
  pt-BR: Anedota
description:
  en: >-
    You can lift the spirits of a group of creatures and help them bond
    together by entertaining them with an uplifting or pointed
    anecdote. For the next hour, those who pay attention to your story
    are trained in a task you choose that's related to the anecdote, as
    long as it's not an attack or defense task.
  pt-BR: 'Você pode levantar o ânimo de um grupo de criaturas e ajudá-las a se unir, entretendo-as com uma anedota inspiradora ou perspicaz. Pela próxima hora, aqueles que prestarem atenção à sua história ficam treinados em uma tarefa à sua escolha relacionada à anedota, desde que não seja uma tarefa de ataque ou defesa.'
  # Note: source tag is "Action to initiate, one minute to complete."
cost:
  pool: intellect
  amount: 2
action_type: action_to_initiate
sources:
  - type: type
    id: speaker
    tier: 1
