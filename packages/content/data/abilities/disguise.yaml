id: disguise
name:
  en: Disguise
  pt-BR: Disfarce
description:
  en: >-
    You are trained in disguise. You can alter your posture, voice,
    mannerisms, and hair to look like someone else for as long as you
    keep up the disguise. However, it is extremely difficult to adopt
    the appearance of a specific individual without a disguise kit at
    your disposal.
  pt-BR: 'Você é treinada em disfarce. Pode alterar sua postura, voz, maneirismos e cabelo para parecer outra pessoa enquanto mantiver o disfarce. Porém, é extremamente difícil adotar a aparência de um indivíduo específico sem um kit de disfarce à disposição.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: operates-undercover
    tier: 2
