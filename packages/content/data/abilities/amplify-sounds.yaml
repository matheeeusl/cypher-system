id: amplify-sounds
name:
  en: Amplify Sounds
  pt-BR: Amplificar Sons
description:
  en: >-
    For one minute, you can amplify distant or small sounds so that
    you can hear them clearly, even if it's a conversation or the
    sound of a small animal moving through an underground burrow up
    to a very long distance away. You can attempt to perceive the
    sound even if interceding barriers block it or the sound is very
    slight, though this requires a few additional rounds of
    concentration. To discriminate the sound you wish in a noisy
    environment might also require a few additional rounds of
    concentration as you audibly explore the surrounding soundscape.
    Given enough time, you could pinpoint every conversation, every
    breathing creature, and every device creating noise within range.
  pt-BR: 'Por um minuto, você pode amplificar sons distantes ou pequenos para ouvi-los com clareza, mesmo que seja uma conversa ou o som de um pequeno animal se movendo por uma toca subterrânea a até uma distância muito longa. Você pode tentar perceber o som mesmo que barreiras intervenientes o bloqueiem ou que ele seja muito fraco, embora isso exija alguns rounds adicionais de concentração. Discriminar o som desejado em um ambiente barulhento também pode exigir alguns rounds adicionais de concentração enquanto você explora auditivamente a paisagem sonora ao redor. Com tempo suficiente, você poderia identificar exatamente cada conversa, cada criatura respirando e cada dispositivo produzindo ruído dentro do alcance.'
  # Note: source tag is "Action to initiate, up to several rounds to
  # complete, depending on the difficulty of the task." — the
  # duration/timing clause is not modeled by action_type.
cost:
  pool: might
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: thunders
    tier: 5
