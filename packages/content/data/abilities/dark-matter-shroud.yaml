id: dark-matter-shroud
name:
  en: Dark Matter Shroud
  pt-BR: Manto de Matéria Escura
description:
  en: Ribbons of dark matter condense and swirl about you for up to one minute. This shroud eases your Speed defense tasks, inflicts 2 points of damage to anyone who tries to touch you or strike you with a melee attack, and gives you +1 Armor.
  pt-BR: 'Fitas de matéria escura se condensam e giram ao seu redor por até um minuto. Este manto facilita suas tarefas de defesa de Velocidade, causa 2 pontos de dano a qualquer um que tentar tocá-lo ou atingi-lo com um ataque corpo a corpo, e concede +1 de Armadura.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: befriends-the-black-dog
    tier: 3
  - type: focus
    id: dances-with-dark-matter
    tier: 3
