id: hard-to-see
name:
  en: Hard to See
  pt-BR: Difícil de Ver
description:
  en: When you move, you are a blur. It is impossible to make out your identity as you run past, and in a round where you do nothing but move, stealth tasks and Speed defense tasks are eased.
  pt-BR: "Tradução em breve."
