id: intelligent-interface
name:
  en: Intelligent Interface
  pt-BR: Interface Inteligente
description:
  en: >-
    You can speak telepathically with any intelligent machine within
    long range. Further, you are trained in all interactions with
    intelligent machines. Such machines and robots that normally
    would never communicate with a human might talk to you.
  pt-BR: 'Você pode falar telepaticamente com qualquer máquina inteligente dentro de uma distância longa. Além disso, é treinada em todas as interações com máquinas inteligentes. Máquinas e robôs que normalmente nunca se comunicariam com um humano podem falar com você.'
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: talks-to-machines
    tier: 3
