id: intelligent-interface
name:
  en: Intelligent Interface
  pt-BR: Interface Inteligente
description:
  en: >-
    You can speak telepathically with any intelligent machine within
    long range. Further, you are trained in all interactions with
    intelligent machines. Such machines and robots that normally
    would never communicate with a human might talk to you.
  pt-BR: "Tradução em breve."
cost:
  pool: intellect
  amount: 3
action_type: enabler
sources:
  - type: focus
    id: talks-to-machines
    tier: 3
