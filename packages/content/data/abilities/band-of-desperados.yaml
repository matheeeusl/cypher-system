id: band-of-desperados
name:
  en: Band of Desperados
  pt-BR: Bando de Desesperados
description:
  en: >-
    Your reputation draws a band of six level 2 desperado NPC
    followers who are completely devoted to you. You and the GM must
    work out the details of these followers. If a follower dies, you
    gain a new one after at least two weeks and proper recruitment.
  pt-BR: 'Sua reputação atrai um bando de seis seguidores PNJ desesperados de nível 2, completamente devotados a você. Você e o Mestre devem definir os detalhes desses seguidores. Se um seguidor morrer, você ganha um novo após pelo menos duas semanas e um recrutamento adequado.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: feigns-no-fear
    tier: 5
  - type: focus
    id: is-wanted-by-the-law
    tier: 5
