id: raider-follower
name:
  en: Raider Follower
  pt-BR: Seguidor Saqueador
description:
  en: >-
    You gain a level 3 follower (initiative, stealth, and defense as
    level 4). The follower does as you say and, generally speaking,
    isn't someone who makes the other PCs in your group feel
    uncomfortable because of their presence.
  pt-BR: 'Você ganha um seguidor de nível 3 (iniciativa, furtividade e defesa como nível 4). O seguidor faz o que você diz e, em geral, não é alguém que deixa os outros personagens do seu grupo desconfortáveis com sua presença.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: raids
    tier: 3
