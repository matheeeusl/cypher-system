id: physical-skills
name:
  en: Physical Skills
  pt-BR: Perícias Físicas
description:
  en: >-
    You are trained in two skills in which you are not already
    trained. Choose two of the following: balancing, climbing, jumping,
    running, or swimming. You can select this ability multiple times.
    Each time you select it, you must choose two different skills.
  pt-BR: 'Você fica treinada em duas perícias nas quais ainda não é treinada. Escolha duas das seguintes: equilíbrio, escalada, salto, corrida ou natação. Você pode escolher esta habilidade múltiplas vezes. Cada vez que a escolher, deve escolher duas perícias diferentes.'
cost: null
