id: gain-rattler-companion
name:
  en: Gain Rattler Companion
  pt-BR: Ganhar Companheira Cascavel
description:
  en: >-
    You gain a supernatural rattlesnake—a dust diamondback—as a
    constant companion. It is over 10 feet (3 m) long and follows
    your psychic commands. You'll probably make rolls for it in
    combat or when it takes actions (or it can ease your attacks or
    your defenses in combat). The companion acts on your turn. If
    your companion dies, you can hunt in the badlands for a few days
    to find a new one.
  pt-BR: "Tradução em breve."
  # Note: source includes brief creature stats for the dust
  # diamondback (level 3, Speed defense as level 4; health 12; bite
  # deals 3 damage plus 1 Speed damage [ignores Armor] on a failed
  # Might defense roll) — no schema field for inline creature stat
  # blocks, dropped as with other summoned-companion abilities.
cost: null
action_type: enabler
sources:
  - type: focus
    id: strikes-like-a-rattler
    tier: 3
