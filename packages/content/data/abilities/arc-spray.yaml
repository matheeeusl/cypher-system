id: arc-spray
name:
  en: Arc Spray
  pt-BR: Rajada em Arco
description:
  en: >-
    If a weapon has the ability to fire rapid shots without reloading
    (usually called a rapid-fire weapon, such as a crank crossbow),
    you can fire your weapon at up to three targets (all next to one
    another) at once. Make a separate attack roll against each
    target. Each attack is hindered.
  pt-BR: "Tradução em breve."
cost:
  pool: speed
  amount: 3
action_type: action
sources:
  - type: focus
    id: is-licensed-to-carry
    tier: 5
