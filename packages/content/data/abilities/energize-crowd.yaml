id: energize-crowd
name:
  en: Energize Crowd
  pt-BR: Energizar Multidão
description:
  en: You extend your Absorb Kinetic Energy ability to up to thirty creatures within short range so that they also can absorb energy from physical attacks and impacts for one hour. If you have Absorb Pure Energy or Improved Absorb Kinetic Energy, these creatures can use those abilities as well. The creatures, however, cannot release excess energy as a blast.
  pt-BR: 'Tradução em breve.'
cost:
  pool: might
  amount: 9
action_type: action_to_initiate
sources:
  - type: focus
    id: absorbs-energy
    tier: 6
