id: fruitfully-pass-the-time
name:
  en: Fruitfully Pass the Time
  pt-BR: Passar o Tempo Proveitosamente
description:
  en: >-
    You are trained in one performance skill, such as singing; playing
    a fiddle, harmonica, or other instrument; or something else that
    others would enjoy watching or hearing you do. When you perform
    with the skill gained through this ability for one minute and you
    succeed on a difficulty 3 performance roll, you and all allies
    within short range who can hear and see you immediately gain a
    one-action recovery roll. You can't use this on someone again
    until you use a one-hour or ten-hour recovery roll.
  pt-BR: "Tradução em breve."
  # Note: source tag is "Action to initiate, one minute to complete." —
  # a further non-standard action_type tag, approximated as
  # `action_to_initiate`. Flagged for schema review (see schema gap
  # item 3).
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
  - type: focus
    id: prepped-for-the-end
    tier: 3
