id: wild-insight
name:
  en: Wild Insight
  pt-BR: Percepção Selvagem
description:
  en: >-
    You gain a momentary perfect understanding of the flow of magic
    around you at this moment. When preparing your magic, choose one
    specific subtle cypher and make a magical lore skill roll against
    level 6. If you succeed, you gain that subtle cypher (the
    cypher's level is 6); if you fail, you get a random subtle
    cypher. If you aren't sure what specific subtle cypher you want,
    you can ask for a broad category such as "healing," "movement,"
    or "skill"; this eases the magical lore task, and if you succeed,
    the GM chooses a random cypher that fits that category. You can't
    use this ability again until after you've taken a ten-hour
    recovery action.
  pt-BR: 'Você ganha uma compreensão perfeita momentânea do fluxo de magia ao seu redor neste momento. Ao preparar sua magia, escolha uma cifra sutil específica e faça uma rolagem de perícia de conhecimento mágico contra nível 6. Se tiver sucesso, obtém essa cifra sutil (o nível da cifra é 6); se falhar, obtém uma cifra sutil aleatória. Se não tiver certeza de qual cifra sutil específica deseja, pode pedir uma categoria ampla, como "cura", "movimento" ou "perícia"; isso facilita a tarefa de conhecimento mágico, e se tiver sucesso, o Mestre escolhe uma cifra aleatória que se encaixe nessa categoria. Você não pode usar esta habilidade novamente até depois de realizar uma ação de recuperação de dez horas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: uses-wild-magic
    tier: 6
