id: relocate
name:
  en: Relocate
  pt-BR: Realocar
description:
  en: Choose one creature or object within immediate range. You instantly transport it to a
    new position within long range that you can see. The new position can be any direction
    from you, but it cannot be inside a solid object.
  pt-BR: Escolha uma criatura ou objeto a distância imediata. Você o transporta
    instantaneamente para uma nova posição a distância longa que consiga ver. A nova
    posição pode ficar em qualquer direção a partir de você, mas não pode ficar dentro de
    um objeto sólido.
cost:
  pool: intellect
  amount: 7
action_type: action
sources:
  - type: flavor
    id: magic
    tier: 6
