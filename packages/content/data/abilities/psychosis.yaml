id: psychosis
name:
  en: Psychosis
  pt-BR: Psicose
description:
  en: Your words inflict a destructive psychosis in the mind of a target within long range that can understand you, dealing 6 points of Intellect damage (ignores Armor) per round. The psychosis can be dispersed if a target uses an action doing nothing but calming and centering itself.
  pt-BR: 'Tradução em breve.'
cost:
  pool: intellect
  amount: 4
action_type: action_to_initiate
sources:
