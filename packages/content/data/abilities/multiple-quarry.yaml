id: multiple-quarry
name:
  en: Multiple Quarry
  pt-BR: Múltiplas Presas
description:
  en: This ability functions like the Quarry ability except that you can select up to three creatures as quarry. You must be able to see all three creatures when you initiate this ability. If you have Hunter's Drive, it applies to all three creatures.
  pt-BR: Esta habilidade funciona como a habilidade Presa, exceto que você pode selecionar até três criaturas como presas. Você precisa conseguir ver as três criaturas ao ativar esta habilidade. Se você tiver Impulso do Caçador, ele se aplica às três criaturas.
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: focus
    id: hunts
    tier: 6
