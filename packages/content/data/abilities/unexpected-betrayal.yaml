id: unexpected-betrayal
name:
  en: Unexpected Betrayal
  pt-BR: Traição Inesperada
description:
  en: >-
    Within a round or two of successfully using Enthrall, Fast Talk, or
    a similar ability on a target within short range, the first attack
    you make on that target is eased by two steps. Once you use
    Unexpected Betrayal on a target, using your abilities or attempting
    simple persuasion on that target is permanently hindered by two
    steps.
  pt-BR: 'Tradução em breve.'
cost: null
action_type: enabler
sources:
  - type: type
    id: speaker
    tier: 2
