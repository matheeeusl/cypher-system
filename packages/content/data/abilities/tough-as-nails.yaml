id: tough-as-nails
name:
  en: Tough As Nails
  pt-BR: Duro na Queda
description:
  en: >-
    When you are impaired or debilitated on the damage track,
    Might-based tasks and defense rolls you attempt are eased. If you
    also have Ignore the Pain, make a difficulty 1 Might defense roll
    when you reach 0 points in all three of your Pools to immediately
    regain 1 Might point and avoid dying. Each time you attempt to save
    yourself with this ability before your next ten-hour recovery roll,
    the task is hindered.
  pt-BR: 'Quando você está enfraquecida ou debilitada no marcador de dano, as tarefas baseadas em Força e rolagens de defesa que tentar são facilitadas. Se você também tiver Ignorar a Dor, faça uma rolagem de defesa de Força de dificuldade 1 ao chegar a 0 pontos em todas as suas três Reservas para recuperar imediatamente 1 ponto de Força e evitar a morte. Cada vez que você tentar se salvar com esta habilidade antes da sua próxima rolagem de recuperação de dez horas, a tarefa é dificultada.'
cost: null
action_type: enabler
sources:
  - type: type
    id: explorer
    tier: 4
  - type: type
    id: warrior
    tier: 4
