id: continuous-transfer
name:
  en: Continuous Transfer
  pt-BR: Transferência Contínua
description:
  en: >-
    When you use either Drain Creature or Tap Currents to drain
    energy, you can transfer it to another creature within short
    range, restoring points to their Might or Speed Pools (or health
    for an NPC). This occurs seamlessly, as part of the same action.
  pt-BR: 'Quando você usa Drenar Criatura ou Captar Correntes para drenar energia, pode transferi-la para outra criatura dentro de uma distância curta, restaurando pontos à Reserva de Força ou Velocidade dela (ou saúde para um PNJ). Isso ocorre de forma contínua, como parte da mesma ação.'
  # Note: source Tier 6 heading reads "Choose either Explosive Release,
  # or both Continuous Transfer and Drain at a Distance" — a choice
  # between one path (Explosive Release alone) and a bundled pair
  # (Continuous Transfer + Drain at a Distance together), modeled on
  # the Focus file as a bundled-pair `choice` option.
cost: null
action_type: enabler
sources:
  - type: focus
    id: transmits-energy
    tier: 6
