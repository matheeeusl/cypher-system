id: inspiring-ease
name:
  en: Inspiring Ease
  pt-BR: Facilidade Inspiradora
description:
  en: Through stories, songs, art, or other forms of entertainment, you inspire your friends. After spending 24 hours with you, once per day each of your friends can ease a task. This benefit is ongoing while you remain in the friend's company. It ends if you leave, but it resumes if you return to the friend's company within 24 hours. If you leave the friend's company for more than 24 hours, you must spend another 24 hours together to reactivate the benefit.
  pt-BR: Por meio de histórias, canções, arte ou outras formas de entretenimento, você inspira seus amigos. Depois de passar 24 horas com você, uma vez por dia cada um de seus amigos pode facilitar uma tarefa. Esse benefício permanece enquanto você continuar na companhia do amigo. Ele termina se você for embora, mas retorna se você voltar à companhia do amigo dentro de 24 horas. Se você ficar longe da companhia do amigo por mais de 24 horas, deve passar outras 24 horas juntos para reativar o benefício.
cost: null
action_type: enabler
sources:
  - type: focus
    id: entertains
    tier: 2
