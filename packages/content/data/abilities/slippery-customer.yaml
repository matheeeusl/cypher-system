id: slippery-customer
name:
  en: Slippery Customer
  pt-BR: Cliente Escorregadio
description:
  en: >-
    When you apply Effort to tasks involving escaping from bonds,
    fitting in tight spaces, and other contortionist tasks, you get a
    free level of Effort on the task. Thanks to your experience, you
    are also trained in Speed defense tasks while wearing light armor
    or no armor.
  pt-BR: 'Quando você aplica Esforço a tarefas envolvendo escapar de amarras, se espremer em espaços apertados e outras tarefas de contorcionismo, ganha um nível gratuito de Esforço na tarefa. Graças à sua experiência, você também é treinada em tarefas de defesa de Velocidade enquanto usa armadura leve ou nenhuma armadura.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: explores-dark-places
    tier: 3
