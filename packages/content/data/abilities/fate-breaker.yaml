id: fate-breaker
name:
  en: Fate Breaker
  pt-BR: Quebrador de Destino
description:
  en: >-
    Something beyond your ken takes an interest in you. If you fail
    on a task (including an attack or a defense), you can change the
    die result to a natural 20. (That still might not be enough to
    succeed if the difficulty is higher than 6.) This ability doesn't
    work if you roll a natural 1 for an attempted task, unless you
    reroll using Consequences of Luck and obtain a result that isn't
    in the failure range. Once you use this ability, it is not
    available again until after you make a ten-hour recovery roll.
  pt-BR: 'Algo além do seu entendimento se interessa por você. Se você falhar em uma tarefa (incluindo um ataque ou uma defesa), pode mudar o resultado do dado para um 20 natural. (Isso ainda pode não ser suficiente para ter sucesso se a dificuldade for maior que 6.) Esta habilidade não funciona se você rolar um 1 natural para uma tarefa tentada, a menos que role novamente usando Consequências da Sorte e obtenha um resultado que não esteja na faixa de falha. Uma vez que você usa esta habilidade, ela não fica disponível novamente até que você faça uma rolagem de recuperação de dez horas.'
cost: null
action_type: enabler
sources:
  - type: focus
    id: gambles-it-all-away
    tier: 6
