id: crushing-blow
name:
  en: Crushing Blow
  pt-BR: Golpe Esmagador
description:
  en: >-
    When you use a bashing or bladed weapon in both hands and apply
    Effort on the attack, you get a free level of Effort on the damage.
    (If fighting unarmed, this attack is made with both fists or both
    feet together.)
  pt-BR: 'Quando você usa uma arma contundente ou de lâmina com as duas mãos e aplica Esforço no ataque, ganha um nível gratuito de Esforço no dano. (Se estiver lutando desarmada, este ataque é feito com os dois punhos ou os dois pés juntos.)'
cost:
  pool: might
  amount: 2
action_type: action
sources:
  - type: type
    id: warrior
    tier: 2
