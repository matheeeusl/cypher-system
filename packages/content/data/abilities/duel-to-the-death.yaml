id: duel-to-the-death
name:
  en: Duel to the Death
  pt-BR: Duelo até a Morte
description:
  en: >-
    Choose a target (a single individual creature that you can see).
    You are trained in all tasks involving fighting that creature.
    When you successfully attack that target, you inflict +5 damage,
    or +7 damage if the creature is engaging someone else instead of
    you. You can duel only one creature at a time. A duel lasts up to
    one minute, or until you break it off.
  pt-BR: 'Escolha um alvo (uma única criatura que você possa ver). Você é treinada em todas as tarefas envolvendo lutar contra essa criatura. Quando você atacar esse alvo com sucesso, causa +5 de dano, ou +7 de dano se a criatura estiver enfrentando outra pessoa em vez de você. Você só pode duelar com uma criatura por vez. Um duelo dura até um minuto, ou até você encerrá-lo.'
cost:
  pool: speed
  amount: 5
action_type: action_to_initiate
sources:
  - type: focus
    id: made-a-deal-with-death
    tier: 6
  - type: focus
    id: sailed-beneath-the-jolly-roger
    tier: 6
