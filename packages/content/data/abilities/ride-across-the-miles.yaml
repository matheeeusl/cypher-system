id: ride-across-the-miles
name:
  en: Ride Across the Miles
  pt-BR: Cavalgar por Quilômetros
description:
  en: >-
    You can ride your mount to an open location on the planet that
    you're familiar with almost instantaneously. If you apply a level
    of Effort, you can attempt to penetrate covered locations that
    you're aware of as long as a route exists from the open air to the
    area you want to reach.
  pt-BR: 'Você pode cavalgar sua montaria até um local aberto no planeta com o qual está familiarizada quase instantaneamente. Se aplicar um nível de Esforço, pode tentar penetrar locais cobertos dos quais tenha conhecimento, desde que exista uma rota do ar livre até a área que deseja alcançar.'
  # Note: source cost is printed as "6+ Speed points" — the schema's
  # cost field can't represent an open-ended "+". Recorded as the
  # baseline 6 Speed points here, flagged for schema review (same
  # approximation used for divine-intervention/return-to-the-obelisk).
cost:
  pool: speed
  amount: 6
action_type: action
sources:
  - type: focus
    id: rides-like-the-wind
    tier: 6
