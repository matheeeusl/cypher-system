id: minor-wish
name:
  en: Minor Wish
  pt-BR: Desejo Menor
description:
  en: >-
    At your request, the magic ally from your Bound Magic Creature
    ability can use its action to cast a minor spell on you.
    Afterward, it must retreat to its bound object to rest for one
    hour. The effects it can produce include the following:

    - Golden Anger. A golden light touches your eyes. For the next
    several minutes, if you attack a target, you inflict 2 additional
    points of damage.

    - Golden Ward. You gain +1 to Armor for one hour from a
    translucent sheen of golden light.

    - Light of Truth. Whenever you attempt to discern falsehood
    during the next hour, the task is eased by two steps.

    - Touch of Grace. With the magic ally's touch, you add 3 points
    to any stat Pool. If you are not damaged, you add the points to
    your chosen Pool's maximum. They remain until you spend them, you
    lose them to damage, or an hour passes.
  pt-BR: >-
    A seu pedido, a aliada mágica da sua habilidade Criatura Mágica
    Vinculada pode usar sua ação para conjurar um feitiço menor em
    você. Depois disso, ela deve se retirar para seu objeto vinculado
    para descansar por uma hora. Os efeitos que ela pode produzir
    incluem os seguintes:

    - Ira Dourada. Uma luz dourada toca seus olhos. Pelos próximos
    vários minutos, se você atacar um alvo, causa 2 pontos adicionais
    de dano.

    - Guarda Dourada. Você ganha +1 de Armadura por uma hora, vinda de
    um brilho translúcido de luz dourada.

    - Luz da Verdade. Sempre que você tentar discernir uma falsidade
    durante a próxima hora, a tarefa é facilitada em dois níveis.

    - Toque da Graça. Com o toque da aliada mágica, você adiciona 3
    pontos a qualquer Reserva de atributo. Se não estiver ferida,
    adiciona os pontos ao máximo da Reserva escolhida. Eles permanecem
    até você gastá-los, perdê-los por dano, ou até passar uma hora.
  # Note: this ability is a menu of 4 sub-effects the magic ally can
  # produce, all sharing the same action_to_initiate framing (unlike
  # drone-upgrade/moderate-wish, no per-sub-option action_type variance
  # here).
cost: null
action_type: action_to_initiate
sources:
  - type: focus
    id: keeps-a-magic-ally
    tier: 3
