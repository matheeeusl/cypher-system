id: group-friendship
name:
  en: Group Friendship
  pt-BR: Amizade Grupal
description:
  en: >-
    You convince a sentient creature to regard you (and up to ten
    creatures that you designate within immediate distance of you)
    positively, as they would a potential friend.
  pt-BR: 'Você convence uma criatura senciente a olhá-lo (e até dez criaturas que você designar dentro de uma distância imediata de você) de forma positiva, como olhariam para um amigo em potencial.'
cost:
  pool: intellect
  amount: 4
action_type: action
sources:
  - type: type
    id: explorer
    tier: 5
  - type: flavor
    id: cozy-magic
    tier: 5
