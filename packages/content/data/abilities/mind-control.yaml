id: mind-control
name:
  en: Mind Control
  pt-BR: Controle Mental
description:
  en: You control the actions of another creature you touch. This effect lasts for one minute. The target must be level 2 or lower. Once you have established control, you maintain mental contact with the target and sense what it senses. You can allow it to act freely or override its control on a case-by-case basis. In addition to the normal options for using Effort, you can choose to use Effort to increase the maximum level of the target or increase the duration by one minute. Thus, to control the mind of a level 5 target (three levels above the normal limit) or control a target for four minutes (three minutes above the normal duration), you must apply three levels of Effort. When the duration ends, the creature doesn't remember being controlled or anything it did while under your command.
  pt-BR: Você controla as ações de outra criatura que tocar. Este efeito dura um minuto. O alvo deve ser de nível 2 ou menor. Uma vez estabelecido o controle, você mantém contato mental com o alvo e percebe o que ele percebe. Você pode deixá-lo agir livremente ou anular seu controle caso a caso. Além das opções normais de uso de Esforço, você pode optar por usar Esforço para aumentar o nível máximo do alvo ou estender a duração em um minuto. Assim, para controlar a mente de um alvo de nível 5 (três níveis acima do limite normal) ou controlar um alvo por quatro minutos (três minutos além da duração normal), você deve aplicar três níveis de Esforço. Quando a duração termina, a criatura não se lembra de ter sido controlada nem de nada que fez sob seu comando.
cost:
  pool: intellect
  amount: 6
action_type: action_to_initiate
sources:
  - type: type
    id: adept
    tier: 4
  - type: focus
    id: commands-mental-powers
    tier: 6
