id: thunder-beam
name:
  en: Thunder Beam
  pt-BR: Feixe de Trovão
description:
  en: >-
    You direct a beam of focused sound at a target within long range,
    inflicting 2 points of damage and inducing a resonant destructive
    wave in their body. Each round after this initial attack, you can
    make another roll for the destructive wave to inflict an
    additional 1 point of damage to the target. If you fail this
    roll, the destructive wave ends. Unlike the initial attack, the
    destructive wave ignores Armor. Alternatively, you can set up a
    destructive resonance in a physical melee weapon for one minute or
    until you let go of it. All attacks made with the target weapon
    inflict 1 additional point of damage.
  pt-BR: 'Você direciona um feixe de som concentrado a um alvo dentro de uma distância longa, causando 2 pontos de dano e induzindo uma onda destrutiva ressonante no corpo dele. A cada round após este ataque inicial, você pode fazer outra rolagem para a onda destrutiva causar 1 ponto adicional de dano ao alvo. Se você falhar nessa rolagem, a onda destrutiva termina. Diferente do ataque inicial, a onda destrutiva ignora Armadura. Alternativamente, você pode estabelecer uma ressonância destrutiva em uma arma corpo a corpo física por um minuto ou até soltá-la. Todos os ataques feitos com a arma-alvo causam 1 ponto adicional de dano.'
cost:
  pool: might
  amount: 2
action_type: action_to_initiate
sources:
  - type: focus
    id: thunders
    tier: 1
