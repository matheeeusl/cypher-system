id: improved-success
name:
  en: Improved Success
  pt-BR: Sucesso Aprimorado
description:
  en: >-
    When you roll a 17 or higher on an attack roll that deals damage,
    you deal 1 additional point of damage. For instance, if you roll a
    natural 18, which normally deals 2 extra points of damage, you
    instead deal 3 extra points. If you roll a natural 20 and choose to
    deal damage instead of achieve a special major effect, you deal 5
    extra points of damage.
  pt-BR: 'Quando você rola 17 ou mais em uma rolagem de ataque que causa dano, causa 1 ponto adicional de dano. Por exemplo, se rolar um 18 natural, que normalmente causa 2 pontos extras de dano, você causa 3 pontos extras em vez disso. Se rolar um 20 natural e optar por causar dano em vez de obter um efeito maior especial, você causa 5 pontos extras de dano.'
cost: null
action_type: enabler
sources:
  - type: type
    id: warrior
    tier: 5
