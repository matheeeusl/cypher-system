id: improved-success
name:
  en: Improved Success
  pt-BR: Sucesso Aprimorado
description:
  en: >-
    When you roll a 17 or higher on an attack roll that deals damage,
    you deal 1 additional point of damage. For instance, if you roll a
    natural 18, which normally deals 2 extra points of damage, you
    instead deal 3 extra points. If you roll a natural 20 and choose to
    deal damage instead of achieve a special major effect, you deal 5
    extra points of damage.
  pt-BR: "Tradução em breve."
cost: null
action_type: enabler
sources:
  - type: type
    id: warrior
    tier: 5
