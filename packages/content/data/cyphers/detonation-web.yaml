id: detonation-web
name: { en: 'Detonation (web)', 'pt-BR': 'Detonação (teia)' }
category: manifest
page_ref: 'Cypher System Rulebook, page 387'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that explodes in an immediate radius and creates sticky strands of goo.
    PCs caught in the area must use a Might-based action to get out, with the difficulty determined by the cypher level.
    NPCs break free if their level is higher than the cypher level.
    (Rather than strands of sticky goo, some web detonations fill the area with a mass of quick-hardening foam that has the same result.)
  pt-BR: >-
    Projeta um pequeno explosivo físico a até uma distância longa, que
    explode em um raio imediato e cria fios pegajosos de gosma. PJs
    presos na área devem usar uma ação baseada em Força para se libertar,
    com a dificuldade determinada pelo nível da cifra. PNJs se libertam
    se o nível deles for superior ao nível da cifra. (Em vez de fios de
    gosma pegajosa, algumas detonações de teia preenchem a área com uma
    massa de espuma de endurecimento rápido que produz o mesmo
    resultado.)
effect_table: null
