id: ray-emitter-mind-disrupting
name: { en: 'Ray emitter (mind disrupting)', 'pt-BR': 'Emissor de raio (disruptor mental)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Allows the user to project a ray of destructive energy up to very long
    range that inflicts Intellect damage equal to the cypher's level. Also,
    the victim cannot take actions for a number of rounds equal to the
    cypher's level.
  pt-BR: >-
    Permite que o usuário projete um raio de energia destrutiva a até
    uma distância muito longa que inflige dano de Intelecto igual ao
    nível da cifra. Além disso, a vítima não pode realizar ações por
    uma quantidade de rodadas igual ao nível da cifra.
effect_table: null
