id: detonation-massive
name: { en: 'Detonation (massive)', 'pt-BR': 'Detonação (massiva)' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 387'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that explodes in a short-range radius, inflicting damage equal to the cypher's level. Roll a d100 to determine the type of damage.(All damaging detonations inflict a minimum of 2 points of damage to those in the radius, regardless of attack or defense rolls.)
  pt-BR: >-
    Projeta um pequeno explosivo físico a até uma distância longa, que
    explode em um raio de distância curta, infligindo dano igual ao
    nível da cifra. Role 1d100 para determinar o tipo de dano. (Todas as
    detonações que causam dano infligem no mínimo 2 pontos de dano a
    quem estiver no raio de alcance, independentemente das rolagens de
    ataque ou defesa.)
effect_table:
  label: { en: 'Detonation (Massive) Effects', 'pt-BR': 'Efeitos da Detonação (Massiva)' }
  entries:
    - range: '01–10'
      text: { en: 'Cell-disrupting (harms only flesh)', 'pt-BR': 'Rompimento celular (prejudica apenas carne)' }
    - range: '11–30'
      text: { en: 'Corrosive', 'pt-BR': 'Corrosivo' }
    - range: '31–40'
      text: { en: 'Electrical discharge', 'pt-BR': 'Descarga elétrica' }
    - range: '41–50'
      text: { en: 'Heat drain (cold)', 'pt-BR': 'Dreno de calor (frio)' }
    - range: '51–75'
      text: { en: 'Fire', 'pt-BR': 'Fogo' }
    - range: '76–00'
      text: { en: 'Shrapnel', 'pt-BR': 'Estilhaços' }
