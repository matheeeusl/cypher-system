id: magnetic-master
name: { en: 'Magnetic master', 'pt-BR': 'Mestre magnético' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Establishes a connection with one metal object within short range that a
    human could hold in one hand. The user can then move or manipulate the
    object anywhere within short range (each movement or manipulation is an
    action). For example, they could wield a weapon or drag a helm affixed to
    a foe's head to and fro. The connection lasts for ten rounds per cypher
    level.
  pt-BR: >-
    Estabelece uma conexão com um objeto de metal dentro de uma
    distância curta que um humano conseguiria segurar com uma mão. O
    usuário pode então mover ou manipular o objeto para qualquer lugar
    dentro de uma distância curta (cada movimento ou manipulação é uma
    ação). Por exemplo, poderia empunhar uma arma ou arrastar um elmo
    preso à cabeça de um inimigo de um lado para o outro. A conexão dura
    dez rodadas por nível da cifra.
effect_table: null
