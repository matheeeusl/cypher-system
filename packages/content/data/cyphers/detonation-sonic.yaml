id: detonation-sonic
name: { en: 'Detonation (sonic)', 'pt-BR': 'Detonação (sônica)' }
category: manifest
page_ref: 'Cypher System Rulebook, page 387'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that explodes with terrifying sound,
    deafening all in an immediate radius for ten minutes per cypher level.
  pt-BR: >-
    Projeta um pequeno explosivo físico a até uma distância longa, que
    explode com um som aterrorizante, ensurdecendo todos dentro de um
    raio imediato por dez minutos por nível da cifra.
