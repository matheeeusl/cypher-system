id: magnetic-shield
name: { en: 'Magnetic shield', 'pt-BR': 'Escudo magnético' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    For ten minutes per cypher level, metal objects cannot come within
    immediate range of the user. Metal items already in the area when the
    device is activated are slowly pushed out.
  pt-BR: >-
    Por dez minutos por nível da cifra, objetos de metal não conseguem
    se aproximar a uma distância imediata do usuário. Itens de metal já
    presentes na área quando o dispositivo é ativado são lentamente
    empurrados para fora.
effect_table: null
