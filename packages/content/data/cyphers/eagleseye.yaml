id: eagleseye
name: { en: 'Eagleseye', 'pt-BR': 'Olho de Águia' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 388'
level_range: '1d6'
effect_text:
  en: >-
    Grants the ability to see ten times as far as normal for one hour per
    cypher level. (For a more realistic game, the eagleseye cypher could
    instead give the user two assets on tasks involving seeing to long
    distances.)
  pt-BR: >-
    Concede a capacidade de enxergar dez vezes mais longe que o normal
    por uma hora por nível da cifra. (Para um jogo mais realista, a
    cifra olho de águia pode, em vez disso, conceder ao usuário dois
    recursos em tarefas envolvendo enxergar a longas distâncias.)
effect_table: null
