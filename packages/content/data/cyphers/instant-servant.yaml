id: instant-servant
name: { en: 'Instant servant', 'pt-BR': 'Servo instantâneo' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 391'
level_range: '1d6'
effect_text:
  en: |-
    Small device expands into a humanoid automaton that is roughly 2 feet (60
    cm) tall. Its level is equal to the cypher's level, and it can understand
    the verbal commands of the character who activated it. Once the servant is
    activated, commanding it is not an action. It can make attacks or perform
    actions as ordered to the best of its abilities, but it cannot speak.

    The automaton has short-range movement but never goes farther than long
    range from the character who activated it. At the GM's discretion, the
    servant might have specialized knowledge, such as how to operate a
    particular device. Otherwise, it has no special knowledge. In any case,
    the servant is not artificially intelligent or capable of initiating
    action. It does only as commanded.

    The servant operates for one hour per cypher level.
  pt-BR: |-
    Um pequeno dispositivo se expande em um autômato humanoide com cerca
    de 60 centímetros (2 pés) de altura. Seu nível é igual ao nível da
    cifra, e ele consegue entender os comandos verbais do personagem
    que o ativou. Uma vez ativado, comandar o servo não é uma ação. Ele
    pode realizar ataques ou executar ações conforme ordenado, dentro do
    limite de suas habilidades, mas não consegue falar.

    O autômato tem movimento de distância curta, mas nunca se afasta
    mais do que uma distância longa do personagem que o ativou. A
    critério do Mestre, o servo pode ter conhecimento especializado,
    como saber operar um dispositivo específico. Caso contrário, não
    possui nenhum conhecimento especial. Em qualquer caso, o servo não é
    artificialmente inteligente nem capaz de tomar iniciativa. Ele só
    faz o que é ordenado.

    O servo opera por uma hora por nível da cifra.
effect_table: null
