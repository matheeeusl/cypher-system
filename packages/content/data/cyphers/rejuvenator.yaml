id: rejuvenator
name: { en: 'Rejuvenator', 'pt-BR': 'Rejuvenescedor' }
category: subtle
page_ref: 'Cypher System Rulebook, page 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Restores a number of points equal to the cypher's level to one random stat
    Pool.
  pt-BR: >-
    Restaura a uma Reserva de atributo aleatória uma quantidade de
    pontos igual ao nível da cifra.
effect_table:
  label:
    en: 'Rejuvenator Effects'
    pt-BR: 'Efeitos do Rejuvenescedor'
  entries:
    - range: '01–50'
      text: { en: 'Might Pool', 'pt-BR': 'Reserva de Força' }
    - range: '51–75'
      text: { en: 'Speed Pool', 'pt-BR': 'Reserva de Velocidade' }
    - range: '76–00'
      text: { en: 'Intellect Pool', 'pt-BR': 'Reserva de Intelecto' }
