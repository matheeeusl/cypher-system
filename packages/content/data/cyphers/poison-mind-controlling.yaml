id: poison-mind-controlling
name: { en: 'Poison (mind controlling)', 'pt-BR': 'Veneno (controle mental)' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 394'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The victim must carry out a specific action in response to a specific
    trigger. Roll a d100 to determine the action.
  pt-BR: >-
    A vítima deve realizar uma ação específica em resposta a um gatilho
    específico. Role 1d100 para determinar a ação.
effect_table:
  label:
    en: 'Poison (Mind Controlling) Effects'
    pt-BR: 'Efeitos do Veneno (Controle Mental)'
  entries:
    - range: '01–20'
      text:
        {
          en: 'Lies down for one minute with eyes closed when told to do so.',
          'pt-BR': 'Deita-se por um minuto com os olhos fechados quando mandada fazer isso.',
        }
    - range: '21–40'
      text:
        {
          en: 'Flees in terror for one minute when threatened.',
          'pt-BR': 'Foge em terror por um minuto quando ameaçada.',
        }
    - range: '41–60'
      text:
        {
          en: 'Answers questions truthfully for one minute.',
          'pt-BR': 'Responde perguntas com sinceridade por um minuto.',
        }
    - range: '61–75'
      text:
        {
          en: 'Attacks close friend for one round when within immediate range.',
          'pt-BR': 'Ataca um amigo próximo por uma rodada quando estiver dentro de uma distância imediata.',
        }
    - range: '76–85'
      text:
        {
          en: 'Obeys next verbal command given (if it is understood).',
          'pt-BR': 'Obedece ao próximo comando verbal dado (se for compreendido).',
        }
    - range: '86–95'
      text:
        {
          en: 'For one day, becomes sexually attracted to the next creature of its own species that it sees.',
          'pt-BR': 'Por um dia, fica sexualmente atraída pela próxima criatura da própria espécie que vir.',
        }
    - range: '96–00'
      text:
        {
          en: 'For one minute, moves toward the next red object seen in lieu of all other actions, ignoring self-preservation.',
          'pt-BR': 'Por um minuto, move-se em direção ao próximo objeto vermelho que vir, em vez de realizar qualquer outra ação, ignorando a autopreservação.',
        }
