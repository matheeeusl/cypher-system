id: poison-mind-controlling
name: { en: 'Poison (mind controlling)', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 394'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The victim must carry out a specific action in response to a specific
    trigger. Roll a d100 to determine the action.
  pt-BR: >-
    Tradução em breve.
effect_table:
