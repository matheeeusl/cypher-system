id: visual-displacement-device
name: { en: 'Visual displacement device', 'pt-BR': 'Dispositivo de deslocamento visual' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6'
effect_text:
  en: >-
    Projects holographic images of the user to confuse attackers. The images
    appear around the user, giving them an asset to Speed defense actions for
    ten minutes per cypher level.
  pt-BR: >-
    Projeta imagens holográficas do usuário para confundir atacantes. As
    imagens surgem ao redor do usuário, concedendo-lhe um recurso em
    ações de defesa de Velocidade por dez minutos por nível da cifra.
effect_table: null
