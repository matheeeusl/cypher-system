id: range-boost
name: { en: 'Range boost', 'pt-BR': 'Impulso de alcance' }
category: power_boost
page_ref: 'Cypher System Rulebook, page 401'
level_range: '1d6 + 1'
effect_text:
  en: >-
    This cypher boosts the range of an ability. Something that affects only
    you can now affect someone you touch. Any other ability increases its
    range by one category (touch to immediate, immediate to short, short to
    long, long to very long, very long to 1,000 feet [300 m], or double for
    any range longer than very long).
  pt-BR: >-
    Esta cifra intensifica o alcance de uma habilidade. Algo que afeta
    apenas você agora pode afetar alguém que você toque. Qualquer outra
    habilidade aumenta seu alcance em uma categoria (de toque para
    imediato, de imediato para curto, de curto para longo, de longo
    para muito longo, de muito longo para 300 metros [1.000 pés], ou
    dobra para qualquer alcance superior a muito longo).
effect_table: null
