id: time-dilation-offensive
name: { en: 'Time dilation (offensive)', 'pt-BR': 'Dilatação temporal (ofensiva)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6'
effect_text:
  en: >-
    For the next twenty-four hours, when the user makes a melee attack, they
    move at almost instantaneous speed, easing their attacks by two steps
    (three steps if the cypher is level 6 or higher).
  pt-BR: >-
    Pelas próximas vinte e quatro horas, quando o usuário fizer um
    ataque corpo a corpo, ele se move em uma velocidade quase
    instantânea, facilitando seus ataques em dois níveis (três níveis se
    a cifra for de nível 6 ou superior).
effect_table: null
