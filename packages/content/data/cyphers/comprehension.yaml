id: comprehension
name: { en: 'Comprehension', 'pt-BR': 'Compreensão' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 385'
level_range: '1d6 + 1'
effect_text:
  {
    en: 'Within five minutes, the user can understand the words of a specific language keyed to the cypher (two languages if the cypher is level 5 or higher). This is true even of creatures that do not normally have a language. If the user could already understand the language, the cypher has no effect. Once the cypher is used, the effect is permanent, and the cypher no longer counts against the number of cyphers that a PC can bear.',
    'pt-BR': 'Em até cinco minutos, o usuário passa a entender as palavras de um idioma específico vinculado à cifra (dois idiomas se a cifra for de nível 5 ou superior). Isso vale até mesmo para criaturas que normalmente não possuem idioma. Se o usuário já conseguia entender o idioma, a cifra não tem efeito. Uma vez usada, a cifra tem efeito permanente e deixa de contar para o número de cifras que um PJ pode portar.',
  }
effect_table: null
