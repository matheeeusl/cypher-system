id: force-shield-projector
name: { en: 'Force shield projector', 'pt-BR': 'Projetor de escudo de força' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 389'
level_range: '1d6 + 3'
effect_text:
  en: >-
    Creates a shimmering energy shield around the user for one hour, during
    which time they gain +3 to Armor (or +4 to Armor if the cypher is level 5
    or higher).
  pt-BR: >-
    Cria um escudo de energia cintilante ao redor do usuário por uma
    hora, durante a qual ele ganha +3 de Armadura (ou +4 de Armadura se
    a cifra for de nível 5 ou superior).
effect_table: null
