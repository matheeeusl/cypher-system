id: density
name: { en: 'Density', 'pt-BR': 'Densidade' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 386'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, each time the user strikes a solid creature or object with a weapon,
    the weapon suddenly increases dramatically in weight, causing the blow to inflict 2 additional points of damage.
  pt-BR: >-
    Pelo próximo dia, toda vez que o usuário atingir uma criatura ou
    objeto sólido com uma arma, a arma repentinamente aumenta
    drasticamente de peso, fazendo com que o golpe inflija 2 pontos
    adicionais de dano.
effect_table: null
