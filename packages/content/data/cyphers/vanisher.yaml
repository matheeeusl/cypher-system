id: vanisher
name: { en: 'Vanisher', 'pt-BR': 'Desaparecedor' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The user becomes invisible for five minutes per cypher level, during which
    time they are specialized in stealth and Speed defense tasks. This effect
    ends if they do something to reveal their presence or position—attacking,
    using an ability, moving a large object, and so on. If this occurs, they
    can regain the remaining invisibility effect by taking an action to focus
    on hiding their position.
  pt-BR: >-
    O usuário fica invisível por cinco minutos por nível da cifra,
    período durante o qual é especializado em tarefas de furtividade e
    defesa de Velocidade. Esse efeito termina se ele fizer algo que
    revele sua presença ou posição — atacar, usar uma habilidade, mover
    um objeto grande, e assim por diante. Se isso ocorrer, ele pode
    recuperar o efeito de invisibilidade restante usando uma ação para
    se concentrar em esconder sua posição.
effect_table: null
