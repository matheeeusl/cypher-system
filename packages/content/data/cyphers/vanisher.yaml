id: vanisher
name: { en: 'Vanisher', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The user becomes invisible for five minutes per cypher level, during which
    time they are specialized in stealth and Speed defense tasks. This effect
    ends if they do something to reveal their presence or position—attacking,
    using an ability, moving a large object, and so on. If this occurs, they
    can regain the remaining invisibility effect by taking an action to focus
    on hiding their position.
  pt-BR: >-
    Tradução em breve.
effect_table: null
