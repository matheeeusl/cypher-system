id: magnetic-attack-drill
name: { en: 'Magnetic attack drill', 'pt-BR': 'Broca de ataque magnética' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The user throws this cypher at a target within short range, and it drills
    into the target for one round, inflicting damage equal to the cypher's
    level. If the target is made of metal or wearing metal (such as armor),
    the attack is eased.
  pt-BR: >-
    O usuário arremessa esta cifra contra um alvo dentro de uma
    distância curta, e ela perfura o alvo por uma rodada, infligindo
    dano igual ao nível da cifra. Se o alvo for feito de metal ou
    estiver usando metal (como armadura), o ataque é facilitado.
effect_table: null
