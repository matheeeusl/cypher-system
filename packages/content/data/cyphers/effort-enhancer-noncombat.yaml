id: effort-enhancer-noncombat
name: { en: 'Effort enhancer (noncombat)', 'pt-BR': 'Tradução em breve.' }
category: subtle
page_ref: 'Cypher System Rulebook, page 388'
level_range: '1d6'
effect_text:
  en: >-
    For the next hour, the user can apply one free level of Effort to a
    noncombat task without spending points from a Pool. The level of Effort
    provided by this cypher does not count toward the maximum amount of Effort
    a character can normally apply to one task. Once this free level of Effort
    is used, the effect of the cypher ends.
  pt-BR: >-
    Tradução em breve.
effect_table: null
