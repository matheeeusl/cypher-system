id: effort-enhancer-noncombat
name: { en: 'Effort enhancer (noncombat)', 'pt-BR': 'Intensificador de esforço (fora de combate)' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 388'
level_range: '1d6'
effect_text:
  en: >-
    For the next hour, the user can apply one free level of Effort to a
    noncombat task without spending points from a Pool. The level of Effort
    provided by this cypher does not count toward the maximum amount of Effort
    a character can normally apply to one task. Once this free level of Effort
    is used, the effect of the cypher ends.
  pt-BR: >-
    Pela próxima hora, o usuário pode aplicar um nível gratuito de
    Esforço em uma tarefa fora de combate sem gastar pontos de uma
    Reserva. O nível de Esforço fornecido por esta cifra não conta para
    a quantidade máxima de Esforço que um personagem pode normalmente
    aplicar em uma tarefa. Uma vez usado esse nível gratuito de Esforço,
    o efeito da cifra termina.
effect_table: null
