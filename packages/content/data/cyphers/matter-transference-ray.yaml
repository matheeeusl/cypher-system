id: matter-transference-ray
name: { en: 'Matter transference ray', 'pt-BR': 'Raio de transferência de matéria' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 392'
level_range: '1d6 + 3'
effect_text:
  en: >-
    The user can target one nonliving object within long range that is their
    size or smaller of the cypher level or lower. The object is transferred
    directly to a random location at least 100 miles (160 km) away. If the GM
    feels it appropriate to the circumstances, only a portion of an object is
    transferred (a portion whose volume is no more than the user's).
  pt-BR: >-
    O usuário pode mirar em um objeto inanimado dentro de uma distância
    longa que seja do seu tamanho ou menor e de nível igual ou inferior
    ao da cifra. O objeto é transferido diretamente para um local
    aleatório a pelo menos 160 km (100 milhas) de distância. Se o Mestre
    considerar apropriado às circunstâncias, apenas uma parte do objeto
    é transferida (uma parte cujo volume não seja maior que o do
    usuário).
effect_table: null
