id: inferno-wall
name: { en: 'Inferno wall', 'pt-BR': 'Parede infernal' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 390'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Creates a wall of extreme heat up to 30 feet by 30 feet by 1 foot (9 m by
    9 m by 30 cm) that inflicts damage equal to the cypher's level on anything
    that passes through it. The wall conforms to the space available. It lasts
    for ten minutes.
  pt-BR: >-
    Cria uma parede de calor extremo de até 9 por 9 metros por 30
    centímetros (30 por 30 por 1 pé) que inflige dano igual ao nível da
    cifra em qualquer coisa que passe por ela. A parede se adapta ao
    espaço disponível. Ela dura dez minutos.
effect_table: null
