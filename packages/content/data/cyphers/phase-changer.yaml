# OG-CSRD Editorial Addition: the original rulebook doesn't give this cypher a
# level formula. The 1d6 + 1 in level_range above is the transcription source's
# own added guess, not primary rulebook text — flag if a more authoritative
# value surfaces.
id: phase-changer
name: { en: 'Phase changer', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 394'
level_range: '1d6 + 1'
effect_text:
  en: >-
    Puts the user out of phase for one minute (two minutes if the cypher is
    level 6 or higher). During this time, they can pass through solid objects
    as though they were entirely insubstantial, like a ghost. They cannot make
    physical attacks or be physically attacked.
    (The phase changer cypher doesn't include a level formula. The 1d6 + 1 listed here is an addition by the editor.)
  pt-BR: >-
    Tradução em breve.
effect_table: null
