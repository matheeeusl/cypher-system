id: sound-dampener
name: { en: 'Sound dampener', 'pt-BR': 'Abafador de som' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Dampens all sound within immediate range for one minute per cypher level,
    providing an asset on stealth actions by all creatures in the area.
  pt-BR: >-
    Abafa todo o som dentro de uma distância imediata por um minuto por
    nível da cifra, concedendo um recurso em ações de furtividade para
    todas as criaturas na área.
effect_table: null
