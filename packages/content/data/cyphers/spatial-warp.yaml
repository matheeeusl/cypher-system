id: spatial-warp
name: { en: 'Spatial warp', 'pt-BR': 'Distorção espacial' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6 + 4'
effect_text:
  en: >-
    When affixed to a device that affects a single target at range, that range
    is increased to 1 mile (1.5 km) with no penalties. Space is temporarily
    warped in terms of seeing and reaching the target. If direct line of sight
    is important to the device's effect, it remains important. The spatial
    warp lasts 10 minutes per cypher level.
  pt-BR: >-
    Quando fixada a um dispositivo que afeta um único alvo à distância,
    esse alcance aumenta para 1,5 km (1 milha) sem penalidades. O
    espaço é temporariamente distorcido em termos de enxergar e
    alcançar o alvo. Se linha de visão direta for importante para o
    efeito do dispositivo, ela continua sendo importante. A distorção
    espacial dura 10 minutos por nível da cifra.
effect_table: null
