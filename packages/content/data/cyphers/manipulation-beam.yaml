id: manipulation-beam
name: { en: 'Manipulation beam', 'pt-BR': 'Feixe de manipulação' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Over the course of one day, the user can activate the cypher a total
    number of times equal to its level. Each time, they can affect an object
    they can see within long range that is not too heavy for them to affect
    physically. The effect must occur over the course of a round and could
    include closing or opening a door, keying in a number on a keypad,
    transferring an object a short distance, wresting an object from another
    creature's grasp (on a successful Might-based roll), or pushing a creature
    an immediate distance. (A manipulation beam could be used to operate a
    computer at a distance, which would make some infiltration and hacking
    jobs easier.)
  pt-BR: >-
    Ao longo de um dia, o usuário pode ativar a cifra um número total
    de vezes igual ao seu nível. A cada vez, pode afetar um objeto que
    consiga ver dentro de uma distância longa e que não seja pesado
    demais para afetar fisicamente. O efeito deve ocorrer ao longo de
    uma rodada e pode incluir fechar ou abrir uma porta, digitar um
    número em um teclado, transferir um objeto por uma distância curta,
    arrancar um objeto das mãos de outra criatura (com sucesso em uma
    rolagem baseada em Força) ou empurrar uma criatura por uma distância
    imediata. (Um feixe de manipulação pode ser usado para operar um
    computador à distância, o que facilitaria alguns trabalhos de
    infiltração e invasão.)
effect_table: null
