id: detonation-gravity-inversion
name: { en: 'Detonation (gravity inversion)', 'pt-BR': 'Detonação (inversão de gravidade)' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 387'
level_range: '1d6 + 1'
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that explodes,
    and for one hour gravity reverses within long range of the explosion.
  pt-BR: >-
    Projeta um pequeno explosivo físico a até uma distância longa, que
    explode e, por uma hora, inverte a gravidade dentro de um alcance
    longo da explosão.
effect_table: null
