id: sleep-inducer
name: { en: 'Sleep inducer', 'pt-BR': 'Indutor de sono' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6'
effect_text:
  en: >-
    Touch puts the victim to sleep for ten minutes per cypher level or until
    awoken by a violent action or an extremely loud noise.
  pt-BR: >-
    O toque faz a vítima adormecer por dez minutos por nível da cifra,
    ou até ser acordada por uma ação violenta ou um ruído extremamente
    alto.
effect_table: null
