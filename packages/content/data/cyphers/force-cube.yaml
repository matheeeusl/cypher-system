id: force-cube
name: { en: 'Force cube', 'pt-BR': 'Cubo de força' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 389'
level_range: '1d6 + 3'
effect_text:
  en: >-
    Creates an immobile cube composed of six planes of solid force, each 30
    feet (9 m) to a side, for one hour. The planes conform to the space
    available. (Although a force cube's walls are not gaseous permeable, there
    is likely enough air within for trapped creatures to breathe for the hour
    it lasts.)
  pt-BR: >-
    Cria um cubo imóvel composto por seis planos de força sólida, cada
    um com 9 metros (30 pés) de lado, por uma hora. Os planos se adaptam
    ao espaço disponível. (Embora as paredes de um cubo de força não
    sejam permeáveis a gases, provavelmente há ar suficiente dentro dele
    para que criaturas presas respirem durante a hora em que dura.)
effect_table: null
