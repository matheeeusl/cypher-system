# Rulebook sidebar (applies to the whole force wall/shield/cube family, not just
# this cypher): "Some force walls, shields, and cubes are transparent. Others
# are translucent. A few are opaque."
id: force-field
name: { en: 'Force field', 'pt-BR': 'Campo de força' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 389'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, the user is surrounded by a powerful force field,
    granting them +1 to Armor (+2 to Armor if the cypher level is 5 or
    higher).
    (Some force walls, shields, and cubes are transparent. Others are translucent. A few are opaque.)
  pt-BR: >-
    Pelo próximo dia, o usuário é envolvido por um poderoso campo de
    força, concedendo-lhe +1 de Armadura (+2 de Armadura se a cifra for
    de nível 5 ou superior).
    (Algumas paredes, escudos e cubos de força são transparentes. Outros
    são translúcidos. Alguns poucos são opacos.)
effect_table: null
