id: time-dilation-defensive
name: { en: 'Time dilation (defensive)', 'pt-BR': 'Dilatação temporal (defensiva)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6'
effect_text:
  en: >-
    For the next twenty-four hours, when the user is attacked, they move in
    rapid, seemingly random jumps, a few inches to one side or the other. This
    is an asset that modifies the user's defense rolls by two steps (three
    steps if the cypher is level 6 or higher).
  pt-BR: >-
    Pelas próximas vinte e quatro horas, quando o usuário for atacado,
    ele se move em saltos rápidos e aparentemente aleatórios, alguns
    centímetros para um lado ou outro. Isso é um recurso que modifica
    as rolagens de defesa do usuário em dois níveis (três níveis se a
    cifra for de nível 6 ou superior).
effect_table: null
