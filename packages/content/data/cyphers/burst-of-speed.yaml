id: burst-of-speed
name: { en: 'Burst of speed', 'pt-BR': 'Explosão de velocidade' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 385'
level_range: '1d6'
effect_text:
  en: >-
    For one minute, a user who normally can move a short distance as an action can
    move a long distance instead.
  pt-BR: >-
    Por um minuto, um usuário que normalmente pode se mover a uma
    distância curta como uma ação pode, em vez disso, se mover a uma
    distância longa.
effect_table: null
