id: ray-emitter-fear
name: { en: 'Ray emitter (fear)', 'pt-BR': 'Emissor de raio (medo)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Allows the user to project a ray up to long range (very long range if the
    cypher is level 6 or higher) that causes the target to flee in terror for
    one minute.
  pt-BR: >-
    Permite que o usuário projete um raio a até uma distância longa
    (muito longa se a cifra for de nível 6 ou superior) que faz o alvo
    fugir em terror por um minuto.
effect_table: null
