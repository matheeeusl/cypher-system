# Sonic holes are much-loved by thieves everywhere but can also be used for less
# nefarious purposes, such as hunting prey and sneaking past enemies.
id: sonic-hole
name: { en: 'Sonic hole', 'pt-BR': 'Buraco sônico' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Draws all sound within long range into the device for one round per cypher
    level. Within the affected area, no sound can be heard.
  pt-BR: >-
    Atrai todo o som dentro de uma distância longa para o dispositivo,
    por uma rodada por nível da cifra. Dentro da área afetada, nenhum
    som pode ser ouvido.
effect_table: null
