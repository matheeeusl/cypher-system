id: gravity-nullifying-application
name: { en: 'Gravity-nullifying application', 'pt-BR': 'Aplicação anuladora de gravidade' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 390'
level_range: '1d6 + 2'
effect_text:
  en: >-
    If a nonliving object no larger than a human (two humans if the cypher
    level is 6 or higher) is coated by this cypher, it floats 1d20 feet in the
    air permanently and no longer has weight if carried (though it needs to be
    strapped down).
  pt-BR: >-
    Se um objeto inanimado não maior que um ser humano (dois seres
    humanos se a cifra for de nível 6 ou superior) for revestido por
    esta cifra, ele flutua permanentemente a 1d20 pés de altura no ar e
    deixa de ter peso quando carregado (embora precise ser preso com
    cintas).
effect_table: null
