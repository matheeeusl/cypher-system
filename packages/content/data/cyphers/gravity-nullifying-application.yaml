id: gravity-nullifying-application
name: { en: 'Gravity-nullifying application', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 390'
level_range: '1d6 + 2'
effect_text:
  en: >-
    If a nonliving object no larger than a human (two humans if the cypher
    level is 6 or higher) is coated by this cypher, it floats 1d20 feet in the
    air permanently and no longer has weight if carried (though it needs to be
    strapped down).
  pt-BR: >-
    Tradução em breve.
effect_table: null
