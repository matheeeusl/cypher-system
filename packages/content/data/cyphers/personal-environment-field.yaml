id: personal-environment-field
name: { en: "Personal environment field", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 394"
level_range: "1d6 + 2"
effect_text:
  en: >-
    Creates an aura of temperature and atmosphere that will sustain a human
    safely for a day. The aura extends to 1 foot (30 cm) around the user
    (double that radius if the cypher is level 7 or higher). It does not
    protect against sudden flashes of temperature change (such as from a heat
    ray). A small number of these cyphers (1%) accommodate the preferred
    environment of a nonhuman, nonterrestrial creature.
  pt-BR: >-
    Tradução em breve.
effect_table: null
