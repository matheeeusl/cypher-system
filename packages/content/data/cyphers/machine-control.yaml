id: machine-control
name: { en: 'Machine control', 'pt-BR': 'Controle de máquina' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Splits into two pieces; one is affixed to a device and the other to a
    character. The character can then use their mind to control the device at
    long range, bidding it to do anything it could do normally. Thus, a device
    could be activated or deactivated, and a vehicle could be piloted. The
    control lasts for ten minutes per cypher level, and once the device is
    chosen, it cannot be changed.
  pt-BR: >-
    Divide-se em duas partes; uma é fixada a um dispositivo, e a outra,
    a um personagem. O personagem pode então usar sua mente para
    controlar o dispositivo a uma distância longa, ordenando que ele
    faça qualquer coisa que normalmente poderia fazer. Assim, um
    dispositivo pode ser ativado ou desativado, e um veículo pode ser
    pilotado. O controle dura dez minutos por nível da cifra, e, uma vez
    escolhido o dispositivo, não pode ser trocado.
effect_table: null
