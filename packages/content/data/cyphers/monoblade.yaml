id: monoblade
name: { en: 'Monoblade', 'pt-BR': 'Monolâmina' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 393'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Produces a 6-inch (15 cm) blade that's the same level as the cypher. The
    blade cuts through any material of a level lower than its own. If used as
    a weapon, it is a light weapon that ignores Armor of a level lower than
    its own. The blade lasts for ten minutes.
  pt-BR: >-
    Produz uma lâmina de 15 centímetros (6 polegadas) do mesmo nível
    que a cifra. A lâmina corta qualquer material de nível inferior ao
    seu. Se usada como arma, é uma arma leve que ignora Armadura de
    nível inferior ao seu. A lâmina dura dez minutos.
effect_table: null
