        }
    - range: '56–65'
      text:
        {
          en: Restores a number of Intellect Pool points equal to cypher level,
          pt-BR: Tradução em breve.,
        }
    - range: '66–75'
      text: { en: Increases Might Edge by 1 for one hour, pt-BR: Tradução em breve. }
    - range: '76–85'
      text: { en: Increases Speed Edge by 1 for one hour, pt-BR: Tradução em breve. }
    - range: '86–95'
      text: { en: Increases Intellect Edge by 1 for one hour, pt-BR: Tradução em breve. }
    - range: '96–00'
