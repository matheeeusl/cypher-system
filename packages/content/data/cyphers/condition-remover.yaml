id: condition-remover
name: { en: 'Condition remover', 'pt-BR': 'Removedor de condições' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 385'
level_range: '1d6 + 3'
effect_text:
  {
    en: 'Cures one occurrence of one specific health condition of the cypher level or lower. It does not prevent the possibility of future occurrences of the same condition. Roll a d20 to determine what it cures.',
    'pt-BR': 'Cura uma ocorrência de uma condição de saúde específica de nível igual ou inferior ao da cifra. Isso não impede a possibilidade de ocorrências futuras da mesma condição. Role 1d20 para determinar o que ela cura.',
  }
effect_table:
  label: { en: 'Condition Remover Effects', 'pt-BR': 'Efeitos do Removedor de Condições' }
