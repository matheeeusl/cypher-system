id: subdual-field
name: { en: 'Subdual field', 'pt-BR': 'Campo de subjugação' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 398'
level_range: '1d6 + 3'
effect_text:
  en: >-
    Two rounds after being activated, the device creates an invisible field
    that fills a specified area (such as a cube a short distance across)
    within long range. The field lasts for one minute. It affects the minds of
    thinking beings within the field, preventing them from taking hostile
    actions. The effect lasts as long as they remain in the field and for 1d6
    rounds after, although an Intellect defense roll is allowed each round to
    act normally (both in the field and after leaving it).
  pt-BR: >-
    Duas rodadas após ser ativado, o dispositivo cria um campo invisível
    que preenche uma área específica (como um cubo com uma distância
    curta de lado) dentro de uma distância longa. O campo dura um
    minuto. Ele afeta as mentes de seres pensantes dentro do campo,
    impedindo-os de realizar ações hostis. O efeito dura enquanto eles
    permanecerem no campo e por 1d6 rodadas depois, embora seja
    permitida uma rolagem de defesa de Intelecto a cada rodada para agir
    normalmente (tanto dentro do campo quanto após sair dele).
effect_table: null
