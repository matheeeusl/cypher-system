id: teleporter-bounder
name: { en: 'Teleporter (bounder)', 'pt-BR': 'Teletransportador (saltador)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 398'
level_range: '1d6 + 2'
effect_text:
  en: >-
    User teleports up to 100 × the cypher level in feet to a location they can
    see. They arrive safely with their possessions but cannot take anything
    else with them.
  pt-BR: >-
    O usuário se teleporta a até 100 vezes o nível da cifra em pés, até
    um local que consiga ver. Ele chega em segurança com seus
    pertences, mas não pode levar mais nada consigo.
effect_table: null
