id: sheen
name: { en: 'Sheen', 'pt-BR': 'Verniz' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 396'
level_range: '1d6'
effect_text:
  en: >-
    For one week, the user's cells are coated with a protective veneer that
    resists damage (+1 to Armor, or +2 to Armor if the cypher is level 5 or
    higher) and eases Might defense rolls by two steps. However, healing is
    more difficult during this time; all recovery rolls suffer a −1 penalty.
  pt-BR: >-
    Por uma semana, as células do usuário ficam revestidas por um
    verniz protetor que resiste a dano (+1 de Armadura, ou +2 de
    Armadura se a cifra for de nível 5 ou superior) e facilita em dois
    níveis as rolagens de defesa de Força. No entanto, a cura fica mais
    difícil durante esse período; todas as rolagens de recuperação
    sofrem uma penalidade de −1.
effect_table: null
