id: nutrition-and-hydration
name: { en: 'Nutrition and hydration', 'pt-BR': 'Nutrição e hidratação' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 393'
level_range: '1d6 + 1'
effect_text:
  en: >-
    The user can go without food and water for a number of days equal to the
    cypher's level without ill effect.
  pt-BR: >-
    O usuário pode ficar sem comida e água por uma quantidade de dias
    igual ao nível da cifra, sem efeitos adversos.
effect_table: null
