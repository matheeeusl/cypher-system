id: repel
name: { en: 'Repel', 'pt-BR': 'Repelir' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 396'
level_range: '1d6 + 1'
effect_text:
  en: >-
    One NPC within immediate range who is of a level lower than the cypher
    decides to leave, using their next five rounds to move away quickly.
  pt-BR: >-
    Um PNJ dentro de uma distância imediata que seja de nível inferior
    ao da cifra decide ir embora, usando suas próximas cinco rodadas
    para se afastar rapidamente.
effect_table: null
