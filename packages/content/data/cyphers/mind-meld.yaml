# In some games, telepathy transcends normal language barriers (if the target
# has a mind that allows for telepathic communication). In others, it might only
# pick up emotions or general concepts of thoughts in another language. It also
# might vary based on the ability used.
id: mind-meld
name: { en: 'Mind meld', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 393'
level_range: '1d6 + 1'
effect_text:
  en: >-
    Lets the user speak telepathically with creatures they can see within
    short range for up to one hour. The user can't read a target's thoughts,
    except those that are specifically "transmitted."
  pt-BR: >-
    Tradução em breve.
effect_table: null
