id: infiltrator
name: { en: 'Infiltrator', 'pt-BR': 'Infiltrador' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 390'
level_range: '1d6'
effect_text:
  en: >-
    Tiny capsule launches and moves at great speed, mapping and scanning an
    unknown area. It moves 500 feet (150 m) per level, scanning an area up to
    50 feet (15 m) per level away from it. It identifies basic layout,
    creatures, and major energy sources and either transmits this information
    back to the user (perhaps by telepathy or an electronic signal) or returns
    to the user to show what it saw. Its movement is blocked by any physical
    or energy barrier.
  pt-BR: >-
    Uma pequena cápsula é lançada e se move em alta velocidade,
    mapeando e escaneando uma área desconhecida. Ela se move 150 metros
    (500 pés) por nível, escaneando uma área de até 15 metros (50 pés)
    por nível de distância dela. Ela identifica o layout básico,
    criaturas e principais fontes de energia, e transmite essa
    informação de volta ao usuário (talvez por telepatia ou sinal
    eletrônico) ou retorna ao usuário para mostrar o que viu. Seu
    movimento é bloqueado por qualquer barreira física ou de energia.
effect_table: null
