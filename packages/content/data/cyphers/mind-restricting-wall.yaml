id: mind-restricting-wall
name: { en: 'Mind-restricting wall', 'pt-BR': 'Parede restritora da mente' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 393'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Creates an immobile plane of permeable energy up to 20 feet by 20 feet (6
    m by 6 m) for one hour. The plane conforms to the space available.
    Intelligent creatures passing through the plane fall unconscious for up to
    one hour, or until slapped awake or damaged.
  pt-BR: >-
    Cria um plano imóvel de energia permeável de até 6 por 6 metros (20
    por 20 pés) por uma hora. O plano se adapta ao espaço disponível.
    Criaturas inteligentes que passam pelo plano caem inconscientes por
    até uma hora, ou até serem acordadas com um tapa ou sofrerem dano.
effect_table: null
