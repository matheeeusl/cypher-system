id: remembering
name: { en: 'Remembering', 'pt-BR': 'Recordação' }
category: subtle
page_ref: 'Cypher System Rulebook, page 396'
level_range: '1d6'
effect_text:
  en: >-
    Allows the user to recall any one experience they've ever had. The
    experience can be no longer than one minute per cypher level, but the
    recall is perfect, so (for example) if they saw someone dial a phone, they
    will remember the number.
  pt-BR: >-
    Permite que o usuário recorde qualquer experiência que já tenha
    vivido. A experiência não pode durar mais que um minuto por nível
    da cifra, mas a lembrança é perfeita, então (por exemplo) se ele viu
    alguém discar um telefone, vai se lembrar do número.
effect_table: null
