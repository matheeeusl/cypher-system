id: warmth
name: { en: 'Warmth', 'pt-BR': 'Aquecimento' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 400'
level_range: '1d6'
effect_text:
  en: >-
    Keeps the user warm and comfortable, even in the harshest cold
    temperatures, for twenty-four hours. During this time, the user has Armor
    equal to the cypher's level that protects against cold damage.
  pt-BR: >-
    Mantém o usuário aquecido e confortável, mesmo nas temperaturas mais
    frias, por vinte e quatro horas. Durante esse período, o usuário
    tem Armadura igual ao nível da cifra que protege contra dano de
    frio.
effect_table: null
