id: repair-unit
name: { en: 'Repair unit', 'pt-BR': 'Unidade de reparo' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 396'
level_range: '1d10'
effect_text:
  en: >-
    The cypher becomes a multiarmed sphere that floats. It repairs one
    designated item (of its own level or lower) that has been damaged but not
    destroyed. The repair unit can also create spare parts, unless the GM
    rules that the parts are too specialized or rare (in which case, the unit
    repairs the device except for the specialized part). Repair time is 1d100
    + 20 minutes.
  pt-BR: >-
    A cifra se transforma em uma esfera flutuante com vários braços. Ela
    repara um item designado (de nível igual ou inferior ao seu) que
    tenha sido danificado, mas não destruído. A unidade de reparo também
    pode criar peças de reposição, a menos que o Mestre determine que as
    peças são especializadas ou raras demais (nesse caso, a unidade
    repara o dispositivo, exceto pela peça especializada). O tempo de
    reparo é de 1d100 + 20 minutos.
effect_table: null
