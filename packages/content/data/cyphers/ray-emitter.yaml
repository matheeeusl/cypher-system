# Rulebook also lists "even weirder ray emitters" as free-form GM inspiration,
# not a d100 table: turns target inside out; inflicts damage and turns flesh
# blue; renders target mute; damages only plants; damages only inorganic matter;
# turns flesh to dead, stonelike material. Editor's Notes — Chapter 15: Science
# Fiction's Artifact Weapons include some unique "emitter" options too.
id: ray-emitter
name: { en: 'Ray emitter', 'pt-BR': 'Emissor de raio' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Allows the user to project a ray of destructive energy up to very long
    range that inflicts damage equal to the cypher's level. Roll a d100 to
    determine the type of energy.
  pt-BR: >-
    Permite que o usuário projete um raio de energia destrutiva a até
    uma distância muito longa que inflige dano igual ao nível da cifra.
    Role 1d100 para determinar o tipo de energia.
effect_table:
  label:
    en: 'Ray Emitter Effects'
    pt-BR: 'Efeitos do Emissor de Raio'
  entries:
    - range: '01–50'
      text: { en: 'Heat/concentrated light', 'pt-BR': 'Calor/luz concentrada' }
    - range: '51–60'
      text: { en: 'Cell-disrupting radiation', 'pt-BR': 'Radiação de rompimento celular' }
    - range: '61–80'
      text: { en: 'Force', 'pt-BR': 'Energia cinética' }
    - range: '81–87'
      text: { en: 'Magnetic wave', 'pt-BR': 'Onda magnética' }
    - range: '88–93'
      text: { en: 'Molecular bond disruption', 'pt-BR': 'Rompimento de ligações moleculares' }
    - range: '94–00'
      text: { en: 'Concentrated cold', 'pt-BR': 'Frio concentrado' }
