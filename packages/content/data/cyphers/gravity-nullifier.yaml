id: gravity-nullifier
name: { en: "Gravity nullifier", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 390"
level_range: "1d6 + 3"
effect_text:
  en: >-
    For one hour, the user can float into the air, moving vertically up to a
    short distance per round (but not horizontally without taking some other
    action, such as pushing along the ceiling). The user must weigh less than
    50 pounds (23 kg) per level of the cypher.
