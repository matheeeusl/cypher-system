# Editor's Notes — The mind stabilizer cypher doesn't list a duration in the
# original rulebook. As a simple solution, the source suggests the GM could
# assign this cypher a duration of one hour per cypher level; that suggestion is
# not encoded in level_range/effect_text above.
id: mind-stabilizer
name: { en: 'Mind stabilizer', 'pt-BR': 'Estabilizador mental' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 393'
level_range: '1d6'
effect_text:
  en: >-
    The user gains +5 to Armor against Intellect damage.
    (The mind stabilizer cypher doesn't list a duration. As a simple solution, the GM could assign this cypher a duration of one hour per cypher level.)
  pt-BR: >-
    O usuário ganha +5 de Armadura contra dano de Intelecto.
    (A cifra estabilizador mental não especifica uma duração. Como
    solução simples, o Mestre pode atribuir a esta cifra uma duração de
    uma hora por nível da cifra.)
effect_table: null
