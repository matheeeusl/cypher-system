id: secret
name: { en: 'Secret', 'pt-BR': 'Segredo' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 396'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The user can ask the GM one question and get a general answer. The GM
    assigns a level to the question, so the more obscure the answer, the more
    difficult the task. Generally, knowledge that a PC could find by looking
    somewhere other than their current location is level 1, and obscure
    knowledge of the past is level 7. Gaining knowledge of the future is level
    10, and such knowledge is always open to interpretation. The cypher cannot
    provide an answer to a question above its level.
  pt-BR: >-
    O usuário pode fazer uma pergunta ao Mestre e obter uma resposta
    geral. O Mestre atribui um nível à pergunta, então quanto mais
    obscura a resposta, mais difícil é a tarefa. Em geral, um
    conhecimento que um PJ poderia encontrar procurando em outro lugar
    que não sua localização atual é de nível 1, e um conhecimento
    obscuro do passado é de nível 7. Obter conhecimento sobre o futuro é
    de nível 10, e esse tipo de conhecimento está sempre aberto a
    interpretação. A cifra não pode fornecer uma resposta a uma
    pergunta acima do seu nível.
effect_table: null
