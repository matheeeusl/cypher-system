id: equipment-cache
name: { en: "Equipment cache", "pt-BR": "Tradução em breve." }
category: manifest
page_ref: "Cypher System Rulebook, page 388"
level_range: "1d6 + 1"
effect_text:
  en: >-
    The user can rummage around and produce from the cypher a desired piece of
    equipment (not an artifact) whose level does not exceed the cypher's
    level. The piece of equipment persists for up to one day, unless its
    fundamental nature allows only a single use (such as with a grenade).
  pt-BR: >-
    Tradução em breve.
effect_table: null
