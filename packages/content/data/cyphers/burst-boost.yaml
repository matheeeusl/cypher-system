id: burst-boost
name:
  en: 'Burst boost'
  pt-BR: 'Ampliação em Rajada'
category: power_boost
page_ref: 'Cypher System Rulebook, p. 401'
level_range: '1d6 + 2'
effect_text:
  en: >-
    This cypher boosts an ability that affects a single target at short range
    or farther. The range decreases to immediate, but the ability affects all
    targets within immediate range.
  pt-BR: >-
    Este cypher aprimora uma habilidade que afeta um único alvo a alcance
    curto ou maior. O alcance da habilidade passa a ser imediato, mas ela
    passa a afetar todos os alvos dentro do alcance imediato.
effect_table: null
