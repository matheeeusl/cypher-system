id: stasis-keeper
name: { en: 'Stasis keeper', 'pt-BR': 'Mantenedor de estase' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 398'
level_range: '1d6'
effect_text:
  en: >-
    Puts a subject into stasis for a number of days equal to the cypher's
    level, or until it is violently disturbed. An object in stasis does not
    age and comes out of the stasis alive and in the same condition as it went
    in, with no memory of the period of inactivity.
  pt-BR: >-
    Coloca um alvo em estase por uma quantidade de dias igual ao nível
    da cifra, ou até ser perturbado violentamente. Um objeto em estase
    não envelhece e sai da estase vivo e nas mesmas condições em que
    entrou, sem nenhuma memória do período de inatividade.
effect_table: null
