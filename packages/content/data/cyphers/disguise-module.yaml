id: disguise-module
name: { en: 'Disguise module', 'pt-BR': 'Módulo de disfarce' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 388'
level_range: '1d6 + 2'
effect_text:
  en: >-
    For the next ten minutes per cypher level, the user's features become almost identical to those of
    one designated person they have previously interacted with, easing by two steps attempts to disguise the user as that person.
    Once designated, the user cannot shift the effect to look like another person,
    though they can remove the module to look like themselves again before the end of the duration.
  pt-BR: >-
    Pelos próximos dez minutos por nível da cifra, as feições do usuário
    se tornam quase idênticas às de uma pessoa designada com quem ele já
    interagiu anteriormente, facilitando em dois níveis as tentativas de
    disfarçar o usuário como essa pessoa. Uma vez designada, o usuário
    não pode mudar o efeito para se parecer com outra pessoa, embora
    possa remover o módulo para voltar a se parecer consigo mesmo antes
    do fim da duração.
effect_table: null
