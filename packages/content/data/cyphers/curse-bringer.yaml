id: curse-bringer
name: { en: 'Curse bringer', 'pt-BR': 'Portador de Maldição' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 386'
level_range: '1d6 + 1'
effect_text:
  en: >-
    The cypher can be activated when given to an individual who doesn't realize its significance.
    The next time the victim attempts an important task when the cypher is in their possession,
    the task is hindered by three steps.
  pt-BR: >-
    A cifra pode ser ativada quando entregue a alguém que não percebe sua
    importância. Na próxima vez que a vítima tentar uma tarefa importante
    enquanto estiver com a cifra em sua posse, a tarefa é prejudicada em
    três níveis.
effect_table: null
