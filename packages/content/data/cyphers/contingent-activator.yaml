id: contingent-activator
name: { en: 'Contingent activator', 'pt-BR': 'Ativador contingente' }
category: subtle
page_ref: 'Cypher System Rulebook, page 386'
level_range: '1d6 + 2'
effect_text:
  en: >-
    If the device is activated in conjunction with another cypher, the user can specify a condition under which the linked cypher will activate.
    The linked cypher retains the contingent command until it is used (either normally or contingently).
    For example, when this cypher is linked to a cypher that provides a form of healing or protection,
    the user could specify that the linked cypher will activate if they become damaged to a certain degree or
    are subject to a particular dangerous circumstance. Until the linked cypher is used, this cypher continues
    to count toward the maximum number of cyphers a PC can carry.
  pt-BR: >-
    Se o dispositivo for ativado em conjunto com outra cifra, o usuário
    pode especificar uma condição sob a qual a cifra vinculada será
    ativada. A cifra vinculada mantém o comando contingente até ser usada
    (seja normalmente, seja de forma contingente). Por exemplo, quando
    esta cifra é vinculada a uma cifra que oferece algum tipo de cura ou
    proteção, o usuário pode especificar que a cifra vinculada será
    ativada se ele sofrer dano até certo ponto ou for submetido a uma
    circunstância perigosa específica. Até que a cifra vinculada seja
    usada, esta cifra continua contando para o número máximo de cifras
    que um PJ pode carregar.
effect_table: null
