id: contingent-activator
name: { en: 'Contingent activator', 'pt-BR': 'Tradução em breve.' }
category: subtle
page_ref: 'Cypher System Rulebook, page 386'
level_range: '1d6 + 2'
effect_text:
  en: >-
    If the device is activated in conjunction with another cypher, the user can specify a condition under which the linked cypher will activate.
    The linked cypher retains the contingent command until it is used (either normally or contingently).
    For example, when this cypher is linked to a cypher that provides a form of healing or protection,
    the user could specify that the linked cypher will activate if they become damaged to a certain degree or
    are subject to a particular dangerous circumstance. Until the linked cypher is used, this cypher continues
    to count toward the maximum number of cyphers a PC can carry.
  pt-BR: >-
    Se o dispositivo for ativado em conjunto com outro cypher, o usuário pode especificar uma condição sob a qual o cypher vinculado será ativado.
    O cypher vinculado retém o comando contingente até ser usado (de forma normal ou contingente).
    Por exemplo, quando este cypher é vinculado a um cypher que fornece uma forma de cura ou proteção,
    o usuário pode especificar que o cypher vinculado será ativado se eles forem danificados a um certo grau ou
    estiverem sujeitos a uma circunstância perigosa particular. Até que o cypher vinculado seja usado, este cypher continua
    a contar para o número máximo de cyphers que um PJ pode carregar.
effect_table: null
