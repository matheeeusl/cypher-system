id: disrupting
name: { en: 'Disrupting', 'pt-BR': 'Tradução em breve.' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 388'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, each time the user strikes a solid creature or object,
    the attack generates a burst of nanites that directly attack its organic cells.
    The target takes 1 additional point of damage. If the target's level is less than the cypher's level,
    it loses its next action; otherwise its next action is hindered.
  pt-BR: >-
    Tradução em breve.
effect_table: null
