id: information-sensor
name: { en: 'Information sensor', 'pt-BR': 'Sensor de informações' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 391'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Over the course of one day, the user can activate the cypher a total
    number of times equal to its level. Each time, they can select a living
    creature within long range and learn the following about it: level,
    origin, species, name, and possibly other facts (such as an individual's
    credit score, home address, phone number, and related information).
  pt-BR: >-
    Ao longo de um dia, o usuário pode ativar a cifra um número total de
    vezes igual ao seu nível. A cada vez, pode selecionar uma criatura
    viva dentro de uma distância longa e descobrir o seguinte sobre ela:
    nível, origem, espécie, nome e possivelmente outros fatos (como
    pontuação de crédito, endereço residencial, número de telefone e
    informações relacionadas de um indivíduo).
effect_table: null
