id: detonation-creature
name: { en: 'Detonation (creature)', 'pt-BR': 'Detonação (criatura)' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 386'
level_range: '1d6 + 1'
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that explodes and creates a momentary teleportation gate.
    A random creature whose level is equal to or less than the cypher's level appears through the gate and attacks the closest target.
    After about one minute, the creature vanishes.
    (All damaging detonations inflict a minimum of 2 points of damage to those in the radius, regardless of attack or defense rolls.)
  pt-BR: >-
    Projeta um pequeno explosivo físico a até uma distância longa, que
    explode e cria um portal de teletransporte momentâneo. Uma criatura
    aleatória de nível igual ou inferior ao da cifra surge através do
    portal e ataca o alvo mais próximo. Após cerca de um minuto, a
    criatura desaparece. (Todas as detonações que causam dano infligem
    no mínimo 2 pontos de dano a quem estiver no raio de alcance,
    independentemente das rolagens de ataque ou defesa.)
effect_table: null
