id: monohorn
name: { en: 'Monohorn', 'pt-BR': 'Monochifre' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 393'
level_range: '1d6 + 3'
effect_text:
  en: |-
    The user gains a horn in the center of their forehead. The horn is deadly
    sharp and strong, and it spirals down to a solid base where it fuses with
    their flesh and bone. The user is specialized in making melee attacks with
    the horn, which is considered a medium weapon. The horn lasts for a number
    of hours equal to the cypher's level.

    Sometimes a monohorn cypher covers the user in a thin sheen of black hide-
    like material, which disguises their identity but doesn't interfere with
    their senses.
  pt-BR: |-
    O usuário ganha um chifre no centro da testa. O chifre é mortalmente
    afiado e resistente, afunilando-se até uma base sólida onde se funde
    com sua carne e osso. O usuário é especializado em realizar ataques
    corpo a corpo com o chifre, que é considerado uma arma média. O
    chifre dura uma quantidade de horas igual ao nível da cifra.

    Às vezes, uma cifra monochifre cobre o usuário com uma fina camada
    de material semelhante a couro negro, que disfarça sua identidade,
    mas não interfere em seus sentidos.
effect_table: null
