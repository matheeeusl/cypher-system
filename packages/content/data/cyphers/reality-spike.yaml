id: reality-spike
name: { en: 'Reality spike', 'pt-BR': 'Pico de realidade' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 395'
level_range: '1d6 + 4'
effect_text:
  en: >-
    Once activated, the cypher does not move—ever—even if activated in midair.
    A Might action will dislodge it, but then it is ruined.
  pt-BR: >-
    Uma vez ativada, a cifra não se move — nunca — mesmo que ativada no
    ar. Uma ação de Força consegue deslocá-la, mas, então, ela fica
    destruída.
