id: uninterruptible-power-source
name: { en: 'Uninterruptible power source', 'pt-BR': 'Tradução em breve.' }
category: manifest
page_ref: 'Cypher System Rulebook, page 399'
level_range: '1d6 + 4'
effect_text:
  en: >-
    Provides power to another device for up to a day. The device to be powered
    can be as simple as a light source or as complex as a small starcraft,
    assuming the cypher's level is equal to the item's power requirements. A
    desk lamp is a level 1 power requirement, a car engine is a level 5 power
    requirement, and a starship is a level 10 power requirement.
  pt-BR: >-
    Tradução em breve.
effect_table: null
