id: skill-boost
name: { en: 'Skill boost', 'pt-BR': 'Impulso de perícia' }
category: subtle
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6'
effect_text:
  en: >-
    Dramatically but temporarily alters the user's mind and body so they can
    ease one specific kind of physical action by three steps. Once activated,
    this boost can be used a number of times equal to the cypher's level, but
    only within a twenty-four-hour period. The boost takes effect each time
    the action is performed. For example, a level 3 cypher boosts the first
    three times that action is attempted. Roll a d100 to determine the action.
  pt-BR: >-
    Altera drástica, mas temporariamente, a mente e o corpo do usuário
    para que ele possa facilitar em três níveis um tipo específico de
    ação física. Uma vez ativado, esse impulso pode ser usado uma
    quantidade de vezes igual ao nível da cifra, mas apenas dentro de um
    período de vinte e quatro horas. O impulso entra em vigor a cada vez
    que a ação é realizada. Por exemplo, uma cifra de nível 3 intensifica
    as três primeiras vezes que essa ação é tentada. Role 1d100 para
    determinar a ação.
effect_table:
  label:
    en: 'Skill Boost Effects'
    pt-BR: 'Efeitos do Impulso de Perícia'
  entries:
    - range: '01–15'
      text: { en: 'Melee attack', 'pt-BR': 'Ataque corpo a corpo' }
    - range: '16–30'
      text: { en: 'Ranged attack', 'pt-BR': 'Ataque à distância' }
    - range: '31–40'
      text: { en: 'Speed defense', 'pt-BR': 'Defesa de Velocidade' }
    - range: '41–50'
      text: { en: 'Might defense', 'pt-BR': 'Defesa de Força' }
    - range: '51–60'
      text: { en: 'Intellect defense', 'pt-BR': 'Defesa de Intelecto' }
    - range: '61–68'
      text: { en: 'Jumping', 'pt-BR': 'Salto' }
    - range: '69–76'
      text: { en: 'Climbing', 'pt-BR': 'Escalada' }
    - range: '77–84'
      text: { en: 'Running', 'pt-BR': 'Corrida' }
    - range: '85–92'
      text: { en: 'Swimming', 'pt-BR': 'Natação' }
    - range: '93–94'
      text: { en: 'Sneaking', 'pt-BR': 'Esgueirar-se' }
    - range: '95–96'
