id: heat-attack
name: { en: 'Heat attack', 'pt-BR': 'Ataque de calor' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 390'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, each time the user strikes a solid creature or object,
    the attack generates a burst of heat that inflicts 2 additional points of
    damage.
  pt-BR: >-
    Pelo próximo dia, toda vez que o usuário atingir uma criatura ou
    objeto sólido, o ataque gera uma rajada de calor que inflige 2
    pontos adicionais de dano.
