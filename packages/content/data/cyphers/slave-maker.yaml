id: slave-maker
name: { en: 'Slave maker', 'pt-BR': 'Escravizador' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 397'
level_range: '1d6 + 2'
effect_text:
  en: >-
    To activate the cypher, the user must succeed on a melee attack against a
    creature about the size of the user and whose level does not exceed the
    cypher's level. The cypher bonds to the target, who immediately becomes
    calm. The target awaits the user's commands and carries out all orders to
    the best of its ability. The target remains so enslaved for a number of
    hours equal to the cypher's level minus the target's level. (If the result
    is 0, the target is enslaved for only one minute.)
  pt-BR: >-
    Para ativar a cifra, o usuário deve ter sucesso em um ataque corpo
    a corpo contra uma criatura de tamanho aproximado ao seu e cujo
    nível não exceda o da cifra. A cifra se vincula ao alvo, que fica
    imediatamente calmo. O alvo aguarda os comandos do usuário e cumpre
    todas as ordens da melhor forma possível. O alvo permanece
    escravizado assim por uma quantidade de horas igual ao nível da
    cifra menos o nível do alvo. (Se o resultado for 0, o alvo fica
    escravizado por apenas um minuto.)
effect_table: null
