id: target-boost
name: { en: 'Target boost', 'pt-BR': 'Impulso de alvo' }
category: power_boost
page_ref: 'Cypher System Rulebook, p. 401'
level_range: '1d6 + 2'
effect_text:
  en: >-
    This cypher boosts an ability that affects a target at a range greater
    than touch. It can affect a second target within range (if the ability is
    an attack, make a separate attack roll for the second creature).
  pt-BR: >-
    Esta cifra intensifica uma habilidade que afeta um alvo a um
    alcance maior que toque. Ela pode afetar um segundo alvo dentro do
    alcance (se a habilidade for um ataque, faça uma rolagem de ataque
    separada para a segunda criatura).
effect_table: null
