id: memory-switch
name: { en: 'Memory switch', 'pt-BR': 'Interruptor de memória' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 392'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The user selects a point within long range, and the minds of all thinking
    creatures within immediate range of that point are attacked. Victims are
    dazed and take no action for a round, and they have no memory of the
    preceding hour.
  pt-BR: >-
    O usuário seleciona um ponto dentro de uma distância longa, e as
    mentes de todas as criaturas pensantes dentro de uma distância
    imediata desse ponto são atacadas. As vítimas ficam atordoadas e não
    realizam nenhuma ação por uma rodada, e não têm nenhuma memória da
    hora anterior.
effect_table: null
