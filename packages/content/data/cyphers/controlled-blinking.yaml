id: controlled-blinking
name: { en: 'Controlled blinking', 'pt-BR': 'Piscar controlado' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 386'
level_range: '1d6 + 2'
effect_text:
  en: >-
    For the next day, each time the user is struck hard enough to inflict damage (but no more than once per round),
    they teleport to a spot they desire within immediate range. Since they are prepared for this effect and their foe
    is not, the user's defenses are eased for one round after they teleport
  pt-BR: >-
    Pelo próximo dia, toda vez que o usuário for atingido com força
    suficiente para sofrer dano (mas no máximo uma vez por rodada), ele
    se teleporta para um local à sua escolha dentro de uma distância
    imediata. Como está preparado para esse efeito e seu inimigo não, as
    defesas do usuário são facilitadas por uma rodada após o
    teletransporte.
effect_table: null
