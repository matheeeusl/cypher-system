id: controlled-blinking
name: { en: "Controlled blinking", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 386"
level_range: "1d6 + 2"
effect_text:
  en: >-
    For the next day, each time the user is struck hard enough to inflict damage (but no more than once per round),
    they teleport to a spot they desire within immediate range. Since they are prepared for this effect and their foe
    is not, the user's defenses are eased for one round after they teleport
  pt-BR: >-
    Tradução em breve.
effect_table: null