id: banishing
name:
  en: 'Banishing'
  pt-BR: 'Banimento'
category: fantastic
page_ref: 'Cypher System Rulebook, page 384'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, each time the user strikes a solid creature or object,
    it generates a burst of energy that teleports the creature or object an
    immediate distance in a random direction (not up or down).
    The teleported creature's actions (including defense) are hindered on its
    next turn (hindered by two steps if the cypher level is 5 or higher).
  pt-BR: >-
    Durante o próximo dia, sempre que o usuário atingir uma criatura sólida ou
    um objeto, ele gera uma explosão de energia que teletransporta a criatura
    ou o objeto uma distância imediata em uma direção aleatória (nunca para
    cima nem para baixo). As ações da criatura teletransportada (incluindo a
    defesa) ficam dificultadas em seu próximo turno (dificultadas em dois
    passos se o nível do cypher for 5 ou superior).
effect_table: null
