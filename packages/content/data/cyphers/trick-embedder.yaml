id: trick-embedder
name: { en: 'Trick embedder', 'pt-BR': 'Incorporador de truques' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 399'
level_range: '1d6'
effect_text:
  en: >-
    A nonintelligent animal immediately and perfectly learns one trick (two
    tricks if the cypher is level 4 or higher) it is capable of physically
    performing (roll over, heel, spin, shake, go to an indicated place within
    long range, and so on). The trick must be designated when the cypher is
    activated.
  pt-BR: >-
    Um animal não inteligente aprende imediata e perfeitamente um
    truque (dois truques se a cifra for de nível 4 ou superior) que
    seja capaz de realizar fisicamente (rolar, sentar ao lado, girar,
    dar a pata, ir até um local indicado dentro de uma distância longa,
    e assim por diante). O truque deve ser designado no momento em que
    a cifra é ativada.
effect_table: null
