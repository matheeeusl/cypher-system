id: teleporter-interstellar
name: { en: 'Teleporter (interstellar)', 'pt-BR': 'Teletransportador (interestelar)' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 398'
level_range: '1d6 + 4'
effect_text:
  en: >-
    User teleports anywhere in the galaxy to a location they have previously
    visited or seen. They arrive safely with their possessions but cannot take
    anything else with them.
  pt-BR: >-
    O usuário se teleporta para qualquer lugar da galáxia, até um local
    que já tenha visitado ou visto anteriormente. Ele chega em segurança
    com seus pertences, mas não pode levar mais nada consigo.
effect_table: null
