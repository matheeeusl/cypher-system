id: flame-retardant-wall
name: { en: 'Flame-retardant wall', 'pt-BR': 'Parede retardante de chamas' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 388'
level_range: '1d6'
effect_text:
  en: >-
    Creates an immobile plane of permeable energy up to 20 feet by 20 feet (6
    m by 6 m) for one hour per cypher level. The plane conforms to the space
    available. Flames passing through the plane are extinguished.
  pt-BR: >-
    Cria um plano imóvel de energia permeável de até 6 por 6 metros (20
    por 20 pés) por uma hora por nível da cifra. O plano se adapta ao
    espaço disponível. Chamas que passam pelo plano são extintas.
effect_table: null
