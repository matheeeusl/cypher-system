id: psychic-communique
name: { en: 'Psychic communique', 'pt-BR': 'Comunicado psíquico' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Allows the user to project a one-time, one-way telepathic message of up to
    ten words per cypher level, with an unlimited range, to anyone they know.
  pt-BR: >-
    Permite que o usuário projete uma mensagem telepática única e
    unidirecional de até dez palavras por nível da cifra, com alcance
    ilimitado, para qualquer pessoa que conheça.
effect_table: null
