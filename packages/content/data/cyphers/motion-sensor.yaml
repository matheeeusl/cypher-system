id: motion-sensor
name: { en: 'Motion sensor', 'pt-BR': 'Sensor de movimento' }
category: subtle
page_ref: 'Cypher System Rulebook, page 393'
level_range: '1d6 + 2'
effect_text:
  en: >-
    For one hour per cypher level, the user knows when any movement occurs
    within short range, and when large creatures or objects move within long
    range (the cypher distinguishes between the two). It also indicates the
    number and size of the creatures or objects in motion.
  pt-BR: >-
    Por uma hora por nível da cifra, o usuário sabe quando qualquer
    movimento ocorre dentro de uma distância curta, e quando criaturas
    ou objetos grandes se movem dentro de uma distância longa (a cifra
    distingue entre os dois casos). Também indica o número e o tamanho
    das criaturas ou objetos em movimento.
effect_table: null
