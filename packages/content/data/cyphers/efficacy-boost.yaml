id: efficacy-boost
name: { en: 'Efficacy boost', 'pt-BR': 'Impulso de eficácia' }
category: power_boost
page_ref: 'Claim the Sky, page 157'
level_range: '1d6 + 1'
effect_text:
  en: >-
    This cypher boosts an ability that requires a skill roll. The use of the
    ability is eased (eased by two steps if the cypher is level 5 or higher).
  pt-BR: >-
    Esta cifra intensifica uma habilidade que exige uma rolagem de
    perícia. O uso da habilidade é facilitado (facilitado em dois níveis
    se a cifra for de nível 5 ou superior).
