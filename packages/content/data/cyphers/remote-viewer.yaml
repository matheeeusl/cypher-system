id: remote-viewer
name: { en: 'Remote viewer', 'pt-BR': 'Visor remoto' }
category: manifest
page_ref: 'Cypher System Rulebook, page 396'
level_range: '1d6'
effect_text:
  en: >-
    For one hour per cypher level, the user can see everything going on in the
    vicinity of the cypher, regardless of the distance between them.
  pt-BR: >-
    Por uma hora por nível da cifra, o usuário consegue ver tudo o que
    acontece nas proximidades da cifra, independentemente da distância
    entre eles.
effect_table: null
