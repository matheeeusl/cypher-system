id: ray-emitter-command
name: { en: 'Ray emitter (command)', 'pt-BR': 'Emissor de raio (comando)' }
category: fantastic
page_ref: 'Cypher System Rulebook, p. 395'
level_range: '1d6 + 2'
effect_text:
  en: >-
    Allows the user to project a ray up to long range (very long range if the
    cypher is level 6 or higher) that forces a target to obey the next verbal
    command given (if it is understood) for one round per cypher level.
  pt-BR: >-
    Permite que o usuário projete um raio a até uma distância longa
    (muito longa se a cifra for de nível 6 ou superior) que força um
    alvo a obedecer ao próximo comando verbal dado (se for compreendido)
    por uma rodada por nível da cifra.
effect_table: null
