id: effect-resistance
name: { en: 'Effect resistance', 'pt-BR': 'Tradução em breve.' }
category: subtle
page_ref: 'Cypher System Rulebook, page 388'
level_range: '1d6 + 1'
effect_text:
  en: >-
    Provides a chance for additional resistance to directly damaging effects
    of all kinds, such as fire, lightning, and the like, for one day. (It does
    not provide resistance to blunt force, slashing, or piercing attacks.) If
    the level of the effect is of the cypher level or lower, the user gains an
    additional defense roll to avoid it. On a successful defense roll, treat
    the attack as if the user had succeeded on their regular defense roll. (If
    the user is an NPC, a PC attacking them with this kind of effect must
    succeed on two attack rolls to harm them.)
  pt-BR: >-
    Tradução em breve.
effect_table: null
