id: shock-attack
name: { en: 'Shock attack', 'pt-BR': 'Ataque de choque' }
category: fantastic
page_ref: 'Cypher System Rulebook, page 396'
level_range: '1d6'
effect_text:
  en: >-
    For the next day, each time the user strikes a solid creature or object,
    the attack generates a burst of electricity, inflicting 1 additional point
    of damage (2 points if the cypher is level 4 or higher, 3 points if the
    cypher is level 6 or higher).
  pt-BR: >-
    Pelo próximo dia, toda vez que o usuário atingir uma criatura ou
    objeto sólido, o ataque gera uma descarga elétrica, infligindo 1
    ponto adicional de dano (2 pontos se a cifra for de nível 4 ou
    superior, 3 pontos se for de nível 6 ou superior).
effect_table: null
