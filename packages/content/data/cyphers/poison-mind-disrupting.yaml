id: poison-mind-disrupting
name: { en: 'Poison (mind disrupting)', 'pt-BR': 'Veneno (disruptor mental)' }
category: manifest
page_ref: 'Cypher System Rulebook, p. 394'
level_range: '1d6 + 2'
effect_text:
  en: >-
    The victim suffers Intellect damage equal to the cypher's level and cannot
    take actions for a number of rounds equal to the cypher's level.
  pt-BR: >-
    A vítima sofre dano de Intelecto igual ao nível da cifra e não pode
    realizar ações por uma quantidade de rodadas igual ao nível da
    cifra.
effect_table: null
