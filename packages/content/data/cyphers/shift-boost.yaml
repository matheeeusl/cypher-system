id: shift-boost
name: { en: 'Shift boost', 'pt-BR': 'Impulso de Mudança' }
category: power_boost
page_ref: 'Claim the Sky, page 158'
level_range: '1d6 + 2'
effect_text:
  en: >-
    This cypher boosts one power shift that the user already has, granting
    them an additional power shift in that category that lasts for one round.
    For example, if the user has a shift in resilience, they can use this
    cypher to gain an additional shift in resilience for one round. If the
    user has more than one kind of power shift (such as dexterity and
    strength), they choose which kind of power shift to boost.
  pt-BR: >-
    Esta cifra intensifica uma mudança de poder que o usuário já possui,
    concedendo-lhe uma mudança de poder adicional naquela categoria, que
    dura uma rodada. Por exemplo, se o usuário tem uma mudança em
    resiliência, pode usar esta cifra para ganhar uma mudança adicional
    em resiliência por uma rodada. Se o usuário tem mais de um tipo de
    mudança de poder (como destreza e força), ele escolhe qual tipo de
    mudança de poder intensificar.
effect_table: null
