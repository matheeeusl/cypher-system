id: keeps-a-magic-ally
name:
  en: Keeps a Magic Ally
  pt-BR: Mantém um Aliado Mágico
description:
  en: >-
    An allied magic creature bound to an object (such as a minor djinn
    in a lamp, or a ghost in a pipe) is your friend, protector, and
    weapon.
  pt-BR: >-
    Uma criatura mágica aliada, vinculada a um objeto (como um djinn
    menor em uma lâmpada, ou um fantasma em um cano), é sua amiga, sua
    protetora e sua arma.
tier_abilities:
