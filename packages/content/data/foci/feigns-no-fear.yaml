id: feigns-no-fear
name:
  en: Feigns No Fear
  pt-BR: Finge Não Sentir Medo
description:
  en: >-
    Everyone thinks you're brave, intrepid—fearless, even. They tell
    stories about you, the person who's never felt fear, how you went
    out to seek what you see as an elusive emotion and never found it.
    But you know the truth. You may present yourself as someone who is
    fearless and courageous, but deep down, you are terrified of
    everything. Fear drives you, and in its face, you stand tall and
    shout the loudest. Because you are also afraid of being seen for
    who you truly are.
  pt-BR: >-
    Todos pensam que você é corajoso, intrépido — até destemido. Contam
    histórias sobre você, a pessoa que nunca sentiu medo, sobre como
    você saiu em busca daquilo que vê como uma emoção elusiva e nunca a
    encontrou. Mas você sabe a verdade. Você pode se apresentar como
    alguém destemido e corajoso, mas, no fundo, tem medo de tudo. O
    medo o move, e diante dele, você se mantém firme e grita mais alto
    que todos. Porque você também tem medo de ser visto por quem
    realmente é.
