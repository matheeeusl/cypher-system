id: stretches
name:
  en: Stretches
  pt-BR: Estica-se
description:
  en: Your armor, along with your size, strength, incredible training, or machine enhancement, makes you difficult to move or hurt.
  pt-BR: Sua armadura, junto com seu tamanho, força, treinamento incrível, ou aprimoramento mecânico, torna você difícil de mover ou ferir.
  # Note: this flavor line is printed identically under Stands Like a
  # Bastion (page 353) — appears to be a source-side copy/paste
  # duplication (Stretches' actual theme is elasticity/flexibility,
  # not armor), not a transcription error on this project's part.
  # Transcribed verbatim per the content-accuracy rule.
