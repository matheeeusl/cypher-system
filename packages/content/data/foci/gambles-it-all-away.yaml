id: gambles-it-all-away
name:
  en: Gambles It All Away
  pt-BR: Aposta Tudo
description:
  en: >-
    How long have you been haunting the card tables? Seems like a
    lifetime. You probably played your first hand of poker before you
    could even read words. People, though, were much easier to
    understand. You could always read other folks' tells, whether
    that's squinting, tapping, stammering, pulling at their earlobe,
    or any of a thousand other ways you know when to call their
    bluffs. Which is not to say you haven't walked away from the
    table in the hole. But you've always been able to make it up
    later. So far, anyway. Lately, you've been having weird dreams of
    loss and void. Is Lady Luck fixin' to turn her back on you? You
    hope not, because there ain't nothing in the world keeping you
    from gambling it all away.
  pt-BR: >-
    Há quanto tempo você assombra as mesas de cartas? Parece uma vida
    inteira. Você provavelmente jogou sua primeira mão de pôquer
    antes mesmo de saber ler. As pessoas, porém, sempre foram mais
    fáceis de entender. Você sempre soube ler os tiques dos outros,
    seja um piscar de olhos, um tamborilar de dedos, uma gagueira, um
    puxar de orelha, ou qualquer uma das mil outras formas de saber
    quando desmascarar um blefe. O que não quer dizer que você nunca
    tenha saído de uma mesa no vermelho. Mas sempre conseguiu se
    recuperar depois. Até agora. Ultimamente, você tem tido sonhos
    estranhos de perda e vazio. Será que a Sorte está prestes a lhe
    virar as costas? Espera que não, porque não há nada no mundo que
    o impeça de apostar tudo.
tier_abilities:
  '1':
    - kind: granted
      ability_id: gambler
    - kind: granted
      ability_id: interaction-skills
  '2':
    - kind: granted
      ability_id: courting-lady-luck
  '3':
