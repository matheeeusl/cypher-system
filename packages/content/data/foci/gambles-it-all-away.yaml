      options:
        - call-their-bluff
        - card-genius
      count: 1
  '4':
    - kind: granted
      ability_id: winning-hand
  '5':
    - kind: granted
      ability_id: consequences-of-luck
  '6':
    - kind: choice
      options:
        - fate-breaker
        - gambling-god
      count: 1
type_swap_option: null
additional_equipment:
  en: A deck of especially fine playing cards.
  pt-BR: Um baralho de cartas de jogar especialmente refinado.
connection_options:
  - en: >-
      Pick one other PC. They beat you in a game of cards or dice
      when you totally thought you had them figured out. You
      befriended them rather than taking it personally (though it's
      possible you've won that and more back since).
    pt-BR: >-
      Escolha outro PJ. Ele venceu você num jogo de cartas ou dados
      quando você tinha certeza de que o tinha entendido completamente.
      Você preferiu fazer amizade a levar para o lado pessoal (embora
      seja possível que já tenha recuperado aquilo e mais um pouco
      desde então).
  - en: >-
      Pick one other PC. Whenever they sit next to you, Lady Luck
      seems to notice. Sometimes your tasks are eased, other times
      hindered, and you never know ahead of time how things will go
      for a given game.
    pt-BR: >-
      Escolha outro PJ. Sempre que ele senta ao seu lado, a Sorte
      parece notar. Às vezes suas tarefas são facilitadas, outras
      vezes dificultadas, e você nunca sabe de antemão como as coisas
      vão se desenrolar numa dada partida.
  - en: >-
      Pick one other PC. This character doesn't seem to care for how
      you make your living at the card tables.
    pt-BR: >-
      Escolha outro PJ. Esse personagem parece não aprovar a forma
      como você ganha a vida nas mesas de cartas.
  - en: >-
      Pick one other PC. When you were hurt by another gambler whose
      clock you cleaned, they stood up for you at great risk to
      themself.
    pt-BR: >-
      Escolha outro PJ. Quando você foi ferido por outro apostador que
      você havia derrotado, ele o defendeu correndo um grande risco.
minor_effect_suggestion:
  en: Your next gambling, wagering, or similar task is eased.
  pt-BR: Sua próxima tarefa de jogo, aposta ou similar é facilitada.
major_effect_suggestion:
  en: You win a wager.
  pt-BR: Você vence uma aposta.
