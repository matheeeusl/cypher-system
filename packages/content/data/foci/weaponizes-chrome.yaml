id: weaponizes-chrome
name:
  en: Weaponizes Chrome
  pt-BR: Arma-se com Cromo
description:
  en: >-
    Some of your organic parts have been replaced with artificial
    components. Like most people in the city, you are a cyborg, but
    your augmentations are extensive, and your chrome parts are
    specialized for melee combat. You almost certainly have metal
    plating and technical components visible on your skin. As you
    advance, you can add to, modify, or discover new functions for
    your machine parts.
  pt-BR: >-
    Algumas de suas partes orgânicas foram substituídas por
    componentes artificiais. Como a maioria das pessoas na cidade,
    você é uma ciborgue, mas suas modificações são extensas, e suas
    peças cromadas são especializadas para combate corpo a corpo.
    Você quase certamente tem placas de metal e componentes técnicos
    visíveis na pele. Conforme avança, você pode adicionar, modificar,
    ou descobrir novas funções para suas peças mecânicas.
tier_abilities:
  '1':
    - kind: granted
      ability_id: bash
    - kind: granted
      ability_id: melee-chrome
  '2':
    - kind: granted
      ability_id: weapon-defense
  '3':
    - kind: choice
      options:
        - heavy-integrated-weapon
        - rapid-attack
      count: 1
  '4':
    - kind: granted
      ability_id: reliable-weaponry
  '5':
    - kind: granted
      ability_id: extreme-mastery
  '6':
    - kind: choice
      options:
        - lethal-damage
        - ultra-enhancement
      count: 1
type_swap_option:
  ability_ids:
    - integrated-weapon
additional_equipment: null
connection_options:
  - en: Pick one other PC. You think they shows potential for learning your combat style (and choice of chrome), but you're not necessarily qualified to teach them.
    pt-BR: Escolha outro PJ. Você acha que ele mostra potencial para aprender seu estilo de combate (e escolha de cromo), mas você não é necessariamente qualificada para ensiná-lo.
  - en: Pick one other PC. They once paid for repairs on a treasured item you own. You feel like you owe them, even though you may have already paid them back.
    pt-BR: Escolha outro PJ. Ele uma vez pagou por reparos em um item estimado que você possui. Você sente que deve algo a ele, mesmo que já tenha pagado de volta.
  - en: Pick one other PC. You once saved their life, and they clearly feel indebted to you (you wish they didn't, it was just part of the job).
    pt-BR: Escolha outro PJ. Você uma vez salvou a vida dele, e ele claramente se sente em dívida com você (você gostaria que não se sentisse, era só parte do trabalho).
  - en: Pick one other PC. This person recently mocked your combat stance. How you deal with this (if at all) is up to you.
    pt-BR: Escolha outro PJ. Essa pessoa recentemente zombou de sua postura de combate. Como você lida com isso (se é que lida) cabe a você decidir.
minor_effect_suggestion:
  en: Your software learns from your successful actions, granting you an asset on a similar action involving the same task (such as making attacks against the same foe or operating the same device).
  pt-BR: Seu software aprende com suas ações bem-sucedidas, concedendo um bônus em uma ação semelhante envolvendo a mesma tarefa (como atacar o mesmo inimigo ou operar o mesmo dispositivo).
major_effect_suggestion:
  en: Make an additional attack with a melee weapon as part of your turn.
  pt-BR: Faça um ataque adicional com uma arma corpo a corpo como parte do seu turno.
