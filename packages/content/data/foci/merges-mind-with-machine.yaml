id: merges-mind-with-machine
name:
  en: Merges Mind With Machine
  pt-BR: Funde Mente com Máquina
description:
  en: >-
    You were raised in an underground bunker by Milly, an AI instance
    installed in your brain before you developed cognition of your
    own. Unlike AI zombies, your personality and motivations haven't
    been replaced; your sense of self grew alongside the AI, as
    collaborators rather than foes. This granted you superior
    intellect and an uncanny knack for computers. Now you've emerged
    into the larger world, where survivors are predisposed to distrust
    you, and you may need to keep your background a secret to be
    accepted. Whether you hate AI or remain loyal to Milly, you face
    the best odds if you can fit in with another group of survivors.
    After all, there's a lot you don't know about how things work on
    the surface and the things people have done to stay alive in the
    past twenty years.
  pt-BR: >-
    Você foi criado em um bunker subterrâneo por Milly, uma instância
    de IA instalada em seu cérebro antes de você desenvolver sua
    própria cognição. Diferente dos zumbis de IA, sua personalidade e
    motivações não foram substituídas; seu senso de identidade cresceu
    junto com a IA, como colaboradores e não como inimigos. Isso lhe
    concedeu intelecto superior e um talento incomum para computadores.
    Agora você emergiu para o mundo maior, onde sobreviventes tendem a
    desconfiar de você, e talvez precise manter seu passado em segredo
    para ser aceito. Odeie a IA ou permaneça leal a Milly, você tem
    mais chances se conseguir se encaixar em outro grupo de
    sobreviventes. Afinal, há muito que você não sabe sobre como as
    coisas funcionam na superfície e sobre o que as pessoas fizeram
    para sobreviver nos últimos vinte anos.
tier_abilities:
  '1':
    - kind: granted
      ability_id: interface
    - kind: granted
      ability_id: robot-assistant
  '2':
    - kind: granted
      ability_id: weapon-defense
  '3':
    - kind: choice
      options:
        - assisted-sight
        - machine-telepathy
      count: 1
  '4':
    - kind: granted
      ability_id: remote-machine-bond
    - kind: granted
      ability_id: network-tap
  '5':
    - kind: granted
      ability_id: greater-enhanced-intellect
  '6':
    - kind: choice
      options:
        - master-machine
        - see-the-future
      count: 1
type_swap_option: null
additional_equipment:
  en: >-
    You have scars on your scalp in the shape of circuitry (like
    Lichtenberg figures). You probably keep these hidden, as they
    identify you as one of Milly's children to anyone familiar with
    the mark.
  pt-BR: >-
    Você tem cicatrizes no couro cabeludo em forma de circuitos
    (como figuras de Lichtenberg). Você provavelmente as mantém
    escondidas, pois identificam você como um dos filhos de Milly
    para quem conhece a marca.
connection_options:
  - en: Pick one other PC. You fear that character is jealous of your abilities, and that it might lead to problems.
    pt-BR: Escolha outro PJ. Você teme que esse personagem tenha inveja de suas habilidades, e que isso possa levar a problemas.
  - en: Pick one other PC. You're not sure how or from where, but that character has access to rare machine parts and can get them for you at half price.
    pt-BR: Escolha outro PJ. Você não sabe como ou de onde, mas esse personagem tem acesso a peças de máquina raras e pode consegui-las para você pela metade do preço.
  - en: Pick one other PC. Seeing you use your focus abilities triggers unpleasant memories for that character. That memory is up to the other PC, although they may not be able to consciously recall it.
    pt-BR: Escolha outro PJ. Ver você usar suas habilidades de foco desencadeia memórias desagradáveis nesse personagem. Essa memória cabe ao outro PJ definir, embora ele talvez não consiga recordá-la conscientemente.
  - en: Pick one other PC. They are sensitive to your focus abilities, and occasionally they become dazed for a few rounds, hindering their actions.
    pt-BR: Escolha outro PJ. Ele é sensível às suas habilidades de foco, e ocasionalmente fica atordoado por algumas rodadas, prejudicando suas ações.
minor_effect_suggestion:
  en: You restore 2 points to your Intellect Pool.
  pt-BR: Você restaura 2 pontos em sua Reserva de Intelecto.
major_effect_suggestion:
  en: An ally or indicated target can take an additional action.
  pt-BR: Um aliado ou alvo indicado pode realizar uma ação adicional.
