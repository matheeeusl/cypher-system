id: prepped-for-the-end
name:
  en: Prepped for the End
  pt-BR: Preparada para o Fim
description:
  en: >-
    You prepared for ultimate disaster, unlike most of the sheeple.
    Which means you stashed away food, water, and other survival gear
    when things were still okay. You trained yourself for harsh
    conditions, for basic machine and electronic repair, and maybe
    even in a musical instrument to pass the time in the bunker when
    no other entertainments could be had. You'd excel in a small group
    of other survivors, but you're ready to go it alone if that's what
    it takes. Above all, you're prepared to make it through whatever
    the future holds, no matter how daunting the odds. Because you
    prepped wisely.
  pt-BR: >-
    Você se preparou para o desastre final, diferente da maioria das
    "ovelhas". Isso significa que você guardou comida, água, e outros
    suprimentos de sobrevivência enquanto as coisas ainda estavam bem.
    Você se treinou para condições adversas, para reparos básicos de
    máquinas e eletrônicos, e talvez até em um instrumento musical
    para passar o tempo no bunker quando nenhum outro entretenimento
    estivesse disponível. Você se sairia bem em um pequeno grupo de
    outros sobreviventes, mas está pronta para seguir sozinha se for
    preciso. Acima de tudo, você está preparada para atravessar o que
    o futuro reservar, não importa quão assustadoras sejam as chances.
    Porque você se preparou com sabedoria.
tier_abilities:
  '1':
    - kind: granted
      ability_id: practiced-in-light-armor
    - kind: granted
      ability_id: prepared-caches
    - kind: granted
      ability_id: trained-for-toughing-it
  '2':
