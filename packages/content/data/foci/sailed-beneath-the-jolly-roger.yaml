id: sailed-beneath-the-jolly-roger
name:
  en: Sailed Beneath the Jolly Roger
  pt-BR: Navegou Sob a Bandeira Pirata
description:
  en: >-
    You sailed with a crew of dread pirates, but you've decided to
    end your days as a pirate and join some other cause. The question
    is, will your past let you go so easily?
  pt-BR: >-
    Você navegou com uma tripulação de piratas temíveis, mas decidiu
    encerrar seus dias como pirata e se juntar a outra causa. A
    questão é: seu passado a deixará ir tão facilmente?
