id: conjures-bullets
name:
  en: Conjures Bullets
  pt-BR: Conjura Balas
description:
  en: You blend sorcery and firearms into an amazing mix of magic and technology. Bullets and spells are almost interchangeable to you; your magic has a firearm motif and you cast using your gun. You might be a trick-shot sorcerer, a magical member of the armed forces, or an outlaw with a flair for arcane power. Gun nuts and wizard purists might look down on your blended technique, but you can do things that nobody else can do. You might call yourself a guncaster, spellshooter, or triggermage. You wear clothing that leaves your arms and hands free to use your weapon and cast spells, preferring something more flashy than a gunslinger's long coat and more intimidating than typical magician or witch clothing.
  pt-BR: Você mistura feitiçaria e armas de fogo em uma combinação incrível de magia e tecnologia. Balas e feitiços são quase intercambiáveis para você; sua magia tem um motivo de arma de fogo e você conjura usando sua arma. Você pode ser um feiticeiro de tiro certeiro, um membro mágico das forças armadas, ou um foragido com talento para o poder arcano. Fanáticos por armas e puristas da magia podem desdenhar de sua técnica mista, mas você consegue fazer coisas que ninguém mais consegue. Você pode se autodenominar conjurador de armas, atirador de feitiços, ou magiarma. Você usa roupas que deixam seus braços e mãos livres para usar sua arma e conjurar feitiços, preferindo algo mais chamativo que o longo casaco de um pistoleiro e mais intimidante que as vestes típicas de um mago ou bruxa.
tier_abilities:
  '1':
    - kind: granted
      ability_id: practiced-with-guns
    - kind: granted
      ability_id: spell-bullet
  '2':
    - kind: granted
      ability_id: gun-jammer
  '3':
    - kind: choice
      options:
        - iron-eye
        - trained-guncasting
      count: 1
  '4':
    - kind: granted
      ability_id: hasty-guncasting
  '5':
    - kind: granted
      ability_id: bullet-jaunt
  '6':
    - kind: choice
      options:
        - deadeye
        - special-shot
      count: 1
type_swap_option: null
additional_equipment:
  en: Medium or heavy handgun.
  pt-BR: Pistola média ou pesada.
connection_options:
  - en: >-
      Pick one other PC. You once grazed this character with one of your
      spell bullets; it's up to them whether they've forgiven you or
      still resent you for it.
    pt-BR: >-
      Escolha outro PJ. Você já feriu de raspão esse personagem com uma
      de suas balas encantadas; fica a critério dele se já o perdoou ou
      ainda guarda rancor por isso.
  - en: >-
      Pick one other PC. You've accidentally discovered that you can
      shoot their spells out of your gun just like you do with your own
      spells, but the PC must be touching your gun while you fire it.
    pt-BR: >-
      Escolha outro PJ. Você descobriu por acaso que consegue disparar
      os feitiços dele pela sua arma assim como faz com os seus
      próprios feitiços, mas o PJ precisa estar tocando sua arma
      enquanto você atira.
  - en: >-
      Pick one other PC. Based on your interactions, you think this
      character resents your use of guns, magic, or both.
    pt-BR: >-
      Escolha outro PJ. Com base em suas interações, você acha que esse
      personagem tem rancor do seu uso de armas, magia, ou ambos.
  - en: >-
      Pick one other PC. This character can barely hear your gunshots
      (magical or otherwise), which are no louder than a whisper to
      them.
    pt-BR: >-
      Escolha outro PJ. Esse personagem mal consegue ouvir seus tiros
      (mágicos ou não), que para ele não são mais altos que um sussurro.
minor_effect_suggestion:
  en: The attack hits the side of the foe's head, deafening them for a few minutes.
  pt-BR: O ataque atinge a lateral da cabeça do inimigo, ensurdecendo-o por alguns minutos.
major_effect_suggestion:
  en: The foe's major blood vessel is hit, causing them to bleed 1 point of damage each round until someone succeeds at a difficulty 3 Intellect or Speed task to bind the wound.
  pt-BR: Um vaso sanguíneo importante do inimigo é atingido, fazendo-o sangrar 1 ponto de dano a cada rodada até que alguém tenha sucesso em uma tarefa de Intelecto ou Agilidade de dificuldade 3 para estancar o ferimento.
