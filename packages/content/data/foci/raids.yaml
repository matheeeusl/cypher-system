id: raids
name:
  en: Raids
  pt-BR: Saqueia
description:
  en: >-
    When civilization fell, you did what you had to do to stay alive.
    Did you kill innocent people? Probably, insofar as anyone who
    survived the end can really be considered "innocent." You figured
    they'd have done the same to you. But whether they deserved it or
    not, you and the other raiders you ran with survived, and your
    targets did not. Then something life-changing happened to you,
    altering your perspective; it's up to you to decide what. In any
    case, you've turned over a new leaf. You don't indiscriminately
    kill anymore, though surviving is still a goal. But you've joined
    with others who you want to protect as much as or even more than
    your own life. You're done with raiding. But is raiding (and those
    who might recognize you as a raider) done with you?
  pt-BR: >-
    Quando a civilização caiu, você fez o que precisava para
    sobreviver. Você matou pessoas inocentes? Provavelmente, na
    medida em que qualquer um que sobreviveu ao fim pode realmente ser
    considerado "inocente". Você imaginou que eles teriam feito o
    mesmo com você. Mas independentemente de merecerem ou não, você e
    os outros saqueadores com quem andava sobreviveram, e seus alvos
    não. Então algo que mudou sua vida aconteceu com você, alterando
    sua perspectiva; cabe a você decidir o quê. De qualquer forma,
    você virou a página. Você não mata mais indiscriminadamente,
    embora sobreviver ainda seja um objetivo. Mas você se juntou a
    outros que quer proteger tanto ou mais que sua própria vida. Você
    terminou com os saques. Mas será que os saques (e aqueles que
    podem reconhecê-la como uma saqueadora) terminaram com você?
tier_abilities:
  '1':
    - kind: granted
      ability_id: ignore-the-pain
    - kind: granted
      ability_id: wilderness-life
  '2':
    - kind: granted
      ability_id: tinker
    - kind: granted
      ability_id: weather-the-vicissitudes
  '3':
    - kind: choice
      options:
        - raider-follower
        - grand-deception
      count: 1
  '4':
    - kind: granted
      ability_id: greater-frenzy
  '5':
    - kind: granted
      ability_id: using-the-environment
  '6':
    - kind: choice
      options:
        - deep-consideration
        - twisting-the-knife
      count: 1
type_swap_option: null
additional_equipment:
  en: You have a tattoo from your raiding days that you probably keep hidden, as it would identify you as a raider to those familiar with the mark.
  pt-BR: Você tem uma tatuagem dos seus dias de saqueadora que provavelmente mantém escondida, pois identificaria você como uma saqueadora para quem conhece a marca.
connection_options:
  - en: Pick one other PC. That character knows that you were a raider, even though it is a secret you've kept from the other PCs so far.
    pt-BR: Escolha outro PJ. Esse personagem sabe que você foi uma saqueadora, mesmo sendo um segredo que você manteve dos outros PJs até agora.
  - en: Pick one other PC. They were also a raider, however briefly, along with you (if they agree to this connection).
    pt-BR: Escolha outro PJ. Ele também foi um saqueador, ainda que brevemente, junto com você (se ele concordar com essa conexão).
  - en: Pick one other PC. You feel very protective of this character and don't want to see them harmed.
    pt-BR: Escolha outro PJ. Você se sente muito protetora em relação a esse personagem e não quer vê-lo machucado.
  - en: Pick one other PC. You know that you're responsible for the death of someone that character knew while you were raiding; they don't know it, but the guilt has been waking you up in the middle of the night.
    pt-BR: Escolha outro PJ. Você sabe que é responsável pela morte de alguém que esse personagem conhecia durante seus dias de saque; ele não sabe disso, mas a culpa tem feito você acordar no meio da noite.
minor_effect_suggestion:
  en: You restore 2 points to your Might Pool.
  pt-BR: Você restaura 2 pontos em sua Reserva de Força.
major_effect_suggestion:
  en: You or an ally get an immediate extra attack.
  pt-BR: Você ou um aliado ganha um ataque extra imediato.
