id: drives-like-a-maniac
name:
  en: Drives Like a Maniac
  pt-BR: Dirija Como um Maníaco
description:
  en: Whether balancing on two wheels, jumping another vehicle, or driving head-on toward an oncoming enemy car, you don't think about the risks when you're behind the wheel. Someone who Drives Like a Maniac needs access to a vehicle.
  pt-BR: Seja equilibrando-se sobre duas rodas, saltando sobre outro veículo ou dirigindo de frente para um carro inimigo que vem na sua direção, você não pensa nos riscos quando está ao volante. Quem Dirige Como um Maníaco precisa ter acesso a um veículo.
