id: is-wanted-by-the-law
name:
  en: Is Wanted by the Law
  pt-BR: É Procurado pela Lei
description:
  en: >-
    "WANTED, DEAD OR ALIVE" posters (or their equivalent) have
    appeared featuring your face. It's up to you whether it's a
    mistake that snowballed out of control or you actually would kill
    someone just for looking at you.
  pt-BR: >-
    Cartazes de "PROCURADO, VIVO OU MORTO" (ou equivalente) apareceram
    estampando seu rosto. Cabe a você decidir se foi um erro que saiu
    do controle ou se você realmente mataria alguém só por olhar para
    você.
tier_abilities:
