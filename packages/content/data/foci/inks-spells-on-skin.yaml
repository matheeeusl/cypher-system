id: inks-spells-on-skin
name:
  en: Inks Spells on Skin
  pt-BR: Tatua Feitiços na Pele
description:
  en: >-
    Your enchanted heritage is etched upon you. Studying strange
    formulas, mystic runes, and magical glyphs to learn spells is one
    thing. Making spells truly a part of you is another, but that's
    exactly what you do when you apply magical inks to create
    intricate spell tattoos across your body. Each tattoo you inscribe
    on yourself is not merely a design, but the keystone of a spell,
    giving you the ability to cast it. Because your tattoos are
    magical, you can continually add to those you've already
    accumulated without ruining the designs, allowing your mastery
    over magic to grow. You often wear clothing that bares your arms
    and perhaps other parts of your body to expose your tattoos, so
    that others know you for a spellcaster.

    Readying Spell Tattoos: You learn two abilities (spells) at every
    tier of this focus, and each of them becomes a tattoo on your
    body. However, for each tier's spells, you can only have one of
    the two readied (available for casting) at any given time, and
    the other is merely an interesting design until you change your
    readied spell for that tier. To change one readied spell,
    immediately after using a one-hour or ten-hour recovery roll, you
    must spend one minute in meditation, after which you can swap one
    readied spell.
  pt-BR: >-
    Sua herança encantada está gravada em você. Estudar fórmulas
    estranhas, runas místicas e glifos mágicos para aprender feitiços é
    uma coisa. Tornar os feitiços verdadeiramente parte de você é
    outra, mas é exatamente isso que você faz ao aplicar tintas mágicas
    para criar intrincadas tatuagens de feitiço por todo o corpo. Cada
    tatuagem que você grava em si mesmo não é apenas um desenho, mas a
    pedra angular de um feitiço, dando a você a habilidade de lançá-lo.
    Como suas tatuagens são mágicas, você pode continuamente acrescentar
    às que já acumulou sem arruinar os desenhos, permitindo que seu
    domínio sobre a magia cresça. Você costuma usar roupas que deixam
    seus braços e talvez outras partes do corpo à mostra para expor
    suas tatuagens, para que outros o reconheçam como um conjurador.

    Preparando Tatuagens de Feitiço: Você aprende duas habilidades
    (feitiços) em cada nível deste foco, e cada uma delas se torna uma
    tatuagem em seu corpo. Porém, para os feitiços de cada nível, você
    só pode ter um dos dois preparados (disponível para lançar) a
    qualquer momento, e o outro é apenas um desenho interessante até
    que você troque seu feitiço preparado daquele nível. Para trocar um
    feitiço preparado, imediatamente após usar uma rolagem de
    recuperação de uma hora ou dez horas, você deve passar um minuto em
    meditação, após o qual pode trocar um feitiço preparado.
tier_abilities:
  '1':
    - kind: granted
      ability_id: fleet-of-foot
    - kind: granted
      ability_id: poison-touch
  '2':
    - kind: granted
      ability_id: eclipse
    - kind: granted
      ability_id: mist-form
  '3':
    - kind: choice
      options:
        - command
        - lightning-flash
        - outwit
      count: 2
  '4':
    - kind: granted
      ability_id: elemental-protection
    - kind: granted
      ability_id: incapacitate
  '5':
    - kind: granted
      ability_id: bypass-barrier
    - kind: granted
      ability_id: granite-wall
  '6':
    - kind: choice
      options:
        - divide-your-mind
        - petrify
        - summon-demon
      count: 2
type_swap_option: null
additional_equipment:
  en: Special ink, a tattooing needle, and a clay, stone, or wooden tablet marked with strange glyphs.
  pt-BR: >-
    Tinta especial, uma agulha de tatuagem, e uma tábua de argila,
    pedra ou madeira marcada com glifos estranhos.
connection_options:
  - en: >-
      Pick one other PC. They once broke a bottle of one of your
      magical tattoo inks. It's up to you if you've forgiven them or
      not.
    pt-BR: >-
      Escolha outro PJ. Ele já quebrou um frasco de uma das suas
      tintas mágicas de tatuagem. Cabe a você decidir se o perdoou ou
      não.
  - en: >-
      Pick one other PC. You think they could learn your tattoo magic,
      and you'd like to teach them. They may or may not be interested
      in learning it.
    pt-BR: >-
      Escolha outro PJ. Você acha que ele poderia aprender sua magia
      de tatuagem, e gostaria de ensiná-lo. Ele pode ou não estar
      interessado em aprender.
  - en: >-
      Pick one other PC. Whenever you ready your spells for the day,
      this character feels faint pain on their body where your
      corresponding tattoo is.
    pt-BR: >-
      Escolha outro PJ. Sempre que você prepara seus feitiços do dia,
      esse personagem sente uma dor fraca no corpo, no local onde sua
      tatuagem correspondente está.
  - en: >-
      Pick one other PC. This character asked you to give them a
      tattoo, so you did. Somehow, now you can always sense their
      general direction and distance from you.
    pt-BR: >-
      Escolha outro PJ. Esse personagem pediu que você lhe desse uma
      tatuagem, então você fez. De alguma forma, agora você sempre
      consegue sentir a direção e a distância gerais dele em relação a
      você.
minor_effect_suggestion:
  en: >-
    Exposed skin on the target creature is marked with a glowing
    glyph of your choice for one hour.
  pt-BR: >-
    A pele exposta da criatura-alvo é marcada com um glifo brilhante à
    sua escolha por uma hora.
major_effect_suggestion:
  en: The foe is cursed, hindering all their actions for one minute.
  pt-BR: O oponente é amaldiçoado, dificultando todas as suas ações por um minuto.
