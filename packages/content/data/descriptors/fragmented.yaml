# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 62 — Fairy Tale descriptors. Unofficial guide, not the
# Cypher System Rulebook.
id: fragmented
category: fairy-tale
name:
  en: Fragmented
  pt-BR: Fragmentado
description:
  en: >-
    Sometimes you feel like you are a single being, and other times you
    think you might be more. You feel torn into pieces, unsure which
    elements are you and which belong to someone else. Or perhaps they're
    all you, and you want to find a way to embrace all of your selves.
  pt-BR: >-
    Às vezes você sente que é um único ser, e outras vezes acha que pode
    ser mais de um. Você se sente despedaçado, sem saber quais partes são
    você e quais pertencem a outra pessoa. Ou talvez todas sejam você, e
    você quer encontrar um jeito de abraçar todos os seus eus.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Adaptable
      pt-BR: Adaptável
    description:
      en: >-
        At the beginning of a conversation, choose a specific type of
        interaction skill, such as persuasion, lying, or intimidation. While
        the conversation lasts, you have an asset in that skill. You cannot
        choose the same type of interaction skill again until after you make
        a ten-hour recovery roll. Enabler.
      pt-BR: >-
        No início de uma conversa, escolha um tipo específico de perícia de
        interação, como persuasão, mentira ou intimidação. Enquanto a conversa
        durar, você tem um recurso nessa perícia. Você não pode escolher o
        mesmo tipo de perícia de interação de novo até fazer uma rolagem de
        recuperação de dez horas. Habilitador.
skill_training:
  - skill_id: resisting-mental-effects
    choice_count: null
  - skill_id: deception
    choice_count: null
    note:
      en: You're trained in all interactions involving lies or trickery.
      pt-BR: Você é treinado em todas as interações que envolvem mentiras ou trapaças.
inabilities:
  - en: >-
      Your memory of events and experiences is spotty. You have an inability
      in memory-related tasks, such as recalling information, memorizing
      names, and so on.
    pt-BR: >-
      A sua memória de eventos e experiências é falha. Você tem inabilidade
      em tarefas relacionadas à memória, como lembrar informações, memorizar
      nomes e assim por diante.
  - en: >-
      Staying centered on a single task is difficult for you. You have an
      inability in tasks requiring focus or concentration.
    pt-BR: >-
      Manter-se centrado em uma única tarefa é difícil para você. Você tem
      inabilidade em tarefas que exigem foco ou concentração.
additional_equipment:
  en: You have a journal that you use to keep notes of your experiences and selves.
  pt-BR: >-
    Você tem um diário que usa para anotar as suas experiências e os seus
    eus.
connection_options:
  - en: >-
      While avoiding an entirely different concern, you walked into your
      current situation.
    pt-BR: >-
      Enquanto evitava um problema completamente diferente, você acabou
      entrando na situação atual.
  - en: >-
      You have reason to believe that being with the other PCs will help you
      better understand your fractured mind.
    pt-BR: >-
      Você tem motivos para acreditar que estar com os outros personagens vai
      ajudá-lo a entender melhor a sua mente fraturada.
  - en: >-
      You have no idea how you joined the PCs. You're just going along with it
      for now until answers present themselves.
    pt-BR: >-
      Você não faz ideia de como se juntou aos personagens. Por enquanto, está
      só indo junto até que as respostas apareçam.
  - en: You felt drawn to join the other PCs, but you don't know why.
    pt-BR: >-
      Você se sentiu atraído a se juntar aos outros personagens, mas não sabe
      por quê.
