connection_options:
  - en: >-
      You solved a riddle before realizing that answering it would
      launch you into the adventure.
    pt-BR: >-
      Você resolveu um enigma antes de perceber que respondê-lo o
      lançaria nesta aventura.
  - en: The other PCs thought you'd bring some much-needed levity to the team.
    pt-BR: >-
      Os outros personagens acharam que você traria uma leveza muito
      necessária para o grupo.
  - en: >-
      You decided that all fun and no work was not the best way to get
      through life, so you joined up with the PCs.
    pt-BR: >-
      Você decidiu que só diversão e nada de trabalho não era a melhor
      forma de levar a vida, então se juntou aos outros personagens.
  - en: >-
      It was either go with the PCs or face up to a circumstance that
      was anything but jovial.
    pt-BR: >-
      Era ir com os outros personagens ou enfrentar uma circunstância
      que não tinha nada de jovial.
