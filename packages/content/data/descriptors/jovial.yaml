id: jovial
name:
  en: Jovial
  pt-BR: Jovial
description:
  en: >-
    You're cheerful, friendly, and outgoing. You put others at ease with
    a big smile and a joke, possibly one at your own expense, though
    lightly ribbing your companions who can take it is also one of your
    favorite pastimes. Sometimes people say you never take anything
    seriously. That's not true, of course, but you have learned that to
    dwell on the bad too long quickly robs the world of joy. You've
    always got a new joke in your back pocket because you collect them
    like some people collect bottles of wine.
  pt-BR: >-
    Você é alegre, amigável e extrovertido. Você deixa os outros à
    vontade com um grande sorriso e uma piada, às vezes às suas próprias
    custas, embora provocar levemente seus companheiros que aguentam a
    brincadeira também seja um dos seus passatempos favoritos. Às vezes
    as pessoas dizem que você nunca leva nada a sério. Isso não é
    verdade, claro, mas você aprendeu que se demorar demais no que é
    ruim rapidamente rouba a alegria do mundo. Você sempre tem uma piada
    nova na manga, porque as coleciona como algumas pessoas colecionam
    garrafas de vinho.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics: []
