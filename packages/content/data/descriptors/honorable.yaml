id: honorable
name:
  en: Honorable
  pt-BR: Honrado
description:
  en: >-
    You are trustworthy, fair, and forthright. You try to do what is
    right, to help others, and to treat them well. Lying and cheating are
    no way to get ahead—these things are for the weak, the lazy, or the
    despicable. You probably spend a lot of time thinking about your
    personal honor, how best to maintain it, and how to defend it if
    challenged. In combat, you are straightforward and offer quarter to
    any foe. You were likely instilled with this sense of honor by a
    parent or a mentor. Sometimes the distinction between what is and
    isn't honorable varies with different schools of thought, but in
    broad strokes, honorable people can agree on most aspects of what
    honor means.
  pt-BR: >-
    Você é confiável, justo e franco. Você tenta fazer o que é certo,
    ajudar os outros e tratá-los bem. Mentir e trapacear não são formas
    de progredir — essas coisas são para os fracos, os preguiçosos ou os
    desprezíveis. Você provavelmente passa muito tempo pensando na sua
    honra pessoal, em como melhor mantê-la e como defendê-la se for
    desafiada. Em combate, você é direto e oferece clemência a qualquer
    inimigo. Provavelmente lhe incutiram esse senso de honra um pai, uma
    mãe ou um mentor. Às vezes, a distinção entre o que é e o que não é
    honrado varia conforme diferentes escolas de pensamento, mas, de modo
    geral, pessoas honradas conseguem concordar sobre a maior parte do
    que a honra significa.
