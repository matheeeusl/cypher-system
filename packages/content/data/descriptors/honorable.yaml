connection_options:
  - en: The PCs' goals appear to be honorable and commendable.
    pt-BR: Os objetivos dos outros personagens parecem ser honrados e louváveis.
  - en: >-
      You see that what the other PCs are about to do is dangerous, and
      you'd like to help protect them.
    pt-BR: >-
      Você percebe que o que os outros personagens estão prestes a fazer
      é perigoso e gostaria de ajudar a protegê-los.
  - en: One of the other PCs invited you, hearing of your trustworthiness.
    pt-BR: >-
      Um dos outros personagens o convidou, ao ouvir falar da sua
      confiabilidade.
  - en: You asked politely if you could join the other PCs in their mission.
    pt-BR: >-
      Você perguntou educadamente se poderia se juntar aos outros
      personagens em sua missão.
