  - skill_id: swimming
    choice_count: null
  - skill_id: handling-animals
    choice_count: null
  - skill_id: identifying-and-using-plants
    choice_count: null
inabilities:
  - en: >-
      You have no social graces and prefer animals to people. Any task
      involving charm, persuasion, etiquette, or deception is hindered.
    pt-BR: >-
      Você não tem nenhuma habilidade social e prefere animais a
      pessoas. Qualquer tarefa envolvendo charme, persuasão, etiqueta ou
      engano é prejudicada.
additional_equipment:
  en: >-
    You carry an explorer's pack with rope, two days' rations, a
    bedroll, and other tools needed for outdoor survival.
  pt-BR: >-
    Você carrega uma mochila de explorador com corda, rações para dois
    dias, um saco de dormir e outras ferramentas necessárias para
    sobrevivência ao ar livre.
connection_options:
  - en: >-
      Against your better judgment, you joined the other PCs because you
      saw that they were in danger.
    pt-BR: >-
      Contrariando seu bom senso, você se juntou aos outros personagens
      porque viu que estavam em perigo.
  - en: >-
      One of the other PCs convinced you that joining the group would be
      in your best interests.
    pt-BR: >-
      Um dos outros personagens o convenceu de que se juntar ao grupo
      seria do seu interesse.
  - en: You're afraid of what might happen if the other PCs fail.
    pt-BR: Você teme o que pode acontecer se os outros personagens fracassarem.
  - en: There is reward involved, and you need the money.
    pt-BR: Há uma recompensa envolvida, e você precisa do dinheiro.
