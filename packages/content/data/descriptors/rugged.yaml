id: rugged
name:
  en: Rugged
  pt-BR: Rústico
description:
  en: >-
    You're a nature lover accustomed to living rough, pitting your wits
    against the elements. Most likely, you're a skilled hunter,
    gatherer, or naturalist. Years of living in the wild have left their
    mark with a worn countenance, wild hair, or scars. Your clothing is
    probably much less refined than the garments worn by city dwellers.
  pt-BR: >-
    Você é um amante da natureza, acostumado a viver de forma rude,
    colocando sua astúcia à prova contra os elementos. Muito
    provavelmente, você é um caçador, coletor ou naturalista habilidoso.
    Anos vivendo na natureza selvagem deixaram suas marcas, seja em um
    semblante desgastado, em cabelos selvagens ou em cicatrizes. Suas
    roupas provavelmente são muito menos refinadas do que as vestimentas
    usadas por quem vive na cidade.
