id: fast
name:
  en: Fast
  pt-BR: Tradução em breve.
description:
  en: >-
    You're fleet of foot. Because you're quick, you can accomplish tasks
    more rapidly than others can. You're not just quick on your feet,
    however—you're quick with your hands, and you think and react
    quickly. You even talk quickly.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: speed
    amount: 2
characteristics:
  - name:
      en: Fast
      pt-BR: Tradução em breve.
    description:
      en: >-
        You can move a short distance and still take another action in
        the same round, or you can move a long distance as your action
        without needing to make any kind of roll.
      pt-BR: Tradução em breve.
skill_training:
  - skill_id: running
    choice_count: null
inabilities:
  - en: >-
      You're a sprinter, not a long-distance runner. You don't have a
      lot of stamina. Might defense rolls are hindered.
    pt-BR: Tradução em breve.
additional_equipment: null
connection_options:
  - en: You jumped in to save one of the other PCs who was in dire need.
    pt-BR: Tradução em breve.
  - en: One of the other PCs recruited you for your unique talents.
    pt-BR: Tradução em breve.
  - en: You're impulsive, and it seemed like a good idea at the time.
    pt-BR: Tradução em breve.
  - en: This mission ties in with a personal goal of your own.
    pt-BR: Tradução em breve.
