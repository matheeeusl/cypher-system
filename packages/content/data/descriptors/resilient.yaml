id: resilient
name:
  en: Resilient
  pt-BR: Tradução em breve.
description:
  en: >-
    You can take a lot of punishment, both physically and mentally, and
    still come back for more. It takes a lot to put you down. Neither
    physical nor mental shocks or damage have a lasting effect. You're
    tough to faze. Unflappable. Unstoppable.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: might
    amount: 2
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Recover
      pt-BR: Tradução em breve.
    description:
      en: >-
        You can make an extra recovery roll each day. This roll is just
        one action. So you can make two recovery rolls that each take
        one action, one roll that takes ten minutes, a fourth roll that
        takes one hour, and a fifth roll that requires ten hours of
        rest.
      pt-BR: Tradução em breve.
skill_training:
  - skill_id: might-defense
    choice_count: null
  - skill_id: intellect-defense
    choice_count: null
inabilities:
  - en: >-
      You're hardy but not necessarily strong. Any task involving
      moving, bending, or breaking things is hindered.
    pt-BR: Tradução em breve.
  - en: >-
      You have a lot of willpower and mental fortitude, but you're not
      necessarily smart. Any task involving knowledge or figuring out
      problems or puzzles is hindered.
    pt-BR: Tradução em breve.
additional_equipment: null
connection_options:
  - en: You saw that the PCs clearly need someone like you to help them out.
    pt-BR: Tradução em breve.
  - en: >-
      Someone asked you to watch over one of the PCs in particular, and
      you agreed.
    pt-BR: Tradução em breve.
  - en: You are bored and desperately in need of a challenge.
    pt-BR: Tradução em breve.
  - en: >-
      You lost a bet—unfairly, you think—and had to take someone's place
      on this mission.
    pt-BR: Tradução em breve.
