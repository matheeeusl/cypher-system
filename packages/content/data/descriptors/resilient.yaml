id: resilient
name:
  en: Resilient
  pt-BR: Resiliente
description:
  en: >-
    You can take a lot of punishment, both physically and mentally, and
    still come back for more. It takes a lot to put you down. Neither
    physical nor mental shocks or damage have a lasting effect. You're
    tough to faze. Unflappable. Unstoppable.
  pt-BR: >-
    Você consegue aguentar muito castigo, tanto físico quanto mental, e
    ainda assim voltar para mais. É preciso muito para derrubá-lo. Nem
    choques nem danos físicos ou mentais têm efeito duradouro em você. É
    difícil abalá-lo. Imperturbável. Imparável.
pool_bonus:
  - stat: might
    amount: 2
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Recover
      pt-BR: Recuperar
    description:
      en: >-
        You can make an extra recovery roll each day. This roll is just
        one action. So you can make two recovery rolls that each take
        one action, one roll that takes ten minutes, a fourth roll that
        takes one hour, and a fifth roll that requires ten hours of
        rest.
      pt-BR: >-
        Você pode fazer uma rolagem de recuperação extra por dia. Essa
        rolagem exige apenas uma ação. Assim, você pode fazer duas
        rolagens de recuperação que exigem apenas uma ação cada, uma
        rolagem que exige dez minutos, uma quarta rolagem que exige uma
        hora e uma quinta rolagem que exige dez horas de descanso.
skill_training:
  - skill_id: might-defense
    choice_count: null
  - skill_id: intellect-defense
    choice_count: null
inabilities:
  - en: >-
      You're hardy but not necessarily strong. Any task involving
      moving, bending, or breaking things is hindered.
    pt-BR: >-
      Você é robusto, mas não necessariamente forte. Qualquer tarefa
      envolvendo mover, dobrar ou quebrar coisas é prejudicada.
  - en: >-
      You have a lot of willpower and mental fortitude, but you're not
      necessarily smart. Any task involving knowledge or figuring out
      problems or puzzles is hindered.
    pt-BR: >-
      Você tem muita força de vontade e fortaleza mental, mas não é
      necessariamente inteligente. Qualquer tarefa envolvendo
      conhecimento ou resolver problemas ou quebra-cabeças é
      prejudicada.
additional_equipment: null
connection_options:
  - en: You saw that the PCs clearly need someone like you to help them out.
    pt-BR: >-
      Você percebeu que os outros personagens claramente precisavam de
      alguém como você para ajudá-los.
  - en: >-
      Someone asked you to watch over one of the PCs in particular, and
      you agreed.
    pt-BR: >-
      Alguém lhe pediu para vigiar um dos outros personagens em
      particular, e você concordou.
  - en: You are bored and desperately in need of a challenge.
    pt-BR: Você está entediado e desesperadamente precisando de um desafio.
  - en: >-
      You lost a bet—unfairly, you think—and had to take someone's place
      on this mission.
    pt-BR: >-
      Você perdeu uma aposta — injustamente, na sua opinião — e teve que
      tomar o lugar de alguém nesta missão.
