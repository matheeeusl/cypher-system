id: mysterious
name:
  en: Mysterious
  pt-BR: Misterioso
description:
  en: >-
    The dark figure lurking silently in the corner? That's you. No one
    really knows where you came from or what your motives are—you play
    things close to the vest. Your manner perplexes and confounds
    others, but that doesn't make you a poor friend or ally. You're just
    good at keeping things to yourself, moving about unseen, and
    concealing your presence and identity.
  pt-BR: >-
    Aquela figura sombria espreitando em silêncio no canto? É você.
    Ninguém realmente sabe de onde você veio ou quais são suas
    motivações — você mantém tudo bem guardado. Seu jeito de ser intriga
    e confunde os outros, mas isso não faz de você um amigo ou aliado
    ruim. Você só é bom em guardar segredos, se mover sem ser visto e
    esconder sua presença e identidade.
pool_bonus: []
characteristics:
  - name:
      en: Confounding
      pt-BR: Desconcertante
    description:
      en: >-
        You pull talents and abilities seemingly out of nowhere. You can
        attempt one task in which you have no training as if you were
        trained, attempt a task that you are trained in as if
        specialized, or gain a free level of Effort with a task that you
        are specialized in. This ability refreshes every time you make a
        recovery roll, but the uses never accumulate.
      pt-BR: >-
        Você tira talentos e habilidades aparentemente do nada. Você pode
        tentar uma tarefa na qual não tem nenhum treinamento como se
        fosse treinado, tentar uma tarefa na qual é treinado como se
        fosse especializado, ou ganhar um nível gratuito de Esforço em
        uma tarefa na qual é especializado. Essa habilidade se renova a
        cada vez que você faz uma rolagem de recuperação, mas os usos
        nunca se acumulam.
skill_training:
  - skill_id: stealth
    choice_count: null
  - skill_id: resisting-interrogation
    choice_count: null
inabilities:
  - en: >-
      People never know where they stand with you. Any task involving
      getting people to believe or trust you is hindered.
    pt-BR: >-
      As pessoas nunca sabem onde estão com você. Qualquer tarefa
      envolvendo fazer alguém acreditar ou confiar em você é prejudicada.
additional_equipment: null
connection_options:
  - en: You just showed up one day.
    pt-BR: Você simplesmente apareceu um dia.
  - en: You convinced one of the other PCs that you had invaluable skills.
    pt-BR: >-
      Você convenceu um dos outros personagens de que tinha habilidades
      inestimáveis.
  - en: >-
      Some equally mysterious figure told you where to be and when (but
      not why) to join the group.
    pt-BR: >-
      Uma figura igualmente misteriosa lhe disse onde e quando (mas não
      por quê) se juntar ao grupo.
  - en: >-
      Something—a feeling, a dream—told you where to be and when to
      join the group.
    pt-BR: >-
      Algo — um pressentimento, um sonho — lhe disse onde e quando se
      juntar ao grupo.
