id: guarded
name:
  en: Guarded
  pt-BR: Arredio
description:
  en: >-
    You conceal your true nature behind a mask and are loath to let
    anyone see who you really are. Protecting yourself, physically and
    emotionally, is what you care about most, and you prefer to keep
    everyone else at a safe distance. You may be suspicious of everyone
    you meet, expecting the worst from people so you won't be surprised
    when they prove you right. Or you might just be a bit reserved,
    careful about letting people through your gruff exterior to the
    person you really are. No one can be as reserved as you are and make
    many friends. Most likely, you have an abrasive personality and tend
    to be pessimistic in your outlook. You probably nurse an old hurt and
    find that the only way you can cope is to keep it and your
    personality locked down.
  pt-BR: >-
    Você esconde sua verdadeira natureza por trás de uma máscara e
    detesta deixar que alguém veja quem você realmente é. Proteger a si
    mesmo, física e emocionalmente, é o que mais importa para você, e
    você prefere manter todos os outros a uma distância segura. Você pode
    desconfiar de todos que conhece, esperando o pior das pessoas para
    não se surpreender quando elas provarem que você estava certo. Ou
    talvez você seja apenas um pouco reservado, cuidadoso ao deixar que
    as pessoas atravessem sua fachada ríspida e cheguem até quem você
    realmente é. Ninguém consegue ser tão reservado quanto você e ainda
    fazer muitos amigos. Muito provavelmente, você tem uma personalidade
    áspera e tende a ter uma visão pessimista das coisas. Você
    provavelmente carrega uma velha mágoa e sente que a única forma de
    lidar com ela é manter a si mesmo e sua personalidade trancados.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics: []
skill_training:
  - skill_id: intellect-defense
    choice_count: null
  - skill_id: discerning-truth
    choice_count: null
inabilities:
  - en: >-
      Your suspicious nature makes you unlikeable. Any task involving
      deception or persuasion is hindered.
    pt-BR: >-
      Sua natureza desconfiada o torna antipático. Qualquer tarefa que
      envolva engano ou persuasão é prejudicada.
additional_equipment: null
connection_options:
  - en: One of the PCs managed to overcome your defenses and befriend you.
    pt-BR: >-
      Um dos outros personagens conseguiu superar suas defesas e se
      tornar seu amigo.
  - en: >-
      You want to see what the PCs are up to, so you accompany them to
      catch them in the act of some wrongdoing.
    pt-BR: >-
      Você quer descobrir o que os outros personagens estão tramando,
      então os acompanha para flagrá-los cometendo alguma irregularidade.
  - en: You have made a few enemies and take up with the PCs for protection.
    pt-BR: >-
      Você fez alguns inimigos e se juntou aos outros personagens em
      busca de proteção.
  - en: The PCs are the only people who will put up with you.
    pt-BR: Os outros personagens são as únicas pessoas que o suportam.
