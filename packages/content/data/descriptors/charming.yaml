id: charming
name:
  en: Charming
  pt-BR: Charmoso
description:
  en: >-
    You're a smooth talker and a charmer. Whether through seemingly
    supernatural means or just a way with words, you can convince others
    to do as you wish. Most likely, you're physically attractive or at
    least highly charismatic, and others enjoy listening to your voice.
    You probably pay attention to your appearance, keeping yourself well
    groomed. You make friends easily. You play up the personality facet
    of your Intellect stat; intelligence is not your strong suit. You're
    personable, but not necessarily studious or strong-willed.
  pt-BR: >-
    Você fala com facilidade e tem um charme natural. Seja por meios
    aparentemente sobrenaturais, seja apenas por um jeito especial com as
    palavras, você consegue convencer os outros a fazer o que deseja.
    Muito provavelmente, você é fisicamente atraente ou, ao menos,
    altamente carismático, e as pessoas gostam de ouvir sua voz. Você
    provavelmente presta atenção à sua aparência, mantendo-se bem
    cuidado. Você faz amizades com facilidade. Você explora o lado da
    personalidade do seu atributo de Intelecto; a inteligência não é o
    seu forte. Você é sociável, mas não necessariamente estudioso ou de
    vontade forte.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Contact
      pt-BR: Contato
    description:
      en: >-
        You have an important contact who is in an influential position,
        such as a minor noble, the captain of the town guard/police, or
        the head of a large gang of thieves. You and the GM should work
        out the details together.
      pt-BR: >-
        Você tem um contato importante que ocupa uma posição de
        influência, como um nobre menor, o capitão da guarda/polícia da
        cidade ou o líder de uma grande gangue de ladrões. Você e o
        Mestre devem acertar os detalhes juntos.
skill_training:
  - skill_id: pleasant-social-interactions
    choice_count: null
  - skill_id: mind-influencing-abilities
    choice_count: null
inabilities:
  - en: >-
      You were never good at studying or retaining facts. Any task
      involving lore, knowledge, or understanding is hindered.
    pt-BR: >-
      Você nunca foi bom em estudar ou reter fatos. Qualquer tarefa
      envolvendo conhecimento, saber ou compreensão é prejudicada.
  - en: >-
      Your willpower is not one of your strong points. Defense actions to
      resist mental attacks are hindered.
    pt-BR: >-
      Sua força de vontade não é um dos seus pontos fortes. Ações de
      defesa para resistir a ataques mentais são prejudicadas.
additional_equipment:
  en: >-
    You've managed to talk your way into some decent discounts and
    bonuses in recent weeks. As a result, you have enough cash jangling
    in your pocket to purchase a moderately priced item.
  pt-BR: >-
    Nas últimas semanas, você conseguiu, com sua lábia, alguns bons
    descontos e vantagens. Como resultado, tem dinheiro suficiente
    tilintando no bolso para comprar um item de preço moderado.
connection_options:
  - en: You convinced one of the other PCs to tell you what they were doing.
    pt-BR: Você convenceu um dos outros personagens a lhe contar o que estava fazendo.
  - en: You instigated the whole thing and convinced the others to join you.
    pt-BR: Você instigou tudo isso e convenceu os outros a se juntarem a você.
  - en: >-
      One of the other PCs did a favor for you, and now you're repaying
      that obligation by helping them with the task at hand.
    pt-BR: >-
      Um dos outros personagens lhe fez um favor, e agora você está
      retribuindo essa obrigação ajudando-o na tarefa em questão.
  - en: There is a reward involved, and you need the money.
    pt-BR: Há uma recompensa envolvida, e você precisa do dinheiro.
