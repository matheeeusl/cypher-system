id: impulsive
name:
  en: Impulsive
  pt-BR: Impulsivo
description:
  en: >-
    You have a hard time tamping down your enthusiasm. Why wait when you
    can just do it (whatever it is) and get it done? You deal with
    problems when they arise rather than plan ahead. Putting out the
    small fires now prevents them from becoming one big fire later. You
    are the first to take risks, to jump in and lend a hand, to step into
    dark passages, and to find danger. Your impulsiveness likely gets you
    into trouble. While others might take time to study the items they
    discover, you use such items without hesitation. After all, the best
    way to learn what something can do is to use it. When a cautious
    explorer might look around and check for danger nearby, you have to
    physically stop yourself from bulling on ahead. Why fuss around when
    the exciting thing is just ahead?
  pt-BR: >-
    Você tem dificuldade em conter seu entusiasmo. Por que esperar quando
    você pode simplesmente fazer (seja lá o que for) e resolver logo?
    Você lida com os problemas conforme eles surgem, em vez de planejar
    com antecedência. Apagar os pequenos incêndios agora evita que se
    tornem um grande incêndio depois. Você é o primeiro a correr riscos,
    a intervir e dar uma mão, a entrar em passagens escuras e a encontrar
    o perigo. Sua impulsividade provavelmente o mete em encrencas.
    Enquanto outros talvez levem tempo para estudar os itens que
    descobrem, você os usa sem hesitar. Afinal, a melhor forma de
    aprender o que algo faz é usá-lo. Quando um explorador cauteloso
    olharia ao redor e checaria se há perigo por perto, você precisa
    fisicamente se conter para não avançar de qualquer jeito. Por que
    perder tempo se a coisa empolgante está logo ali à frente?
pool_bonus:
  - stat: speed
    amount: 2
characteristics: []
skill_training:
  - skill_id: initiative
    choice_count: null
  - skill_id: speed-defense
    choice_count: null
inabilities:
  - en: >-
      You'll try anything once, but quickly grow bored after that. Any
      task that involves patience, willpower, or discipline is hindered.
    pt-BR: >-
      Você experimenta qualquer coisa uma vez, mas logo se entedia depois
      disso. Qualquer tarefa que envolva paciência, força de vontade ou
      disciplina é prejudicada.
additional_equipment: null
connection_options:
  - en: You heard what the other PCs were up to and suddenly decided to join them.
    pt-BR: >-
      Você ouviu o que os outros personagens estavam tramando e decidiu,
      de repente, se juntar a eles.
  - en: >-
      You pulled everyone together after you heard rumors about
      something interesting you want to see or do.
    pt-BR: >-
      Você reuniu todo mundo depois de ouvir rumores sobre algo
      interessante que quer ver ou fazer.
  - en: You blew all of your money and now find yourself strapped for cash.
    pt-BR: Você gastou todo o seu dinheiro e agora está sem grana.
  - en: >-
      You're in trouble for acting recklessly. You join the other PCs
      because they offer a way out of your problem.
    pt-BR: >-
      Você está encrencado por agir de forma imprudente. Você se junta
      aos outros personagens porque eles oferecem uma saída para o seu
      problema.
