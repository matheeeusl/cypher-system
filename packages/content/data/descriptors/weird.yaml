id: weird
name:
  en: Weird
  pt-BR: Tradução em breve.
description:
  en: >-
    You aren't like anyone else, and that's fine with you. People don't
    seem to understand you—they even seem put off by you—but who cares?
    You understand the world better than they do because you're weird,
    and so is the world you live in. The concept of "the weird" is well
    known to you. Strange devices, ancient locales, bizarre creatures,
    storms that can transform you, living energy fields, conspiracies,
    aliens, and things most people can't even name populate the world,
    and you thrive on them. You have a special attachment to it all, and
    the more you discover about the weirdness in the world, the more you
    might discover about yourself. Weird characters might be mutants or
    people born with strange qualities, but sometimes they started out
    "normal" and adopted the weird by choice.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Distinctive Physical Quirk
      pt-BR: Tradução em breve.
    description:
      en: >-
        You have a unique physical aspect that is, well, bizarre.
        Depending on the setting, this can vary greatly. You might have
        purple hair or metal spikes on your head. Perhaps your hands
        don't connect to your arms, although they move as if they do.
        Maybe a third eye stares out from the side of your head, or
        superfluous tendrils grow from your back. Whatever it is, your
        quirk might be a mutation, a supernatural trait (a blessing or
        curse), a feature with no explanation, or just a really wild
        tattoo that draws a lot of attention.
      pt-BR: Tradução em breve.
  - name:
      en: A Sense for the Weird
      pt-BR: Tradução em breve.
    description:
      en: >-
        Sometimes—at the GM's discretion—weird things relating to the
        supernatural or its effects on the world seem to call out to
        you. You can sense them from afar, and if you get within long
        range of such a thing, you can sense whether it is overtly
        dangerous or not.
      pt-BR: Tradução em breve.
skill_training:
  - skill_id: supernatural-knowledge
    choice_count: null
inabilities:
  - en: >-
      People find you unnerving. All tasks relating to pleasant social
      interaction are hindered.
    pt-BR: Tradução em breve.
additional_equipment: null
connection_options:
  - en: It seemed weird, so why not?
    pt-BR: Tradução em breve.
  - en: >-
      Whether the other PCs realize it or not, their mission has to do
      with something weird that you know about, so you got involved.
    pt-BR: Tradução em breve.
  - en: As an expert in the weird, you were specifically recruited by the other PCs.
    pt-BR: Tradução em breve.
  - en: You felt drawn to join the other PCs, but you don't know why.
    pt-BR: Tradução em breve.
