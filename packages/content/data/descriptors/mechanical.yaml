id: mechanical
name:
  en: Mechanical
  pt-BR: Mecânico
description:
  en: >-
    You have a special talent with machines of all kinds, and you're
    adept at understanding and, if need be, repairing them. Perhaps
    you're a bit of an inventor, creating new machines from time to
    time. You get called "techie," "tech," "mech," "gear-head,"
    "motor-head," or any of a number of other nicknames. Mechanics
    usually wear practical work clothes and carry around a lot of tools.
  pt-BR: >-
    Você tem um talento especial com máquinas de todo tipo, e é hábil em
    entendê-las e, se necessário, consertá-las. Talvez você seja um
    pouco inventor, criando novas máquinas de vez em quando. Chamam você
    de "nerd de tecnologia", "engenheiro", "mecânico", "fissurado em
    engrenagens", "louco por motores" ou qualquer outro apelido do tipo.
    Mecânicos costumam usar roupas de trabalho práticas e carregar
    muitas ferramentas.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics: []
skill_training:
  - skill_id: understanding-machines
    choice_count: null
  - skill_id: repairing-and-crafting-machines
    choice_count: null
inabilities: []
additional_equipment:
  en: You start with a variety of machine tools.
  pt-BR: Você começa com uma variedade de ferramentas mecânicas.
connection_options:
  - en: While repairing a nearby machine, you overheard the other PCs talking.
    pt-BR: >-
      Enquanto consertava uma máquina por perto, você ouviu os outros
      personagens conversando.
  - en: You need money to buy tools and parts.
    pt-BR: Você precisa de dinheiro para comprar ferramentas e peças.
  - en: >-
      It was clear that the mission couldn't succeed without your skills
      and knowledge.
    pt-BR: >-
      Ficou claro que a missão não teria sucesso sem suas habilidades e
      conhecimento.
  - en: Another PC asked you to join them.
    pt-BR: Outro personagem pediu que você se juntasse a eles.
