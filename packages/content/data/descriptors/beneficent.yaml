id: beneficent
name:
  en: Beneficent
  pt-BR: Beneficente
description:
  en: >-
    Helping others is your calling. It's why you're here. Others delight
    in your outgoing and charitable nature, and you delight in their
    happiness. You're at your best when you're aiding people, either by
    explaining how they can best overcome a challenge or by demonstrating
    how to do so yourself.
  pt-BR: >-
    Ajudar os outros é o seu chamado. É por isso que você está aqui. As
    pessoas se encantam com sua natureza extrovertida e caridosa, e você
    se encanta com a felicidade delas. Você está no seu melhor quando
    está auxiliando alguém, seja explicando a melhor forma de superar um
    desafio, seja demonstrando como fazê-lo você mesmo.
pool_bonus: []
characteristics:
  - name:
      en: Generous
      pt-BR: Generoso
    description:
      en: >-
        Allies who have spent the last day with you add +1 to their
        recovery rolls.
      pt-BR: >-
        Aliados que passaram o último dia com você somam +1 às suas
        rolagens de recuperação.
  - name:
      en: Altruistic
      pt-BR: Altruísta
    description:
      en: >-
        If you're standing next to a creature that takes damage, you can
        intercede and take 1 point of that damage yourself (reducing the
        damage inflicted on the creature by 1 point). If you have Armor,
        it does not provide a benefit when you use this ability.
      pt-BR: >-
        Se você estiver ao lado de uma criatura que sofre dano, pode
        intervir e sofrer 1 ponto desse dano você mesmo (reduzindo em 1
        ponto o dano infligido à criatura). Se você tiver Armadura, ela
        não oferece nenhum benefício quando você usa esta habilidade.
  - name:
      en: Helpful
      pt-BR: Prestativo
    description:
      en: >-
        Whenever you help another character, that character gains the
        benefit as if you were trained even if you are not trained or
        specialized in the attempted task.
      pt-BR: >-
        Sempre que você ajuda outro personagem, esse personagem recebe o
        benefício como se você fosse treinado, mesmo que você não seja
        treinado ou especializado na tarefa tentada.
skill_training:
  - skill_id: pleasant-social-interactions
    choice_count: null
inabilities:
  - en: While you are alone, all Intellect and Speed tasks are hindered.
    pt-BR: >-
      Enquanto estiver sozinho, todas as tarefas de Intelecto e
      Velocidade são prejudicadas.
additional_equipment: null
connection_options:
  - en: >-
      Even though you didn't know most of the other PCs beforehand, you
      invited yourself along on their quest.
    pt-BR: >-
      Mesmo sem conhecer a maioria dos outros personagens anteriormente,
      você se convidou para participar da missão deles.
  - en: >-
      You saw the PCs struggling to overcome a problem and selflessly
      joined them to help.
    pt-BR: >-
      Você viu os personagens lutando para superar um problema e,
      desinteressadamente, juntou-se a eles para ajudar.
  - en: You're nearly certain the PCs will fail without you.
    pt-BR: Você tem quase certeza de que os outros personagens fracassarão sem você.
  - en: >-
      The choice was between your tattered life and helping others. You
      haven't looked back since.
    pt-BR: >-
      A escolha era entre sua vida em farrapos e ajudar os outros. Você
      nunca mais olhou para trás desde então.
