# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 65 — Fantasy Species descriptors. Unofficial guide, not
# the Cypher System Rulebook. "Practiced in using axes" is weapon
# proficiency, not skill training, so it stays a characteristic.
id: dwarf
category: fantasy-species
name:
  en: Dwarf
  pt-BR: Anão
description:
  en: >-
    You're a stocky, broad-shouldered, bearded native of the mountains and
    hills. You're also as stubborn as the stone in which the dwarves carve
    their homes under the mountains. Tradition, honor, pride in smithcraft
    and warcraft, and a keen appreciation of the wealth buried under the
    roots of the world are all part of your heritage. Those who wish you ill
    should be wary of your temper. When dwarves are wronged, they never
    forget.
  pt-BR: >-
    Você é um nativo atarracado, de ombros largos e barbudo, das montanhas e
    colinas. Também é tão teimoso quanto a pedra em que os anões esculpem
    seus lares sob as montanhas. Tradição, honra, orgulho na forja e na
    guerra e um apreço aguçado pelas riquezas enterradas sob as raízes do
    mundo fazem parte da sua herança. Quem lhe deseja mal deve tomar cuidado
    com o seu temperamento. Quando os anões são injustiçados, nunca
    esquecem.
pool_bonus:
  - stat: might
    amount: 2
characteristics:
  - name:
      en: Skill
      pt-BR: Perícia
    description:
      en: You are practiced in using axes.
      pt-BR: Você é praticado no uso de machados.
  - name:
      en: Vulnerability
      pt-BR: Vulnerabilidade
    description:
      en: >-
        When you fail an Intellect defense roll to avoid damage, you take 1
        extra point of damage.
      pt-BR: >-
        Quando você falha em uma rolagem de defesa de Intelecto para evitar
        dano, sofre 1 ponto de dano extra.
skill_training:
  - skill_id: might-defense
    choice_count: null
  - skill_id: stonework
    choice_count: null
    note:
      en: >-
        You are trained in tasks related to stone, including sensing
        stonework traps, knowing the history of a particular piece of
        stonecraft, and knowing your distance beneath the surface.
      pt-BR: >-
        Você é treinado em tarefas relacionadas à pedra, incluindo notar
        armadilhas em cantaria, conhecer a história de uma obra em pedra
        específica e saber a que profundidade está abaixo da superfície.
  - skill_id: crafting
    choice_count: null
    note:
      en: You are trained in using the tools required to shape and mine stone.
      pt-BR: >-
        Você é treinado no uso das ferramentas necessárias para moldar e
        extrair pedra.
inabilities: []
additional_equipment:
  en: You have an axe.
  pt-BR: Você tem um machado.
connection_options:
  - en: >-
      You found the PCs wandering a maze of tunnels and led them to safety.
    pt-BR: >-
      Você encontrou os personagens vagando por um labirinto de túneis e os
      levou em segurança para fora.
  - en: The PCs hired you to dig out the entrance to a buried ruin.
    pt-BR: >-
      Os personagens o contrataram para escavar a entrada de uma ruína
      soterrada.
  - en: >-
      You tracked down the thieves of your ancestor's tomb and found they were
      the PCs. Instead of killing them, you joined them.
    pt-BR: >-
      Você rastreou os ladrões do túmulo do seu ancestral e descobriu que eram
      os personagens. Em vez de matá-los, você se juntou a eles.
  - en: Before dwarves settle down, they need to see the world.
    pt-BR: Antes de sossegar, os anões precisam ver o mundo.
