# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 66 — Fantasy Species descriptors. Unofficial guide, not
# the Cypher System Rulebook. The book prints the full text of the three
# Natural Affinity abilities; they are data/abilities/communication,
# eyes-adjusted and minor-illusion. "Practiced in using hammers" is weapon
# proficiency, so it stays a characteristic.
id: gnome
category: fantasy-species
name:
  en: Gnome
  pt-BR: Gnomo
description:
  en: >-
    You are curious and love discovering ways to turn found things into art,
    tools, or weapons. You might be a sculptor, smith, artist, chef,
    storyteller, or inventor. Alchemy, magic, and engineering fascinate you.
    Other beings may see you as a strange mix of a nature-loving elf and a
    craft-obsessed dwarf, but you and your kind are unique people with a
    passion for life, exploration, and creation.
  pt-BR: >-
    Você é curioso e adora descobrir maneiras de transformar coisas que
    encontra em arte, ferramentas ou armas. Pode ser escultor, ferreiro,
    artista, cozinheiro, contador de histórias ou inventor. Alquimia, magia
    e engenharia o fascinam. Outros seres podem vê-lo como uma mistura
    estranha de um elfo amante da natureza com um anão obcecado por ofícios,
    mas você e os seus são um povo único, com paixão pela vida, pela
    exploração e pela criação.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics:
  - name:
      en: Skill
      pt-BR: Perícia
    description:
      en: You are practiced in using hammers.
      pt-BR: Você é praticado no uso de martelos.
  - name:
      en: Natural Affinity
      pt-BR: Afinidade Natural
    description:
      en: >-
        You gain one of the following abilities: Communication, Eyes
        Adjusted, or Minor Illusion.
      pt-BR: >-
        Você ganha uma das seguintes habilidades: Comunicação, Olhos
        Adaptados ou Ilusão Menor.
skill_training:
  - skill_id: null
    choice_count: 2
    note:
      en: >-
        You are trained in two skills that suit your creative nature, such as
        alchemy, smithing, poetry, cooking, woodcarving, or pottery.
      pt-BR: >-
        Você é treinado em duas perícias que combinam com a sua natureza
        criativa, como alquimia, forja, poesia, culinária, entalhe em madeira
        ou cerâmica.
inabilities:
  - en: Your small size makes some physical tasks difficult. Might-based tasks are hindered.
    pt-BR: >-
      O seu tamanho pequeno torna algumas tarefas físicas difíceis. Tarefas
      baseadas em Força são dificultadas.
additional_equipment:
  en: You have a bag of light tools or a bag of heavy tools.
  pt-BR: Você tem uma bolsa de ferramentas leves ou uma bolsa de ferramentas pesadas.
connection_options:
  - en: >-
      You think an object or material you've been looking for can be found
      where the other PCs are going.
    pt-BR: >-
      Você acha que um objeto ou material que procura pode ser encontrado
      para onde os outros personagens estão indo.
  - en: You were recruited because of your knowledge on a particular subject.
    pt-BR: Você foi recrutado pelo seu conhecimento sobre um assunto específico.
  - en: >-
      You were bored and it sounded like the PCs were going to do something
      interesting.
    pt-BR: >-
      Você estava entediado, e parecia que os personagens iam fazer algo
      interessante.
  - en: You owe one of the PCs a favor for a useful gift in the past.
    pt-BR: >-
      Você deve um favor a um dos personagens por um presente útil no
      passado.
