# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), pp. 99–100 — Weird West descriptors. Unofficial guide, not
# the Cypher System Rulebook. Missing from the p. 29 list. The Advancement
# options are listed by name only. The "Sigil Branded" sidebar is not
# modeled.
id: risen
category: weird-west
name:
  en: Risen
  pt-BR: Reerguido
description:
  en: >-
    You died. Now you're back. Except not completely—you're what them
    alchemists call a necrovore, or as regular folks whisper in your wake,
    Damned. And perhaps you do bear a sigil branded onto your flesh by a
    demon from Perdition. Maybe your situation is the result of some other
    curse that pulled you screaming back into animation. Or you might be
    called back from death due to your own need to finish a task you failed
    to accomplish before life fled.

    Whatever the cause, you no longer breathe, your eyes dimly shine and
    blink only when you remember to, and your skin takes on an unnatural
    pallor.
  pt-BR: >-
    Você morreu. Agora está de volta. Só que não por completo — você é o que
    os tais alquimistas chamam de necróvoro, ou, como as pessoas comuns
    sussurram quando você passa, um Danado. E talvez você carregue mesmo um
    sigilo marcado a ferro na carne por um demônio da Perdição. Talvez a sua
    situação seja resultado de alguma outra maldição que o arrastou aos
    gritos de volta à vida. Ou você pode ter sido chamado de volta da morte
    pela sua própria necessidade de terminar uma tarefa que não conseguiu
    cumprir antes de a vida ir embora.

    Seja qual for a causa, você não respira mais, os seus olhos brilham
    fracamente e só piscam quando você se lembra, e a sua pele ganha uma
    palidez antinatural.
pool_bonus: []
characteristics:
  - name:
      en: Hell Hide
      pt-BR: Couro Infernal
    description:
      en: +1 to your Armor.
      pt-BR: +1 na sua Armadura.
  - name:
      en: Deathless Resilience
      pt-BR: Resistência Imortal
    description:
      en: >-
        When you're debilitated, you can still act as if you were only
        impaired, even if your Speed is at 0. You're still killed if you
        descend three steps on the damage track.
      pt-BR: >-
        Quando está debilitado, você ainda pode agir como se estivesse apenas
        enfraquecido, mesmo com a Velocidade em 0. Você ainda morre se
        descer três degraus no marcador de dano.
  - name:
      en: Sometimes You Come Back
      pt-BR: Às Vezes Você Volta
    description:
      en: >-
        If you descend three steps on the damage track, you can spend 2 XP to
        return to animation at some point the GM chooses within the next few
        days.
      pt-BR: >-
        Se você descer três degraus no marcador de dano, pode gastar 2 XP para
        voltar à vida em algum momento escolhido pelo Mestre nos dias
        seguintes.
  - name:
      en: Stiff as Death
      pt-BR: Duro como a Morte
    description:
      en: >-
        You ain't as supple as you once was. Anytime you apply a level of
        Effort using Speed, it costs 1 additional point of Speed.
      pt-BR: >-
        Você não é mais tão flexível quanto já foi. Sempre que aplica um nível
        de Esforço usando Velocidade, isso custa 1 ponto adicional de
        Velocidade.
  - name:
      en: Risen Advancement
      pt-BR: Avanço de Reerguido
    description:
      en: >-
        With the GM's approval, you can choose from these abilities instead
        of your type abilities: Absorb Kinetic Energy, Improved Recovery, Not
        Dead Yet, Repair Flesh, See the Unseen, Speaker for the Dead.
      pt-BR: >-
        Com a aprovação do Mestre, você pode escolher entre estas habilidades
        em vez das habilidades do seu tipo: Absorver Energia Cinética,
        Recuperação Aprimorada, Ainda Não Morri, Reparar Carne, Ver o
        Invisível, Portador da Voz dos Mortos.
skill_training: []
inabilities:
  - en: >-
      Something ain't right about you. Your positive interaction tasks and
      tasks related to interacting with animals are hindered.
    pt-BR: >-
      Tem algo de errado com você. Suas tarefas de interação positiva e as
      tarefas relacionadas a lidar com animais são dificultadas.
additional_equipment: null
connection_options:
  - en: >-
      When everyone else ran away from you, the PCs stayed to learn more about
      your situation.
    pt-BR: >-
      Quando todos os outros fugiram de você, os personagens ficaram para
      saber mais sobre a sua situação.
  - en: >-
      You saw the PCs struggling with a necrovore and decided to show them not
      all undead were bad.
    pt-BR: >-
      Você viu os personagens em apuros com um necróvoro e decidiu mostrar a
      eles que nem todo morto-vivo é mau.
  - en: >-
      The choice was between a half life on the edges of society and joining
      the PCs' mission.
    pt-BR: >-
      A escolha era entre uma meia-vida à margem da sociedade e se juntar à
      missão dos personagens.
  - en: >-
      The PCs knew you before you died and wanted you back again even though
      your memories from back then are blurry.
    pt-BR: >-
      Os personagens o conheciam antes de você morrer e o quiseram de volta,
      mesmo que as suas lembranças daquela época estejam embaçadas.
