# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 73 — Modern Magic descriptors. Unofficial guide, not the
# Cypher System Rulebook.
id: hunter
category: modern-magic
name:
  en: Hunter
  pt-BR: Caçador
description:
  en: >-
    You once rode with the Wild Hunt: an immortal cavalry who traversed the
    skies in secret each night, gathering the souls of those who died in
    battle and carrying them to the beyond. These days, the Wild Hunt has
    downsized and your nights are your own. You're mortal again, too, but
    it's impossible to forget the terrifying freedom and power you once
    held. Maybe you've let nostalgia make you bitter, or maybe you don't miss
    the Hunt at all, instead living in fear of being conscripted once more.
  pt-BR: >-
    Você já cavalgou com a Caçada Selvagem: uma cavalaria imortal que
    atravessava os céus em segredo todas as noites, recolhendo as almas dos
    que morriam em batalha e levando-as para o além. Hoje em dia a Caçada
    Selvagem encolheu, e as suas noites são só suas. Você também voltou a
    ser mortal, mas é impossível esquecer a liberdade e o poder aterradores
    que já teve. Talvez a nostalgia o tenha deixado amargo, ou talvez você
    não sinta a menor falta da Caçada e viva com medo de ser convocado de
    novo.
pool_bonus:
  - stat: speed
    amount: 2
characteristics:
  - name:
      en: Equestrian
      pt-BR: Equestre
    description:
      en: You're trained in handling and riding horses.
      pt-BR: Você é treinado em lidar com cavalos e cavalgá-los.
  - name:
      en: Sword Hand
      pt-BR: Mão de Espada
    description:
      en: You're proficient with two-handed swords and can use them without penalty.
      pt-BR: >-
        Você tem proficiência com espadas de duas mãos e pode usá-las sem
        penalidade.
  - name:
      en: Hearing the Dead
      pt-BR: Ouvir os Mortos
    description:
      en: You're skilled in all social interactions with ghosts.
      pt-BR: Você é hábil em todas as interações sociais com fantasmas.
  - name:
      en: The Call of the Hunt
      pt-BR: O Chamado da Caçada
    description:
      en: >-
        You're often distracted by sounds that remind you of the Wild Hunt,
        such as horns and baying hounds. Tasks requiring concentration are
        hindered.
      pt-BR: >-
        Você costuma se distrair com sons que lembram a Caçada Selvagem, como
        trompas e cães latindo. Tarefas que exigem concentração são
        dificultadas.
  - name:
      en: Lost Years
      pt-BR: Anos Perdidos
    description:
      en: >-
        In the years you belonged to the Wild Hunt, you lost touch with
        advancing technology. Tasks involving computers, pop culture, and
        recent history are hindered.
      pt-BR: >-
        Nos anos em que pertenceu à Caçada Selvagem, você perdeu o contato
        com os avanços da tecnologia. Tarefas que envolvem computadores,
        cultura pop e história recente são dificultadas.
skill_training:
  - skill_id: riding
    choice_count: null
inabilities: []
additional_equipment: null
connection_options:
  - en: >-
      You ferried the soul of a PC's relative to the afterlife. When you left
      the Wild Hunt, you found the PC to tell them of their relative's brave
      deeds.
    pt-BR: >-
      Você levou a alma de um parente de um personagem para o além. Quando
      deixou a Caçada Selvagem, procurou esse personagem para lhe contar os
      feitos corajosos do parente.
  - en: >-
      The living only see the Wild Hunt cross the sky if they're destined for
      disaster. A PC saw the Wild Hunt years ago, and you've taken it upon
      yourself to protect them.
    pt-BR: >-
      Os vivos só veem a Caçada Selvagem cruzar o céu se estão destinados ao
      desastre. Um personagem viu a Caçada Selvagem anos atrás, e você tomou
      para si a tarefa de protegê-lo.
  - en: >-
      You're afraid that the leader of the Wild Hunt will summon you, and you
      need help concealing yourself.
    pt-BR: >-
      Você tem medo de que o líder da Caçada Selvagem o convoque, e precisa
      de ajuda para se esconder.
  - en: >-
      You're searching for the horse you remember riding—a massive undead
      stallion with flaming hooves.
    pt-BR: >-
      Você está procurando o cavalo que se lembra de montar — um enorme
      garanhão morto-vivo de cascos flamejantes.
