# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 101 — Weird West descriptors. Unofficial guide, not the
# Cypher System Rulebook.
id: trailblazing
category: weird-west
name:
  en: Trailblazing
  pt-BR: Desbravador
description:
  en: >-
    You ain't afraid to explore badlands, high plains, or weirder locales.
    That's down to your pioneering spirit. Others like to stick close to
    what's known, but you like to ride out to see places others can't even
    imagine. Fear of the unknown is something you just don't understand;
    it's the known that makes you afraid. Spending too much time in one
    place makes you itchy and irritable. You live for the next time you're
    blazing a fresh trail, scouting a new territory, and coming around
    another bend just to see what's up ahead.
  pt-BR: >-
    Você não tem medo de explorar terras ermas, planaltos ou lugares mais
    estranhos. É o seu espírito pioneiro. Outros gostam de ficar perto do
    conhecido, mas você gosta de cavalgar para ver lugares que os outros nem
    imaginam. Medo do desconhecido é algo que você simplesmente não
    entende; é o conhecido que lhe dá medo. Passar tempo demais num só lugar
    o deixa inquieto e irritadiço. Você vive pela próxima vez em que vai
    abrir uma trilha nova, explorar um território novo e dobrar mais uma
    curva só para ver o que vem pela frente.
pool_bonus:
  - stat: might
    amount: 2
characteristics: []
skill_training:
  - skill_id: navigation
    choice_count: null
    note:
      en: >-
        You're trained in wilderness navigation tasks, including finding your
        way through unknown locations.
      pt-BR: >-
        Você é treinado em tarefas de navegação em áreas selvagens, incluindo
        encontrar o caminho por lugares desconhecidos.
  - skill_id: identifying
    choice_count: null
    note:
      en: >-
        You're trained in identifying creatures and plants, including cursed
        beasts and strange folk.
      pt-BR: >-
        Você é treinado em identificar criaturas e plantas, incluindo feras
        amaldiçoadas e gente estranha.
  - skill_id: perception
    choice_count: null
inabilities:
  - en: >-
      You're easily bored. Tasks requiring sustained attention of one or more
      minutes are hindered.
    pt-BR: >-
      Você se entedia fácil. Tarefas que exigem atenção contínua por um
      minuto ou mais são dificultadas.
additional_equipment:
  en: You have a hand compass.
  pt-BR: Você tem uma bússola de mão.
connection_options:
  - en: You were hired by the PCs to guide them to a strange location.
    pt-BR: >-
      Você foi contratado pelos personagens para guiá-los até um lugar
      estranho.
  - en: >-
      You have reason to believe that journeying with the other PCs will lead
      you to many more places unknown to you.
    pt-BR: >-
      Você tem motivos para acreditar que viajar com os outros personagens vai
      levá-lo a muitos outros lugares que você não conhece.
  - en: >-
      The one time you got in trouble out on your own, the PCs happened by and
      saved you.
    pt-BR: >-
      A única vez em que você se meteu em encrenca sozinho, os personagens
      passaram por acaso e o salvaram.
  - en: >-
      You saw the PCs from afar, figured something interesting was happening,
      and wanted to be part of it.
    pt-BR: >-
      Você viu os personagens de longe, imaginou que algo interessante estava
      acontecendo e quis fazer parte.
