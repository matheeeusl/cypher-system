id: graceful
name:
  en: Graceful
  pt-BR: Gracioso
description:
  en: >-
    You have a perfect sense of balance, moving and speaking with grace
    and beauty. You're quick, lithe, flexible, and dexterous. Your body
    is perfectly suited to dance, and you use that advantage in combat to
    dodge blows. You might wear garments that enhance your agile movement
    and sense of style.
  pt-BR: >-
    Você tem um senso de equilíbrio perfeito, movendo-se e falando com
    graça e beleza. Você é rápido, ágil, flexível e destro. Seu corpo é
    perfeitamente adequado para a dança, e você usa essa vantagem em
    combate para esquivar de golpes. Você pode usar roupas que realcem
    seus movimentos ágeis e seu senso de estilo.
pool_bonus:
  - stat: speed
    amount: 2
characteristics: []
skill_training:
  - skill_id: balance-and-careful-movement
    choice_count: null
  - skill_id: physical-performing-arts
    choice_count: null
  - skill_id: speed-defense
    choice_count: null
inabilities: []
additional_equipment: null
connection_options:
  - en: >-
      Against your better judgment, you joined the other PCs because you
      saw that they were in danger.
    pt-BR: >-
      Contrariando seu bom senso, você se juntou aos outros personagens
      porque viu que estavam em perigo.
  - en: >-
      One of the other PCs convinced you that joining the group would be
      in your best interests.
    pt-BR: >-
      Um dos outros personagens o convenceu de que se juntar ao grupo
      seria do seu interesse.
  - en: You're afraid of what might happen if the other PCs fail.
    pt-BR: Você teme o que pode acontecer se os outros personagens fracassarem.
  - en: There is reward involved, and you need the money.
    pt-BR: Há uma recompensa envolvida, e você precisa do dinheiro.
