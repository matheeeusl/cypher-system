id: clumsy
name:
  en: Clumsy
  pt-BR: Tradução em breve.
description:
  en: >-
    Graceless and awkward, you were told that you'd grow out of it, but
    you never did. You often drop things, trip over your own feet, or
    knock things (or people) over. Some people get frustrated by this
    quality, but most find it funny and even a little charming.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: speed
    amount: -2
  - stat: might
    amount: 2
characteristics:
  - name:
      en: Inelegant
      pt-BR: Tradução em breve.
    description:
      en: >-
        You have a certain lovable charm. You are trained in all pleasant
        social interactions when you express a lighthearted,
        self-deprecating manner.
      pt-BR: Tradução em breve.
  - name:
      en: Dumb Luck
      pt-BR: Tradução em breve.
    description:
      en: >-
        The GM can introduce a GM intrusion on you, based on your
        clumsiness, without awarding you any XP (as if you had rolled a 1
        on a d20 roll). However, if this happens, 50% of the time, your
        clumsiness works to your advantage. Rather than hurting you
        (much), it helps you, or it hurts your enemies. You slip, but
        it's just in time to duck an attack. You fall down, but you trip
        your enemies as you crash into their legs. You turn around too
        quickly, but you end up knocking the weapon from your foe's hand.
        You and the GM should work together to determine the details. If
        the GM wishes, they can use GM intrusions based on your
        clumsiness normally (awarding XP).
      pt-BR: Tradução em breve.
skill_training:
  - skill_id: breaking-things
    choice_count: null
inabilities:
  - en: >-
      Any task that involves balance, grace, or hand-to-eye coordination
      is hindered.
    pt-BR: Tradução em breve.
additional_equipment: null
connection_options:
  - en: You were in the right place at the right time.
    pt-BR: Tradução em breve.
  - en: >-
      You had a piece of information that the other PCs needed to make
      their plans.
    pt-BR: Tradução em breve.
  - en: A sibling recommended you to the other PCs.
    pt-BR: Tradução em breve.
  - en: >-
      You stumbled into the PCs as they were discussing their mission,
      and they took a liking to you.
    pt-BR: Tradução em breve.
