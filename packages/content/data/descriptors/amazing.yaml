# Source: Old Gus' Unofficial Cypher System Player's Guide (OG-CSPG,
# 2025-09-17), p. 94 — Superhero descriptors. Unofficial guide, not the
# Cypher System Rulebook.
id: amazing
category: superhero
name:
  en: Amazing
  pt-BR: Espetacular
description:
  en: >-
    You have a knack for surprising people—performing impossible athletic
    feats, sneaking up on someone who's alert, or instantly reacting to an
    ambush. You like to make use of these talents to enhance (or
    rehabilitate) your reputation as a hero prone to spectacular rescues,
    defeating foes way above your league, and arriving just in time to save
    the day. Ironically, in your normal daily life, you're a little awkward
    and overlooked.
  pt-BR: >-
    Você tem um talento para surpreender as pessoas — realizar façanhas
    atléticas impossíveis, se aproximar sorrateiramente de alguém que está
    alerta ou reagir instantaneamente a uma emboscada. Você gosta de usar
    esses talentos para melhorar (ou recuperar) sua reputação de herói
    propenso a resgates espetaculares, que derrota inimigos muito acima do
    seu nível e chega bem a tempo de salvar o dia. Ironicamente, na sua vida
    cotidiana, você é um pouco desajeitado e passa despercebido.
pool_bonus:
  - stat: speed
    amount: 2
pool_bonus_choice:
  kind: divide
  points: 2
  stats: [might, speed, intellect]
characteristics:
  - name:
      en: Self-Hype
      pt-BR: Autoconfiança
    description:
      en: >-
        When you apply a level of Effort to a task, you get a free level of
        Effort. You can do this one time, although the ability is renewed
        each time you make a one-hour or ten-hour recovery roll.
      pt-BR: >-
        Quando você aplica um nível de Esforço a uma tarefa, recebe um nível
        de Esforço gratuito. Você pode fazer isso uma vez, mas a habilidade é
        renovada sempre que você faz uma rolagem de recuperação de uma hora
        ou de dez horas.
skill_training:
  - skill_id: initiative
    choice_count: null
  - skill_id: stealth
    choice_count: null
inabilities:
  - en: >-
      Your sudden appearances are startling to regular people. Positive
      social reactions are hindered (villains and other superheroes aren't
      affected by this).
    pt-BR: >-
      Suas aparições repentinas assustam as pessoas comuns. Reações sociais
      positivas são dificultadas (vilões e outros super-heróis não são
      afetados por isso).
additional_equipment: null
connection_options:
  - en: >-
      You got in a bit over your head, but another PC's coincidental arrival
      gave you just the distraction you needed.
    pt-BR: >-
      Você se meteu em algo maior do que podia, mas a chegada por acaso de
      outro personagem lhe deu exatamente a distração de que precisava.
  - en: >-
      You were tailing someone the other PCs were following and decided to
      drop in.
    pt-BR: >-
      Você estava seguindo alguém que os outros personagens também
      perseguiam e decidiu aparecer.
  - en: >-
      You saw that the other PCs were in a fight and chose to help them out.
    pt-BR: >-
      Você viu que os outros personagens estavam em uma luta e decidiu
      ajudá-los.
  - en: You had a hunch that something big was about to go down.
    pt-BR: Você teve um pressentimento de que algo grande estava para acontecer.
