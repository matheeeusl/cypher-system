id: tongue-tied
name:
  en: Tongue-Tied
  pt-BR: Calado
description:
  en: >-
    You've never been much of a talker. When forced to interact with
    others, you never think of the right thing to say—words fail you
    entirely, or they come out all wrong. You often end up saying
    precisely the wrong thing and insult someone unintentionally. Most
    of the time, you just keep mum. This makes you a listener instead—a
    careful observer. It also means that you're better at doing things
    than talking about them. You're quick to take action.
  pt-BR: >-
    Você nunca foi muito de falar. Quando forçado a interagir com os
    outros, você nunca pensa na coisa certa a dizer — as palavras
    simplesmente falham, ou saem completamente erradas. Você
    frequentemente acaba dizendo exatamente a coisa errada e ofende
    alguém sem querer. Na maior parte do tempo, você simplesmente fica
    calado. Isso faz de você um ouvinte, em vez disso — um observador
    cuidadoso. Também significa que você é melhor em fazer as coisas do
    que em falar sobre elas. Você é rápido para agir.
pool_bonus:
  - stat: might
    amount: 2
  - stat: speed
    amount: 2
characteristics: []
skill_training:
  - skill_id: perception
    choice_count: null
  - skill_id: initiative
    choice_count: null
inabilities:
  - en: All tasks relating to social interaction are hindered.
    pt-BR: Todas as tarefas relacionadas a interação social são prejudicadas.
  - en: >-
      All tasks involving verbal communication or relaying information
      are hindered.
    pt-BR: >-
      Todas as tarefas envolvendo comunicação verbal ou transmissão de
      informações são prejudicadas.
additional_equipment: null
connection_options:
  - en: You just tagged along and no one told you to leave.
    pt-BR: Você simplesmente foi junto, e ninguém mandou você ir embora.
  - en: >-
      You saw something important the other PCs did not and (with some
      effort) managed to relate it to them.
    pt-BR: >-
      Você viu algo importante que os outros personagens não viram e
      (com algum esforço) conseguiu contar a eles.
  - en: You intervened to save one of the other PCs when they were in danger.
    pt-BR: >-
      Você interveio para salvar um dos outros personagens quando ele
      estava em perigo.
  - en: One of the other PCs recruited you for your talents.
    pt-BR: Um dos outros personagens o recrutou por seus talentos.
