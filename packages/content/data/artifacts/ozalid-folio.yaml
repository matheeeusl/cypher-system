id: ozalid-folio
name:
  en: Ozalid Folio
  pt-BR: Fólio Ozalid
level: '1d6 + 4'
form:
  en: Tome of translucent pages
  pt-BR: Tomo de páginas translúcidas
effect_text:
  en: >-
    You can spend 10 minutes to draw a mundane object—no more than 10 feet
    (3 m) in any given dimension, and that weighs no more than 1,000
    pounds—into the folio. When complete, the object's substance gives
    way, stored as a series of 16 full-page illustrations within the
    book, each featuring the object drawn from a different angle, with
    precise mathematical notation about the object's construction, notes
    on materials used, and fine details, for example, a deep scratch left
    on a table leg. The folio can inscribe a number of items equal to the
    artifact level. You can retrieve an object by performing a similar
    10-minute transference, freeing up those pages in the folio. When
    found, half its pages (rounded up) are already inscribed with items
    from the Ozalid Folio Contents table. Items inscribed in or
    transcribed from the folio must rest on a solid surface that can
    support them. When the ozalid folio is depleted, all items held
    within its pages are lost.
  pt-BR: >-
    Você pode gastar 10 minutos para desenhar um objeto comum — não maior
    que 3 metros (10 pés) em qualquer dimensão, e que não pese mais de
    450 kg (1.000 libras) — para dentro do fólio. Ao concluir, a
    substância do objeto se dissipa, sendo armazenada como uma série de
    16 ilustrações de página inteira dentro do livro, cada uma retratando
    o objeto de um ângulo diferente, com notação matemática precisa sobre
    a construção do objeto, anotações sobre os materiais usados e
    detalhes minuciosos, como, por exemplo, um arranhão profundo deixado
    na perna de uma mesa. O fólio pode inscrever uma quantidade de itens
    igual ao nível do artefato. Você pode recuperar um objeto realizando
    uma transferência semelhante de 10 minutos, liberando essas páginas
    no fólio. Quando encontrado, metade de suas páginas (arredondado para
    cima) já estão inscritas com itens da tabela Conteúdo do Fólio
    Ozalid. Itens inscritos no ou transcritos do fólio devem repousar
    sobre uma superfície sólida capaz de sustentá-los. Quando o fólio
    ozalid se esgota, todos os itens guardados em suas páginas são
    perdidos.
