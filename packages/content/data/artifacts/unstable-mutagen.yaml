id: unstable-mutagen
name:
  en: Unstable Mutagen
  pt-BR: Mutágeno Instável
level: '1d10'
form:
  en: Injection, topical ooze, or potion
  pt-BR: Injeção, gosma tópica ou poção
effect_text:
  en: >-
    The user gains a random mutation. Each time you use this artifact,
    roll a d20 to determine which table to roll from for your mutation
    (see the table below). When rolling from the mutation tables, you can
    modify your roll's results by adding or subtracting any amount up to
    the artifact level.
  pt-BR: >-
    O usuário ganha uma mutação aleatória. Cada vez que você usa este
    artefato, role 1d20 para determinar de qual tabela rolar sua mutação
    (veja a tabela abaixo). Ao rolar nas tabelas de mutação, você pode
    modificar o resultado da sua rolagem somando ou subtraindo qualquer
    valor até o nível do artefato.
effect_table:
  label:
    en: Mutagen Effects
    pt-BR: Efeitos do Mutágeno
