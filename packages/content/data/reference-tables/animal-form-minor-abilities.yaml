ability_definitions:
  aquatic:
    en: The animal either breathes water instead of air or is able to breathe water in addition to breathing air.
    'pt-BR': O animal respira água em vez de ar, ou é capaz de respirar tanto água quanto ar.
  armor:
    en: The animal has a thick hide or shell, granting +1 to Armor.
    'pt-BR': O animal possui uma pele grossa ou casco, concedendo +1 de Armadura.
  constrict:
    en: The animal can grip its opponent fast after making a melee attack (usually with a bite or claw), easing attack rolls against that foe on later turns until the animal releases the foe.
    'pt-BR': O animal pode prender firmemente o oponente após um ataque corpo a corpo (geralmente com uma mordida ou garra), facilitando as rolagens de ataque contra esse inimigo nos turnos seguintes, até que o animal o solte.
  fast:
    en: The animal can move a long distance on its turn instead of a short distance.
    'pt-BR': O animal pode se mover a uma distância longa em seu turno, em vez de uma distância curta.
  flying:
    en: The animal can fly, which (depending on the type of animal) may be up to a short or long distance on its turn.
    'pt-BR': O animal pode voar, o que (dependendo do tipo de animal) pode ser até uma distância curta ou longa em seu turno.
  hands:
    en: The animal has paws or hands that are nearly as agile as those of a human. Unlike with most animal shapes, the animal's tasks that require hands are not hindered (although the GM may decide that some tasks requiring human agility, such as playing a flute, are still hindered).
    'pt-BR': O animal possui patas ou mãos quase tão ágeis quanto as de um humano. Diferente da maioria das formas animais, as tarefas do animal que exigem mãos não são dificultadas (embora o Mestre possa decidir que algumas tarefas que exigem destreza humana, como tocar flauta, continuem dificultadas).
  scent:
    en: The animal has a strong sense of smell, gaining an asset on tracking and dealing with darkness or blindness.
    'pt-BR': O animal possui um olfato apurado, ganhando um recurso em tarefas de rastreamento e ao lidar com escuridão ou cegueira.
  small:
    en: The animal is considerably smaller than a human, easing its Speed defense tasks but hindering tasks to move heavy things.
    'pt-BR': O animal é consideravelmente menor que um humano, o que facilita suas tarefas de defesa de Velocidade, mas dificulta tarefas de mover objetos pesados.
  venom:
    en: The animal is poisonous (usually through a bite), inflicting 1 additional point of damage.
    'pt-BR': O animal é venenoso (geralmente por meio de uma mordida), infligindo 1 ponto adicional de dano.
