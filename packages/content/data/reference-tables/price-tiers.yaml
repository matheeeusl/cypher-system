- id: inexpensive
  description:
    en: 'Something common people buy — a meal, a drink, or a book.'
    'pt-BR': 'Algo que pessoas comuns compram — uma refeição, uma bebida ou um livro.'
- id: moderately_priced
  description:
    en: 'Something common people buy, but often or a lot of — a comfortable chair, concert tickets, or a new outfit.'
    'pt-BR': 'Algo que pessoas comuns compram, mas com frequência ou em grande quantidade — uma cadeira confortável, ingressos para um show ou uma roupa nova.'
- id: expensive
  description:
    en: "Something that would strain a common person's finances — rent, plane tickets, or a fancy new outfit."
    'pt-BR': 'Algo que pesaria nas finanças de uma pessoa comum — aluguel, passagens aéreas ou uma roupa nova e sofisticada.'
- id: very_expensive
  description:
    en: 'Something out of the reach of most people — jewelry, a fancy car, luxury travel.'
    'pt-BR': 'Algo fora do alcance da maioria das pessoas — joias, um carro sofisticado, uma viagem de luxo.'
- id: exorbitant
  description:
    en: 'Something only the rich can afford — a mansion, ship, or famous artwork.'
    'pt-BR': 'Algo que só os ricos podem pagar — uma mansão, um navio ou uma obra de arte famosa.'
- id: priceless
  description:
    en: 'Something only a rich corporation or nation-state might acquire or build.'
    'pt-BR': 'Algo que apenas uma corporação rica ou um Estado-nação poderia adquirir ou construir.'
