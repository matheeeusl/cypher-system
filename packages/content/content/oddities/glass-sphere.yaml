id: glass-sphere
description:
  en: >-
    A perfectly smooth glass sphere the size of a fist. Suspended inside
    it, motionless, is a single drop of a silver liquid.
  pt-BR: >-
    Uma esfera de vidro perfeitamente lisa do tamanho de um punho.
    Suspensa em seu interior, imóvel, há uma única gota de um líquido
    prateado.
