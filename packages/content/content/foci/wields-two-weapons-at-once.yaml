id: wields-two-weapons-at-once
name:
  en: Wields Two Weapons at Once
  pt-BR: Empunha Duas Armas ao Mesmo Tempo
description:
  en: You bear steel with both hands, ready to take on any foe.
  pt-BR: Você empunha aço com as duas mãos, pronto para enfrentar qualquer inimigo.
connection_text:
  en: >-
    One of the other PCs taught you to fight this way, or you learned it
    watching them survive a fight you both should have lost.
  pt-BR: >-
    Um dos outros PJs lhe ensinou a lutar dessa forma, ou você aprendeu
    observando-o sobreviver a uma luta que ambos deveriam ter perdido.
tier_abilities:
  '1':
    - kind: granted
      ability_id: dual-light-wield
