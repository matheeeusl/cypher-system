id: encouragement
name:
  en: Encouragement
  pt-BR: Encorajamento
description:
  en: >-
    While you maintain this ability through ongoing inspiring oration, your
    allies within short range ease one of the following task types (your
    choice): defense tasks, attack tasks, or tasks related to any skill
    that you are trained or specialized in.
  pt-BR: >-
    Enquanto você mantém esta habilidade por meio de um discurso inspirador
    contínuo, seus aliados dentro do alcance curto facilitam um dos
    seguintes tipos de tarefa (à sua escolha): tarefas de defesa, tarefas
    de ataque, ou tarefas relacionadas a qualquer perícia na qual você seja
    treinado ou especializado.
tier: 1
cost:
  pool: intellect
  amount: 1
action_type: action
sources:
  - type: type
    id: speaker
