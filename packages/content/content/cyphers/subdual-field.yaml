id: subdual-field
name: { en: "Subdual field", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 398"
level_range: "1d6 + 3"
effect_text:
  en: >-
    Two rounds after being activated, the device creates an invisible field
    that fills a specified area (such as a cube a short distance across)
    within long range. The field lasts for one minute. It affects the minds of
    thinking beings within the field, preventing them from taking hostile
    actions. The effect lasts as long as they remain in the field and for 1d6
    rounds after, although an Intellect defense roll is allowed each round to
    act normally (both in the field and after leaving it).
  pt-BR: >-
    Tradução em breve.
effect_table: null
