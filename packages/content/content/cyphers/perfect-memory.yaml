id: perfect-memory
name: { en: "Perfect memory", "pt-BR": "Tradução em breve." }
category: subtle
page_ref: "Cypher System Rulebook, page 393"
level_range: "1d6"
effect_text:
  en: >-
    Allows the user to mentally record everything they see for thirty seconds
    per cypher level and store the recording permanently in their long-term
    memory. This cypher is useful for watching someone pick a specific lock,
    enter a complex code, or do something else that happens quickly.
  pt-BR: >-
    Tradução em breve.
effect_table: null
