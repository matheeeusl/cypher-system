id: detonation-spawn
name: { en: "Detonation (spawn)", "pt-BR": "Tradução em breve." }
category: manifest
page_ref: "Cypher System Rulebook, page 387"
level_range: "1d6 + 2"
effect_text:
  en: >-
    Projects a small physical explosive up to a long distance away that bursts in an immediate radius,
    blinding all within it for one minute and inflicting damage equal to the cypher's level.
    The burst spawns 1d6 additional detonations; in the next round, each additional detonation flies to
    a random spot within short rangeand explodes in an immediate radius.
    Roll a d100 to determine the type of damage dealt by all detonations:
    (All damaging detonations inflict a minimum of 2 points of damage to those in the radius, regardless of attack or defense rolls.)
  pt-BR: >-
    Tradução em breve.
effect_table:
  label: { en: "Detonation (Spawn) Effects", "pt-BR": "Tradução em breve." }
  entries:
    - range: "01–10"
      text: { en: "Cell-disrupting (harms only flesh)", "pt-BR": "Tradução em breve." }
    - range: "11–30"
      text: { en: "Corrosive", "pt-BR": "Tradução em breve." }
    - range: "31–40"
      text: { en: "Electrical discharge", "pt-BR": "Tradução em breve." }
    - range: "41–50"
      text: { en: "Heat drain (cold)", "pt-BR": "Tradução em breve." }
    - range: "51–75"
      text: { en: "Fire", "pt-BR": "Tradução em breve." }
    - range: "76–00"
      text: { en: "Shrapnel", "pt-BR": "Tradução em breve." }
