id: monoblade
name: { en: "Monoblade", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 393"
level_range: "1d6 + 2"
effect_text:
  en: >-
    Produces a 6-inch (15 cm) blade that's the same level as the cypher. The
    blade cuts through any material of a level lower than its own. If used as
    a weapon, it is a light weapon that ignores Armor of a level lower than
    its own. The blade lasts for ten minutes.
  pt-BR: >-
    Tradução em breve.
effect_table: null
