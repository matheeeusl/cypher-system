# Most poisons are not considered cyphers, except for a very few that are
# unique.
id: poison-emotion
name: { en: "Poison (emotion)", "pt-BR": "Tradução em breve." }
category: manifest
page_ref: "Cypher System Rulebook, page 394"
level_range: "1d6 + 2"
effect_text:
  en: >-
    The victim feels a specific emotion for one hour. Roll a d100 to determine
    the emotion.
  pt-BR: >-
    Tradução em breve.
effect_table:
  label:
    en: "Poison (Emotion) Effects"
    pt-BR: "Tradução em breve."
  entries:
    - range: "01–20"
      text: { en: "Anger: Likely to attack anyone who disagrees with them. Very hard to interact with; all such actions are hindered by two steps.", "pt-BR": "Tradução em breve." }
    - range: "21–40"
      text: { en: "Fear: Flees in terror for one minute when threatened.", "pt-BR": "Tradução em breve." }
    - range: "41–60"
      text: { en: "Lust: Cannot focus on any nonsexual activity.", "pt-BR": "Tradução em breve." }
    - range: "61–75"
      text: { en: "Sadness: All tasks are hindered.", "pt-BR": "Tradução em breve." }
    - range: "76–85"
      text: { en: "Complacency: Has no motivation. All tasks are hindered by two steps.", "pt-BR": "Tradução em breve." }
    - range: "86–95"
      text: { en: "Joy: Easy to interact with in a pleasant manner; all pleasant interaction tasks are eased.", "pt-BR": "Tradução em breve." }
    - range: "96–00"
      text: { en: "Love: Much easier to interact with; all interaction tasks are eased by two steps, but temporary attachment is likely.", "pt-BR": "Tradução em breve." }
