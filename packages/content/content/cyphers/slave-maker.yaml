id: slave-maker
name: { en: "Slave maker", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 397"
level_range: "1d6 + 2"
effect_text:
  en: >-
    To activate the cypher, the user must succeed on a melee attack against a
    creature about the size of the user and whose level does not exceed the
    cypher's level. The cypher bonds to the target, who immediately becomes
    calm. The target awaits the user's commands and carries out all orders to
    the best of its ability. The target remains so enslaved for a number of
    hours equal to the cypher's level minus the target's level. (If the result
    is 0, the target is enslaved for only one minute.)
  pt-BR: >-
    Tradução em breve.
effect_table: null
