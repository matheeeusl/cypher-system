id: magnetic-master
name: { en: "Magnetic master", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 392"
level_range: "1d6 + 2"
effect_text:
  en: >-
    Establishes a connection with one metal object within short range that a
    human could hold in one hand. The user can then move or manipulate the
    object anywhere within short range (each movement or manipulation is an
    action). For example, they could wield a weapon or drag a helm affixed to
    a foe's head to and fro. The connection lasts for ten rounds per cypher
    level.
  pt-BR: >-
    Tradução em breve.
effect_table: null
