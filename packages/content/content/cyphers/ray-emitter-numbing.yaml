id: ray-emitter-numbing
name: { en: "Ray emitter (numbing)", "pt-BR": "Tradução em breve." }
category: fantastic
page_ref: "Cypher System Rulebook, page 395"
level_range: "1d6 + 2"
effect_text:
  en: >-
    Allows the user to project a ray of energy up to long range (very long
    range if the cypher is level 6 or higher) that numbs one limb of the
    target, making it useless for one minute. A small number of these devices
    (5%) induce numbness that lasts for one hour.
  pt-BR: >-
    Tradução em breve.
effect_table: null
