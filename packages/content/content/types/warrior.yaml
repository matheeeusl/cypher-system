id: warrior
name:
  en: Warrior
  pt-BR: Guerreiro
tagline:
  en: You're a good ally to have in a fight.
  pt-BR: Você é um bom aliado para se ter em uma luta.
description:
  en: >-
    You know how to use weapons and defend yourself. Depending on the genre
    and setting in question, this might mean wielding a sword and shield in
    the gladiatorial arena, an AK-47 and a bandolier of grenades in a
    savage firefight, or a blaster rifle and powered armor when exploring
    an alien planet.
  pt-BR: >-
    Você sabe usar armas e se defender. Dependendo do gênero e cenário em
    questão, isso pode significar empunhar uma espada e um escudo na arena
    de gladiadores, um AK-47 e um bandoleiro de granadas em um tiroteio
    selvagem, ou um rifle de energia e uma armadura reforçada ao explorar
    um planeta alienígena.
