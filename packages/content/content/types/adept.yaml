id: adept
name:
  en: Adept
  pt-BR: Adepto
tagline:
  en: You master powers or abilities outside the experience, understanding, and sometimes belief of others.
  pt-BR: Você domina poderes ou habilidades além da experiência, compreensão e, às vezes, crença dos outros.
description:
  en: >-
    They might be magic, psychic powers, mutant abilities, or just a wide
    variety of intricate devices, depending on the setting. Your abilities
    might be an expression of technological devices, channeling spirits,
    mutations, psionics, nanotechnology, or something else.
  pt-BR: >-
    Podem ser magia, poderes psíquicos, habilidades mutantes, ou apenas uma
    grande variedade de dispositivos intrincados, dependendo do cenário.
    Suas habilidades podem ser uma expressão de dispositivos tecnológicos,
    canalização de espíritos, mutações, psiônicos, nanotecnologia, ou outra
    coisa.
