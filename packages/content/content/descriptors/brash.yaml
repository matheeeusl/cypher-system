id: brash
name:
  en: Brash
  pt-BR: Tradução em breve.
description:
  en: >-
    You're a self-assertive sort, confident in your abilities, energetic,
    and perhaps a bit irreverent toward ideas that you don't agree with.
    Some people call you bold and brave, but those you've put in their
    place might call you puffed up and arrogant. Whatever. It's not in
    your nature to care what other people think about you, unless those
    people are your friends or family. Even someone as brash as you knows
    that friends sometimes have to come first.
  pt-BR: Tradução em breve.
