id: guarded
name:
  en: Guarded
  pt-BR: Tradução em breve.
description:
  en: >-
    You conceal your true nature behind a mask and are loath to let
    anyone see who you really are. Protecting yourself, physically and
    emotionally, is what you care about most, and you prefer to keep
    everyone else at a safe distance. You may be suspicious of everyone
    you meet, expecting the worst from people so you won't be surprised
    when they prove you right. Or you might just be a bit reserved,
    careful about letting people through your gruff exterior to the
    person you really are. No one can be as reserved as you are and make
    many friends. Most likely, you have an abrasive personality and tend
    to be pessimistic in your outlook. You probably nurse an old hurt and
    find that the only way you can cope is to keep it and your
    personality locked down.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics: []
skill_training:
  - skill_id: intellect-defense
    choice_count: null
  - skill_id: discerning-truth
    choice_count: null
inabilities:
  - en: >-
      Your suspicious nature makes you unlikeable. Any task involving
      deception or persuasion is hindered.
    pt-BR: Tradução em breve.
additional_equipment: null
connection_options:
  - en: One of the PCs managed to overcome your defenses and befriend you.
    pt-BR: Tradução em breve.
  - en: >-
      You want to see what the PCs are up to, so you accompany them to
      catch them in the act of some wrongdoing.
    pt-BR: Tradução em breve.
  - en: You have made a few enemies and take up with the PCs for protection.
    pt-BR: Tradução em breve.
  - en: The PCs are the only people who will put up with you.
    pt-BR: Tradução em breve.
