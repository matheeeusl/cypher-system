id: honorable
name:
  en: Honorable
  pt-BR: Tradução em breve.
description:
  en: >-
    You are trustworthy, fair, and forthright. You try to do what is
    right, to help others, and to treat them well. Lying and cheating are
    no way to get ahead—these things are for the weak, the lazy, or the
    despicable. You probably spend a lot of time thinking about your
    personal honor, how best to maintain it, and how to defend it if
    challenged. In combat, you are straightforward and offer quarter to
    any foe. You were likely instilled with this sense of honor by a
    parent or a mentor. Sometimes the distinction between what is and
    isn't honorable varies with different schools of thought, but in
    broad strokes, honorable people can agree on most aspects of what
    honor means.
  pt-BR: Tradução em breve.
