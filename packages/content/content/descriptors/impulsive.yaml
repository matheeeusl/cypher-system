      You pulled everyone together after you heard rumors about
      something interesting you want to see or do.
    pt-BR: Tradução em breve.
  - en: You blew all of your money and now find yourself strapped for cash.
    pt-BR: Tradução em breve.
  - en: >-
      You're in trouble for acting recklessly. You join the other PCs
      because they offer a way out of your problem.
    pt-BR: Tradução em breve.
