id: clever
name:
  en: Clever
  pt-BR: Tradução em breve.
description:
  en: >-
    You're quick-witted, thinking well on your feet. You understand
    people, so you can fool them but are rarely fooled. Because you
    easily see things for what they are, you get the lay of the land
    swiftly, size up threats and allies, and assess situations with
    accuracy. Perhaps you're physically attractive, or maybe you use your
    wit to overcome any physical or mental imperfections.
  pt-BR: Tradução em breve.
pool_bonus:
  - stat: intellect
    amount: 2
characteristics: []
skill_training:
  - skill_id: lies-and-trickery
    choice_count: null
  - skill_id: intellect-defense
    choice_count: null
  - skill_id: identifying-and-assessing
    choice_count: null
inabilities:
  - en: >-
      You were never good at studying or retaining trivial knowledge. Any
      task involving lore, knowledge, or understanding is hindered.
    pt-BR: Tradução em breve.
additional_equipment:
  en: >-
    You see through the schemes of others and occasionally convince them
    to believe you—even when, perhaps, they should not. Thanks to your
    clever behavior, you have an additional expensive item.
  pt-BR: Tradução em breve.
connection_options:
  - en: You convinced one of the other PCs to tell you what they were doing.
    pt-BR: Tradução em breve.
  - en: >-
      From afar, you observed that something interesting was going on.
    pt-BR: Tradução em breve.
  - en: >-
      You talked your way into the situation because you thought it
      might earn some money.
    pt-BR: Tradução em breve.
  - en: You suspect that the other PCs won't succeed without you.
    pt-BR: Tradução em breve.
