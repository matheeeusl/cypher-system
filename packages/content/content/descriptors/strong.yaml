id: strong
name:
  en: Strong
  pt-BR: Forte
description:
  en: >-
    You're extremely strong and physically powerful, and you use these
    qualities well, whether through violence or feats of prowess. You
    likely have a brawny build and impressive muscles.
  pt-BR: >-
    Você é extremamente forte e fisicamente poderoso, e usa bem essas
    qualidades, seja através da violência ou de feitos de proeza. Você
    provavelmente tem um físico corpulento e músculos impressionantes.
skill_bonuses:
  - smashing
  - jumping
skill_inabilities: []
initial_bonus:
  en: 'Very Powerful: +4 to your Might Pool.'
  pt-BR: 'Muito Poderoso: +4 ao seu Reservatório de Vigor.'
connection_text:
  en: >-
    Choose or roll: 1) Against your better judgment, you joined the other
    PCs because you saw that they were in danger. 2) One of the other PCs
    convinced you that joining the group would be in your best interests.
    3) You're afraid of what might happen if the other PCs fail. 4) There
    is reward involved, and you need the money.
  pt-BR: >-
    Escolha ou role: 1) Contra seu melhor julgamento, você se juntou aos
    outros PJs porque viu que estavam em perigo. 2) Um dos outros PJs o
    convenceu de que se juntar ao grupo seria do seu interesse. 3) Você
    teme o que pode acontecer se os outros PJs falharem. 4) Há uma
    recompensa envolvida, e você precisa do dinheiro.
