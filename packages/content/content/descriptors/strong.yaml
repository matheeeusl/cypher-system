id: strong
name:
  en: Strong
  pt-BR: Forte
description:
  en: >-
    You're extremely strong and physically powerful, and you use these
    qualities well, whether through violence or feats of prowess. You
    likely have a brawny build and impressive muscles.
  pt-BR: >-
    Você é extremamente forte e fisicamente poderoso, e usa bem essas
    qualidades, seja através da violência ou de feitos de proeza. Você
    provavelmente tem um físico corpulento e músculos impressionantes.
pool_bonus:
  - stat: might
    amount: 4
characteristics: []
skill_training:
  - skill_id: breaking-inanimate-objects
    choice_count: null
  - skill_id: jumping
    choice_count: null
inabilities: []
additional_equipment:
  en: You have an extra medium weapon or heavy weapon.
  pt-BR: Tradução em breve.
connection_options:
  - en: >-
      Against your better judgment, you joined the other PCs because you
      saw that they were in danger.
    pt-BR: >-
      Contra seu melhor julgamento, você se juntou aos outros PJs porque
      viu que estavam em perigo.
  - en: >-
      One of the other PCs convinced you that joining the group would be
      in your best interests.
    pt-BR: >-
      Um dos outros PJs o convenceu de que se juntar ao grupo seria do
      seu interesse.
  - en: You're afraid of what might happen if the other PCs fail.
    pt-BR: Você teme o que pode acontecer se os outros PJs falharem.
  - en: There is reward involved, and you need the money.
    pt-BR: Há uma recompensa envolvida, e você precisa do dinheiro.
