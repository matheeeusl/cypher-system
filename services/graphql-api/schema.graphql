directive @oneOf on INPUT_OBJECT

# ---- shared ----
type LocalizedString {
  en: String!
  ptBR: String!
}
enum Stat {
  MIGHT
  SPEED
  INTELLECT
}
enum PriceTier {
  INEXPENSIVE
  MODERATELY_PRICED
  EXPENSIVE
  VERY_EXPENSIVE
  EXORBITANT
  PRICELESS
}

# ---- Type ----
enum WeaponCategory {
  LIGHT
  MEDIUM
  HEAVY
}
type StartingPools {
  might: Int!
  speed: Int!
  intellect: Int!
}
type StartingEdge {
  statChoices: [Stat!]!
  amount: Int!
}
type WeaponProficiency {
  practiced: [WeaponCategory!]!
  inability: [WeaponCategory!]!
}
type TypeTierChooseCount {
  tier: Int!
  count: Int!
}
type TypeTierAbilityGroup {
  tier: Int!
  abilityIds: [ID!]!
}
type TypeDescription {
  individualRole: LocalizedString!
  groupRole: LocalizedString!
  societalRole: LocalizedString!
}
type PlayerIntrusion {
  name: LocalizedString!
  description: LocalizedString!
}
type TypeStartingEquipmentItem {
  priceTier: PriceTier!
  count: Int!
  # true when the rulebook states the count exactly ("four"), false when
  # it's a cap ("up to four").
  exact: Boolean!
}
type TypeStartingEquipment {
  clothing: Boolean!
  # Free text, not structured — phrasing varies meaningfully between Types.
  # Null for a Type that gets no starting weapon (e.g. Adept).
  weapon: LocalizedString
  items: [TypeStartingEquipmentItem!]!
}

type Type {
  id: ID!
  name: LocalizedString!
  tagline: LocalizedString!
  description: TypeDescription!
  playerIntrusions: [PlayerIntrusion!]!
  startingPools: StartingPools!
  startingEdge: StartingEdge!
  specialAbilityId: ID
  # How many cyphers this Type can bear at once (the engine's getCypherLimit).
  cypherLimit: Int!
  weaponProficiency: WeaponProficiency!
  startingSkills: [ID!]!
  startingEquipment: TypeStartingEquipment!
  tierAbilities: [TypeTierAbilityGroup!]!
  # How many Type abilities the player picks on reaching each tier.
  tierChooseCounts: [TypeTierChooseCount!]!
  contentVersion: String!
}

# ---- Descriptor ----
type DescriptorPoolBonus {
  stat: Stat!
  amount: Int!
}
type DescriptorCharacteristic {
  name: LocalizedString!
  description: LocalizedString!
}
type DescriptorSkillTraining {
  # Exactly one of skillId/choiceCount is set per entry: a specific named
  # skill, or "N skills of your choice."
  skillId: ID
  choiceCount: Int
  # The level a fixed skill starts at: TRAINED, except the Elf's perception
  # (SPECIALIZED). A choice entry is always TRAINED.
  level: SkillLevel!
  # The rest of the book's line when it adds a rule: a condition, a narrower
  # choice ("perception or stealth"), or "specialized".
  note: LocalizedString
}
# The book's descriptor groups (Standard, Cyberpunk, Fairy Tale…).
type DescriptorCategory {
  id: ID!
  name: LocalizedString!
  # The book's one-line introduction to the group; null for Standard.
  intro: LocalizedString
  # First page of the group in OG-CSPG.
  page: Int!
}
# "N additional points to divide among <stats>" (Hideous, Addicted…).
type DescriptorPoolDivide {
  points: Int!
  stats: [Stat!]!
}
# Pick exactly one option; each is a list of fixed bonuses (Sylph, Rusted).
type DescriptorPoolOneOf {
  options: [[DescriptorPoolBonus!]!]!
}
union DescriptorPoolBonusChoice = DescriptorPoolDivide | DescriptorPoolOneOf

type Descriptor {
  id: ID!
  name: LocalizedString!
  description: LocalizedString!
  category: DescriptorCategory!
  # Fixed bonuses; all of them apply.
  poolBonus: [DescriptorPoolBonus!]!
  # A Pool bonus the player decides, on top of poolBonus; answered by
  # CharacterChoicesInput.descriptorPoolChoice.
  poolBonusChoice: DescriptorPoolBonusChoice
  characteristics: [DescriptorCharacteristic!]!
  skillTraining: [DescriptorSkillTraining!]!
  # Prose, not skill ids — real inability text is often a whole task
  # category, not a single skill.
  inabilities: [LocalizedString!]!
  # Present on some Descriptors, absent on others.
  additionalEquipment: LocalizedString
  # 4 numbered options, or none where the book prints no Initial Link
  # (Artificially Intelligent, Quintar).
  connectionOptions: [LocalizedString!]!
  contentVersion: String!
}

# ---- Focus ----
type GrantedAbility {
  abilityId: ID!
}
type ChoiceAbility {
  # Each entry is usually a single ability id, but a few Foci offer a
  # "choose either X, or both Y and Z" bundled-pair option — that bundle is
  # a 2-element list; an ordinary single-ability option is a 1-element
  # list. See @cypher/content's FocusSchema for the source shape.
  options: [[ID!]!]!
  count: Int!
}
union FocusTierAbilityEntry = GrantedAbility | ChoiceAbility
type FocusTierAbilityGroup {
  tier: Int!
  entries: [FocusTierAbilityEntry!]!
}

type FocusTypeSwapOption {
  abilityIds: [ID!]!
}

type Focus {
  id: ID!
  name: LocalizedString!
  description: LocalizedString!
  tierAbilities: [FocusTierAbilityGroup!]!
  # Set for the few Foci that let a player learn this ability instead of a
  # Type ability — null for most Foci, not every one has this option.
  typeSwapOption: FocusTypeSwapOption
  contentVersion: String!
}

# ---- Flavor ----
# An optional add-on to a Type (Combat, Stealth...) that widens the pool its
# abilities are picked from. There are no pick counts here: those stay on the
# Type (tierChooseCounts). Same per-tier shape as Type.tierAbilities.
type Flavor {
  id: ID!
  name: LocalizedString!
  description: LocalizedString!
  tierAbilities: [TypeTierAbilityGroup!]!
  contentVersion: String!
}

# ---- Ability ----
enum ActionType {
  ACTION
  ENABLER
  ACTION_TO_INITIATE
  ACTION_TO_INITIATE_OR_REINITIATE
  ACTION_OR_ENABLER
  ACTION_TO_ESTABLISH
  ACTION_TO_ESTABLISH_CONTACT
  ACTION_TO_ANIMATE
  ACTION_TO_MANIFEST
  ACTION_TO_TELEPORT
  ACTION_TO_CHANGE_OR_REVERT
  ACTION_TO_ENTER_OR_EXIT
  ACTION_TO_SPLIT_OR_RECOMBINE
  ACTION_TO_CREATE
  ACTION_TO_CREATE_AND_CHECK
  ACTION_TO_CREATE_AND_DIRECT
  ACTION_TO_PRODUCE_AND_CONSUME
  ACTION_TO_INITIATE_AND_COMPLETE
  ACTION_TO_INITIATE_AND_ANIMATE
  ACTION_TO_INITIATE_AND_CONCENTRATE
  ACTION_TO_INITIATE_AND_DIRECT_PER_ROUND
  ACTION_TO_ENTER_AND_TRAVERSE
  ACTION_TO_INITIATE_AND_CALL
  ACTION_TO_CREATE_AND_MODIFY
  ACTION_TO_INITIATE_AND_DRAIN
  ACTION_TO_CHANGE
  ACTION_TO_CHANGE_BACK
  ACTION_TO_ACTIVATE
  ACTION_PER_TARGET_TO_INITIATE
  ACTION_TO_PREPARE_AND_INITIATE
}
enum AbilitySourceType {
  TYPE
  FOCUS
  FLAVOR
  # This ability is one of the options of the ability named by `id`.
  ABILITY
}
type AbilityCost {
  pool: Stat!
  amount: Int!
}
type AbilitySourceRef {
  type: AbilitySourceType!
  id: ID!
  tier: Int!
  # True when the rulebook marks this specific source's printing with "~"
  # (a cyberware-derived ability) — per-source, since the book itself
  # marks the same ability inconsistently across the Foci that grant it.
  cyberware: Boolean!
}

# "You are trained in `count` skills of your choice" — null on abilities that
# don't grant skills. `noncombat` means any skill not flagged `combat` (and
# `options` is then empty); otherwise the player picks `count` of `options`.
# A second shape an ability can take instead ("two skills, or specialized in
# one"): the picks are of this shape when there are exactly `count` of them.
type SkillGrantAlternate {
  count: Int!
  mode: String!
}

# Present on abilities that ask the player to pick `count` of `options` (other
# abilities) once chosen: Blessing of the Gods, Cantrips. The picks are sent
# as AbilityChoiceInput under the key a PendingPick of kind "option" carries.
type AbilityChoice {
  options: [ID!]!
  count: Int!
  # Present when more options can be learned later for XP (Cantrips: 2 XP for
  # two more). Only characters whose flavor lists the ability may.
  learn: AbilityChoiceLearn
}

type AbilityChoiceLearn {
  xpCost: Int!
  count: Int!
}

# Present on abilities that permanently raise an Edge. kind "fixed": +`amount`
# to `stat` (Enhanced Might Edge). kind "choose_zero" (Improved Edge): the
# player picks an Edge that is 0 when the ability is gained, and it becomes 1;
# `stat` and `amount` are null. The pick is sent as AbilityEdgeChoiceInput under
# the key a PendingPick of kind "edge" carries.
type EdgeGrant {
  kind: String!
  stat: Stat
  amount: Int
}

type SkillGrant {
  count: Int!
  # The player may type their own skill/area instead of picking from the
  # catalog; a typed pick is sent and returned as "custom:<text>".
  allowCustom: Boolean!
  alternate: SkillGrantAlternate
  # What a pick does: "train" (a skill not yet trained), "train_or_specialize"
  # (trained, or specialized if already trained) or "specialize" (a skill the
  # character is already trained in).
  mode: String!
  noncombat: Boolean!
  options: [ID!]!
  # "You can select this ability multiple times": it may be taken again at a
  # later tier (each time with different skills).
  repeatable: Boolean!
}

type Ability {
  id: ID!
  name: LocalizedString!
  description: LocalizedString!
  cost: AbilityCost
  actionType: ActionType!
  sources: [AbilitySourceRef!]!
  # An attack (makes an attack roll or inflicts damage) — the only kind of
  # special ability the Skills advancement can train.
  attack: Boolean!
  skillGrant: SkillGrant
  choice: AbilityChoice
  edgeGrant: EdgeGrant
  contentVersion: String!
}

# ---- Skill ----
type Skill {
  id: ID!
  name: LocalizedString!
  description: LocalizedString!
  # A fighting skill (defense tasks, initiative) — excluded from "noncombat" picks.
  combat: Boolean!
  contentVersion: String!
}

# ---- Cypher ----
enum CypherCategory {
  MANIFEST
  FANTASTIC
  SUBTLE
  POWER_BOOST
}
type CypherEffectTableEntry {
  range: String!
  text: LocalizedString!
}
type CypherEffectTable {
  label: LocalizedString!
  entries: [CypherEffectTableEntry!]!
}
type Cypher {
  id: ID!
  name: LocalizedString!
  category: CypherCategory!
  pageRef: String!
  levelRange: String!
  effectText: LocalizedString!
  effectTable: CypherEffectTable
  contentVersion: String!
}

# ---- Artifact ----
type ArtifactEffectTableEntry {
  range: String!
  text: LocalizedString!
}
type ArtifactEffectTable {
  label: LocalizedString!
  entries: [ArtifactEffectTableEntry!]!
}
type Artifact {
  id: ID!
  name: LocalizedString!
  level: String!
  form: LocalizedString!
  effectText: LocalizedString!
  effectTable: ArtifactEffectTable
  flavorQuote: LocalizedString
  depletionDie: String!
  contentVersion: String!
}

# ---- Oddity ----
type Oddity {
  id: ID!
  description: LocalizedString!
  contentVersion: String!
}

# ---- validate operation: inputs ----
input StatAllocationInput {
  might: Int!
  speed: Int!
  intellect: Int!
}
input DescriptorPoolBonusInput {
  stat: Stat!
  amount: Int!
}
# The answer to Descriptor.poolBonusChoice: `allocation` for a
# DescriptorPoolDivide, or `optionIndex` (0-based) for a DescriptorPoolOneOf.
input DescriptorPoolChoiceInput @oneOf {
  allocation: StatAllocationInput
  optionIndex: Int
}
# One ability of a Focus choice at `tier`. A choice of `count` options is sent as
# all the ability ids of the chosen options (a bundled pair sends both ids).
input FocusChoiceSelectionInput {
  tier: Int!
  abilityId: ID!
}
input TypeAbilityPickInput {
  tier: Int!
  abilityId: ID!
}

# The skills picked for one time a skill-granting ability was gained. `key` is
# "<type|focus>:<tier>:<abilityId>" — a PendingPick's `key`, or built from the
# ability and the tier it was gained at.
input AbilitySkillChoiceInput {
  key: String!
  skillIds: [ID!]!
}

# Abilities picked for an ability that asks for them. `key` is
# "type:<tier>:<abilityId>", the same format as AbilitySkillChoiceInput.key.
input AbilityChoiceInput {
  key: String!
  abilityIds: [ID!]!
}

# The Edge picked for an Improved Edge (EdgeGrant kind "choose_zero"). `key`
# is "<type|focus>:<tier>:<abilityId>", the same format as
# AbilitySkillChoiceInput.key.
input AbilityEdgeChoiceInput {
  key: String!
  stat: Stat!
}

# A flavor gained in play instead of at creation (so flavorId must be unset), with
# the exchanges of already-picked Type abilities for flavor ones: `tier` is the
# tier of the pick, `replaces` the Type ability given up, `with` the flavor
# ability taken.
input FlavorGainInput {
  flavorId: ID!
  swaps: [FlavorSwapInput!]!
}
input FlavorSwapInput {
  tier: Int!
  replaces: ID!
  with: ID!
}

# Options learned later for XP: `abilityId` is the choice ability (cantrips),
# `optionIds` the options bought, in multiples of its learn count.
input LearnedOptionInput {
  abilityId: ID!
  optionIds: [ID!]!
}

input AdvancementPurchaseInput @oneOf {
  increasingCapabilities: IncreasingCapabilitiesPurchaseInput
  movingTowardPerfection: MovingTowardPerfectionPurchaseInput
  extraEffort: ExtraEffortPurchaseInput
  skills: SkillsPurchaseInput
  # The Other Options: at most one per tier, in place of a standard advancement.
  reduceArmorSpeedCost: OtherOptionPurchaseInput
  recoveryRollBonus: OtherOptionPurchaseInput
  # Another Type (or flavor) ability, of the tier the character has when buying or lower.
  typeAbility: TypeAbilityPurchaseInput
  # One more option of a Focus choice already made (a bundled pair gives two ids).
  focusAbility: FocusAbilityPurchaseInput
}
input OtherOptionPurchaseInput {
  tier: Int!
}
input TypeAbilityPurchaseInput {
  tier: Int!
  abilityId: ID!
}
input FocusAbilityPurchaseInput {
  tier: Int!
  abilityIds: [ID!]!
}
input IncreasingCapabilitiesPurchaseInput {
  tier: Int!
  statPoolAllocation: StatAllocationInput!
}
input MovingTowardPerfectionPurchaseInput {
  tier: Int!
  edgeStat: Stat!
}
input ExtraEffortPurchaseInput {
  tier: Int!
}
input SkillsPurchaseInput {
  tier: Int!
  target: SkillsPurchaseTargetInput!
}
input SkillsPurchaseTargetInput @oneOf {
  skillId: ID
  abilityId: ID
}

input CharacterChoicesInput {
  typeId: ID!
  descriptorId: ID!
  focusId: ID!
  # Optional flavor; its abilities join the pool tier1TypeAbilityIds / typeAbilityPicks draw from.
  flavorId: ID
  # A flavor gained in play (not together with flavorId).
  flavorGain: FlavorGainInput
  startingEdgeChoice: Stat
  poolPointAllocation: StatAllocationInput!
  # Ignored: every Pool bonus is read from the Descriptor's content.
  descriptorPoolBonus: DescriptorPoolBonusInput
    @deprecated(reason: "Ignored. The Descriptor's Pool bonuses come from content.")
  # Required when the Descriptor has a poolBonusChoice; omitted otherwise.
  descriptorPoolChoice: DescriptorPoolChoiceInput
  tier1TypeAbilityIds: [ID!]!
  focusChoiceSelections: [FocusChoiceSelectionInput!]!
  # Type abilities picked from tier 2 up (the tier-1 picks are tier1TypeAbilityIds).
  typeAbilityPicks: [TypeAbilityPickInput!]! = []
  descriptorSkillChoices: [ID!]!
  # Skills picked for skill-granting abilities (Physical Skills, Life Lessons...).
  abilitySkillChoices: [AbilitySkillChoiceInput!]! = []
  # Abilities picked for choice abilities (Blessing of the Gods, Cantrips).
  abilityChoices: [AbilityChoiceInput!]! = []
  # Edges picked for Improved Edge.
  abilityEdgeChoices: [AbilityEdgeChoiceInput!]! = []
  # Options learned later for XP (cantrips). The XP itself isn't tracked here.
  learnedOptions: [LearnedOptionInput!]! = []
  advancementPurchases: [AdvancementPurchaseInput!]!
}

# ---- validate operation: output ----
type PoolMax {
  max: Int!
}
type Pools {
  might: PoolMax!
  speed: PoolMax!
  intellect: PoolMax!
}
type Edge {
  might: Int!
  speed: Int!
  intellect: Int!
}

type TypeAbilitySource {
  typeId: ID!
}
type FocusAbilitySource {
  focusId: ID!
}
type FlavorAbilitySource {
  flavorId: ID!
}
# Gained through a typeAbility/focusAbility purchase tagged `tier`.
type AdvancementAbilitySource {
  tier: Int!
}
union AbilitySource =
  | TypeAbilitySource
  | FocusAbilitySource
  | FlavorAbilitySource
  | AdvancementAbilitySource

enum SkillLevel {
  INABILITY
  PRACTICED
  TRAINED
  SPECIALIZED
}
type KnownAbility {
  abilityId: ID!
  source: AbilitySource!
  trained: Boolean!
}
type SkillEntry {
  skillId: ID!
  level: SkillLevel!
}

type DerivedCharacterPayload {
  tier: Int!
  pools: Pools!
  edge: Edge!
  effort: Int!
  # Added to recovery rolls (1d6 + tier + this), from recoveryRollBonus purchases.
  recoveryRollBonus: Int!
  # Taken off the Speed Effort cost of wearing armor, from reduceArmorSpeedCost purchases.
  armorSpeedCostReduction: Int!
  knownAbilities: [KnownAbility!]!
  skills: [SkillEntry!]!
  # Level-up choices still owed for tiers already reached.
  pendingPicks: [PendingPick!]!
}

type PendingPick {
  # "type", "focus", "option", "skill" or "edge" (one Edge to pick: required
  # 1, chosen 0)
  kind: String!
  tier: Int!
  required: Int!
  chosen: Int!
  # Only for kind "skill", "option" or "edge": the AbilitySkillChoiceInput.key
  # (or AbilityChoiceInput.key, AbilityEdgeChoiceInput.key) to answer it under,
  # and the ability it belongs to.
  key: String
  abilityId: ID
  # Only for kind "skill": the pick count of the ability's alternate shape.
  alternateRequired: Int
}

type ValidCharacterResult {
  character: DerivedCharacterPayload!
}
# One way the choices are invalid, as a stable code + parameters so clients can
# localize it. `value` is always a string (numbers are stringified).
type IssueParam {
  key: String!
  value: String!
}
type ValidationIssue {
  code: String!
  params: [IssueParam!]!
}
type InvalidCharacterResult {
  # English sentences, same order/length as `issues`.
  errors: [String!]!
  issues: [ValidationIssue!]!
}
union ValidationResultPayload = ValidCharacterResult | InvalidCharacterResult

# ---- advancement rules ----
type AdvancementRules {
  # XP cost of one standard advancement.
  costXp: Int!
  # Advancements that must all be bought to reach the next tier.
  perTier: Int!
  # The highest tier a character can reach.
  maxTier: Int!
  # XP cost of gaining a flavor in play (free when a character arc grants it).
  flavorCostXp: Int!
  # What one recoveryRollBonus purchase adds to recovery rolls.
  recoveryRollBonus: Int!
  # What one reduceArmorSpeedCost purchase takes off the Speed Effort cost of armor.
  armorSpeedCostReduction: Int!
}

# ---- queries ----
type Query {
  advancementRules: AdvancementRules!
  types: [Type!]!
  type(id: ID!): Type
  descriptors: [Descriptor!]!
  descriptor(id: ID!): Descriptor
  foci: [Focus!]!
  focus(id: ID!): Focus
  flavors: [Flavor!]!
  flavor(id: ID!): Flavor
  abilities: [Ability!]!
  ability(id: ID!): Ability
  skills: [Skill!]!
  skill(id: ID!): Skill
  cyphers: [Cypher!]!
  cypher(id: ID!): Cypher
  artifacts: [Artifact!]!
  artifact(id: ID!): Artifact
  oddities: [Oddity!]!
  oddity(id: ID!): Oddity

  validateCharacterChoices(input: CharacterChoicesInput!): ValidationResultPayload!
}
